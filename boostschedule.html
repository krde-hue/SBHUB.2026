<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-dark: #070e1b;
      --card-bg: #0b172a;
      --card-border: #1a2a44;
      --border-dashed: #1e3557;
      --primary-blue: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --accent-tier: #eab308;
      --accent-tier-bg: #fef08a;
      --accent-hot: #ef4444;
      --accent-hot-bg: #fecaca;
      --accent-green: #10b981;
      --pill-bg: #0f2744;
      --pill-border: #1d4ed8;
      --btn-blue: #2563eb;
      --btn-purple: #7c3aed;
      --btn-green: #059669;
      --control-bg: #0d1b2e;
      --input-bg: #070e1b;
    }

    body.light-mode {
      --bg-dark: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --border-dashed: #94a3b8;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #334155;
      --pill-bg: #e2e8f0;
      --pill-border: #3b82f6;
      --control-bg: #e2e8f0;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; font-size: 14px; transition: background-color 0.3s, color 0.3s; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 12px;
    }
    
    .title-area { display: flex; flex-direction: column; gap: 2px; }
    .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5px; }
    .badge-sync { background-color: #064e3b; color: #34d399; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid #059669; }
    .sub-title { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tz-clocks { display: flex; align-items: center; gap: 12px; background: var(--control-bg); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--card-border); font-size: 0.72rem; color: var(--text-light); flex-wrap: wrap; }
    .tz-clock span { color: #38bdf8; font-weight: 700; }

    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .top-btn {
      background-color: var(--primary-blue);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .top-btn:hover { background-color: var(--primary-hover); }
    .top-btn.secondary { background-color: var(--control-bg); color: var(--text-main); border: 1px solid var(--card-border); }
    .top-btn.secondary:hover { opacity: 0.8; }
    .top-btn.green { background-color: #059669; }
    .top-btn.green:hover { background-color: #047857; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--control-bg);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .tab-btn.active {
      background-color: var(--primary-blue);
      color: #ffffff;
      border-color: var(--primary-blue);
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
      background: var(--control-bg);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      width: 100%;
      font-size: 0.78rem;
    }
    .filter-select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      outline: none;
    }
    .control-btn {
      background: var(--control-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .date-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 14px;
      margin: 16px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .date-title { font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
    .date-actions { display: flex; gap: 6px; }
    .date-btn {
      background: var(--control-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .date-btn:hover { background: var(--primary-blue); color: #fff; border-color: var(--primary-blue); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .card.is-hot { border: 1px solid var(--accent-hot); }
    .card.selected { border-color: var(--primary-blue); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-checkbox { transform: scale(1.1); cursor: pointer; margin-right: 6px; }
    .header-left-group { display: flex; align-items: center; gap: 6px; }

    .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { font-size: 0.62rem; font-weight: 800; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-top { background-color: var(--accent-tier-bg); color: #854d0e; }
    .badge-hot { background-color: var(--accent-hot); color: #ffffff; }

    .league-title { font-size: 0.68rem; color: #38bdf8; font-weight: 700; text-transform: uppercase; }
    .event-info { font-size: 0.95rem; font-weight: 700; margin-top: 1px; }
    .event-time { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

    .boost-box {
      border: 1px dashed var(--border-dashed);
      border-radius: 4px;
      padding: 8px 10px;
      margin-top: 2px;
      background: var(--input-bg);
    }

    .boost-box-header { color: #38bdf8; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
    .boost-sub-header { color: var(--text-muted); font-size: 0.68rem; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
    .pills-container { display: flex; flex-wrap: wrap; gap: 6px; }
    .market-pill { background-color: var(--pill-bg); border: 1px solid var(--pill-border); color: var(--text-main); font-size: 0.7rem; font-weight: 700; padding: 4px 8px; border-radius: 4px; display: inline-block; }

    .import-actions { display: flex; gap: 4px; margin-top: 4px; border-top: 1px solid var(--card-border); padding-top: 8px; }
    .import-btn { flex: 1; color: #ffffff; border: none; padding: 5px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; cursor: pointer; text-align: center; }
    .import-btn.ibet { background-color: var(--btn-blue); }
    .import-btn.edge { background-color: var(--btn-purple); }
    .import-btn.both { background-color: var(--btn-green); }
    .import-btn:hover { opacity: 0.88; }

    .empty-msg { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.95rem; background: var(--card-bg); border: 1px dashed var(--border-dashed); border-radius: 6px; margin-top: 16px; }

    @media (max-width: 768px) {
      body { padding: 10px; }
      header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .header-right { width: 100%; flex-direction: column; align-items: flex-start; gap: 8px; }
      .tz-clocks { width: 100%; justify-content: space-between; font-size: 0.65rem; padding: 6px 10px; }
      .header-btns { width: 100%; display: flex; }
      .header-btns .top-btn { flex: 1; justify-content: center; }
      .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
      .tabs::-webkit-scrollbar { display: none; }
      .controls-bar { flex-direction: column; align-items: stretch; }
      .search-box { width: 100%; }
      .filter-select, .control-btn { width: 100%; text-align: center; }
      .grid { grid-template-columns: 1fr; }
      .date-banner { flex-direction: column; align-items: flex-start; }
      .date-actions { width: 100%; }
      .date-btn { flex: 1; justify-content: center; }
      .card-header { flex-direction: column; align-items: flex-start; }
      .badges { justify-content: flex-start; }
    }
  </style>
</head>

    <button class="tab-btn" onclick="switchTab('OUTRIGHTS')">Outright Picks & Specials</button>

  <div class="controls-bar">

    <button class="control-btn" onclick="selectAllCurrent(true)">Select All</button>
    <button class="control-btn" onclick="selectAllCurrent(false)">Deselect All</button>

    function toggleThemeMode() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('modeText').textContent = isLight ? 'Night Mode' : 'Day Mode';
      localStorage.setItem('theme_mode', isLight ? 'light' : 'dark');
    }

    function updateLiveClocks() {
      const now = new Date();
      document.getElementById('clockSgt').textContent = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Singapore', hour12: false });
      document.getElementById('clockCet').textContent = now.toLocaleTimeString('en-US', { timeZone: 'Europe/Berlin', hour12: false });
      document.getElementById('clockEst').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false });
    }
    setInterval(updateLiveClocks, 1000);

    function parseIsoDate(isoStr) {
      if (!isoStr) return new Date(NaN);
      return new Date(isoStr);
    }

    function formatGMT8Date(dateObj) {
      return dateObj.toLocaleDateString('en-US', {
        timeZone: 'Asia/Singapore',
        weekday: 'long',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function formatGMT8Time(dateObj) {
      return dateObj.toLocaleTimeString('en-US', {
        timeZone: 'Asia/Singapore',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }) + ' PM (GMT+8)';
    }

    function isOutright(item) {
      const title = (item.title || '').toLowerCase();
      if (title.includes(' vs ') || title.includes(' v ')) {
        return false;
      }
      const fullMeta = `${item.category} ${item.sportCategory || ''} ${item.league || ''} ${item.title || ''}`.toUpperCase();
      return item.category === 'OUTRIGHTS' || item.isOutright === true || fullMeta.includes('OUTRIGHT') || fullMeta.includes('WINNER') || fullMeta.includes('CHAMPIONSHIP');
    }

      const icon = document.getElementById("syncIcon");
      const badge = document.getElementById("syncBadge");
      icon.style.transform = "rotate(360deg)";
      icon.style.transition = "transform 0.5s ease";
      badge.textContent = "PARSING LIVE FLASHSCORE...";
      badge.style.borderColor = "#eab308";
      badge.style.color = "#eab308";

      try {
        if (!API_KEY) {
          scheduleDatabase = await parse7DayFullDatabase();
        } else {
          const response = await fetch(FLASHSCORE_API_ENDPOINT, {
            method: 'GET',
            headers: {
              'X-RapidAPI-Key': API_KEY,
              'X-RapidAPI-Host': 'flashscore-data-api.p.rapidapi.com'
            }
          });
          const json = await response.json();
          scheduleDatabase = json.data;
        }

        badge.textContent = "LIVE FLASHSCORE SYNC ACTIVE";
        badge.style.borderColor = "#059669";
        badge.style.color = "#34d399";

        icon.style.transform = "rotate(0deg)";

    function renderSchedule() {
      const container = document.getElementById("contentArea");
      container.innerHTML = "";
      
      const now = new Date();
      const searchQuery = document.getElementById("searchInput").value.toLowerCase();
      const priorityFilter = document.getElementById("priorityFilter").value;

      if (!scheduleDatabase || scheduleDatabase.length === 0) {
        container.innerHTML = `<div class="empty-msg">No upcoming selections found for this category</div>`;
        return;
      }

      const filtered = scheduleDatabase.filter(item => {
        const itemIsOutright = isOutright(item);

        if (currentTab === 'OUTRIGHTS') {
          if (!itemIsOutright) return false;
        } else if (itemIsOutright) {
          return false;
        } else if (currentTab === 'TENNIS') {
          const cat = (item.category + ' ' + (item.sportCategory || '')).toUpperCase();
          if (!cat.includes('TENNIS') && !cat.includes('ATP') && !cat.includes('WTA')) return false;
        } else if (currentTab === 'OTHER') {
          const sportMeta = (item.category + ' ' + (item.sportCategory || '')).toUpperCase();
          if (!ALLOWED_OTHER_SPORTS.some(sport => sportMeta.includes(sport))) return false;
        } else if (item.category !== currentTab) {
          return false;
        }

        if (searchQuery) {
          const textStr = `${item.title} ${item.league} ${item.category}`.toLowerCase();
          if (!textStr.includes(searchQuery)) return false;
        }

        if (priorityFilter === 'TIER1' && !item.isTopTier) return false;
        if (priorityFilter === 'HOT' && !item.isHot) return false;

        const matchDate = parseIsoDate(item.isoTime);
        const isNotExpired = matchDate >= now; 
        const isWithin7Days = matchDate <= new Date(now.getTime() + (7 * 24 * 3600 * 1000));

        return isNotExpired && isWithin7Days;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-msg">No upcoming selections found within the 7-day schedule window</div>`;
        return;
      }

      const grouped = {};
      filtered.forEach(item => {
        const dateObj = parseIsoDate(item.isoTime);
        const dateStr = formatGMT8Date(dateObj);
        if (!grouped[dateStr]) grouped[dateStr] = [];
        grouped[dateStr].push(item);
      });

      Object.keys(grouped).forEach(dateStr => {
        const dayItems = grouped[dateStr];

        const banner = document.createElement("div");
        banner.className = "date-banner";
        banner.innerHTML = `
          <div class="date-title">📅 ${dateStr}</div>
          <div class="date-actions">
            <button class="date-btn" onclick="bulkSelectDay('${dateStr}', true)">☑ Select Day</button>
            <button class="date-btn" onclick="bulkSelectDay('${dateStr}', false)">☐ Deselect Day</button>
          </div>
        `;
        container.appendChild(banner);

        const grid = document.createElement("div");
        grid.className = "grid";

        dayItems.forEach(item => {
          const isSelected = selectedItemIds.has(item.id);
          const dateObj = parseIsoDate(item.isoTime);

          const card = document.createElement("div");
          card.className = `card ${item.isHot ? 'is-hot' : ''} ${isSelected ? 'selected' : ''}`;
          card.id = `card-${item.id}`;

          let badgesHTML = '';
          if (item.isTopTier) badgesHTML += `<span class="badge badge-top">⭐ TIER 1 PRIORITY</span>`;
          if (item.isHot) badgesHTML += `<span class="badge badge-hot">🔥 DERBY / HOT MATCH</span>`;

          const pillsHTML = item.suggestedMarkets.map(m => `<span class="market-pill">${m}</span>`).join('');

          card.innerHTML = `
            <div class="card-header">
              <div class="header-left-group">
                <input type="checkbox" class="card-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${item.id}')">
                <div class="league-title">${item.sportCategory || item.category} • ${item.league}</div>
              </div>
              <div class="badges">${badgesHTML}</div>
            </div>
            
            <div class="event-info">${item.title}</div>
            <div class="event-time">📌 Kickoff: ${formatGMT8Time(dateObj)}</div>

            <div class="boost-box">
              <div class="boost-box-header">🎯 SUGGESTED BOOST MARKETS</div>
              <div class="boost-sub-header">📌 Popular Markets to Offer:</div>
              <div class="pills-container">${pillsHTML}</div>
            </div>

            <div class="import-actions">
              <button class="import-btn ibet" onclick="importSingle('ibet_boosts', '${item.id}')">+ ibet_boosts</button>
              <button class="import-btn edge" onclick="importSingle('edge_boosts', '${item.id}')">+ Edge boosts</button>
              <button class="import-btn both" onclick="importSingle('BOTH', '${item.id}')">+ BOTH</button>
            </div>
          `;
          grid.appendChild(card);
        });

        container.appendChild(grid);
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderSchedule();
    }

    function toggleSelect(id) {
      if (selectedItemIds.has(id)) selectedItemIds.delete(id);
      else selectedItemIds.add(id);
      renderSchedule();
    }

    function selectAllCurrent(shouldSelect) {
      document.querySelectorAll('.card-checkbox').forEach(cb => {
        const id = cb.getAttribute('onchange').match(/'([^']+)'/)[1];
        if (shouldSelect) selectedItemIds.add(id);
        else selectedItemIds.delete(id);
      });
      renderSchedule();
    }

    function bulkSelectDay(dateStr, shouldSelect) {
      scheduleDatabase.forEach(item => {
        const dateObj = parseIsoDate(item.isoTime);
        if (formatGMT8Date(dateObj) === dateStr) {
          if (shouldSelect) selectedItemIds.add(item.id);
          else selectedItemIds.delete(item.id);
        }
      });
      renderSchedule();
    }

    function prepareImportPayload(item) {
      const dateObj = parseIsoDate(item.isoTime);
      return {
        id: 'imp-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
        koDate: formatGMT8Date(dateObj),
        koTime: formatGMT8Time(dateObj),
        sport: item.category || 'FOOTBALL',
        league: item.league || '',
        event: item.title || '',
        market: ''
      };
    }

    function saveToStorageTop(storageKey, newPayload) {
      const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');
      existing.unshift(newPayload);
      localStorage.setItem(storageKey, JSON.stringify(existing));
    }

    function importSingle(destination, itemId) {
      const item = scheduleDatabase.find(i => i.id === itemId);
      if (!item) return;

      const payload = prepareImportPayload(item);

      if (destination === 'ibet_boosts') {
        saveToStorageTop('ibet_boosts_list', payload);
        window.location.href = 'ibet_boosts.html';
      } else if (destination === 'edge_boosts') {
        saveToStorageTop('edge_boosts_list', payload);
        window.location.href = 'edge_boosts.html';
      } else if (destination === 'BOTH') {
        saveToStorageTop('ibet_boosts_list', payload);
        saveToStorageTop('edge_boosts_list', payload);
        window.location.href = 'ibet_boosts.html';
      }
    }

    window.onload = () => {
      if (localStorage.getItem('theme_mode') === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('modeText').textContent = 'Night Mode';
      }
      updateLiveClocks();
      fetchLiveFlashscoreFeed();
    };
  </script>
