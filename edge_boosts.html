        function parseRowDate(val) {
            if (!val || typeof val !== 'string' || val.trim() === "") return null;
            let clean = val.split(' ')[0].replace(/-/g, '.');
            let parts = clean.split('.');
            if (parts.length === 3) {
                let day, month, year;
                if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    day = parseInt(parts[2], 10);
                } else {
                    month = parseInt(parts[0], 10) - 1;
                    day = parseInt(parts[1], 10);
                    year = parseInt(parts[2], 10);
                }
                return new Date(year, month, day);
            }
            return null;
        }

        // MASTER CHRONOLOGICAL SORTING & SLICING ENGINE
        function getSortedAndLimitedRows(allRows) {
            const dateColIdx = currentSheet === "EDGE Banners" ? 1 : 3;
            const limitVal = document.getElementById('recordLimitSelect')?.value || "30";

            const mappedRows = allRows.map((row, index) => {
                const dateObj = parseRowDate(row[dateColIdx]);
                // If a row has no date (or is brand new), assign MAX_SAFE_INTEGER to force it to position #1 at the top
                const timestamp = dateObj ? dateObj.getTime() : Number.MAX_SAFE_INTEGER;
                return {
                    originalIndex: index,
                    row: row,
                    date: timestamp
                };
            });

            // Sort entire database strictly from newest to oldest date
            mappedRows.sort((a, b) => b.date - a.date);

            let resultMapped = mappedRows;
            if (limitVal !== "ALL") {
                const count = parseInt(limitVal, 10);
                resultMapped = mappedRows.slice(0, count);
            }

            return resultMapped;
        }

        // CONTINUOUS SEQUENTIAL DISPLAY NUMBERING (Calculates 145, 144, 143... down to 1)
        function renderTableRows(mappedRows) {
            const tbody = document.getElementById('tableBody');
            const sheet = workbookData[currentSheet];
            const recordCounter = document.getElementById('recordCounter');
            
            if (recordCounter) {
                recordCounter.innerText = `Showing ${mappedRows.length} of ${sheet.rows.length}`;
            }

            tbody.innerHTML = '';
            const totalDatabaseRows = sheet.rows.length;

            mappedRows.forEach((item, displayIndex) => {
                // Numbering counts downwards sequentially from highest database row count (e.g., 145, 144, 143...)
                const sequentialLabelNumber = totalDatabaseRows - displayIndex;
                const tr = createTableRowElement(item.row, item.originalIndex, sequentialLabelNumber);
                tbody.appendChild(tr);
            });

            setTimeout(() => {
                document.querySelectorAll('.editable-cell').forEach(el => autoResizeTextarea(el));
            }, 50);
        }

        function createTableRowElement(row, originalIndex, displayLabelNumber) {
            const sheet = workbookData[currentSheet];
            const tr = document.createElement('tr');

            let rowHTML = `
                <td class="row-number-cell">${displayLabelNumber}</td>
                <td style="text-align: center; width: 50px;">
                    <button class="delete-btn" onclick="deleteRow(${originalIndex})" title="Delete Row">🗑️</button>
                </td>
            `;

            sheet.headers.forEach((headerName, colIndex) => {
                const cellVal = row[colIndex];

                if (typeof cellVal === 'boolean') {
                    rowHTML += `
                        <td style="text-align: center; width: 45px;">
                            <input type="checkbox" class="checkbox-cell" ${cellVal ? 'checked' : ''} onchange="updateCell(${originalIndex}, ${colIndex}, this.checked)">
                        </td>
                    `;
                } else if (headerName === "Sports") {
                    if (currentSheet === "Edge Football") {
                        rowHTML += `<td><span class="pill-badge sport-football">Football</span></td>`;
                    } else if (currentSheet === "Edge Tennis") {
                        rowHTML += `<td><span class="pill-badge sport-tennis">Tennis</span></td>`;
                    } else {
                        const sClass = getSportClass(cellVal || "Football");
                        rowHTML += `
                            <td>
                                <div class="dropdown-container">
                                    <span class="pill-badge ${sClass}" onclick="toggleFloatingDropdown(event, 'sport-${originalIndex}')">${escapeHtml(cellVal || 'Football')} ▼</span>
                                    <div id="sport-${originalIndex}" class="dropdown-menu">
                                        ${sportsOptions.map(s => `
                                            <div class="dropdown-option" onclick="selectSportOption(${originalIndex}, ${colIndex}, '${s.name}')">
                                                <span class="pill-badge ${s.class}">${s.name}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </td>
                        `;
                    }
                } else if (headerName === "Type") {
                    const tClass = getTypeClass(cellVal || "Bet Builder");
                    rowHTML += `
                        <td>
                            <div class="dropdown-container">
                                <span class="pill-badge ${tClass}" onclick="toggleFloatingDropdown(event, 'type-${originalIndex}')">${escapeHtml(cellVal || 'Bet Builder')} ▼</span>
                                <div id="type-${originalIndex}" class="dropdown-menu">
                                    ${typeOptions.map(t => `
                                        <div class="dropdown-option" onclick="selectTypeOption(${originalIndex}, ${colIndex}, '${t.name}')">
                                            <span class="pill-badge ${t.class}">${t.name}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </td>
                    `;
                } else {
                    rowHTML += `
                        <td>
                            <textarea class="editable-cell" oninput="autoResizeTextarea(this); updateCellDirectly(${originalIndex}, ${colIndex}, this.value)">${escapeHtml(cellVal !== undefined && cellVal !== null ? cellVal : '')}</textarea>
                        </td>
                    `;
                }
            });

            tr.innerHTML = rowHTML;
            return tr;

        function toggleFloatingDropdown(e, id) {

            const badge = e.currentTarget;
            const menu = document.getElementById(id);
            if (!menu) return;

            const isAlreadyOpen = menu.classList.contains('show');
            closeAllDropdowns();

            if (!isAlreadyOpen) {
                const rect = badge.getBoundingClientRect();
                menu.style.top = (rect.bottom + window.scrollY) + 'px';
                menu.style.left = (rect.left + window.scrollX) + 'px';
                menu.classList.add('show');
            }
        }

        function selectSportOption(rowIndex, colIndex, sportName) {
            pushState();
            updateCell(rowIndex, colIndex, sportName);
            renderActiveSheet();
        }

        function selectTypeOption(rowIndex, colIndex, typeName) {
            pushState();
            updateCell(rowIndex, colIndex, typeName);
            renderActiveSheet();
        }

        function renderGuidelinesView() {
            const container = document.getElementById('guidelinesView');
            const gData = workbookData["Guideliness"].data || guidelinesData;

            let html = `
                <div class="guidelines-container">
                    <div>
                        <div class="guidelines-header-badge">HERO BANNERS</div>
                        <div class="guidelines-section-title">WHICH TEAM TO PICK? WHO'S PLAYING?</div>
                        <div style="overflow-x: auto;">
                            <table class="guidelines-table">
                                <thead>
                                    <tr>
                                        <th>Leagues / Competition</th>
                                        <th>Rank</th>
                                        <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
                                        <th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            gData.hero.forEach((row, rIdx) => {
                html += `
                    <tr>
                        <td class="col-league">
                            <input type="text" class="guidelines-cell-input left-align" value="${escapeHtml(row.league)}" onchange="updateHeroGuideline(${rIdx}, 'league', this.value)">
                        </td>
                        <td class="col-rank">
                            <input type="text" class="guidelines-cell-input" value="${escapeHtml(row.rank)}" onchange="updateHeroGuideline(${rIdx}, 'rank', this.value)">
                        </td>
                `;
                for (let oIdx = 0; oIdx < 11; oIdx++) {
                    const optVal = row.options[oIdx] !== undefined ? row.options[oIdx] : "";
                    html += `
                        <td>
                            <input type="text" class="guidelines-cell-input" value="${escapeHtml(optVal)}" onchange="updateHeroOption(${rIdx}, ${oIdx}, this.value)">
                        </td>
                    `;
                }
                html += `</tr>`;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 300px;">
                            <div class="guidelines-section-title">Normal Boosts</div>
                            <table class="guidelines-table">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Max Stake</th>
                                        <th>Odds 1.50 - 11.0</th>
                                        <th>Odds 11.0 +</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            gData.normalBoosts.forEach((b, nbIdx) => {
                html += `
                    <tr>
                        <td><input type="text" class="guidelines-cell-input left-align" value="${escapeHtml(b.type)}" onchange="updateNormalBoost(${nbIdx}, 'type', this.value)"></td>
                        <td><input type="text" class="guidelines-cell-input" value="${escapeHtml(b.maxStake)}" onchange="updateNormalBoost(${nbIdx}, 'maxStake', this.value)"></td>
                        <td><input type="text" class="guidelines-cell-input" style="color: #166534; font-weight: bold;" value="${escapeHtml(b.odds1)}" onchange="updateNormalBoost(${nbIdx}, 'odds1', this.value)"></td>
                        <td><input type="text" class="guidelines-cell-input" style="color: #166534; font-weight: bold;" value="${escapeHtml(b.odds2)}" onchange="updateNormalBoost(${nbIdx}, 'odds2', this.value)"></td>
                    </tr>
                `;
            });

            html += `
                                </tbody>
                            </table>
                        </div>

                        <div style="flex: 1; min-width: 300px;">
                            <div class="guidelines-section-title">Specials Boosts (Finals, Region Specials etc)</div>
                            <table class="guidelines-table">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Max Stake</th>
                                        <th>Boost Ratio</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            gData.specialBoosts.forEach((b, sbIdx) => {
                html += `
                    <tr>
                        <td><input type="text" class="guidelines-cell-input left-align" value="${escapeHtml(b.type)}" onchange="updateSpecialBoost(${sbIdx}, 'type', this.value)"></td>
                        <td><input type="text" class="guidelines-cell-input" value="${escapeHtml(b.maxStake)}" onchange="updateSpecialBoost(${sbIdx}, 'maxStake', this.value)"></td>
                        <td><input type="text" class="guidelines-cell-input" style="color: #166534; font-weight: bold;" value="${escapeHtml(b.odds1)}" onchange="updateSpecialBoost(${sbIdx}, 'odds1', this.value)"></td>
                    </tr>
                `;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="rules-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border-color); padding-bottom: 6px; margin-bottom: 8px;">
                            <span style="font-size: 13px; font-weight: 800;">📌 OPERATIONAL DUTY RULES & GUIDELINES</span>
                            <button class="btn btn-success" style="padding: 4px 10px; font-size: 11px;" onclick="addRuleInstruction()">➕ Add Rule</button>
                        </div>
                        <div class="rules-list">
            `;

            gData.instructions.forEach((ins, insIdx) => {
                html += `
                    <div class="rules-item">
                        <span style="font-weight: bold;">•</span>
                        <textarea class="rule-textarea" oninput="autoResizeTextarea(this); updateInstructionRuleDirectly(${insIdx}, this.value)">${escapeHtml(ins)}</textarea>
                        <button class="delete-btn" onclick="deleteInstructionRule(${insIdx})" title="Delete Rule">🗑️</button>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            setTimeout(() => {
                container.querySelectorAll('.rule-textarea').forEach(el => autoResizeTextarea(el));
            }, 50);
        }

        function updateHeroGuideline(rIdx, prop, val) {
            pushState();
            if (!workbookData["Guideliness"].data) workbookData["Guideliness"].data = guidelinesData;
            workbookData["Guideliness"].data.hero[rIdx][prop] = val;
            debouncedSaveToFirebase();
        }

        function updateHeroOption(rIdx, oIdx, val) {
            pushState();
            if (!workbookData["Guideliness"].data) workbookData["Guideliness"].data = guidelinesData;
            workbookData["Guideliness"].data.hero[rIdx].options[oIdx] = val;
            debouncedSaveToFirebase();
        }

        function updateNormalBoost(nbIdx, prop, val) {
            pushState();
            if (!workbookData["Guideliness"].data) workbookData["Guideliness"].data = guidelinesData;
            workbookData["Guideliness"].data.normalBoosts[nbIdx][prop] = val;
            debouncedSaveToFirebase();
        }

        function updateSpecialBoost(sbIdx, prop, val) {
            pushState();
            if (!workbookData["Guideliness"].data) workbookData["Guideliness"].data = guidelinesData;
            workbookData["Guideliness"].data.specialBoosts[sbIdx][prop] = val;
            debouncedSaveToFirebase();
        }

        function updateInstructionRuleDirectly(insIdx, val) {
            if (!workbookData["Guideliness"].data) workbookData["Guideliness"].data = guidelinesData;
            workbookData["Guideliness"].data.instructions[insIdx] = val;
            debouncedSaveToFirebase();
        }

        function addRuleInstruction() {
            pushState();
            if (!workbookData["Guideliness"].data) workbookData["Guideliness"].data = guidelinesData;
            workbookData["Guideliness"].data.instructions.push("New operational rule/instruction...");
            saveToFirebaseNow();
            renderGuidelinesView();
        }

        function deleteInstructionRule(insIdx) {
            if (confirm("Are you sure you want to delete this rule?")) {
                pushState();
                if (!workbookData["Guideliness"].data) workbookData["Guideliness"].data = guidelinesData;
                workbookData["Guideliness"].data.instructions.splice(insIdx, 1);
                saveToFirebaseNow();
                renderGuidelinesView();
            }
        }

        function updateCellDirectly(rowIndex, colIndex, value) {
            workbookData[currentSheet].rows[rowIndex][colIndex] = value;
            debouncedSaveToFirebase();
        }

        function updateCell(rowIndex, colIndex, value) {
            pushState();
            workbookData[currentSheet].rows[rowIndex][colIndex] = value;
            debouncedSaveToFirebase();
        }

        // ADD NEW BLANK ROW GUARANTEED AT ABSOLUTE ROW #1
        function addNewRow() {
            pushState();
            const sheet = workbookData[currentSheet];

            const newRow = sheet.headers.map((h, idx) => {
                if ((idx === 0 || idx === 1) && typeof sheet.rows[0]?.[idx] === 'boolean') return false;
                if (h === "Brands") return "7Abet/BVBet";
                if (h === "KO Date" || h === "Event Date") return ""; // Left unpopulated to guarantee position #1
                if (h === "Sports") return currentSheet === "Edge Tennis" ? "Tennis" : "Football";
                if (h === "Type") return "Bet Builder";
                return "";
            });

            sheet.rows.unshift(newRow); // Prepend to index 0
            saveToFirebaseNow();
            renderActiveSheet();

            setTimeout(() => {
                const wrapper = document.getElementById('tableWrapper');
                if (wrapper) wrapper.scrollTop = 0;
            }, 50);
        }

        function deleteRow(rowIndex) {
            if (confirm("Are you sure you want to delete this record?")) {
                pushState();
                workbookData[currentSheet].rows.splice(rowIndex, 1);
                saveToFirebaseNow();
                renderActiveSheet();
            }
        }

        function clearCurrentSheet() {
            if (confirm(`Are you sure you want to CLEAR ALL records in "${currentSheet}"?`)) {
                pushState();
                workbookData[currentSheet].rows = [];
                saveToFirebaseNow();
                renderActiveSheet();
            }
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const allRows = workbookData[currentSheet].rows;
            const mappedRows = getSortedAndLimitedRows(allRows);
            const filtered = mappedRows.filter(item => 
                item.row.some(cell => String(cell).toLowerCase().includes(query))
            );
            renderTableRows(filtered);
        }

        function toggleDarkMode() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme_7a', newTheme);
        }

        function escapeHtml(text) {
            return String(text).replace(/"/g, "&quot;");
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
