<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Application Hub</title>

    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0b132b 100%);
            --glass-bg: rgba(26, 38, 66, 0.55);
            --glass-card: rgba(30, 42, 74, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-input: rgba(11, 19, 43, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --month-bg: linear-gradient(135deg, #f59e0b, #d97706);
            --month-text: #000000;
            --box-bg: rgba(15, 23, 42, 0.6);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 50%, #cbd5e1 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-card: rgba(255, 255, 255, 0.88);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-input: rgba(255, 255, 255, 0.9);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-cyan: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.15);
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --month-bg: linear-gradient(135deg, #facc15, #eab308);
            --month-text: #0f172a;
            --box-bg: rgba(241, 245, 249, 0.85);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* GLASS HEADER WIDGET */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow);
            flex-wrap: wrap;
            gap: 14px;
            position: sticky;
            top: 16px;
            z-index: 1000;
        }

        .title-group { display: flex; flex-direction: column; gap: 2px; }
        h1 { font-size: 20px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
        .title-credit { font-size: 11px; font-weight: 700; color: var(--accent-cyan); letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.9; }

        .btn-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 9px 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--glass-input);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
        }

        .btn-dashboard {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
            color: #ffffff !important;
            border: 1.5px solid var(--accent-cyan) !important;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* GLASS FILTER WIDGET */
        .filter-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select, .form-control {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass-input);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        .filter-bar input:focus, .filter-bar select:focus, .form-control:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .filter-bar input { flex: 1; min-width: 220px; }

        /* TIMELINE LAYOUT */
        .timeline-container { display: flex; flex-direction: column; gap: 28px; }

        .month-header {
            background: var(--month-bg);
            color: var(--month-text);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        .date-section {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .date-badge {
            font-size: 13px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: fit-content;
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--accent-cyan);
        }

        .date-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 18px;
        }

        /* GLASS CARD WIDGET */
        .leave-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .leave-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45);
        }

        .leave-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .leave-target-header {
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .leave-message-box {
            background: var(--box-bg);
            border-left: 3.5px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 2px 6px var(--accent-glow);
        }

        .category-badge {
            font-size: 10px;
            font-weight: 800;
            background: var(--accent-cyan);
            color: #0b132b;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: auto;
            letter-spacing: 0.5px;
        }

        .card-image-preview {
            width: 100%;
            max-height: 260px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            object-fit: contain;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.25);
            transition: opacity 0.2s;
        }

        .card-image-preview:hover { opacity: 0.9; }

        .card-footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            padding-top: 10px;
            border-top: 1px dashed var(--glass-border);
        }

        /* GLASS MODAL WIDGETS */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.show { display: flex; }

        .modal-box {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 800;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
        }

        .paste-drop-zone {
            border: 2px dashed var(--glass-border);
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            background: var(--glass-input);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .paste-drop-zone:hover { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.05); }

        .image-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            display: none;
            margin-top: 10px;
            border: 1px solid var(--glass-border);
        }

        .lightbox-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .lightbox-backdrop.show { display: flex; }
        .lightbox-backdrop img { max-width: 92%; max-height: 92%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .date-grid { grid-template-columns: 1fr; }
            .header-container { flex-direction: column; align-items: stretch; }
            .btn-controls { justify-content: stretch; }
            .btn-controls .btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- MAIN HEADER GLASS WIDGET -->
    <div class="header-container">
        <div class="title-group">
            <h1><i class="fa-solid fa-plane-departure" style="color: var(--accent-cyan);"></i> LEAVE APPLICATION HUB</h1>
            <span class="title-credit">kdv_2026 model</span>
        </div>
        <div class="btn-controls">
            <button class="btn btn-primary" onclick="openNewLeaveModal()"><i class="fa-solid fa-plus"></i> Submit Leave</button>
            <button class="btn btn-secondary" onclick="toggleDarkMode()"><i class="fa-solid fa-circle-half-stroke"></i> Mode</button>
            <a href="rota.html" class="btn btn-dashboard"><i class="fa-regular fa-calendar-days"></i> Back to Rota</a>
        </div>
    </div>

    <!-- FILTER & SEARCH GLASS WIDGET -->
    <div class="filter-bar">
        <i class="fa-solid fa-magnifying-glass" style="opacity: 0.7; color: var(--accent-cyan);"></i>
        <input type="text" id="searchInput" placeholder="Search by Employee, Leave Context, or Target Dates..." oninput="renderLeaves()">

        <select id="filterEmployee" onchange="renderLeaves()">
            <option value="ALL">All Employees</option>
            <option value="ANN">ANN</option>
            <option value="DAVE">DAVE</option>
            <option value="KENNETH">KENNETH</option>
            <option value="KRIZTEL">KRIZTEL</option>
        </select>

        <select id="filterCategory" onchange="renderLeaves()">
            <option value="ALL">All Categories</option>
            <option value="VL">Vacation Leave (VL)</option>
            <option value="SL">Sick Leave (SL)</option>
            <option value="EMERGENCY">Emergency Leave</option>
            <option value="PERSONAL">Personal Leave</option>
        </select>
    </div>

    <!-- TIMELINE CONTAINER -->
    <div class="timeline-container" id="timelineContainer"></div>

    <!-- NEW / EDIT ENTRY MODAL -->
    <div class="modal-backdrop" id="leaveModal">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modalTitle">Submit Leave Application</span>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal()"></i>
            </div>
            
            <input type="hidden" id="editLeaveId">

            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 180px;">
                    <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 6px;">Date Submitted *</label>
                    <input type="date" id="dateSubmitted" class="form-control" style="width: 100%;">
                </div>
                <div style="flex: 1; min-width: 180px;">
                    <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 6px;">Category *</label>
                    <select id="leaveCategory" class="form-control" style="width: 100%;">
                        <option value="VL">Vacation Leave (VL)</option>
                        <option value="SL">Sick Leave (SL)</option>
                        <option value="EMERGENCY">Emergency Leave</option>
                        <option value="PERSONAL">Personal Leave</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 180px;">
                    <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 6px;">Employee Name *</label>
                    <select id="leaveEmployee" class="form-control" style="width: 100%;">
                        <option value="ANN">ANN</option>
                        <option value="DAVE">DAVE</option>
                        <option value="KENNETH">KENNETH</option>
                        <option value="KRIZTEL">KRIZTEL</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 180px;">
                    <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 6px;">Target VL/Leave Date(s) *</label>
                    <input type="text" id="targetLeaveDates" class="form-control" style="width: 100%;" placeholder="e.g. Oct 12 or Oct 12, Oct 14-15">
                </div>
            </div>

            <div>
                <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 6px;">Message / Leave Context *</label>
                <textarea id="leaveContext" class="form-control" style="width: 100%; height: 95px; resize: vertical;" placeholder="Enter leave details, coverage plan, or context..."></textarea>
            </div>

            <div>
                <label style="font-size: 12px; font-weight: 700; display: block; margin-bottom: 6px;">Approval / Medical Cert Screenshot</label>
                <div class="paste-drop-zone" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px; margin-bottom: 6px; color: var(--accent-cyan);"></i>
                    <p style="font-size: 12px; font-weight: 600;">Click to Upload OR Press <strong>Ctrl+V / Cmd+V</strong> to Paste Screenshot</p>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                </div>
                <img id="imagePreview" class="image-preview" alt="Attachment Preview">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveLeave()">Save Application</button>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div class="lightbox-backdrop" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Enlarged View">
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaEclzLI284lWCFk-vXbLSXa_bEZsXbOg",
            authDomain: "test-daily-task--sb.firebaseapp.com",
            databaseURL: "https://test-daily-task--sb-default-rtdb.firebaseio.com",
            projectId: "test-daily-task--sb",
            storageBucket: "test-daily-task--sb.firebasestorage.app",
            messagingSenderId: "928476661919",
            appId: "1:928476661919:web:c6d531190824c6ed7c7aaa"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let leaveApplications = {};
        let currentImageData = "";

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function listenToDatabase() {
            db.ref('leave_applications').on('value', (snapshot) => {
                leaveApplications = snapshot.val() || {};
                renderLeaves();
            });
        }

        function renderLeaves() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const filterEmp = document.getElementById('filterEmployee').value;
            const filterCat = document.getElementById('filterCategory').value;

            const logsArray = Object.keys(leaveApplications).map(id => ({ id, ...leaveApplications[id] }));

            const filteredLogs = logsArray.filter(log => {
                const matchesSearch = (log.context && log.context.toLowerCase().includes(searchText)) ||
                                      (log.employee && log.employee.toLowerCase().includes(searchText)) ||
                                      (log.targetDates && log.targetDates.toLowerCase().includes(searchText));
                const matchesEmp = (filterEmp === 'ALL' || log.employee === filterEmp);
                const matchesCat = (filterCat === 'ALL' || log.category === filterCat);
                return matchesSearch && matchesEmp && matchesCat;
            });

            filteredLogs.sort((a, b) => {
                const timeA = a.dateSubmitted ? new Date(a.dateSubmitted).getTime() : (a.timestamp || 0);
                const timeB = b.dateSubmitted ? new Date(b.dateSubmitted).getTime() : (b.timestamp || 0);
                if (timeB !== timeA) {
                    return timeB - timeA;
                }
                return (b.timestamp || 0) - (a.timestamp || 0);
            });

            const groupedMonths = [];

            filteredLogs.forEach(log => {
                const dateObj = new Date(log.dateSubmitted || log.timestamp);
                const monthName = monthNames[dateObj.getMonth()];
                const dayNum = dateObj.getDate();
                const monthShort = monthName.substring(0, 3);
                const dateKey = `${dayNum}-${monthShort}`;

                let lastMonth = groupedMonths[groupedMonths.length - 1];
                if (!lastMonth || lastMonth.name !== monthName) {
                    lastMonth = { name: monthName, dates: [] };
                    groupedMonths.push(lastMonth);
                }

                let lastDate = lastMonth.dates[lastMonth.dates.length - 1];
                if (!lastDate || lastDate.key !== dateKey) {
                    lastDate = { key: dateKey, logs: [] };
                    lastMonth.dates.push(lastDate);
                }

                lastDate.logs.push(log);
            });

            groupedMonths.forEach(mGroup => {
                const monthBlock = document.createElement('div');
                monthBlock.innerHTML = `<div class="month-header"><i class="fa-regular fa-calendar"></i> ${mGroup.name}</div>`;

                mGroup.dates.forEach(dGroup => {
                    const dateSec = document.createElement('div');
                    dateSec.className = 'date-section';
                    dateSec.innerHTML = `<div class="date-badge"><i class="fa-regular fa-clock"></i> Submitted: ${dGroup.key}</div>`;

                    const grid = document.createElement('div');
                    grid.className = 'date-grid';

                    dGroup.logs.forEach(log => {
                        const card = document.createElement('div');
                        card.className = 'leave-card';

                        const userInitial = (log.employee || 'E').substring(0, 1).toUpperCase();

                        card.innerHTML = `
                            <div class="leave-card-top">
                                <div class="leave-target-header">
                                    <i class="fa-regular fa-calendar-check"></i>
                                    <span>Target Dates: ${escapeHtml(log.targetDates || 'N/A')}</span>
                                </div>
                            </div>

                            <div class="leave-message-box">
                                <div class="user-meta">
                                    <span class="user-avatar">${userInitial}</span>
                                    <span>${escapeHtml(log.employee || 'Employee')}</span>
                                    <span class="category-badge">${escapeHtml(log.category || 'LEAVE')}</span>
                                </div>
                                <div style="font-size: 13px; line-height: 1.5; white-space: pre-line;">${escapeHtml(log.context || '')}</div>
                            </div>

                            ${log.image ? `
                                <img src="${log.image}" class="card-image-preview" alt="Attachment" onclick="openLightbox('${log.image}')">
                            ` : ''}

                            <div class="card-footer-actions">
                                <span style="font-size: 11px; opacity: 0.75; font-weight: 700;">📋 Submitted: ${log.dateSubmitted || 'N/A'}</span>
                                <div>
                                    <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px;" onclick="editLeave('${log.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                                    <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px; color: #f87171;" onclick="deleteLeave('${log.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    dateSec.appendChild(grid);
                    monthBlock.appendChild(dateSec);
                });

                container.appendChild(monthBlock);
            });

            if (container.children.length === 0) {
                container.innerHTML = `<div style="text-align: center; opacity: 0.6; padding: 60px; font-weight: 600;">No leave applications found. Click <strong>"➕ Submit Leave"</strong> to log one.</div>`;
            }
        }

        function openNewLeaveModal() {
            document.getElementById('editLeaveId').value = '';
            document.getElementById('dateSubmitted').value = new Date().toISOString().split('T')[0];
            document.getElementById('targetLeaveDates').value = '';
            document.getElementById('leaveEmployee').value = 'ANN';
            document.getElementById('leaveCategory').value = 'VL';
            document.getElementById('leaveContext').value = '';
            
            currentImageData = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('modalTitle').innerText = 'Submit Leave Application';
            document.getElementById('leaveModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('leaveModal').classList.remove('show');
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentImageData = evt.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.src = currentImageData;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        window.addEventListener('paste', function(e) {
            if (!document.getElementById('leaveModal').classList.contains('show')) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        currentImageData = evt.target.result;
                        const preview = document.getElementById('imagePreview');
                        preview.src = currentImageData;
                        preview.style.display = 'block';
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        async function saveLeave() {
            const dateSubmitted = document.getElementById('dateSubmitted').value;
            const targetDates = document.getElementById('targetLeaveDates').value.trim();
            const employee = document.getElementById('leaveEmployee').value;
            const category = document.getElementById('leaveCategory').value;
            const context = document.getElementById('leaveContext').value.trim();
            const editId = document.getElementById('editLeaveId').value;

            if (!dateSubmitted || !targetDates || !context) {
                return alert("Please enter the Submission Date, Target Leave Date(s), and Message Context.");
            }

            const leaveData = {
                dateSubmitted,
                targetDates,
                employee,
                category,
                context,
                image: currentImageData,
                timestamp: editId && leaveApplications[editId] ? leaveApplications[editId].timestamp : Date.now()
            };

            if (editId) {
                await db.ref(`leave_applications/${editId}`).set(leaveData);
            } else {
                await db.ref('leave_applications').push(leaveData);
            }

            // Interactive confirmation pop-up to import/plot into ROTA Calendar
            const promptPlot = confirm(
                "📅 Plot Leave to ROTA Calendar?\n\nWould you like to automatically sync and plot these target leave date(s) onto the Team ROTA Schedule?"
            );

            if (promptPlot) {
                await autoSyncToRota(employee, category, targetDates, dateSubmitted, 'ADD');
            }

            closeModal();
        }

        function editLeave(id) {
            const log = leaveApplications[id];
            if (!log) return;

            document.getElementById('editLeaveId').value = id;
            document.getElementById('dateSubmitted').value = log.dateSubmitted || new Date().toISOString().split('T')[0];
            document.getElementById('targetLeaveDates').value = log.targetDates || '';
            document.getElementById('leaveEmployee').value = log.employee || 'ANN';
            document.getElementById('leaveCategory').value = log.category || 'VL';
            document.getElementById('leaveContext').value = log.context || '';
            currentImageData = log.image || '';

            const preview = document.getElementById('imagePreview');
            if (currentImageData) {
                preview.src = currentImageData;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }

            document.getElementById('modalTitle').innerText = 'Edit Leave Application';
            document.getElementById('leaveModal').classList.add('show');
        }

        async function deleteLeave(id) {
            const log = leaveApplications[id];
            if (!log) return;

            if (!confirm("Are you sure you want to delete this leave application?")) {
                return;
            }

            // Interactive confirmation pop-up to remove leave from ROTA Calendar
            const promptRemoveRota = confirm(
                "🗓️ Remove Leave from ROTA Calendar?\n\nWould you like to also clear these leave date(s) from the Team ROTA Schedule?"
            );

            if (promptRemoveRota && log.employee && log.targetDates) {
                await autoSyncToRota(log.employee, log.category, log.targetDates, log.dateSubmitted, 'REMOVE');
            }

            await db.ref(`leave_applications/${id}`).remove();
        }

        /**
         * Parses target dates (e.g. "Oct 12", "Oct 12-14", "12 Oct") 
         * and writes or clears VL/SL directly in the Rota Firebase path.
         */
        async function autoSyncToRota(employeeName, category, targetDatesString, submissionDate, action = 'ADD') {
            const leaveTag = (action === 'REMOVE') ? '' : ((category === 'SL') ? 'SL' : 'VL');

            // 1. Fetch current team members to locate the employee's row index
            const teamSnap = await db.ref('team_members').once('value');
            const team = teamSnap.val() || ["Ann", "Dave", "Kenneth", "Kriztel", "Miguel"];
            const memberIndex = team.findIndex(m => m.toLowerCase() === employeeName.toLowerCase());

            if (memberIndex === -1) return;

            // 2. Determine year from submission date
            const subYear = submissionDate ? new Date(submissionDate).getFullYear() : new Date().getFullYear();

            // 3. Month Name mapping helper
            const monthsMap = {
                jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
                jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
            };

            const monthMatch = targetDatesString.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i);
            if (!monthMatch) return;

            const monthNum = monthsMap[monthMatch[0].toLowerCase()];
            const monthKey = `${subYear}_${monthNum}`;

            // Extract numbers (days)
            const dayMatches = targetDatesString.match(/\d+/g);
            if (!dayMatches) return;

            let daysToUpdate = [];

            // Check if input contains a range like "12-15"
            const rangeMatch = targetDatesString.match(/(\d+)\s*-\s*(\d+)/);
            if (rangeMatch) {
                const startDay = parseInt(rangeMatch[1]);
                const endDay = parseInt(rangeMatch[2]);
                for (let d = startDay; d <= endDay; d++) {
                    daysToUpdate.push(d);
                }
            } else {
                daysToUpdate = dayMatches.map(d => parseInt(d));
            }

            // 4. Update Firebase Rota Data for each target day
            for (const day of daysToUpdate) {
                if (day >= 1 && day <= 31) {
                    await db.ref(`rota_data/${monthKey}/${day}/${memberIndex}`).set(leaveTag);
                }
            }
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('show');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
        }

        function toggleDarkMode() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('sb_theme', newTheme);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = function() {
            if (localStorage.getItem('sb_theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            listenToDatabase();
        };
    </script>
