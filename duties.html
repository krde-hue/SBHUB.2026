<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB Team Operational Duty Roster</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: rgba(15, 23, 42, 0.65);
            --card-bg: rgba(30, 41, 59, 0.55);
            --card-border: rgba(255, 255, 255, 0.12);
            --glass-blur: blur(16px) saturate(180%);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --header-text: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.08);
            --table-border: rgba(255, 255, 255, 0.12);
            --accent-gradient: linear-gradient(135deg, rgba(2, 132, 199, 0.8) 0%, rgba(37, 99, 235, 0.8) 100%);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --hover-glow: rgba(56, 189, 248, 0.12);
            
            /* Rest Day Cell Specific Styling Variable */
            --rd-cell-bg: rgba(148, 163, 184, 0.04);
            --rd-cell-border: rgba(148, 163, 184, 0.1);
            
            /* Dynamic Font Scaling Variables */
            --base-font-scale: 1rem;
            --ui-font-size: 11px;
            --task-font-size: 9.5px;
            --header-font-size: 10px;
        }

        [data-theme="light"] {
            --bg-color: #cbd5e1;
            --sidebar-bg: rgba(255, 255, 255, 0.65);
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-border: rgba(255, 255, 255, 0.5);
            --glass-blur: blur(16px) saturate(180%);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --header-text: #0284c7;
            --border-color: rgba(0, 0, 0, 0.08);
            --table-border: rgba(0, 0, 0, 0.12);
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
            --hover-glow: rgba(2, 132, 199, 0.08);
            
            --rd-cell-bg: rgba(100, 116, 139, 0.04);
            --rd-cell-border: rgba(100, 116, 139, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color); 
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-color); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            transition: background-color 0.3s; 
            font-size: var(--base-font-scale); 
        }

        /* Sidebar Navigation Glass Panel */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 12px;
            z-index: 20;
            box-shadow: var(--card-shadow);
            transition: width 0.3s ease, padding 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 76px;
            padding: 16px 10px;
        }

        .sidebar.collapsed .brand-text-container,
        .sidebar.collapsed .sidebar-section-title,
        .sidebar.collapsed .day-nav-btn span:nth-child(2),
        .sidebar.collapsed .day-nav-list,
        .sidebar.collapsed .font-size-control-container,
        .sidebar.collapsed .sidebar-actions .btn span {
            display: none !important;
        }

        .sidebar.collapsed .brand-box {
            justify-content: center;
            padding-left: 0;
        }

        .sidebar.collapsed .day-nav-btn {
            justify-content: center;
            padding: 8px;
        }

        .sidebar.collapsed .sidebar-actions .btn {
            justify-content: center;
            padding: 10px;
            width: 44px !important;
            height: 44px;
            margin: 0 auto;
            border-radius: 10px;
            font-size: 16px;
        }

        .sidebar-top { display: flex; flex-direction: column; gap: 16px; flex: 1; overflow: hidden; }
        .brand-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-left: 8px; }
        .brand-text-container { display: flex; flex-direction: column; }
        .brand-box h2 { font-size: 15px; font-weight: 800; color: var(--header-text); letter-spacing: -0.01em; text-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }
        .brand-subtitle { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }

        .collapse-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .collapse-toggle-btn:hover { background: var(--header-text); color: white; border-color: transparent; }

        .sidebar-section-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; padding-left: 8px; margin-bottom: 6px; }

        .day-nav-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            max-height: calc(100vh - 340px);
            padding-right: 4px;
        }

        .day-nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .day-nav-btn:hover { background-color: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); }
        .day-nav-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
        }

        .sidebar-actions { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border-color); }

        .font-size-control-container {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
        }
        .font-control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        
        .font-slider {
            width: 100%;
            cursor: pointer;
            accent-color: var(--header-text);
            height: 6px;
            touch-action: pan-y;
            user-select: none;
        }

        /* Main Workspace Glass Container */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 12px 16px;
            gap: 10px;
        }

        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            padding: 8px 14px;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .workspace-title { font-size: calc(var(--ui-font-size) + 3px); font-weight: 700; color: var(--header-text); display: flex; align-items: center; gap: 8px; }

        .btn { 
            padding: 6px 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: var(--ui-font-size); 
            transition: all 0.2s; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            text-decoration: none; 
            backdrop-filter: blur(8px);
        }
        .btn-primary { background: var(--accent-gradient); color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); border-color: rgba(255,255,255,0.2); }
        .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-color); border-color: var(--card-border); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
        .btn-archive { background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(79, 70, 229, 0.8) 100%); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25); border-color: rgba(255,255,255,0.2); }
        .btn-archive:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.35); }
        .btn-success { background: linear-gradient(135deg, rgba(16, 185, 129, 0.8) 0%, rgba(5, 150, 105, 0.8) 100%); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); border-color: rgba(255,255,255,0.2); }
        .btn-success:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-warning { background: linear-gradient(135deg, rgba(245, 158, 11, 0.8) 0%, rgba(217, 119, 6, 0.8) 100%); color: white; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); border-color: rgba(255,255,255,0.2); }
        .btn-warning:hover { filter: brightness(1.15); transform: translateY(-1px); }
        
        .btn-lock { background: linear-gradient(135deg, rgba(139, 92, 246, 0.8) 0%, rgba(109, 40, 217, 0.8) 100%); color: white; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25); border-color: rgba(255,255,255,0.2); }
        .btn-lock:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-unlock { background: linear-gradient(135deg, rgba(236, 72, 153, 0.8) 0%, rgba(190, 24, 93, 0.8) 100%); color: white; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25); border-color: rgba(255,255,255,0.2); }
        .btn-unlock:hover { filter: brightness(1.15); transform: translateY(-1px); }

        /* Glass Panel View */
        .day-panel {
            background: var(--card-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .date-picker-wrapper { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            background: rgba(0, 0, 0, 0.2); 
            padding: 5px 10px; 
            border-radius: 8px; 
            border: 1px solid var(--card-border); 
            font-weight: 700; 
            font-size: var(--ui-font-size); 
        }
        .date-picker-input { border: none; font-size: var(--ui-font-size); font-weight: 700; color: var(--text-color); background: transparent; outline: none; cursor: pointer; }

        .reminder-box-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            flex: 1;
            max-width: 420px;
        }
        .reminder-box-input { border: none; background: transparent; font-size: var(--ui-font-size); font-weight: 600; color: var(--text-color); outline: none; width: 100%; }

        /* Schedule Glass Table Layout */
        .schedule-table-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            position: relative;
            background: rgba(0, 0, 0, 0.1);
            width: 100%;
        }

        .schedule-table { 
            width: 100%; 
            display: table;
            border-collapse: separate; 
            border-spacing: 0; 
            table-layout: fixed; 
        }

        th, td {
            border-bottom: 1px solid var(--table-border);
            border-right: 1px solid var(--border-color);
            background-color: transparent;
            transition: background 0.15s;
        }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }

        th.col-member, td:nth-child(1) { width: 10%; min-width: 80px; }
        th.col-shift, td:nth-child(2) { width: 11%; min-width: 100px; }
        
        th:nth-child(n+3), td:nth-child(n+3) {
            width: 13.16%;
        }

        th {
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            color: var(--header-text);
            padding: 10px 6px;
            text-align: center;
            font-weight: 700;
            border-bottom: 2px solid var(--table-border);
            font-size: var(--header-font-size);
            text-transform: uppercase;
            letter-spacing: -0.01em;
            z-index: 5;
        }

        td { vertical-align: top; height: 25%; }
        td:hover { background-color: var(--hover-glow); }

        .team-member-cell { padding: 4px; font-weight: 800; font-size: calc(var(--ui-font-size) + 1px); color: var(--text-color); text-align: center; text-transform: uppercase; display: flex; align-items: center; justify-content: center; height: 100%; background: rgba(0,0,0,0.1); }
        
        .shift-select-container { padding: 4px; display: flex; align-items: center; justify-content: center; height: 100%; }
        .shift-select { border: 1px solid var(--card-border); background: rgba(0,0,0,0.25); font-weight: 600; font-size: var(--ui-font-size); cursor: pointer; outline: none; width: 100%; padding: 4px; border-radius: 6px; color: var(--text-color); text-align: center; }

        /* Rest Day Row & Watermark */
        tr.row-rest-day td {
            background-color: var(--rd-cell-bg) !important;
            border-color: var(--rd-cell-border) !important;
        }

        .restday-row-watermark-cell {
            position: relative;
            vertical-align: middle !important;
            text-align: center;
        }

        .restday-watermark-text {
            font-size: calc(var(--ui-font-size) + 4px);
            font-weight: 800;
            color: var(--text-muted);
            opacity: 0.3;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            display: inline-block;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Task Card & Checkbox Styling */
        .task-card { 
            padding: 6px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            position: relative; 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        .task-card.off-duty-active {
            background-color: transparent !important;
            border: none !important;
            opacity: 0.9;
        }

        .task-card.off-duty-active .task-items-container,
        .task-card.off-duty-active .task-dropdown-container {
            display: none !important;
        }

        .task-dropdown-container { position: relative; width: 100%; flex-shrink: 0; }
        .task-dropdown-btn { border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); font-weight: 600; font-size: var(--ui-font-size); cursor: pointer; outline: none; width: 100%; padding: 3px 6px; border-radius: 6px; text-align: left; display: flex; justify-content: space-between; align-items: center; color: var(--text-color); backdrop-filter: blur(4px); }
        .task-dropdown-btn:hover { background: rgba(255,255,255,0.1); }

        .task-dropdown-content { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--sidebar-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--card-border); border-radius: 8px; box-shadow: var(--card-shadow); z-index: 100; max-height: 240px; overflow-y: auto; padding: 6px; margin-top: 2px; }
        .task-dropdown-content.show { display: block; }

        .category-header-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            font-weight: 800;
            color: var(--header-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin-bottom: 3px;
            cursor: pointer;
            user-select: none;
        }
        .category-header-label:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        .task-option-label { display: flex; align-items: center; padding: 3px 6px; font-size: var(--ui-font-size); cursor: pointer; color: var(--text-color); gap: 6px; user-select: none; border-radius: 4px; }
        .task-option-label:hover { background-color: rgba(255, 255, 255, 0.1); }

        .remove-task-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            padding: 0 3px;
            line-height: 1;
            border-radius: 3px;
            transition: all 0.15s ease;
        }
        .remove-task-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        /* Checkbox Task List inside Cells */
        .task-items-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            flex: 1;
            padding-top: 2px;
            min-height: 30px;
        }

        /* Drag and Drop Task Styling */
        .task-item-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
            cursor: grab;
        }

        .task-item-row:active {
            cursor: grabbing;
        }

        .task-item-row.dragging {
            opacity: 0.4;
            border: 1px dashed var(--header-text);
        }

        .task-item-row.drag-over {
            border-top: 2px solid var(--header-text) !important;
            transform: translateY(-2px);
        }

        .task-item-row:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.25);
        }

        .task-item-row.completed {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.25);
        }

        .task-item-row.completed .task-item-text {
            text-decoration: line-through;
            opacity: 0.55;
            color: var(--text-muted);
        }

        .task-item-checkbox {
            cursor: pointer;
            width: 13px;
            height: 13px;
            accent-color: #10b981;
            flex-shrink: 0;
        }

        .task-item-text {
            font-size: var(--task-font-size);
            font-weight: 600;
            color: var(--text-color);
            word-break: break-word;
            line-height: 1.35;
            flex: 1;
            user-select: none;
        }

        .autosave-badge { font-size: var(--ui-font-size); color: #10b981; font-weight: 700; opacity: 0; transition: opacity 0.3s; background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.3); padding: 3px 8px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 4px; }
        
        @keyframes bounceSticker { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.1); } }
        .jumping-sticker { display: inline-block; font-size: 16px; animation: bounceSticker 0.6s infinite ease-in-out; margin: 0 4px; }
        
        .shift-end-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(16, 185, 129, 0.2));
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: var(--ui-font-size);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-shrink: 0;
            box-shadow: var(--card-shadow);
        }

        /* Password & Archive Glass Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
        .modal-card {
            background: var(--sidebar-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            padding: 22px;
            border-radius: 14px;
            box-shadow: var(--card-shadow);
            width: 360px;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
        }
        .modal-card h3 { font-size: 15px; font-weight: 800; color: var(--header-text); }
        .modal-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 50vh;
            padding-right: 4px;
        }
        .archive-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        function getNormalizedSlotTasks(rawList) {
            if (!Array.isArray(rawList)) return [];
            return rawList.map(item => {
                if (typeof item === 'string') return { text: item, done: false };
                return { text: item.text || '', done: !!item.done };
            });

        /* Drag and Drop Handlers for Duty Tasks */
        function handleTaskDragStart(event, memberId, slotId, taskIdx) {
            if (isLocked) { event.preventDefault(); return; }
            dragSource = { memberId, slotId, taskIdx };
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', JSON.stringify(dragSource));
            event.currentTarget.classList.add('dragging');
        }

        function handleTaskDragOver(event) {
            if (isLocked) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const row = event.currentTarget.closest('.task-item-row');
            if (row) row.classList.add('drag-over');
        }

        function handleTaskDragLeave(event) {
            const row = event.currentTarget.closest('.task-item-row');
            if (row) row.classList.remove('drag-over');
        }

        function handleTaskDrop(event, targetMemberId, targetSlotId, targetTaskIdx) {
            event.preventDefault();
            event.stopPropagation();
            document.querySelectorAll('.task-item-row').forEach(el => el.classList.remove('drag-over', 'dragging'));

            if (isLocked || !dragSource) return;

            const { memberId: srcMemberId, slotId: srcSlotId, taskIdx: srcTaskIdx } = dragSource;

            if (srcMemberId === targetMemberId && srcSlotId === targetSlotId) {
                let dayGrid = database[selectedDayKey].grid[srcMemberId];
                let normalized = getNormalizedSlotTasks(dayGrid.slots[srcSlotId]);
                const [movedItem] = normalized.splice(srcTaskIdx, 1);
                normalized.splice(targetTaskIdx, 0, movedItem);
                dayGrid.slots[srcSlotId] = normalized;
            } else {
                let srcGrid = database[selectedDayKey].grid[srcMemberId];
                let tgtGrid = database[selectedDayKey].grid[targetMemberId];
                let srcTasks = getNormalizedSlotTasks(srcGrid.slots[srcSlotId]);
                let tgtTasks = getNormalizedSlotTasks(tgtGrid.slots[targetSlotId]);

                const [movedItem] = srcTasks.splice(srcTaskIdx, 1);
                tgtTasks.splice(targetTaskIdx, 0, movedItem);

                srcGrid.slots[srcSlotId] = srcTasks;
                tgtGrid.slots[targetSlotId] = tgtTasks;
            }

            dragSource = null;
            saveToDatabase();
            renderActiveDayPanel();
        }

            if (isLocked || !dragSource) return;

        function renderArchivesModalContent() {
            const container = document.getElementById('archivesModalContainer');

                archiveItemsHtml = `<p style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 20px;">No archived days found.</p>`;

                    let archivedDate = item.archivedAt ? new Date(item.archivedAt).toLocaleDateString() : '';
                    return `
                        <div class="archive-item">

                                <span class="archive-item-date">📅 ${displayDate}</span>
                                <span class="archive-item-meta">${item.reminder ? '📌 ' + item.reminder : 'No notes'} ${archivedDate ? ' • Archived: ' + archivedDate : ''}</span>

                masterRotaCalendar = snapshot.val() || {};
                syncShiftsFromRotaMaster();
            });

            db.ref('roster_data').on('value', (snapshot) => {
                const liveData = snapshot.val();
                if (liveData && typeof liveData === 'object' && Object.keys(liveData).length > 0) {

        function parseRotaShiftToShiftId(rawShiftText) {
            if (!rawShiftText) return null;
            let text = rawShiftText.trim();
            if (text.startsWith("Adjusted:") || text === "Adjusted") return "shift-adjusted";
            if (text === "RD") return "shift-rd";
            if (text === "VL") return "shift-vl";
            if (text === "SL") return "shift-sl";
            if (text === "6:00 - 15:00") return "shift-6-15";
            if (text === "6:00 - 15:00 (WFH)") return "shift-6-15-wfh";
            if (text === "7:00 - 16:00") return "shift-7-16";
            if (text === "7:00 - 16:00 (WFH)") return "shift-7-16-wfh";
            if (text === "9:00 - 18:00") return "shift-9-18";
            if (text === "9:00 - 18:00 (WFH)") return "shift-9-18-wfh";
            if (text === "10:00 - 19:00") return "shift-10-19";
            if (text === "10:00 - 19:00 (WFH)") return "shift-10-19-wfh";
            if (text === "12:00 - 21:00") return "shift-12-21";
            if (text === "12:00 - 21:00 (WFH)") return "shift-12-21-wfh";
            if (text === "14:00 - 23:00") return "shift-14-23";
            if (text === "14:00 - 23:00 (WFH)") return "shift-14-23-wfh";
            if (text === "15:00 - 00:00") return "shift-15-0";
            if (text === "15:00 - 00:00 (WFH)") return "shift-15-0-wfh";
            if (text === "16:00 - 1:00" || text === "16:00 - 01:00") return "shift-16-1";
            if (text === "16:00 - 1:00 (WFH)" || text === "16:00 - 01:00 (WFH)") return "shift-16-1-wfh";
            return "shift-adjusted";
        }

        function syncShiftsFromRotaMaster() {
            if (!masterRotaCalendar || Object.keys(masterRotaCalendar).length === 0) return;
            let updated = false;
            Object.keys(database || {}).forEach(dayKey => {
                if (dayKey === 'archives') return;
                let dayData = database[dayKey];
                if (dayData && dayData.isoDate) {
                    let dateParts = dayData.isoDate.split('-');
                    if (dateParts.length === 3) {
                        let year = dateParts[0];
                        let month = parseInt(dateParts[1], 10);
                        let dayNum = parseInt(dateParts[2], 10);
                        let rotaMonthKey = `${year}_${month}`;
                        let rotaDayRow = masterRotaCalendar[rotaMonthKey] ? masterRotaCalendar[rotaMonthKey][dayNum] : null;

                        if (rotaDayRow) {
                            members.forEach(m => {
                                let rawRotaShift = rotaDayRow[m.index];
                                let matchedShiftId = parseRotaShiftToShiftId(rawRotaShift);
                                if (matchedShiftId) {
                                    if (!dayData.grid[m.id]) dayData.grid[m.id] = { slots: {} };
                                    if (dayData.grid[m.id].shift !== matchedShiftId) {
                                        dayData.grid[m.id].shift = matchedShiftId;
                                        updated = true;
                                    }
                                }
                            });
                        }
                    }
                }
            });
            if (updated) renderApp();
        }

        function checkNearShiftEnd() {
            if (isCalendarMaximized) return;
            const now = new Date();
            const currentMinutesOfDay = now.getHours() * 60 + now.getMinutes();
            if (!database[selectedDayKey]) return;
            let activeGrid = database[selectedDayKey].grid || {};
            let endingMembers = [];

            members.forEach(m => {
                let memberData = activeGrid[m.id] || { shift: m.defaultShift };
                let shiftObj = shifts.find(s => s.id === memberData.shift);
                if (shiftObj && shiftObj.endHour !== null) {
                    let endMinutesOfDay = shiftObj.endHour * 60 + shiftObj.endMinute;
                    if ((shiftObj.endHour === 0 || shiftObj.endHour === 1) && currentMinutesOfDay > 12 * 60) endMinutesOfDay += 24 * 60;
                    let minutesRemaining = endMinutesOfDay - currentMinutesOfDay;
                    if (minutesRemaining > 0 && minutesRemaining <= 20) endingMembers.push(m.name);
                }
            });

            const banner = document.getElementById('shiftEndBanner');
            const messageElem = document.getElementById('shiftEndMessage');
            if (endingMembers.length > 0) {
                let nameString = endingMembers.length === 1 ? endingMembers[0] : `${endingMembers.slice(0, -1).join(', ')}, and ${endingMembers[endingMembers.length - 1]}`;
                messageElem.innerText = `Almost there, ${nameString}! Shift ends in less than 20 minutes.`;
                banner.style.display = 'flex';
            } else {
                banner.style.display = 'none';
            }
        }

        function autoDistributeTasks() {
            if (isLocked) { alert("Roster is locked! Unlock with password to modify."); return; }
            if (!database[selectedDayKey]) return;
            let dayData = database[selectedDayKey];
            let grid = dayData.grid || {};

            const continuousCoreTasks = [
                "Edge Prediction Market Ticker",
                "Pubs Prediction Market Ticker",
                "@Sportsbook Escalation Check",
                "Site Checking (Web/Mobile)"
            ];

            const generalPool = availableTasks.filter(t => !continuousCoreTasks.includes(t) && t !== "Handover Report AM" && t !== "Handover Report PM");

            members.forEach(m => {
                if (grid[m.id]) grid[m.id].slots = {};
            });

            timeSlots.forEach(slot => {
                let activeInSlot = members.filter(m => !isOffDuty(grid[m.id]?.shift || m.defaultShift, slot.id));
                if (activeInSlot.length > 0) {
                    continuousCoreTasks.forEach((coreTask, idx) => {
                        let assignedMember = activeInSlot[idx % activeInSlot.length];
                        if (!grid[assignedMember.id].slots[slot.id]) grid[assignedMember.id].slots[slot.id] = [];
                        let normalized = getNormalizedSlotTasks(grid[assignedMember.id].slots[slot.id]);
                        if (!normalized.some(t => t.text === coreTask)) {
                            grid[assignedMember.id].slots[slot.id].push({ text: coreTask, done: false });
                        }
                    });
                }
            });

            let generalPoolIdx = 0;
            timeSlots.forEach(slot => {
                let activeInSlot = members.filter(m => !isOffDuty(grid[m.id]?.shift || m.defaultShift, slot.id));
                activeInSlot.forEach((m) => {
                    if (!grid[m.id].slots[slot.id]) grid[m.id].slots[slot.id] = [];
                    let task1 = generalPool[generalPoolIdx % generalPool.length];
                    let task2 = generalPool[(generalPoolIdx + 1) % generalPool.length];
                    generalPoolIdx += 2;

                    [task1, task2].forEach(t => {
                        let normalized = getNormalizedSlotTasks(grid[m.id].slots[slot.id]);
                        if (!normalized.some(item => item.text === t)) {
                            grid[m.id].slots[slot.id].push({ text: t, done: false });
                        }
                    });
                });
            });

            members.forEach(m => {
                let memberShift = grid[m.id]?.shift || m.defaultShift;
                let workingSlots = timeSlots.filter(s => !isOffDuty(memberShift, s.id));
                if (workingSlots.length > 0) {
                    let finalSlot = workingSlots[workingSlots.length - 1];
                    
                    if (memberShift.includes('9-18') || memberShift.includes('6-15') || memberShift.includes('7-16')) {
                        if (!grid[m.id].slots[finalSlot.id]) grid[m.id].slots[finalSlot.id] = [];
                        let normalized = getNormalizedSlotTasks(grid[m.id].slots[finalSlot.id]);
                        if (!normalized.some(item => item.text === "Handover Report AM")) {
                            grid[m.id].slots[finalSlot.id].push({ text: "Handover Report AM", done: false });
                        }
                    }

                    if (memberShift.includes('15-0') || memberShift.includes('12-21') || memberShift.includes('14-23') || memberShift.includes('16-1') || finalSlot.id === 'slot_21_0') {
                        if (!grid[m.id].slots[finalSlot.id]) grid[m.id].slots[finalSlot.id] = [];
                        let normalized = getNormalizedSlotTasks(grid[m.id].slots[finalSlot.id]);
                        if (!normalized.some(item => item.text === "Handover Report PM")) {
                            grid[m.id].slots[finalSlot.id].push({ text: "Handover Report PM", done: false });
                        }
                    }
                }
            });

            saveToDatabase();
            renderActiveDayPanel();
        }

        function shuffleTasks() {
            if (isLocked) { alert("Roster is locked! Unlock with password to modify."); return; }
            if (!database[selectedDayKey]) return;
            let dayData = database[selectedDayKey];
            let grid = dayData.grid || {};

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            const continuousCoreTasks = [
                "Edge Prediction Market Ticker",
                "Pubs Prediction Market Ticker",
                "@Sportsbook Escalation Check",
                "Site Checking (Web/Mobile)"
            ];

            const generalPool = availableTasks.filter(t => !continuousCoreTasks.includes(t) && t !== "Handover Report AM" && t !== "Handover Report PM");

            members.forEach(m => {
                if (grid[m.id]) grid[m.id].slots = {};
            });

            let shuffledGeneral = shuffleArray([...generalPool]);
            let genIdx = 0;

            timeSlots.forEach(slot => {
                let activeInSlot = members.filter(m => !isOffDuty(grid[m.id]?.shift || m.defaultShift, slot.id));
                if (activeInSlot.length > 0) {
                    let shuffledCore = shuffleArray([...continuousCoreTasks]);
                    shuffledCore.forEach((coreTask, idx) => {
                        let assignedMember = activeInSlot[idx % activeInSlot.length];
                        if (!grid[assignedMember.id].slots[slot.id]) grid[assignedMember.id].slots[slot.id] = [];
                        let normalized = getNormalizedSlotTasks(grid[assignedMember.id].slots[slot.id]);
                        if (!normalized.some(item => item.text === coreTask)) {
                            grid[assignedMember.id].slots[slot.id].push({ text: coreTask, done: false });
                        }
                    });

                    activeInSlot.forEach((m) => {
                        if (!grid[m.id].slots[slot.id]) grid[m.id].slots[slot.id] = [];
                        let t1 = shuffledGeneral[genIdx % shuffledGeneral.length];
                        let t2 = shuffledGeneral[(genIdx + 1) % shuffledGeneral.length];
                        genIdx += 2;

                        [t1, t2].forEach(t => {
                            let normalized = getNormalizedSlotTasks(grid[m.id].slots[slot.id]);
                            if (!normalized.some(item => item.text === t)) {
                                grid[m.id].slots[slot.id].push({ text: t, done: false });
                            }
                        });
                    });
                }
            });

            members.forEach(m => {
                let memberShift = grid[m.id]?.shift || m.defaultShift;
                let workingSlots = timeSlots.filter(s => !isOffDuty(memberShift, s.id));
                if (workingSlots.length > 0) {
                    let finalSlot = workingSlots[workingSlots.length - 1];
                    
                    if (memberShift.includes('9-18') || memberShift.includes('6-15') || memberShift.includes('7-16')) {
                        if (!grid[m.id].slots[finalSlot.id]) grid[m.id].slots[finalSlot.id] = [];
                        let normalized = getNormalizedSlotTasks(grid[m.id].slots[finalSlot.id]);
                        if (!normalized.some(item => item.text === "Handover Report AM")) {
                            grid[m.id].slots[finalSlot.id].push({ text: "Handover Report AM", done: false });
                        }
                    }

                    if (memberShift.includes('15-0') || memberShift.includes('12-21') || memberShift.includes('14-23') || memberShift.includes('16-1') || finalSlot.id === 'slot_21_0') {
                        if (!grid[m.id].slots[finalSlot.id]) grid[m.id].slots[finalSlot.id] = [];
                        let normalized = getNormalizedSlotTasks(grid[m.id].slots[finalSlot.id]);
                        if (!normalized.some(item => item.text === "Handover Report PM")) {
                            grid[m.id].slots[finalSlot.id].push({ text: "Handover Report PM", done: false });
                        }
                    }
                }
            });

            saveToDatabase();
            renderActiveDayPanel();
        }

        function renderSidebarNav() {
            const navList = document.getElementById('sidebarDayNavList');
            if (!navList) return;
            navList.innerHTML = '';

            const todayStr = new Date().toISOString().split('T')[0];
            let dayKeys = Object.keys(database || {}).filter(k => k !== 'archives');

            // Automatic date sorting: Today at very top, future dates next, past dates pushed to the bottom
            dayKeys.sort((a, b) => {
                let dateA = database[a]?.isoDate || '';
                let dateB = database[b]?.isoDate || '';

                let isTodayA = (dateA === todayStr);
                let isTodayB = (dateB === todayStr);

                if (isTodayA && !isTodayB) return -1;
                if (!isTodayA && isTodayB) return 1;

                let isPastA = dateA < todayStr;
                let isPastB = dateB < todayStr;

                if (!isPastA && isPastB) return -1;
                if (isPastA && !isPastB) return 1;

                return dateA.localeCompare(dateB);
            });

            dayKeys.forEach((dayKey, index) => {
                let dayData = database[dayKey];
                let isToday = dayData.isoDate === todayStr;
                let displayDate = dayData.isoDate ? dayData.isoDate.split('-').slice(1).join('/') : `Day ${index + 1}`;
                let isActive = dayKey === selectedDayKey;

                let btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `day-nav-btn ${isActive ? 'active' : ''}`;
                btn.innerHTML = `<span>📅 ${displayDate} ${isToday ? '⭐️' : ''}</span> <span style="font-size:10px; opacity:0.8;">#${index + 1}</span>`;
                btn.onclick = () => {
                    selectedDayKey = dayKey;
                    renderApp();
                    checkNearShiftEnd();
                };
                navList.appendChild(btn);
            });
        }

                            <div class="task-item-row ${tObj.done ? 'completed' : ''}"
                                 draggable="${!isLocked}"
                                 ondragstart="handleTaskDragStart(event, '${m.id}', '${slot.id}', ${tIdx})"
                                 ondragover="handleTaskDragOver(event)"
                                 ondragleave="handleTaskDragLeave(event)"
                                 ondrop="handleTaskDrop(event, '${m.id}', '${slot.id}', ${tIdx})"
                                 ondragend="handleTaskDragEnd()">
                                <input type="checkbox" class="task-item-checkbox" ${tObj.done ? 'checked' : ''} ${isLocked ? 'disabled' : ''} onchange="toggleTaskDone('${m.id}', '${slot.id}', ${tIdx}, this.checked, event)">
                                <span class="task-item-text">${tObj.text}</span>
                                ${!isLocked ? `<button type="button" class="remove-task-btn no-print" onclick="removeTask('${m.id}', '${slot.id}', ${tIdx}, event)" title="Remove task">×</button>` : ''}
                            </div>
                        `).join('');

                        let td = document.createElement('td');
                        td.innerHTML = `
                            <div class="task-card ${memberGrid.shift} ${offDutyClass}">
                                <div class="task-dropdown-container no-print" onclick="event.stopPropagation();" ${isLocked ? 'style="display:none;"' : ''}>
                                    <button type="button" class="task-dropdown-btn" onclick="toggleDropdown(event, '${dropdownId}')">
                                        <span>▼ Tasks</span>
                                    </button>
                                    <div id="dropdown-${dropdownId}" class="task-dropdown-content ${dropdownOpenClass}" onclick="event.stopPropagation();">
                                        ${taskCheckboxes}
                                        ${customInputSection}
                                    </div>
                                </div>
                                <div class="task-items-container"
                                     ondragover="handleTaskDragOver(event)"
                                     ondrop="handleContainerDrop(event, '${m.id}', '${slot.id}')">
                                    ${taskItemsHtml}
                                </div>
                            </div>
                        `;
                        tr.appendChild(td);
                    });
                }
                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            tableWrapper.appendChild(table);
            panel.appendChild(tableWrapper);
            container.appendChild(panel);
        }

        function toggleDropdown(event, id) {
            if (isLocked) return;
            event.stopPropagation();
            const targetContent = document.getElementById(`dropdown-${id}`);
            const isCurrentlyShown = targetContent.classList.contains('show');
            document.querySelectorAll('.task-dropdown-content').forEach(el => el.classList.remove('show'));
            if (!isCurrentlyShown) {
                targetContent.classList.add('show');
                activeOpenDropdownId = id;
            } else {
                activeOpenDropdownId = null;
            }
        }

        function toggleTask(memberId, slotId, checkbox, event) {
            if (isLocked) return;
            if (event) event.stopPropagation();
            if (!database[selectedDayKey]) database[selectedDayKey] = { grid: {} };
            if (!database[selectedDayKey].grid[memberId]) database[selectedDayKey].grid[memberId] = { shift: 'shift-7-16', slots: {} };
            let dayGrid = database[selectedDayKey].grid[memberId];
            if (!dayGrid.slots) dayGrid.slots = {};
            if (!dayGrid.slots[slotId]) dayGrid.slots[slotId] = [];

            let normalized = getNormalizedSlotTasks(dayGrid.slots[slotId]);

            if (checkbox.checked) {
                if (!normalized.some(item => item.text === checkbox.value)) {
                    normalized.push({ text: checkbox.value, done: false });
                }
            } else {
                normalized = normalized.filter(item => item.text !== checkbox.value);
            }

            dayGrid.slots[slotId] = normalized;
            saveToDatabase();
            renderActiveDayPanel();
        }

        function toggleCategoryTasks(memberId, slotId, catIdx, isChecked, event) {
            if (isLocked) return;
            if (event) event.stopPropagation();
            if (!database[selectedDayKey]) database[selectedDayKey] = { grid: {} };
            if (!database[selectedDayKey].grid[memberId]) database[selectedDayKey].grid[memberId] = { shift: 'shift-7-16', slots: {} };
            let dayGrid = database[selectedDayKey].grid[memberId];
            if (!dayGrid.slots) dayGrid.slots = {};
            if (!dayGrid.slots[slotId]) dayGrid.slots[slotId] = [];

            let normalized = getNormalizedSlotTasks(dayGrid.slots[slotId]);
            let catTasks = taskCategories[catIdx] ? taskCategories[catIdx].tasks : [];

            if (isChecked) {
                catTasks.forEach(t => {
                    if (!normalized.some(item => item.text === t)) {
                        normalized.push({ text: t, done: false });
                    }
                });
            } else {
                normalized = normalized.filter(item => !catTasks.includes(item.text));
            }

            dayGrid.slots[slotId] = normalized;
            saveToDatabase();
            renderActiveDayPanel();
        }

        function addCustomTask(memberId, slotId, taskText) {
            if (isLocked) return;
            if (!taskText || !taskText.trim()) return;
            let text = taskText.trim();

            if (!database[selectedDayKey]) database[selectedDayKey] = { grid: {} };
            if (!database[selectedDayKey].grid[memberId]) database[selectedDayKey].grid[memberId] = { shift: 'shift-7-16', slots: {} };
            let dayGrid = database[selectedDayKey].grid[memberId];
            if (!dayGrid.slots) dayGrid.slots = {};
            if (!dayGrid.slots[slotId]) dayGrid.slots[slotId] = [];

            let normalized = getNormalizedSlotTasks(dayGrid.slots[slotId]);
            if (!normalized.some(item => item.text.toLowerCase() === text.toLowerCase())) {
                normalized.push({ text: text, done: false });
                dayGrid.slots[slotId] = normalized;
                saveToDatabase();
                renderActiveDayPanel();
            }
        }

        function removeTask(memberId, slotId, taskIdx, event) {
            if (event) event.stopPropagation();
            if (isLocked) return;
            if (!database[selectedDayKey] || !database[selectedDayKey].grid[memberId]) return;
            let dayGrid = database[selectedDayKey].grid[memberId];
            if (!dayGrid.slots || !dayGrid.slots[slotId]) return;

            let normalized = getNormalizedSlotTasks(dayGrid.slots[slotId]);
            normalized.splice(taskIdx, 1);
            dayGrid.slots[slotId] = normalized;
            saveToDatabase();
            renderActiveDayPanel();
        }

        function toggleTaskDone(memberId, slotId, taskIdx, isDone, event) {
            if (event) event.stopPropagation();
            if (isLocked) return;
            if (!database[selectedDayKey] || !database[selectedDayKey].grid[memberId]) return;
            let dayGrid = database[selectedDayKey].grid[memberId];
            if (!dayGrid.slots || !dayGrid.slots[slotId]) return;

            let normalized = getNormalizedSlotTasks(dayGrid.slots[slotId]);
            if (normalized[taskIdx]) {
                normalized[taskIdx].done = isDone;
                dayGrid.slots[slotId] = normalized;
                saveToDatabase();
                renderActiveDayPanel();
            }
        }

        function syncActiveDropdownCheckboxes() {
            if (!activeOpenDropdownId) return;
            let parts = activeOpenDropdownId.split('-');
            if (parts.length < 3) return;
            let dayKey = parts[0];
            let memberId = parts[1];
            let slotId = parts[2];

            let rawTaskList = (database[dayKey] && database[dayKey].grid[memberId] && database[dayKey].grid[memberId].slots[slotId]) 
                ? database[dayKey].grid[memberId].slots[slotId] : [];
            let normalized = getNormalizedSlotTasks(rawTaskList);

            let dropdown = document.getElementById(`dropdown-${activeOpenDropdownId}`);
            if (dropdown) {
                dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    if (cb.value) {
                        cb.checked = normalized.some(item => item.text === cb.value);
                    }
                });
            }
        }

        function changeShift(memberId, newShift) {
            if (isLocked) return;
            if (!database[selectedDayKey]) database[selectedDayKey] = { grid: {} };
            if (!database[selectedDayKey].grid[memberId]) database[selectedDayKey].grid[memberId] = { slots: {} };
            database[selectedDayKey].grid[memberId].shift = newShift;
            saveToDatabase();
            checkNearShiftEnd();
            renderActiveDayPanel();
        }

        function updateDayDate(newIsoDate) {
            if (isLocked) return;
            if (!database[selectedDayKey]) return;
            database[selectedDayKey].isoDate = newIsoDate;
            saveToDatabase();
            syncShiftsFromRotaMaster();
            renderSidebarNav();
            document.getElementById('activeWorkspaceTitle').innerText = `📅 Schedule Roster — ${newIsoDate}`;
        }

        function clearDayDuties() {
            if (isLocked) return;
            if (confirm("Clear tasks for this active day?")) {
                members.forEach(m => {
                    if (database[selectedDayKey] && database[selectedDayKey].grid[m.id]) database[selectedDayKey].grid[m.id].slots = {};
                });
                saveToDatabase();
                renderActiveDayPanel();
            }
        }

        function clearAllData() {
            if (isLocked) return;
            if (confirm("Clear ALL duties across all active days?")) {
                Object.keys(database || {}).forEach(dayKey => {
                    if (dayKey === 'archives') return;
                    members.forEach(m => {
                        if (database[dayKey] && database[dayKey].grid[m.id]) database[dayKey].grid[m.id].slots = {};
                    });
                });
                saveToDatabase();
                renderActiveDayPanel();
            }
        }

        function deleteActiveDay() {
            if (isLocked) return;
            let dayKeys = Object.keys(database || {}).filter(k => k !== 'archives');
            
            let choice = confirm("Do you want to Archive this day sheet to keep a copy?\n\nPress OK to Archive, or Cancel to Delete Permanently.");
            if (choice) {
                archiveActiveDay();
            } else {
                if (dayKeys.length <= 1) return alert("You must keep at least one active day sheet.");
                if (confirm("Permanently delete this day sheet?")) {
                    delete database[selectedDayKey];
                    selectedDayKey = Object.keys(database).filter(k => k !== 'archives')[0];
                    saveToDatabase();
                    renderApp();
                }
            }
        }

        function addNewDay() {
            if (isLocked) { alert("Roster is locked! Unlock with password to modify."); return; }
            let dayKeys = Object.keys(database || {}).filter(k => k !== 'archives');
            let lastKey = dayKeys[dayKeys.length - 1] || "day_1";
            let lastIsoStr = (database[lastKey] && database[lastKey].isoDate) ? database[lastKey].isoDate : new Date().toISOString().split('T')[0];
            
            let lastDate = new Date(lastIsoStr);
            if (isNaN(lastDate.getTime())) lastDate = new Date();
            lastDate.setDate(lastDate.getDate() + 1);
            
            let newIsoDate = lastDate.toISOString().split('T')[0];
            let newDayNum = parseInt(lastKey.split('_')[1] || '1') + 1;
            let newDayId = "day_" + newDayNum;
            
            database[newDayId] = { isoDate: newIsoDate, reminder: "", grid: {} };
            members.forEach(m => {
                database[newDayId].grid[m.id] = { shift: m.defaultShift, slots: {} };
            });
            
            selectedDayKey = newDayId;
            saveToDatabase();
            syncShiftsFromRotaMaster();
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('sb_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeButtonLabel(savedTheme);

            const savedFontLevel = localStorage.getItem('sb_font_size_level') || '1';
            changeFontSizeLevel(savedFontLevel);

            setupSidebarHoverEvents();

            listenToLiveDatabase();
            setupPresenceSystem();

            window.addEventListener('click', function(e) {
                if (!e.target.closest('.task-dropdown-container')) {
                    document.querySelectorAll('.task-dropdown-content').forEach(el => el.classList.remove('show'));
                    activeOpenDropdownId = null;
                }
            });
        };
    </script>
</body>
</html>
