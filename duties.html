<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Task Scheduler - Duties</title>

    <!-- Shared Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f2537;
            --text-color: #ffffff;
            --header-bg: #143149;
            --card-bg: #112d44;
            --slot-bg: #0f2537;
            --border-color: #3a5a7a;
            --dropdown-bg: #16334d;
            --dropdown-btn-bg: #183854;
            --text-muted: #cbd5e1;
            --off-shift-bg: #0a1926;
            --off-day-bg: #050d14;
            --input-bg: #1b3d5a;
        }

        body.light-theme {
            --bg-color: #f1f5f9;
            --text-color: #0f172a;
            --header-bg: #ffffff;
            --card-bg: #e2e8f0;
            --slot-bg: #ffffff;
            --border-color: #cbd5e1;
            --dropdown-bg: #ffffff;
            --dropdown-btn-bg: #e2e8f0;
            --text-muted: #334155;
            --off-shift-bg: #f8fafc;
            --off-day-bg: #f1f5f9;
            --input-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--header-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .date-picker-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--input-bg);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .date-btn {
            background: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .meta-info input[type="date"], .meta-info select, .meta-info input[type="text"], .meta-info input[type="time"] {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 13px;
        }

        .meeting-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--input-bg);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            color: #ffffff;
        }

        .btn-primary { background-color: #2563eb; }
        .btn-secondary { background-color: #475569; }
        .btn-success { background-color: #10b981; }
        .btn-danger { background-color: #ef4444; }
        .btn-warning { background-color: #f59e0b; color: #1e293b; }
        .btn-theme { background-color: #8b5cf6; }

        .scheduler-grid {
            display: grid;
            grid-template-columns: 220px repeat(4, 1fr);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--slot-bg);
        }

        .grid-header {
            border: 1px dashed var(--border-color);
            padding: 12px;
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            background-color: var(--header-bg);
            color: #38bdf8;
        }

        .team-col {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 1px dashed var(--border-color);
            background-color: var(--card-bg);
        }

        .member-card {
            flex: 1;
            height: 100%;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0px 1px 2px rgba(0,0,0,0.6);
            text-transform: uppercase;
            border-radius: 4px;
            font-size: 13px;
        }

        .shift-select-box {
            width: 115px;
        }

        .shift-select-box select {
            width: 100%;
            padding: 5px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .wfh-6am { background-color: #fbcfe8 !important; color: #831843 !important; }
        .wfh-9am { background-color: #f472b6 !important; color: #831843 !important; }
        .wfh-12pm { background-color: #e9d5ff !important; color: #581c87 !important; }
        .wfh-3pm { background-color: #a855f7 !important; color: #ffffff !important; }

        .bg-ann { background-color: #db2777; }
        .bg-dave { background-color: #0284c7; }
        .bg-kenneth { background-color: #65a30d; }
        .bg-kriztel { background-color: #ea580c; }

        .time-slot-cell {
            border: 1px dashed var(--border-color);
            padding: 8px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            background-color: var(--slot-bg);
            position: relative;
        }

        .time-slot-cell.off-shift {
            opacity: 0.4;
            background-color: var(--off-shift-bg);
        }

        .time-slot-cell.off-day {
            opacity: 0.3;
            background-color: var(--off-day-bg);
        }

        .status-badge {
            margin: auto;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
        }

        .badge-rd { color: #ef4444; border: 1px dashed #ef4444; }
        .badge-vl { color: #f59e0b; border: 1px dashed #f59e0b; }
        .badge-sl { color: #06b6d4; border: 1px dashed #06b6d4; }

        .dropdown-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 8px;
        }

        .dropdown-btn {
            width: 100%;
            background-color: var(--dropdown-btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            font-size: 11px;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            font-weight: 600;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            background-color: var(--dropdown-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            z-index: 100;
            padding: 5px 0;
            border-radius: 4px;
        }

        .dropdown-wrapper.open .dropdown-content {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
            color: var(--text-color);
        }

        .dropdown-item:hover {
            background-color: var(--border-color);
        }

        .task-list {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 11px;
            color: var(--text-muted);
            padding-left: 18px;
        }

        .task-list li {
            margin-bottom: 4px;
        }

        .handover-tag { color: #f59e0b; font-weight: bold; }
        .strict-tag { color: #10b981; }

        /* Bottom Alert Container Styling */
        .bottom-alert-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification-banner {
            display: none;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease-in-out;
        }

        .meeting-alert-banner {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border: 2px solid #60a5fa;
            color: #ffffff;
        }

        .shift-end-alert-banner {
            background: linear-gradient(135deg, #065f46, #10b981);
            border: 2px solid #34d399;
            color: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 850px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .controls {
                justify-content: space-between;
            }

            .scheduler-grid {
                grid-template-columns: 1fr;
            }

            .grid-header {
                display: none;
            }

            .team-col {
                margin-top: 15px;
                border-radius: 4px;
            }

            .time-slot-cell {
                min-height: auto;
                padding: 12px 8px;
            }

            .time-slot-cell::before {
                content: attr(data-time);
                font-weight: bold;
                font-size: 12px;
                color: #38bdf8;
                margin-bottom: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="meta-info">
            <div class="date-picker-group">
                <button class="date-btn" onclick="changeDate(-1)">&#9664;</button>
                <input type="date" id="scheduleDate" onchange="loadDateSchedule()">
                <button class="date-btn" onclick="changeDate(1)">&#9654;</button>
            </div>
            <div>
                <select id="historySelect"><option value="">Schedule History...</option></select>
            </div>
            <!-- Added Meeting Details Input Group -->
            <div class="meeting-input-group">
                <input type="text" id="meetingTitle" placeholder="Meeting Topic..." style="width: 140px;" onchange="saveMeetingDetails()">
                <input type="time" id="meetingTime" onchange="saveMeetingDetails()">
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-theme" onclick="toggleTheme()">Day/Night</button>
            <button class="btn btn-primary" onclick="autoAssignTasks()">Shuffle Task</button>
            <button class="btn btn-success" onclick="saveDay()">Save Changes</button>
            <button class="btn btn-secondary" onclick="clearDay()">Clear Day</button>
            <button class="btn btn-warning" onclick="toggleViewOnlyWithPassword()" id="viewOnlyBtn">View Only</button>
            <button class="btn btn-danger" onclick="deleteDay()">Delete Day</button>
        </div>
    </div>

    <div class="scheduler-grid">
        <div class="grid-header">Team Member / Shift</div>
        <div class="grid-header">9:00 - 12:00</div>
        <div class="grid-header">12:00 - 15:00</div>
        <div class="grid-header">15:00 - 18:00</div>
        <div class="grid-header">18:00 - 21:00</div>

        <div id="gridBody" style="display: contents;"></div>
    </div>

    <!-- Red Box Guidance Container: Popups & Alerts Render Here -->
    <div class="bottom-alert-container">
        <!-- Meeting Notification Banner -->
        <div id="meetingAlertBanner" class="notification-banner meeting-alert-banner">
            📅 <strong style="font-size: 16px; text-transform: uppercase;">MEETING REMINDER</strong>
            <div id="meetingAlertText" style="margin-top: 4px; font-weight: 600;"></div>
        </div>

        <!-- Shift End Motivation Banner -->
        <div id="shiftEndAlertBanner" class="notification-banner shift-end-alert-banner">
            🎉 <strong style="font-size: 16px;">GREAT JOB & WELL DONE!</strong>
            <div id="shiftEndAlertText" style="margin-top: 4px; font-weight: 600;"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaEclzLI284lWCFk-vXbLSXa_bEZsXbOg",
            authDomain: "test-daily-task--sb.firebaseapp.com",
            databaseURL: "https://test-daily-task--sb-default-rtdb.firebaseio.com",
            projectId: "test-daily-task--sb",
            storageBucket: "test-daily-task--sb.firebasestorage.app",
            messagingSenderId: "928476661919",
            appId: "1:928476661919:web:c6d531190824c6ed7c7aaa"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MEMBERS = [
            { id: 'ANN', name: 'ANN', class: 'bg-ann', defaultShift: '12:00 - 21:00' },
            { id: 'DAVE', name: 'DAVE', class: 'bg-dave', defaultShift: '9:00 - 18:00' },
            { id: 'KENNETH', name: 'KENNETH', class: 'bg-kenneth', defaultShift: '12:00 - 21:00' },
            { id: 'KRIZTEL', name: 'KRIZTEL', class: 'bg-kriztel', defaultShift: '9:00 - 18:00' }
        ];

        const TIME_SLOTS = ["9:00 - 12:00", "12:00 - 15:00", "15:00 - 18:00", "18:00 - 21:00"];

        const SHIFT_OPTIONS = [
            { label: "6:00 - 15:00", class: "" },
            { label: "9:00 - 18:00", class: "" },
            { label: "12:00 - 21:00", class: "" },
            { label: "15:00 - 00:00", class: "" },
            { label: "6:00 - 15:00 (WFH)", class: "wfh-6am" },
            { label: "9:00 - 18:00 (WFH)", class: "wfh-9am" },
            { label: "12:00 - 21:00 (WFH)", class: "wfh-12pm" },
            { label: "15:00 - 00:00 (WFH)", class: "wfh-3pm" },
            { label: "RD", class: "" },
            { label: "VL", class: "" },
            { label: "SL", class: "" }
        ];

        const STRICT_9AM = [
            "Telegram Channel Monitoring",
            "Sports Events Booking Check (BR Portal)",
            "7A/BVB/GQBET tickers",
            "Rejected Bets Monitoring",
            "Site Checking (Web/Mobile)",
            "Big Winners check",
            "Boost Display"
        ];

        const STRICT_12PM = [
            "Boost & Banner Creation",
            "Overnight Bets",
            "Others (As instructed)"
        ];

        const FLEXIBLE_TASKS = [
            "Edge Prediction Market Ticker",
            "Pubs Prediction Market Ticker",
            "Pubs Tickers",
            "@Sportsbook Escalation check",
            "Rejected Bets Monitoring",
            "Site Checking (Web/Mobile)",
            "ALL Tickers",
            "Qbet tickers",
            "30Bet tickers",
            "55Bet tickers",
            "Ibet tickers",
            "7A/BVB/GQBET tickers",
            "SoftSwiss Files",
            "SB Files checking (Client's Tracking/VIP files/CRM files)",
            "Friendlies Checking",
            "Overnight Bets",
            "Others (As instructed)",
            "Handover Report AM",
            "Handover Report PM"
        ];

        const ALL_TASKS = Array.from(new Set([...STRICT_9AM, ...STRICT_12PM, ...FLEXIBLE_TASKS]));

        let currentSchedule = {};
        let activeOpenDropdown = null;
        let isViewOnly = false;
        let liveRotaData = {};
        let liveRotaTeam = ["Ann", "Dave", "Kenneth", "Kriztel", "Miguel"];

        document.getElementById('scheduleDate').valueAsDate = new Date();

        if (localStorage.getItem('theme_mode') === 'light') {
            document.body.classList.add('light-theme');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const mode = document.body.classList.contains('light-theme') ? 'light' : 'dark';
            localStorage.setItem('theme_mode', mode);
        }

        function toggleViewOnlyWithPassword() {
            const password = prompt("Enter View-Only Mode Password:");
            if (password === "2026") {
                isViewOnly = !isViewOnly;
                const btn = document.getElementById('viewOnlyBtn');
                btn.innerText = isViewOnly ? 'EDIT MODE' : 'VIEW ONLY';
                initGrid();
            } else if (password !== null) {
                alert("Incorrect Password!");
            }
        }

        function normalizeShift(shiftStr) {
            if (!shiftStr) return null;
            if (shiftStr.startsWith("Adjusted:")) return "RD";
            const clean = shiftStr.trim().toUpperCase();
            if (clean === 'OFF' || clean === 'OFF (RD)' || clean === 'REST DAY' || clean === 'RD') return 'RD';
            if (clean === 'VACATION LEAVE' || clean === 'VL') return 'VL';
            if (clean === 'SICK LEAVE' || clean === 'SL') return 'SL';
            
            const match = SHIFT_OPTIONS.find(opt => opt.label.toUpperCase() === clean);
            return match ? match.label : shiftStr;
        }

        function detectShiftFromRota(memberId, dateStr) {
            if (!dateStr) return null;
            const [year, month, day] = dateStr.split('-');
            const monthKey = `${year}_${parseInt(month, 10)}`;
            const dayNum = parseInt(day, 10);

            if (liveRotaData[monthKey] && liveRotaData[monthKey][dayNum]) {
                const dayShifts = liveRotaData[monthKey][dayNum];
                const memberIndex = liveRotaTeam.findIndex(name => name.toUpperCase() === memberId.toUpperCase());
                if (memberIndex !== -1 && dayShifts[memberIndex] !== undefined) {
                    return normalizeShift(dayShifts[memberIndex]);
                }
            }

            try {
                const rotaHistory = JSON.parse(localStorage.getItem('rota_schedules') || '{}');
                if (rotaHistory[dateStr] && rotaHistory[dateStr][memberId]) {
                    return normalizeShift(rotaHistory[dateStr][memberId]);
                }
            } catch(e) {}

            return null;
        }

        function syncFirebaseRota() {
            db.ref('rota_team_list').on('value', (snapshot) => {
                if (snapshot.val() && Array.isArray(snapshot.val())) {
                    liveRotaTeam = snapshot.val();
                    initGrid();
                }
            });

            db.ref('rota_data').on('value', (snapshot) => {
                liveRotaData = snapshot.val() || {};
                initGrid();
            });
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown-wrapper')) {
                activeOpenDropdown = null;
                document.querySelectorAll('.dropdown-wrapper').forEach(dw => dw.classList.remove('open'));
            }
        });

        function changeDate(days) {
            const dateInput = document.getElementById('scheduleDate');
            const currentDate = new Date(dateInput.value || new Date());
            currentDate.setDate(currentDate.getDate() + days);
            dateInput.value = currentDate.toISOString().split('T')[0];
            loadDateSchedule();
        }

        function toggleDropdown(button) {
            if (isViewOnly) return;
            const wrapper = button.closest('.dropdown-wrapper');
            const slotKey = wrapper.dataset.slotKey;
            
            if (activeOpenDropdown === slotKey) {
                activeOpenDropdown = null;
                wrapper.classList.remove('open');
            } else {
                activeOpenDropdown = slotKey;
                document.querySelectorAll('.dropdown-wrapper').forEach(dw => dw.classList.remove('open'));
                wrapper.classList.add('open');
            }
        }

        function getBaseShiftTime(shift) {
            if (!shift) return '';
            return shift.replace(' (WFH)', '').trim();
        }

        function isSlotActiveForShift(shift, slotIndex) {
            const baseShift = getBaseShiftTime(shift);
            if (['RD', 'OFF (RD)', 'OFF', 'VL', 'SL'].includes(baseShift)) return false;
            if (baseShift === '6:00 - 15:00') return slotIndex === 0 || slotIndex === 1;
            if (baseShift === '9:00 - 18:00') return slotIndex === 0 || slotIndex === 1 || slotIndex === 2;
            if (baseShift === '12:00 - 21:00') return slotIndex === 1 || slotIndex === 2 || slotIndex === 3;
            if (baseShift === '15:00 - 00:00') return slotIndex === 2 || slotIndex === 3;
            return true;
        }

        function getShiftColorStyle(shift) {
            if (!shift) return '';
            if (shift.includes("6:00 - 15:00 (WFH)")) return 'background-color: #fbcfe8; color: #831843;';
            if (shift.includes("9:00 - 18:00 (WFH)")) return 'background-color: #f472b6; color: #831843;';
            if (shift.includes("12:00 - 21:00 (WFH)")) return 'background-color: #e9d5ff; color: #581c87;';
            if (shift.includes("15:00 - 00:00 (WFH)")) return 'background-color: #a855f7; color: #ffffff;';
            return '';
        }

        function initGrid() {
            const date = document.getElementById('scheduleDate').value;
            const gridBody = document.getElementById('gridBody');
            gridBody.innerHTML = '';

            MEMBERS.forEach(member => {
                const rotaShift = detectShiftFromRota(member.id, date);
                
                if (!currentSchedule[member.id]) {
                    currentSchedule[member.id] = { shift: rotaShift || member.defaultShift };
                } else if (rotaShift) {
                    currentSchedule[member.id].shift = rotaShift;
                }

                const memberShift = currentSchedule[member.id].shift || member.defaultShift;
                const shiftStyle = getShiftColorStyle(memberShift);

                const selectOptionsHtml = SHIFT_OPTIONS.map(opt => `
                    <option value="${opt.label}" class="${opt.class}" ${memberShift === opt.label ? 'selected' : ''}>
                        ${opt.label}
                    </option>
                `).join('');

                const memberDiv = document.createElement('div');
                memberDiv.className = 'team-col';
                memberDiv.innerHTML = `
                    <div class="member-card ${member.class}">${member.name}</div>
                    <div class="shift-select-box">
                        <select style="${shiftStyle}" onchange="updateMemberShift('${member.id}', this.value)" ${isViewOnly ? 'disabled' : ''}>
                            ${selectOptionsHtml}
                        </select>
                    </div>
                `;
                gridBody.appendChild(memberDiv);

                TIME_SLOTS.forEach((slot, index) => {
                    if (!currentSchedule[member.id][slot]) {
                        currentSchedule[member.id][slot] = { assignedList: [] };
                    }

                    const slotData = currentSchedule[member.id][slot];
                    const slotDiv = document.createElement('div');
                    const baseShift = getBaseShiftTime(memberShift);
                    
                    let cellClass = 'time-slot-cell';
                    if (['RD', 'OFF (RD)', 'OFF', 'VL', 'SL'].includes(baseShift)) {
                        cellClass += ' off-day';
                    } else if (!isSlotActiveForShift(memberShift, index)) {
                        cellClass += ' off-shift';
                    }

                    slotDiv.className = cellClass;
                    slotDiv.setAttribute('data-time', slot);
                    const slotKey = `${member.id}_${index}`;

                    if (['RD', 'OFF (RD)', 'OFF'].includes(baseShift)) {
                        slotDiv.innerHTML = `<div class="status-badge badge-rd">OFF (REST DAY)</div>`;
                    } else if (baseShift === 'VL') {
                        slotDiv.innerHTML = `<div class="status-badge badge-vl">VACATION LEAVE</div>`;
                    } else if (baseShift === 'SL') {
                        slotDiv.innerHTML = `<div class="status-badge badge-sl">SICK LEAVE</div>`;
                    } else {
                        const dropdownItems = ALL_TASKS.map(task => {
                            const checked = slotData.assignedList.includes(task) ? 'checked' : '';
                            return `
                                <label class="dropdown-item" onclick="event.stopPropagation()">
                                    <input type="checkbox" value="${task}" ${checked} 
                                        onchange="toggleTaskSelection('${member.id}', '${slot}', '${task}', this.checked)">
                                    <span>${task}</span>
                                </label>
                            `;
                        }).join('');

                        const isOpenClass = activeOpenDropdown === slotKey ? 'open' : '';

                        slotDiv.innerHTML = `
                            <div class="dropdown-wrapper ${isOpenClass}" data-slot-key="${slotKey}">
                                <button class="dropdown-btn" onclick="toggleDropdown(this)">
                                    Assigned Tasks (${slotData.assignedList.length}) &#9660;
                                </button>
                                <div class="dropdown-content">
                                    ${dropdownItems}
                                </div>
                            </div>
                            <ul class="task-list">
                                ${renderTaskList(slotData.assignedList)}
                            </ul>
                        `;
                    }
                    gridBody.appendChild(slotDiv);
                });
            });
            loadMeetingDetails();
        }

        function updateMemberShift(memberId, newShift) {
            currentSchedule[memberId].shift = newShift;
            const baseShift = getBaseShiftTime(newShift);
            if (['RD', 'OFF (RD)', 'OFF', 'VL', 'SL'].includes(baseShift)) {
                TIME_SLOTS.forEach(s => {
                    if (currentSchedule[memberId][s]) {
                        currentSchedule[memberId][s].assignedList = [];
                    }
                });
            }
            initGrid();
            saveLocal();
        }

        function toggleTaskSelection(memberId, slot, task, isChecked) {
            let list = currentSchedule[memberId][slot].assignedList;
            if (isChecked) {
                if (!list.includes(task)) list.push(task);
            } else {
                currentSchedule[memberId][slot].assignedList = list.filter(t => t !== task);
            }
            initGrid();
            saveLocal();
        }

        function renderTaskList(list) {
            if (!list || list.length === 0) return '';
            return list.map(item => {
                let styleClass = '';
                if (item.includes('Handover')) styleClass = 'handover-tag';
                else if (STRICT_9AM.includes(item) || STRICT_12PM.includes(item)) styleClass = 'strict-tag';
                return `<li class="${styleClass}">${item}</li>`;
            }).join('');
        }

        function autoAssignTasks() {
            const date = document.getElementById('scheduleDate').value;

            MEMBERS.forEach(m => {
                const rotaShift = detectShiftFromRota(m.id, date);
                const currentShift = rotaShift || currentSchedule[m.id]?.shift || m.defaultShift;
                currentSchedule[m.id] = { shift: currentShift };
                TIME_SLOTS.forEach(s => {
                    currentSchedule[m.id][s] = { assignedList: [] };
                });
            });

            const activeAmMembers = MEMBERS.filter(m => {
                const baseShift = getBaseShiftTime(currentSchedule[m.id].shift);
                return baseShift === '6:00 - 15:00' || baseShift === '9:00 - 18:00';
            });

            if (activeAmMembers.length > 0) {
                let shuffled9am = [...STRICT_9AM].sort(() => 0.5 - Math.random());
                activeAmMembers.forEach((m, idx) => {
                    const count = Math.ceil(shuffled9am.length / activeAmMembers.length);
                    currentSchedule[m.id][TIME_SLOTS[0]].assignedList.push(...shuffled9am.slice(idx * count, (idx + 1) * count));
                });
            }

            const activeNoonMembers = MEMBERS.filter(m => isSlotActiveForShift(currentSchedule[m.id].shift, 1));
            if (activeNoonMembers.length > 0) {
                let shuffled12pm = [...STRICT_12PM].sort(() => 0.5 - Math.random());
                activeNoonMembers.forEach((m, idx) => {
                    const count = Math.ceil(shuffled12pm.length / activeNoonMembers.length);
                    currentSchedule[m.id][TIME_SLOTS[1]].assignedList.push(...shuffled12pm.slice(idx * count, (idx + 1) * count));
                });
            }

            const flexTasksOnly = FLEXIBLE_TASKS.filter(t => !t.includes('Handover'));

            TIME_SLOTS.forEach((slot, slotIdx) => {
                const workingMembers = MEMBERS.filter(m => isSlotActiveForShift(currentSchedule[m.id].shift, slotIdx));

                if (workingMembers.length > 0) {
                    let shuffledFlex = [...flexTasksOnly].sort(() => 0.5 - Math.random());
                    
                    workingMembers.forEach((m, memberIdx) => {
                        const itemsPerMember = Math.min(3, Math.ceil(shuffledFlex.length / workingMembers.length));
                        const assignedSlice = shuffledFlex.slice(memberIdx * itemsPerMember, (memberIdx + 1) * itemsPerMember);
                        
                        assignedSlice.forEach(task => {
                            if (!currentSchedule[m.id][slot].assignedList.includes(task)) {
                                currentSchedule[m.id][slot].assignedList.push(task);
                            }
                        });
                    });
                }
            });

            if (activeAmMembers.length > 0) {
                const amHandoverMember = activeAmMembers[Math.floor(Math.random() * activeAmMembers.length)].id;
                currentSchedule[amHandoverMember][TIME_SLOTS[1]].assignedList.push("Handover Report AM");
            }

            const activePmMembers = MEMBERS.filter(m => {
                const baseShift = getBaseShiftTime(currentSchedule[m.id].shift);
                return baseShift === '12:00 - 21:00' || baseShift === '15:00 - 00:00';
            });

            if (activePmMembers.length > 0) {
                const pmHandoverMember = activePmMembers[Math.floor(Math.random() * activePmMembers.length)].id;
                currentSchedule[pmHandoverMember][TIME_SLOTS[3]].assignedList.push("Handover Report PM");
            }

            initGrid();
            saveDay();
        }

        function loadDateSchedule() {
            const date = document.getElementById('scheduleDate').value;
            let history = JSON.parse(localStorage.getItem('shift_schedules') || '{}');
            if (history[date]) {
                currentSchedule = history[date];
            } else {
                currentSchedule = {};
            }
            initGrid();
        }

        function saveDay() {
            const date = document.getElementById('scheduleDate').value;
            if (!date) return alert('Please select a date.');

            let history = JSON.parse(localStorage.getItem('shift_schedules') || '{}');
            history[date] = currentSchedule;
            localStorage.setItem('shift_schedules', JSON.stringify(history));

            db.ref('schedules/' + date).set(currentSchedule)
                .then(() => alert('Saved locally and synced to Firebase!'))
                .catch(err => alert('Saved locally!'));

            updateHistoryDropdown();
        }

        function clearDay() {
            MEMBERS.forEach(m => {
                const shift = currentSchedule[m.id]?.shift || m.defaultShift;
                currentSchedule[m.id] = { shift: shift };
                TIME_SLOTS.forEach(s => {
                    currentSchedule[m.id][s] = { assignedList: [] };
                });
            });
            initGrid();
        }

        function deleteDay() {
            const date = document.getElementById('scheduleDate').value;
            let history = JSON.parse(localStorage.getItem('shift_schedules') || '{}');
            delete history[date];
            localStorage.setItem('shift_schedules', JSON.stringify(history));
            clearDay();
            updateHistoryDropdown();
            alert('Day deleted.');
        }

        function updateHistoryDropdown() {
            const historySelect = document.getElementById('historySelect');
            let history = JSON.parse(localStorage.getItem('shift_schedules') || '{}');
            historySelect.innerHTML = '<option value="">Schedule History...</option>';
            Object.keys(history).sort().reverse().forEach(date => {
                historySelect.innerHTML += `<option value="${date}">${date}</option>`;
            });

            historySelect.onchange = (e) => {
                if (e.target.value && history[e.target.value]) {
                    document.getElementById('scheduleDate').value = e.target.value;
                    currentSchedule = history[e.target.value];
                    initGrid();
                }
            };
        }

        function saveLocal() {
            const date = document.getElementById('scheduleDate').value;
            if (!date) return;
            let history = JSON.parse(localStorage.getItem('shift_schedules') || '{}');
            history[date] = currentSchedule;
            localStorage.setItem('shift_schedules', JSON.stringify(history));
        }

        /* --- MEETING DETAILS STORAGE & BANNERS LOGIC --- */
        function saveMeetingDetails() {
            const date = document.getElementById('scheduleDate').value;
            const title = document.getElementById('meetingTitle').value;
            const time = document.getElementById('meetingTime').value;
            if (!date) return;

            let meetings = JSON.parse(localStorage.getItem('meeting_schedules') || '{}');
            meetings[date] = { title, time };
            localStorage.setItem('meeting_schedules', JSON.stringify(meetings));
            checkScheduledAlerts();
        }

        function loadMeetingDetails() {
            const date = document.getElementById('scheduleDate').value;
            let meetings = JSON.parse(localStorage.getItem('meeting_schedules') || '{}');
            if (meetings[date]) {
                document.getElementById('meetingTitle').value = meetings[date].title || '';
                document.getElementById('meetingTime').value = meetings[date].time || '';
            } else {
                document.getElementById('meetingTitle').value = '';
                document.getElementById('meetingTime').value = '';
            }
        }

        function parseShiftEndTimeInMinutes(shiftLabel) {
            const base = getBaseShiftTime(shiftLabel);
            if (!base || ['RD', 'OFF', 'VL', 'SL'].includes(base)) return null;
            const parts = base.split('-');
            if (parts.length < 2) return null;
            const endTimeStr = parts[1].trim();
            const [h, m] = endTimeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function checkScheduledAlerts() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
            const currentDate = String(now.getDate()).padStart(2, '0');
            const todayStr = `${currentYear}-${currentMonth}-${currentDate}`;

            const selectedDate = document.getElementById('scheduleDate').value;
            if (selectedDate !== todayStr) {
                document.getElementById('meetingAlertBanner').style.display = 'none';
                document.getElementById('shiftEndAlertBanner').style.display = 'none';
                return;
            }

            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            // 1. Meeting Reminder Logic (Triggers 5m before, disappears 15m after target time)
            const meetingTitle = document.getElementById('meetingTitle').value;
            const meetingTime = document.getElementById('meetingTime').value;

            if (meetingTime) {
                const [mH, mM] = meetingTime.split(':').map(Number);
                const meetingMinutes = mH * 60 + mM;
                const diffMeeting = meetingMinutes - currentMinutes;

                if (diffMeeting <= 5 && diffMeeting >= -15) {
                    const meetingBanner = document.getElementById('meetingAlertBanner');
                    const meetingText = document.getElementById('meetingAlertText');
                    meetingText.innerHTML = `Upcoming Meeting: <strong>${meetingTitle || 'Scheduled Team Sync'}</strong> at <strong>${meetingTime}</strong>`;
                    meetingBanner.style.display = 'block';
                } else {
                    document.getElementById('meetingAlertBanner').style.display = 'none';
                }
            } else {
                document.getElementById('meetingAlertBanner').style.display = 'none';
            }

            // 2. Shift Ending Motivation Banner (20 mins before shift ends, disappears when shift ends)
            let finishingMembers = [];
            MEMBERS.forEach(m => {
                const shift = currentSchedule[m.id]?.shift || m.defaultShift;
                const endMinutes = parseShiftEndTimeInMinutes(shift);
                if (endMinutes !== null) {
                    const diffShift = endMinutes - currentMinutes;
                    if (diffShift > 0 && diffShift <= 20) {
                        finishingMembers.push(m.name);
                    }
                }
            });

            if (finishingMembers.length > 0) {
                const shiftBanner = document.getElementById('shiftEndAlertBanner');
                const shiftText = document.getElementById('shiftEndAlertText');
                shiftText.innerText = `${finishingMembers.join(' & ')} - 20 minutes remaining in your shift! Thank you for your hard work today! 👏🌟`;
                shiftBanner.style.display = 'block';
            } else {
                document.getElementById('shiftEndAlertBanner').style.display = 'none';
            }
        }

        window.onload = () => {
            syncFirebaseRota();
            loadDateSchedule();
            updateHistoryDropdown();
            checkScheduledAlerts();
            setInterval(checkScheduledAlerts, 10000); // Check desktop clock every 10 seconds
        };
    </script>
</body>
