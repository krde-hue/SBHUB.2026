        function createDefaultDatabase() {
            let defaultDb = {

                    reminder: "",

            };

        function setupPresenceSystem() {
            if (!db) return;
            const presenceRef = db.ref('active_sessions');
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    const userSessionRef = presenceRef.push();
                    userSessionRef.onDisconnect().remove();

                    userSessionRef.set({
                        online: true,
                        joinedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            });

            presenceRef.on('value', (snap) => {
                const count = snap.numChildren();
                const countElem = document.getElementById('activeViewersCount');
                if (countElem) {
                    countElem.innerText = count > 0 ? count : 1;
                }
            });
        }

        function listenToLiveDatabase() {
            if (!db) return;
            db.ref('rota_data').on('value', (snapshot) => {
                masterRotaCalendar = snapshot.val() || {};
                syncShiftsFromRotaMaster();
            });

            db.ref('roster_data').on('value', (snapshot) => {
                const liveData = snapshot.val();
                if (liveData && typeof liveData === 'object' && Object.keys(liveData).length > 0) {
                    database = liveData;
                } else {
                    database = createDefaultDatabase();
                    saveToDatabase();
                }
                
                syncShiftsFromRotaMaster();

                if (!activeOpenDropdownId) {
                    renderAllPages();
                } else {
                    syncActiveDropdownCheckboxes();
                }
                checkNearShiftEnd();
            });

        function parseRotaShiftToShiftId(rawShiftText) {
            if (!rawShiftText) return null;

            let text = rawShiftText.trim();

            if (text.startsWith("Adjusted:") || text === "Adjusted") {
                return "shift-adjusted";
            }

            if (text === "RD") return "shift-rd";
            if (text === "VL") return "shift-vl";
            if (text === "SL") return "shift-sl";

            if (text === "7:00 - 10:00 (WFH)") return "shift-7-10-wfh";
            if (text === "7:00 - 16:00 (WFH)") return "shift-7-16-wfh";

            if (text.includes("7:00") && text.includes("16:00")) return "shift-7-16";
            if (text.includes("9:00") && text.includes("18:00")) return "shift-9-18";
            if (text.includes("10:00") && text.includes("19:00")) return "shift-10-19";
            if (text.includes("12:00") && text.includes("21:00")) return "shift-12-21";
            if (text.includes("14:00") && text.includes("23:00")) return "shift-14-23";
            if (text.includes("16:00") && text.includes("1:00")) return "shift-16-1";

            return "shift-adjusted";
        }

        function syncShiftsFromRotaMaster() {
            if (!masterRotaCalendar || Object.keys(masterRotaCalendar).length === 0) return;

            let updated = false;
            Object.keys(database || {}).forEach(dayKey => {
                let dayData = database[dayKey];
                if (dayData && dayData.isoDate) {
                    let dateParts = dayData.isoDate.split('-');
                    if (dateParts.length === 3) {
                        let year = dateParts[0];
                        let month = parseInt(dateParts[1], 10);
                        let dayNum = parseInt(dateParts[2], 10);

                        let rotaMonthKey = `${year}_${month}`;
                        let rotaDayRow = masterRotaCalendar[rotaMonthKey] ? masterRotaCalendar[rotaMonthKey][dayNum] : null;

                        if (rotaDayRow) {
                            members.forEach(m => {
                                let rawRotaShift = rotaDayRow[m.index];
                                let matchedShiftId = parseRotaShiftToShiftId(rawRotaShift);

                                if (matchedShiftId) {
                                    if (!dayData.grid[m.id]) dayData.grid[m.id] = { slots: {} };
                                    
                                    if (dayData.grid[m.id].shift !== matchedShiftId) {
                                        dayData.grid[m.id].shift = matchedShiftId;
                                        updated = true;
                                    }
                                }
                            });
                        }
                    }
                }
            });

            if (updated) {
                renderAllPages();
            }
        }

        function saveToDatabase() {
            if (!database) database = createDefaultDatabase();
            if (db) db.ref('roster_data').set(database);
            let statusBadge = document.getElementById('saveStatus');
            if (statusBadge) {
                statusBadge.style.opacity = '1';
                setTimeout(() => { statusBadge.style.opacity = '0'; }, 1000);
            }
        }

        function toggleDarkMode() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('sb_theme', newTheme);
        }

        function checkNearShiftEnd() {
            const now = new Date();
            const currentMinutesOfDay = now.getHours() * 60 + now.getMinutes();

            let dayKeys = Object.keys(database || {});
            if (dayKeys.length === 0) return;
            let currentDayKey = dayKeys[0];
            let activeGrid = database[currentDayKey].grid || {};

            let endingMembers = [];

            members.forEach(m => {
                let memberData = activeGrid[m.id] || { shift: m.defaultShift };
                let shiftObj = shifts.find(s => s.id === memberData.shift);

                if (shiftObj && shiftObj.endHour !== null) {
                    let endMinutesOfDay = shiftObj.endHour * 60 + shiftObj.endMinute;
                    
                    if (shiftObj.endHour === 1 && currentMinutesOfDay > 12 * 60) {
                        endMinutesOfDay += 24 * 60;
                    }

                    let minutesRemaining = endMinutesOfDay - currentMinutesOfDay;

                    if (minutesRemaining > 0 && minutesRemaining <= 20) {
                        endingMembers.push(m.name);
                    }
                }
            });

            const banner = document.getElementById('shiftEndBanner');
            const messageElem = document.getElementById('shiftEndMessage');

            if (endingMembers.length > 0 && banner && messageElem) {
                let nameString = "";
                if (endingMembers.length === 1) {
                    nameString = endingMembers[0];
                } else if (endingMembers.length === 2) {
                    nameString = `${endingMembers[0]} and ${endingMembers[1]}`;
                } else {
                    nameString = `${endingMembers.slice(0, -1).join(', ')}, and ${endingMembers[endingMembers.length - 1]}`;
                }

                messageElem.innerText = `Almost there, ${nameString}! Shift ends in less than 20 minutes—keep up the great work!`;
                banner.style.display = 'flex';
            } else if (banner) {
                banner.style.display = 'none';
            }
        }

        setInterval(checkNearShiftEnd, 30000);

        function isOffDuty(shiftId, slotId) {
            return (shiftOffDutyMap[shiftId] || []).includes(slotId);
        }

        function updateReminderText(dayKey, newText) {
            if (!database[dayKey]) database[dayKey] = { grid: {} };
            database[dayKey].reminder = newText;
            saveToDatabase();
        }

        function renderAllPages() {
            const container = document.getElementById('pagesContainer');
            if (!container) return;
            container.innerHTML = '';
            if (!database) database = createDefaultDatabase();
            
            Object.keys(database).forEach((dayKey) => {
                let dayData = database[dayKey];
                let daySection = document.createElement('div');
                daySection.className = 'day-section';
                
                let titleHTML = `
                    <div class="day-title-area">
                        <div class="day-title-left">
                            <span class="date-picker-wrapper">
                                📅 
                                <input type="date" class="date-picker-input" value="${dayData.isoDate || ''}" onchange="updateDayDate('${dayKey}', this.value)">
                                SHIFT
                            </span>
                            <div class="reminder-box-wrapper">
                                <span>📌</span>
                                <input type="text" class="reminder-box-input" placeholder="Meeting Reminders / Notes..." value="${dayData.reminder || ''}" onchange="updateReminderText('${dayKey}', this.value)">
                            </div>
                        </div>
                        <div class="no-print" style="display:flex; gap:10px; align-items:center;">
                            <button class="btn btn-secondary" onclick="clearDayDuties('${dayKey}')" style="padding:4px 8px; font-size:11px;">🧹 Clear Day</button>
                            <button class="btn btn-danger" onclick="deleteDay('${dayKey}')" style="padding:4px 8px; font-size:11px;">🗑️ Delete Day</button>
                        </div>
                    </div>
                `;
                daySection.innerHTML += titleHTML;
                
                let tableWrapper = document.createElement('div');
                tableWrapper.className = 'table-responsive-wrapper';

                let table = document.createElement('table');
                table.className = 'schedule-table';
                
                let thead = `
                    <thead>
                        <tr>
                            <th class="col-member">TEAM</th>
                            <th class="col-shift">SHIFT</th>
                            ${timeSlots.map(s => `<th>${s.label}</th>`).join('')}
                        </tr>
                    </thead>
                `;
                table.innerHTML += thead;
                
                let tbody = document.createElement('tbody');
                members.forEach(m => {
                    let memberGrid = (dayData.grid && dayData.grid[m.id]) ? dayData.grid[m.id] : { shift: m.defaultShift, slots: {} };
                    let tr = document.createElement('tr');
                    
                    let memberCell = `<td><div class="team-member-cell">${m.name}</div></td>`;
                    let shiftOptions = shifts.map(s => 
                        `<option value="${s.id}" ${memberGrid.shift === s.id ? 'selected' : ''}>${s.label}</option>`
                    ).join('');

                    let shiftCell = `
                        <td>
                            <div class="shift-select-container">
                                <select class="shift-select no-print" onchange="changeShift('${dayKey}', '${m.id}', this.value)">
                                    ${shiftOptions}
                                </select>
                            </div>
                        </td>
                    `;
                    
                    tr.innerHTML += memberCell + shiftCell;
                    
                    timeSlots.forEach(slot => {
                        let isSlotOffDuty = isOffDuty(memberGrid.shift, slot.id);
                        let selectedTaskList = (memberGrid.slots && memberGrid.slots[slot.id]) ? memberGrid.slots[slot.id] : [];
                        let formattedText = isSlotOffDuty ? '' : selectedTaskList.join('\n');
                        let offDutyClass = isSlotOffDuty ? 'off-duty-active' : '';
                        
                        let td = document.createElement('td');
                        
                        let taskCheckboxes = availableTasks.map(t => {
                            let isChecked = selectedTaskList.includes(t) ? 'checked' : '';
                            return `
                                <label class="task-option-label" onclick="event.stopPropagation();">
                                    <input type="checkbox" value="${t}" ${isChecked} onchange="toggleTask('${dayKey}', '${m.id}', '${slot.id}', this, event)">
                                    ${t}
                                </label>
                            `;
                        }).join('');

                        let dropdownOpenClass = (activeOpenDropdownId === `${dayKey}-${m.id}-${slot.id}`) ? 'show' : '';

                        td.innerHTML = `
                            <div class="task-card ${memberGrid.shift} ${offDutyClass}">
                                <div class="task-dropdown-container no-print" onclick="event.stopPropagation();">
                                    <button type="button" class="task-dropdown-btn" onclick="toggleDropdown(event, '${dayKey}-${m.id}-${slot.id}')">
                                        <span>▼ Tasks</span>
                                    </button>
                                    <div id="dropdown-${dayKey}-${m.id}-${slot.id}" class="task-dropdown-content ${dropdownOpenClass}" onclick="event.stopPropagation();">
                                        ${taskCheckboxes}
                                    </div>
                                </div>
                                <div class="editable-content-area" id="editor-${dayKey}-${m.id}-${slot.id}" contenteditable="${!isSlotOffDuty}" oninput="updateCellText('${dayKey}', '${m.id}', '${slot.id}', this)">${formattedText}</div>
                            </div>
                        `;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                
                table.appendChild(tbody);
                tableWrapper.appendChild(table);
                daySection.appendChild(tableWrapper);
                container.appendChild(daySection);
            });
        }

        function toggleDropdown(event, id) {
            event.stopPropagation();
            const targetContent = document.getElementById(`dropdown-${id}`);
            const isCurrentlyShown = targetContent ? targetContent.classList.contains('show') : false;
            
            document.querySelectorAll('.task-dropdown-content').forEach(el => el.classList.remove('show'));
            
            if (!isCurrentlyShown && targetContent) {
                targetContent.classList.add('show');
                activeOpenDropdownId = id;
            } else {
                activeOpenDropdownId = null;
            }
        }

        function toggleTask(dayKey, memberId, slotId, checkbox, event) {
            if (event) event.stopPropagation();

            if (!database[dayKey]) database[dayKey] = { grid: {} };
            if (!database[dayKey].grid[memberId]) database[dayKey].grid[memberId] = { shift: 'shift-7-16', slots: {} };
            let dayGrid = database[dayKey].grid[memberId];
            if (!dayGrid.slots) dayGrid.slots = {};
            if (!dayGrid.slots[slotId]) dayGrid.slots[slotId] = [];

            if (checkbox.checked) {
                if (!dayGrid.slots[slotId].includes(checkbox.value)) dayGrid.slots[slotId].push(checkbox.value);
            } else {
                dayGrid.slots[slotId] = dayGrid.slots[slotId].filter(t => t !== checkbox.value);
            }

            let editor = document.getElementById(`editor-${dayKey}-${memberId}-${slotId}`);
            if (editor) {
                editor.innerText = dayGrid.slots[slotId].join('\n');
            }

            saveToDatabase();
        }

        function syncActiveDropdownCheckboxes() {
            if (!activeOpenDropdownId) return;
            let parts = activeOpenDropdownId.split('-');
            if (parts.length < 3) return;
            let dayKey = parts[0];
            let memberId = parts[1];
            let slotId = parts[2];

            let selectedList = (database[dayKey] && database[dayKey].grid[memberId] && database[dayKey].grid[memberId].slots[slotId]) 
                ? database[dayKey].grid[memberId].slots[slotId] : [];

            let dropdown = document.getElementById(`dropdown-${activeOpenDropdownId}`);
            if (dropdown) {
                dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = selectedList.includes(cb.value);
                });
            }
        }

        function changeShift(dayKey, memberId, newShift) {
            if (!database[dayKey]) database[dayKey] = { grid: {} };
            if (!database[dayKey].grid[memberId]) database[dayKey].grid[memberId] = { slots: {} };
            database[dayKey].grid[memberId].shift = newShift;
            saveToDatabase();
            checkNearShiftEnd();
        }

        function updateCellText(dayKey, memberId, slotId, element) {
            let lines = element.innerText.split('\n').filter(l => l.trim() !== '');
            if (!database[dayKey]) database[dayKey] = { grid: {} };
            if (!database[dayKey].grid[memberId]) database[dayKey].grid[memberId] = { shift: 'shift-7-16', slots: {} };
            if (!database[dayKey].grid[memberId].slots) database[dayKey].grid[memberId].slots = {};
            database[dayKey].grid[memberId].slots[slotId] = lines;
            saveToDatabase();
        }

        function updateDayDate(dayKey, newIsoDate) { 
            if (!database[dayKey]) return;
            database[dayKey].isoDate = newIsoDate; 
            saveToDatabase(); 
            syncShiftsFromRotaMaster();
        }

        function clearDayDuties(dayKey) {
            if (confirm("Clear tasks for this day?")) {
                members.forEach(m => {
                    if (database[dayKey] && database[dayKey].grid[m.id]) database[dayKey].grid[m.id].slots = {};
                });
                saveToDatabase();
            }
        }

        function clearAllData() {
            if (confirm("Clear ALL duties across all days?")) {
                Object.keys(database || {}).forEach(dayKey => {
                    members.forEach(m => {
                        if (database[dayKey] && database[dayKey].grid[m.id]) database[dayKey].grid[m.id].slots = {};
                    });
                });
                saveToDatabase();
            }
        }

        function deleteDay(dayKey) {
            if (Object.keys(database || {}).length <= 1) return alert("You must keep at least one day sheet.");
            if (confirm("Delete this day sheet?")) {
                delete database[dayKey];
                saveToDatabase();
            }
        }

        function addNewDay() {
            if (!database || typeof database !== 'object' || Object.keys(database).length === 0) {
                database = createDefaultDatabase();
            } else {
                let dayKeys = Object.keys(database);
                let lastKey = dayKeys[dayKeys.length - 1];
                let lastIsoStr = (database[lastKey] && database[lastKey].isoDate) ? database[lastKey].isoDate : "2026-09-01";
                
                let lastDate = new Date(lastIsoStr);
                if (isNaN(lastDate.getTime())) lastDate = new Date();
                lastDate.setDate(lastDate.getDate() + 1);
                
                let newIsoDate = lastDate.toISOString().split('T')[0];
                let newDayNum = parseInt(lastKey.split('_')[1] || '1') + 1;
                let newDayId = "day_" + newDayNum;
                
                database[newDayId] = { isoDate: newIsoDate, reminder: "", grid: {} };
                members.forEach(m => {
                    database[newDayId].grid[m.id] = { shift: m.defaultShift, slots: {} };
                });
            }
            
            saveToDatabase();
            syncShiftsFromRotaMaster();
        }

        // Initialize application after DOM is fully parsed
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('sb_theme') === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }
            if (localStorage.getItem('duties_mobile_view') === 'true' || window.innerWidth < 768) {
                isMobileView = false;
                toggleMobileView();
            }
            renderAllPages();
            listenToLiveDatabase();
            setupPresenceSystem();
            
            window.addEventListener('click', function(e) {
                if (!e.target.closest('.task-dropdown-container')) {
                    document.querySelectorAll('.task-dropdown-content').forEach(el => el.classList.remove('show'));
                    activeOpenDropdownId = null;
                }
            });
        });
    </script>
</body>
</html>
