        function parseRotaShiftToShiftId(rawShiftText) {
            if (!rawShiftText) return null;
            let text = rawShiftText.trim();
            if (text.startsWith("Adjusted:") || text === "Adjusted") return "shift-adjusted";
            if (text === "RD") return "shift-rd";
            if (text === "VL") return "shift-vl";
            if (text === "SL") return "shift-sl";
            if (text === "7:00 - 10:00 (WFH)") return "shift-7-10-wfh";
            if (text === "7:00 - 16:00 (WFH)") return "shift-7-16-wfh";
            if (text.includes("7:00") && text.includes("16:00")) return "shift-7-16";
            if (text.includes("9:00") && text.includes("18:00")) return "shift-9-18";
            if (text.includes("10:00") && text.includes("19:00")) return "shift-10-19";
            if (text.includes("12:00") && text.includes("21:00")) return "shift-12-21";
            if (text.includes("14:00") && text.includes("23:00")) return "shift-14-23";
            if (text.includes("16:00") && text.includes("1:00")) return "shift-16-1";

            return "shift-adjusted";
        }

        function syncShiftsFromRotaMaster() {
            if (!masterRotaCalendar || Object.keys(masterRotaCalendar).length === 0) return;

            let updated = false;
            Object.keys(database || {}).forEach(fbKey => {
                let dayData = database[fbKey];
                if (dayData && dayData.isoDate) {
                    let dateParts = dayData.isoDate.split('-');
                    if (dateParts.length === 3) {
                        let year = dateParts[0];
                        let monthInt = parseInt(dateParts[1], 10);
                        let dayNum = parseInt(dateParts[2], 10);

                        let monthPadded = String(monthInt).padStart(2, '0');
                        let rotaMonthKey1 = `${year}_${monthInt}`;
                        let rotaMonthKey2 = `${year}_${monthPadded}`;

                        let rotaMonthData = masterRotaCalendar[rotaMonthKey1] || masterRotaCalendar[rotaMonthKey2] || null;
                        let rotaDayRow = rotaMonthData ? (rotaMonthData[dayNum] || rotaMonthData[String(dayNum)]) : null;

                        if (rotaDayRow) {
                            members.forEach(m => {
                                let rawRotaShift = rotaDayRow[m.index] || rotaDayRow[m.id];
                                let matchedShiftId = parseRotaShiftToShiftId(rawRotaShift);

                                if (matchedShiftId) {
                                    if (!dayData.grid) dayData.grid = {};
                                    if (!dayData.grid[m.id]) {
                                        dayData.grid[m.id] = { shift: matchedShiftId, slots: {} };
                                        updated = true;
                                    } else if (dayData.grid[m.id].shift !== matchedShiftId) {
                                        dayData.grid[m.id].shift = matchedShiftId;
                                        dayData.grid[m.id].slots = dayData.grid[m.id].slots || {};
                                        updated = true;
                                    }
                                }
                            });
                        }
                    }
                }
            });

            if (updated) {
                saveToDatabase();
            }
        }

        function shuffleArray(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }

        function autoAssignTasksForDay(dayKey) {
            getValidatedUser();
            if (!database[dayKey]) return;

            isLocalActionPending = true;

            let currentProfileKey = getAutoProfileForDay(database[dayKey]);
            let activeSlots = timeSlotProfiles[currentProfileKey];

            members.forEach(m => {
                let defaultForProfile = currentProfileKey === 'profile_2' ? m.defaultShiftProfile2 : m.defaultShiftProfile1;
                if (!database[dayKey].grid[m.id]) {
                    database[dayKey].grid[m.id] = { shift: defaultForProfile, slots: {} };
                } else {
                    database[dayKey].grid[m.id].slots = {};
                }
            });

            let memberLastSlot = {};
            let endSlotMemberMap = {};

            members.forEach(m => {
                let defaultForProfile = currentProfileKey === 'profile_2' ? m.defaultShiftProfile2 : m.defaultShiftProfile1;
                let memberShift = database[dayKey].grid[m.id]?.shift || defaultForProfile;
                let activeForMember = activeSlots.filter(s => !isOffDuty(memberShift, s.id)).map(s => s.id);
                if (activeForMember.length > 0) {
                    let lastSlotId = activeForMember[activeForMember.length - 1];
                    memberLastSlot[m.id] = lastSlotId;

                    if (!endSlotMemberMap[lastSlotId]) endSlotMemberMap[lastSlotId] = [];
                    endSlotMemberMap[lastSlotId].push(m.id);
                }
            });

            let handoverAssignees = {};
            Object.keys(endSlotMemberMap).forEach(slotId => {
                let candidates = endSlotMemberMap[slotId];
                let chosenMember = candidates[Math.floor(Math.random() * candidates.length)];
                handoverAssignees[chosenMember] = slotId;
            });

            const tickerFallbackPool = [
                "ALL Tickers", "Pubs Tickers", "Qbet tickers", "30Bet tickers", 
                "55Bet tickers", "Ibet tickers", "7A/BVB/GQBET tickers", 
                "Edge Prediction Market Ticker", "Pubs Prediction Market Ticker"
            ];

            activeSlots.forEach(slot => {
                let slotId = slot.id;

                let activeMembersInSlot = members.filter(m => {
                    let defaultForProfile = currentProfileKey === 'profile_2' ? m.defaultShiftProfile2 : m.defaultShiftProfile1;
                    let memberShift = database[dayKey].grid[m.id]?.shift || defaultForProfile;
                    return !isOffDuty(memberShift, slotId);
                });

                let isSoloSlot = (activeMembersInSlot.length === 1);
                let assignedTasksInSlot = new Set();

                activeMembersInSlot.forEach(m => {
                    let defaultForProfile = currentProfileKey === 'profile_2' ? m.defaultShiftProfile2 : m.defaultShiftProfile1;
                    let memberShift = database[dayKey].grid[m.id]?.shift || defaultForProfile;
                    let isLateShift = ['shift-12-21', 'shift-14-23', 'shift-16-1'].includes(memberShift);

                    let pool = [];
                    
                    let isExact9amSlot = (slotId === 'slot_7_10' || slotId === 'slot_9_12');
                    let isExact12pmSlot = (slotId === 'slot_12_16' || slotId === 'slot_12_15');

                    if (isExact9amSlot && !isLateShift) {
                        pool = shuffleArray([...strict9amSlotTasks, ...generalUnmentionedTasks]);
                    } else if (isExact12pmSlot && isLateShift) {
                        pool = shuffleArray([...strict12pmSlotTasks, ...generalUnmentionedTasks]);
                    } else {
                        pool = shuffleArray(generalUnmentionedTasks);
                    }

                    let availableTasksForMember = isSoloSlot 
                        ? pool 
                        : pool.filter(t => !assignedTasksInSlot.has(t));

                    let taskBatchSize = isSoloSlot ? Math.min(8, availableTasksForMember.length) : Math.min(5, availableTasksForMember.length);
                    let selectedTasks = availableTasksForMember.slice(0, taskBatchSize);

                    if (selectedTasks.length === 0) {
                        let shuffledTickers = shuffleArray(tickerFallbackPool);
                        let unassignedTickers = shuffledTickers.filter(t => !assignedTasksInSlot.has(t));
                        
                        selectedTasks = unassignedTickers.length >= 2 
                            ? unassignedTickers.slice(0, 3) 
                            : shuffledTickers.slice(0, 3);
                    }

                    if (!isSoloSlot) {
                        selectedTasks.forEach(t => assignedTasksInSlot.add(t));
                    }

                    selectedTasks = selectedTasks.filter(t => !t.includes("Handover Report"));

                    if (handoverAssignees[m.id] === slotId) {
                        let handoverTask = (isLateShift || memberShift === 'shift-10-19') ? "Handover Report PM" : "Handover Report AM";
                        selectedTasks.push(handoverTask);
                    }

                    database[dayKey].grid[m.id].slots[slotId] = selectedTasks;
                });
            });

            archiveSnapshot(`AUTO_ASSIGN_${dayKey}`);
            renderAllPages();
            saveToDatabase();
            logActivity("AUTO_ASSIGN_TASKS", { targetDay: dayKey });

            setTimeout(() => {
                isLocalActionPending = false;
            }, 300);
        }

        function getMemberDutyCountsForDay(dayData, memberId) {
            const taskCounts = {};
            availableTasks.forEach(t => taskCounts[t] = 0);

            if (!dayData || !dayData.grid || !dayData.grid[memberId]) return taskCounts;

            const slots = dayData.grid[memberId].slots || {};
            Object.keys(slots).forEach(slotId => {
                const taskList = slots[slotId] || [];
                taskList.forEach(taskName => {
                    if (taskCounts.hasOwnProperty(taskName)) {
                        taskCounts[taskName]++;
                    } else {
                        const matched = availableTasks.find(t => t.toLowerCase() === taskName.toLowerCase());
                        if (matched) taskCounts[matched]++;
                    }
                });
            });

            return taskCounts;
        }

        function ensureDayExists(targetIsoDate) {

            let existingKey = Object.keys(database).find(k => {

            if (!existingKey) {

            const todayStr = getLocalDateString();

            ensureDayExists(activeViewIsoDate);
            let dayKey = Object.keys(database).find(k => {
                return k === formatFirebaseKey(activeViewIsoDate) || database[k].isoDate === activeViewIsoDate;
            }) || formatFirebaseKey(activeViewIsoDate);

            let dayData = database[dayKey] || { isoDate: activeViewIsoDate, reminder: "", grid: {} };
            let daySection = document.createElement('div');
            daySection.className = 'day-section';
            daySection.id = `section-${dayKey}`;

            const isToday = (dayData.isoDate === todayStr);
            if (isToday) daySection.classList.add('today-card');

            let currentProfileKey = getAutoProfileForDay(dayData);
            let activeTimeSlots = timeSlotProfiles[currentProfileKey];
            let shiftBadgeText = currentProfileKey === 'profile_2' ? 'SHIFT 2' : 'SHIFT 1';

            let titleHTML = `
                <div class="day-title-area">
                    <div class="day-title-left">
                        <button class="btn btn-secondary no-print" onclick="changeViewDate(-1)" title="Previous Day">◀ Previous</button>
                        <span class="date-picker-wrapper">
                            📅 
                            <input type="date" class="date-picker-input" value="${dayData.isoDate}" onchange="activeViewIsoDate=this.value; localStorage.setItem('sb_active_view_date', this.value); updateDayDate('${dayKey}', this.value)">
                            <span class="shift-badge-label">${shiftBadgeText}</span>
                        </span>
                        <button class="btn btn-secondary no-print" onclick="changeViewDate(1)" title="Next Day">Next ▶</button>
                        ${isToday ? '<span class="today-badge">Today</span>' : `<button class="btn btn-secondary no-print" onclick="resetToTodayView()">Today 📍</button>`}
                        <div class="reminder-box-wrapper">
                            <span>📌</span>
                            <input type="text" class="reminder-box-input" placeholder="Meeting Reminders / Notes..." value="${dayData.reminder || ''}" onchange="updateReminderText('${dayKey}', this.value)">
                        </div>
                    </div>
                    <div class="no-print" style="display:flex; gap:8px; align-items:center;">
                        <button class="btn btn-success" onclick="manualSaveDatabase()" style="padding:5px 12px; font-size:11px; font-weight:800;" title="Permanently Commit Changes">💾 Save Changes</button>
                        <button class="btn btn-primary" onclick="autoAssignTasksForDay('${dayKey}')" style="padding:5px 10px; font-size:11px;">🎲 Auto Assign Tasks</button>
                        <button class="btn btn-secondary" onclick="reshuffleTasksForDay('${dayKey}')" style="padding:5px 10px; font-size:11px; background:#e0f2fe; color:#0369a1; border-color:#bae6fd;">🔀 Re-Shuffle Tasks</button>
                        <button class="btn btn-secondary" onclick="clearDayDuties('${dayKey}')" style="padding:5px 10px; font-size:11px;">🧹 Clear Day</button>
                        <button class="btn btn-danger" onclick="deleteDay('${dayKey}')" style="padding:5px 10px; font-size:11px;">🗑️ Delete Day</button>
                    </div>
                </div>
            `;
            daySection.innerHTML += titleHTML;
            
            let contentWrapper = document.createElement('div');
            contentWrapper.className = 'day-content-wrapper';

            let tableWrapper = document.createElement('div');
            tableWrapper.className = 'table-responsive-wrapper';

            let table = document.createElement('table');
            table.className = 'schedule-table';
            
            let thead = `
                <thead>
                    <tr>
                        <th class="col-member">TEAM & DUTY COUNTER</th>
                        <th class="col-shift">SHIFT</th>
                        ${activeTimeSlots.map(s => `<th>${s.label}</th>`).join('')}
                    </tr>
                </thead>
            `;
            table.innerHTML += thead;

            let tbody = document.createElement('tbody');
            members.forEach(m => {
                let defaultForProfile = currentProfileKey === 'profile_2' ? m.defaultShiftProfile2 : m.defaultShiftProfile1;
                let memberGrid = (dayData.grid && dayData.grid[m.id]) ? dayData.grid[m.id] : { shift: defaultForProfile, slots: {} };
                let tr = document.createElement('tr');
                
                const taskCounts = getMemberDutyCountsForDay(dayData, m.id);
                
                let counterRowsHtml = '';
                let colorClasses = ['pill-c0', 'pill-c1', 'pill-c2', 'pill-c3'];
                let colorIdx = 0;

                availableTasks.forEach(tName => {
                    const cnt = taskCounts[tName] || 0;
                    if (cnt > 0) {
                        const pillClass = colorClasses[colorIdx % colorClasses.length];
                        colorIdx++;
                        counterRowsHtml += `
                            <div class="duty-counter-row">
                                <span class="duty-counter-row-name" title="${tName}">${tName}:</span>
                                <span class="duty-counter-pill ${pillClass}">${cnt}</span>
                            </div>
                        `;
                    }
                });

                if (!counterRowsHtml) {
                    counterRowsHtml = `<div style="text-align:center; color:#9ca3af; font-size:9px; padding:2px 0;">No tasks assigned</div>`;
                }

                let memberCell = `
                    <td>
                        <div class="team-member-container">
                            <div class="member-avatar-circle ${m.avatarClass}">${m.initial}</div>
                            <div class="member-name-label">${m.name}</div>
                            
                            <div class="duty-counter-card">
                                <div class="duty-counter-title">Daily Summary</div>
                                <div class="duty-counter-list">
                                    ${counterRowsHtml}
                                </div>
                            </div>
                        </div>
                    </td>
                `;

                let shiftOptions = shifts.map(s => 
                    `<option value="${s.id}" ${memberGrid.shift === s.id ? 'selected' : ''}>${s.label}</option>`
                ).join('');

                let shiftCell = `
                    <td>
                        <div class="shift-select-container">
                            <select class="shift-select no-print" onchange="changeShift('${dayKey}', '${m.id}', this.value)">
                                ${shiftOptions}
                            </select>
                        </div>
                    </td>
                `;
                
                tr.innerHTML += memberCell + shiftCell;
                
                activeTimeSlots.forEach(slot => {
                    let isSlotOffDuty = isOffDuty(memberGrid.shift, slot.id);
                    let selectedTaskList = (memberGrid.slots && memberGrid.slots[slot.id]) ? memberGrid.slots[slot.id] : [];
                    let formattedText = isSlotOffDuty ? '' : selectedTaskList.join('\n');
                    let offDutyClass = isSlotOffDuty ? 'off-duty-active' : '';
                    
                    let td = document.createElement('td');
                    
                    let taskCheckboxes = availableTasks.map(t => {
                        let isChecked = selectedTaskList.includes(t) ? 'checked' : '';
                        return `
                            <label class="task-option-label" onclick="event.stopPropagation();">
                                <input type="checkbox" value="${t}" ${isChecked} onchange="toggleTask('${dayKey}', '${m.id}', '${slot.id}', this, event)">
                                ${t}
                            </label>
                        `;
                    }).join('');

                    let dropdownOpenClass = (activeOpenDropdownId === `${dayKey}-${m.id}-${slot.id}`) ? 'show' : '';

                    td.innerHTML = `
                        <div class="task-card ${memberGrid.shift} ${offDutyClass}">
                            <div class="task-dropdown-container no-print" onclick="event.stopPropagation();">
                                <button type="button" class="task-dropdown-btn" onclick="toggleDropdown(event, '${dayKey}-${m.id}-${slot.id}')">
                                    <span>▼ Tasks</span>
                                </button>
                                <div id="dropdown-${dayKey}-${m.id}-${slot.id}" class="task-dropdown-content ${dropdownOpenClass}" onclick="event.stopPropagation();">
                                    ${taskCheckboxes}
                                </div>
                            </div>
                            <div class="editable-content-area" id="editor-${dayKey}-${m.id}-${slot.id}" contenteditable="${!isSlotOffDuty}" oninput="updateCellTextDebounced('${dayKey}', '${m.id}', '${slot.id}', this)">${formattedText}</div>
                        </div>
                    `;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            
            table.appendChild(tbody);
            tableWrapper.appendChild(table);
            contentWrapper.appendChild(tableWrapper);

            daySection.appendChild(contentWrapper);
            container.appendChild(daySection);
        }

        function toggleDropdown(event, id) {
            event.stopPropagation();
            const targetContent = document.getElementById(`dropdown-${id}`);
            const isCurrentlyShown = targetContent ? targetContent.classList.contains('show') : false;
            
            document.querySelectorAll('.task-dropdown-content').forEach(el => el.classList.remove('show'));
            
            if (!isCurrentlyShown && targetContent) {
                targetContent.classList.add('show');
                activeOpenDropdownId = id;
            } else {
                activeOpenDropdownId = null;
            }
        }

        function toggleTask(dayKey, memberId, slotId, checkbox, event) {
            if (event) event.stopPropagation();

            getValidatedUser();
            isLocalActionPending = true;

            if (!database[dayKey]) database[dayKey] = { grid: {} };
            let currentProfileKey = getAutoProfileForDay(database[dayKey]);
            let mObj = members.find(m => m.id === memberId);
            let defaultForProfile = currentProfileKey === 'profile_2' ? mObj.defaultShiftProfile2 : mObj.defaultShiftProfile1;

            if (!database[dayKey].grid[memberId]) database[dayKey].grid[memberId] = { shift: defaultForProfile, slots: {} };
            let dayGrid = database[dayKey].grid[memberId];
            if (!dayGrid.slots) dayGrid.slots = {};
            if (!dayGrid.slots[slotId]) dayGrid.slots[slotId] = [];

            if (checkbox.checked) {
                if (!dayGrid.slots[slotId].includes(checkbox.value)) dayGrid.slots[slotId].push(checkbox.value);
            } else {
                dayGrid.slots[slotId] = dayGrid.slots[slotId].filter(t => t !== checkbox.value);
            }

            let editor = document.getElementById(`editor-${dayKey}-${memberId}-${slotId}`);
            if (editor) {
                editor.innerText = dayGrid.slots[slotId].join('\n');
            }

            saveToDatabase();
            logActivity("TOGGLE_TASK", { targetDay: dayKey, member: memberId, slot: slotId, task: checkbox.value, checked: checkbox.checked });
            renderAllPages();

            setTimeout(() => { isLocalActionPending = false; }, 300);
        }

        function syncActiveDropdownCheckboxes() {
            if (!activeOpenDropdownId) return;
            let parts = activeOpenDropdownId.split('-');
            if (parts.length < 3) return;
            let dayKey = parts[0];
            let memberId = parts[1];
            let slotId = parts[2];

            let selectedList = (database[dayKey] && database[dayKey].grid[memberId] && database[dayKey].grid[memberId].slots[slotId]) 
                ? database[dayKey].grid[memberId].slots[slotId] : [];

            let dropdown = document.getElementById(`dropdown-${activeOpenDropdownId}`);
            if (dropdown) {
                dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = selectedList.includes(cb.value);
                });
            }
        }

        function changeShift(dayKey, memberId, newShift) {
            getValidatedUser();
            isLocalActionPending = true;

            if (!database[dayKey]) database[dayKey] = { grid: {} };
            if (!database[dayKey].grid[memberId]) database[dayKey].grid[memberId] = { slots: {} };
            database[dayKey].grid[memberId].shift = newShift;
            saveToDatabase();
            logActivity("CHANGE_SHIFT", { targetDay: dayKey, member: memberId, newShift: newShift });
            renderAllPages();

            setTimeout(() => { isLocalActionPending = false; }, 300);
        }

        function updateCellTextDebounced(dayKey, memberId, slotId, element) {
            isLocalActionPending = true;
            clearTimeout(debounceInputTimer);
            debounceInputTimer = setTimeout(() => {
                let lines = element.innerText.split('\n').filter(l => l.trim() !== '');
                if (!database[dayKey]) database[dayKey] = { grid: {} };
                let currentProfileKey = getAutoProfileForDay(database[dayKey]);
                let mObj = members.find(m => m.id === memberId);
                let defaultForProfile = currentProfileKey === 'profile_2' ? mObj.defaultShiftProfile2 : mObj.defaultShiftProfile1;

                if (!database[dayKey].grid[memberId]) database[dayKey].grid[memberId] = { shift: defaultForProfile, slots: {} };
                if (!database[dayKey].grid[memberId].slots) database[dayKey].grid[memberId].slots = {};
                database[dayKey].grid[memberId].slots[slotId] = lines;
                saveToDatabase();
                isLocalActionPending = false;
                renderAllPages();
            }, 500);
        }

        function updateDayDate(dayKey, newIsoDate) { 
            getValidatedUser();

            if (!database[dayKey]) return;
            
            let oldData = database[dayKey];
            delete database[dayKey];
            
            let newKey = formatFirebaseKey(newIsoDate);
            oldData.isoDate = newIsoDate;
            database[newKey] = oldData;
            
            saveToDatabase(); 
            logActivity("UPDATE_DATE", { oldKey: dayKey, newDate: newIsoDate });
            syncShiftsFromRotaMaster();
            renderAllPages();
        }

        function clearDayDuties(dayKey) {
            getValidatedUser();
            if (confirm(`Clear all assigned tasks for day (${dayKey})?`)) {
                archiveSnapshot(`CLEAR_DAY_${dayKey}`);
                logActivity("CLEAR_DAY_DUTIES", { targetDay: dayKey, backupData: JSON.stringify(database[dayKey]) });
                
                members.forEach(m => {
                    if (database[dayKey] && database[dayKey].grid[m.id]) {
                        database[dayKey].grid[m.id].slots = {};
                        let activeProfileSlots = timeSlotProfiles[getAutoProfileForDay(database[dayKey])];
                        activeProfileSlots.forEach(s => {
                            database[dayKey].grid[m.id].slots[s.id] = [];
                        });
                    }
                });
                
                saveToDatabase();
                renderAllPages();
            }
        }

        function clearAllData() {
            let user = getValidatedUser();

            if (confirm(`CRITICAL WARNING! Are you sure you want to clear ALL duties across ALL days? This event will be logged in the Security Audit Trail.`)) {
                archiveSnapshot("CLEAR_ALL_DATA");
                logActivity("CLEAR_ALL_DATA", { clearedBy: user, fullBackup: JSON.stringify(database) });
                Object.keys(database || {}).forEach(dayKey => {
                    members.forEach(m => {
                        if (database[dayKey] && database[dayKey].grid[m.id]) {
                            database[dayKey].grid[m.id].slots = {};
                            let currentSlots = timeSlotProfiles[getAutoProfileForDay(database[dayKey])];
                            currentSlots.forEach(s => {
                                database[dayKey].grid[m.id].slots[s.id] = [];
                            });
                        }
                    });
                });
                saveToDatabase();
                renderAllPages();
            }
        }

        function deleteDay(dayKey) {
            getValidatedUser();

            if (Object.keys(database || {}).length <= 1) return alert("You must keep at least one day sheet.");
            if (confirm(`Warning! Are you sure you want to delete this day sheet?`)) {
                archiveSnapshot(`DELETE_DAY_${dayKey}`);
                logActivity("DELETE_DAY_SHEET", { targetDay: dayKey, backupData: JSON.stringify(database[dayKey]) });
                delete database[dayKey];
                saveToDatabase();
                renderAllPages();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('sb_theme') === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }

            toggleMobileView(false);

            // 1. Render immediately from local memory/LocalStorage backup
            renderAllPages();

            // 2. Establish live database connection safely
            listenToLiveDatabase();
            setupPresenceSystem();
            
            window.addEventListener('click', function(e) {
                if (!e.target.closest('.task-dropdown-container')) {
                    document.querySelectorAll('.task-dropdown-content').forEach(el => el.classList.remove('show'));
                    activeOpenDropdownId = null;
                }
            });
        });
    </script>
</body>
</html>
