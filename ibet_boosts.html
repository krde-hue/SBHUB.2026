      --base-font-size: 14px;

      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --accent-blue: #0284c7;

      --danger-red: #dc2626;
      --text-main: #0f172a;

    .logo-title span { color: var(--accent-blue); }

    .action-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background: var(--card-bg); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--card-border); font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--danger-red); }
    .dot.live { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

    .btn { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .btn-primary { background: linear-gradient(135deg, #00b4d8, #0077b6); color: #fff; border: none; font-weight: 700; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-success { background: var(--accent-green); color: #fff; border: none; font-weight: 700; }

    /* Top Picks Banner */
    .top-picks-section { margin-bottom: 30px; }
    .section-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
    .top-picks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    
    .pick-card { background: var(--card-bg); border: 1px solid var(--accent-blue); border-radius: 12px; padding: 18px; position: relative; box-shadow: 0 4px 20px rgba(0, 180, 216, 0.08); }
    .pick-card .tag { position: absolute; top: 14px; right: 14px; background: rgba(0, 180, 216, 0.15); color: var(--accent-blue); font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .pick-card .event { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
    .pick-card .market { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main); line-height: 1.3; }
    .pick-card .odds-row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1rem; color: var(--accent-green); }

    /* Navigation Tabs */
    .sports-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--card-border); margin-bottom: 20px; overflow-x: auto; padding-bottom: 2px; }
    .tab-item { background: none; border: none; color: var(--text-sub); padding: 10px 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border-radius: 8px 8px 0 0; transition: 0.2s; white-space: nowrap; }
    .tab-item.active { background: var(--card-bg); color: var(--accent-blue); border: 1px solid var(--card-border); border-bottom: none; }
    .tab-item.primary { border-top: 3px solid var(--accent-blue); }

    /* Controls Bar */
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 16px; flex-wrap: wrap; }
    .search-box, .select-control { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 14px; border-radius: 8px; outline: none; font-size: 0.9rem; }
    .search-box { width: 220px; }
    .search-box:focus, .select-control:focus { border-color: var(--accent-blue); }
    .controls-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .font-slider-container { display: flex; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }
    .font-slider { cursor: pointer; accent-color: var(--accent-blue); width: 80px; }

    /* Table Component */
    .table-wrapper { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: inherit; }
    th { background: var(--table-header-bg); color: var(--text-sub); padding: 12px 14px; font-weight: 700; text-transform: uppercase; font-size: 0.75em; letter-spacing: 0.05em; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
    td { padding: 6px 10px; border-bottom: 1px solid var(--card-border); color: var(--text-main); position: relative; }
    tr:hover { background-color: rgba(0, 180, 216, 0.03); }

    /* Invisible Editable Input Field */
    .invisible-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: inherit;
      padding: 6px 8px;
      font-size: inherit;
      border-radius: 4px;
      outline: none;
      transition: all 0.2s ease;
    }
    .invisible-input:hover {
      border-color: rgba(148, 163, 184, 0.25);

    .invisible-input:focus {
      background: var(--input-bg);

      color: var(--text-main);

    .track-checkbox {

    function sortDatasetDescending(dataArray) {
      if (!dataArray || !Array.isArray(dataArray)) return;
      dataArray.sort((a, b) => {
        const dateA = a.Date || a["To Activate"] || a.Activated || "";
        const dateB = b.Date || b["To Activate"] || b.Activated || "";
        return String(dateB).localeCompare(String(dateA));
      });
    }

    // Populate Dynamic Month Filter Dropdown
    function populateMonthFilter() {
      const select = document.getElementById('monthFilter');
      const currentSelected = select.value;
      select.innerHTML = '<option value="ALL">All Months</option>';

      const monthsSet = new Set();
      Object.keys(masterDataset).forEach(sportKey => {
        if (sportKey === "Guidelines") return;
        (masterDataset[sportKey] || []).forEach(row => {
          const rawDate = row.Date || row["To Activate"] || row.Activated || "";
          const d = parseDate(rawDate);
          if (d) {
            const mKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            const mLabel = d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            monthsSet.add(JSON.stringify({ key: mKey, label: mLabel }));
          }
        });
      });

      const sortedMonths = Array.from(monthsSet).map(s => JSON.parse(s)).sort((a, b) => b.key.localeCompare(a.key));
      sortedMonths.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.key;
        opt.innerText = m.label;
        if (m.key === currentSelected) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // Banner logic: Filter upcoming weekly matches
    function generateUpcomingTopPicks() {
      const today = new Date("2026-09-02T00:00:00"); 
      const nextWeek = new Date(today);
      nextWeek.setDate(today.getDate() + 7);

      let upcomingList = [];

      Object.keys(masterDataset).forEach(sportKey => {
        if (sportKey === "Guidelines") return;
        const rows = masterDataset[sportKey] || [];
        rows.forEach(item => {
          const rawDate = item.Date || item["To Activate"] || item.Activated || "";
          const d = parseDate(rawDate);

          if (d && d >= today && d <= nextWeek) {
            upcomingList.push({
              event: `${item.League || sportKey}: ${item.Event || 'Special Event'}`,
              market: item.Market || item.Pick || 'Boosted Selection',
              oldOdds: item["Old Price"] || item.OG || "2.05",
              newOdds: item["New Price"] || item.NEW || "2.55",
              tag: (item.Sport || sportKey).toUpperCase(),
              parsedDate: d
            });
          }
        });
      });

      upcomingList.sort((a, b) => a.parsedDate - b.parsedDate);
      return upcomingList.slice(0, 3);
    }

    // -------------------------------------------------------------
    // 3. UI RENDERING ENGINE & CONTROLS
    // -------------------------------------------------------------
    function toggleDaylightNightMode() {
      document.body.classList.toggle('light-mode');
      const btn = document.getElementById('btnThemeToggle');
      if (document.body.classList.contains('light-mode')) {
        btn.innerText = '🌙 Night Mode';
      } else {
        btn.innerText = '☀️ Daylight Mode';
      }
    }

    function adjustFontSize(val) {
      document.documentElement.style.setProperty('--base-font-size', val + 'px');
      document.getElementById('fontSizeLabel').innerText = val + 'px';
    }

    function renderTabs() {
      const nav = document.getElementById('sportsTabsNav');
      nav.innerHTML = '';

      Object.keys(masterDataset).forEach((key) => {
        const btn = document.createElement('button');
        btn.className = `tab-item ${key === activeTabKey ? 'active' : ''} primary`;
        btn.innerText = key;
        btn.onclick = () => {
          activeTabKey = key;
          renderTabs();
          renderActiveTab();
        };
        nav.appendChild(btn);
      });

      populateMonthFilter();
    }

    function renderActiveTab() {
      const mainContainer = document.getElementById('mainContainer');
      const btnAddRow = document.getElementById('btnAddRow');
      const searchInput = document.getElementById('searchInput');
      const monthFilter = document.getElementById('monthFilter').value;
      const rowLimitFilter = document.getElementById('rowLimitFilter').value;

      if (activeTabKey === "Guidelines") {
        btnAddRow.style.display = 'none';
        renderGuidelinesView(mainContainer);
        return;
      }

      btnAddRow.style.display = 'inline-block';
      mainContainer.className = 'table-wrapper';
      mainContainer.innerHTML = `
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      `;

      let data = masterDataset[activeTabKey] || [];
      const query = searchInput.value.toLowerCase();
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');

      if (data.length === 0) {
        document.getElementById('rowCount').innerText = '0 records found';
        return;
      }

      sortDatasetDescending(data);

      const headers = Object.keys(data[0]);
      
      // Build Header
      const trHead = document.createElement('tr');
      headers.forEach(h => {
        const th = document.createElement('th');
        th.innerText = h;
        if (h === 'BO' || h === 'PUB') th.style.textAlign = 'center';
        trHead.appendChild(th);
      });
      const thAction = document.createElement('th');
      thAction.innerText = "Action";
      thAction.style.width = "80px";
      trHead.appendChild(thAction);
      thead.appendChild(trHead);

      // Filter Rows (Month Filter + Search Query)
      const filteredIndexes = [];
      data.forEach((row, index) => {
        const rawDate = row.Date || row["To Activate"] || row.Activated || "";
        const d = parseDate(rawDate);
        const mKey = d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : '';

        const monthMatches = (monthFilter === "ALL" || mKey === monthFilter);
        const queryMatches = Object.values(row).some(v => String(v).toLowerCase().includes(query));

        if (monthMatches && queryMatches) {
          filteredIndexes.push(index);
        }
      });

      // Apply Row Limit Filter
      const totalFiltered = filteredIndexes.length;
      let displayIndexes = filteredIndexes;
      if (rowLimitFilter !== "ALL") {
        const limit = parseInt(rowLimitFilter, 10);
        displayIndexes = filteredIndexes.slice(0, limit);
      }

      document.getElementById('rowCount').innerText = `Showing ${displayIndexes.length} of ${totalFiltered} entries`;

      displayIndexes.forEach(rowIndex => {
        const row = data[rowIndex];
        const tr = document.createElement('tr');

        headers.forEach(h => {
          const td = document.createElement('td');
          
          if (h === 'BO' || h === 'PUB') {
            const flexDiv = document.createElement('div');
            flexDiv.className = 'checkbox-container';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'track-checkbox';
            checkbox.checked = (row[h] === true || row[h] === "True" || row[h] === "1.0" || row[h] === 1);
            checkbox.onchange = (e) => {
              masterDataset[activeTabKey][rowIndex][h] = e.target.checked;
              pushToFirebaseSilent();
            };
            flexDiv.appendChild(checkbox);
            td.appendChild(flexDiv);
          } else {
            const input = document.createElement('input');
            input.className = 'invisible-input';
            input.type = 'text';
            input.value = row[h] !== undefined ? row[h] : '';
            input.oninput = (e) => {
              masterDataset[activeTabKey][rowIndex][h] = e.target.value;
            };
            input.onblur = () => pushToFirebaseSilent();
            td.appendChild(input);
          }
          tr.appendChild(td);
        });

        const tdDelete = document.createElement('td');
        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn-delete';
        btnDelete.innerText = '❌ Delete';
        btnDelete.onclick = () => deleteRow(rowIndex);
        tdDelete.appendChild(btnDelete);
        tr.appendChild(tdDelete);

        tbody.appendChild(tr);
      });

      renderTopPicks();
    }

    // Guidelines Tab Layout Renderer
    function renderGuidelinesView(container) {
      const g = masterDataset.Guidelines;
      container.className = '';
      let html = `
        <div class="guidelines-card">
          <div class="guidelines-title">🏆 Tier 1 Leagues & Priority Target Teams</div>
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>League / Competition</th>
                <th>Priority Target Teams</th>
              </tr>
            </thead>
            <tbody>
      `;
      
      g.leaguesRank.forEach(item => {
        html += `
          <tr>
            <td><strong>#${item.rank}</strong></td>
            <td>${item.league}</td>
            <td>${item.teams}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>

        <div class="guidelines-grid">
          <div class="guidelines-card">
            <div class="guidelines-title">🎯 Target Boost Markets</div>
            <ul style="padding-left: 20px; line-height: 1.8; color: var(--text-sub);">
      `;

      g.targetMarkets.forEach(m => {
        html += `<li style="margin-bottom: 8px;"><strong style="color:var(--text-main);">${m.split(':')[0]}:</strong> ${m.split(':')[1]}</li>`;
      });

      html += `
            </ul>
          </div>

          <div class="guidelines-card">
            <div class="guidelines-title">⚙️ Boost Configuration Settings</div>
            <table>
              <thead>
                <tr>
                  <th>Boost Type</th>
                  <th>Min Stake</th>
                  <th>Max Stake</th>
                  <th>Min Odds</th>
                  <th>Boost %</th>
                </tr>
              </thead>
              <tbody>
      `;

      g.boostSettings.forEach(bs => {
        html += `
          <tr>
            <td><strong>${bs.type}</strong></td>
            <td>${bs.minStake}</td>
            <td>${bs.maxStake}</td>
            <td>${bs.minOdds}</td>
            <td style="color:var(--accent-green); font-weight:bold;">${bs.boost}</td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.innerHTML = html;
      document.getElementById('rowCount').innerText = 'Guidelines Active';
    }

    function renderTopPicks(customPicks) {
      const container = document.getElementById('topPicksContainer');
      container.innerHTML = '';

      const picks = customPicks && customPicks.length > 0 ? customPicks : generateUpcomingTopPicks();

      if (picks.length === 0) {
        container.innerHTML = `<div style="color:var(--text-sub); padding:10px;">No upcoming fixtures scheduled for this week.</div>`;
        return;
      }

      picks.forEach(p => {
        const div = document.createElement('div');
        div.className = 'pick-card';
        div.innerHTML = `
          <div class="tag">${p.tag || 'UPCOMING'}</div>
          <div class="event">${p.event}</div>
          <div class="market">${p.market}</div>
          <div class="odds-row">
            <span style="color:var(--text-sub); font-size:0.85rem; font-weight:normal;">Was: <strike>${p.oldOdds}</strike></span>
            <span>Boosted: ${p.newOdds}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // -------------------------------------------------------------
    // 4. ADD, DELETE & EXPORT
    // -------------------------------------------------------------
    function addNewRowAtTop() {
      if (activeTabKey === "Guidelines") return;
      const data = masterDataset[activeTabKey];
      let newRow = {};

      if (data && data.length > 0) {
        Object.keys(data[0]).forEach(k => {
          if (k === 'BO' || k === 'PUB') {
            newRow[k] = false;
          } else if (k === 'Date') {
            newRow[k] = new Date().toISOString().split('T')[0];
          } else {
            newRow[k] = "";
          }
        });
      } else {
        newRow = { "BO": false, "PUB": false, "Brand": "Ibet", "Date": new Date().toISOString().split('T')[0], "Sport": activeTabKey, "League": "", "Event": "", "Market": "", "Notes": "" };
      }

      masterDataset[activeTabKey].unshift(newRow);
      populateMonthFilter();
      renderActiveTab();
      pushToFirebaseSilent();
    }

    function deleteRow(index) {
      if (confirm("Are you sure you want to delete this entry?")) {
        masterDataset[activeTabKey].splice(index, 1);
        populateMonthFilter();
        renderActiveTab();
        pushToFirebaseSilent();
      }
    }

    function exportExcelCurrentTab() {
      const data = masterDataset[activeTabKey];
      if (!data || Array.isArray(data) && data.length === 0) {
        alert("No tabular data available to export.");
        return;
      }
      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, activeTabKey);
      XLSX.writeFile(workbook, `IBET_BOOST_${activeTabKey}.xlsx`);
    }

    function exportExcelAllTabs() {
      const workbook = XLSX.utils.book_new();
      Object.keys(masterDataset).forEach(tabKey => {
        if (tabKey === "Guidelines") return;
        const data = masterDataset[tabKey] || [];
        if (data.length > 0) {
          const worksheet = XLSX.utils.json_to_sheet(data);
          XLSX.utils.book_append_sheet(workbook, worksheet, tabKey);
        }
      });
      XLSX.writeFile(workbook, `IBET_BOOST_All_Records.xlsx`);
    }

    function bindFirebaseListeners() {
      if (!db) return;

      db.ref('masterBoostsData').on('value', (snap) => {
        const val = snap.val();
        if (val) {
          masterDataset = val;
          renderTabs();
          renderActiveTab();
        }
      });
    }

    function pushToFirebaseSilent() {
      if (db) {
        db.ref('masterBoostsData').set(masterDataset);
      }
    }

    function pushToFirebase() {
      if (!db) {
        alert("Firebase is not initialized! Please configure your Firebase keys.");
        return;
      }
      db.ref('masterBoostsData').set(masterDataset);
      db.ref('topPicks').set(generateUpcomingTopPicks())
        .then(() => alert("Successfully synced all IBET BOOST data to Firebase!"))
        .catch(e => alert("Firebase Sync Error: " + e.message));
    }

    // Initialize
    renderTabs();
    renderActiveTab();
  </script>
</body>
</html>
