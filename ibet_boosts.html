    <style>

            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --header-text: #0f172a;
            --credit-text: #64748b;
            --border-color: #cbd5e0;
            --table-border: #cbd5e0;
            --accent-btn: #e2e8f0;
            --accent-btn-text: #334155;
            --th-bg: #f1f5f9;
            --th-text: #0f172a;
            --hover-row: #f8fafc;
            --active-tab-bg: #0d233a;
            --active-tab-text: #ffffff;
            --input-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --excel-green-bg: #dcfce7;
            --excel-green-text: #166534;
            --excel-yellow-bg: #fef9c3;
            --excel-yellow-text: #854d0e;
            --modal-bg: rgba(255, 255, 255, 0.98);
            --row-both-checked: rgba(34, 197, 94, 0.18);
            --row-single-checked: rgba(234, 179, 8, 0.15);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --header-text: #38bdf8;
            --credit-text: #94a3b8;
            --border-color: #334155;
            --table-border: #334155;
            --accent-btn: #334155;
            --accent-btn-text: #f8fafc;
            --th-bg: #0f172a;
            --th-text: #94a3b8;
            --hover-row: #1e293b;
            --active-tab-bg: #38bdf8;
            --active-tab-text: #0f172a;
            --input-bg: #0f172a;
            --dropdown-bg: #1e293b;
            --excel-green-bg: #064e3b;
            --excel-green-text: #a7f3d0;
            --excel-yellow-bg: #713f12;
            --excel-yellow-text: #fef08a;
            --modal-bg: rgba(15, 23, 42, 0.98);
            --row-both-checked: rgba(34, 197, 94, 0.22);
            --row-single-checked: rgba(234, 179, 8, 0.22);

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); padding: 15px; color: var(--text-color); transition: background-color 0.3s; }

        .sticky-top-panel { position: sticky; top: 0; z-index: 1000; background-color: var(--bg-color); padding-bottom: 5px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card-bg); padding: 12px 18px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 12px; border: 1px solid var(--border-color); }
        .title-group { display: flex; flex-direction: column; gap: 2px; }
        h1 { font-size: 20px; color: var(--header-text); }

        .btn-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-primary { background-color: #0d233a; color: white; }
        .btn-primary:hover { background-color: #173b61; }
        .btn-secondary { background-color: var(--accent-btn); color: var(--accent-btn-text); border: 1px solid var(--border-color); }
        .btn-secondary:hover { opacity: 0.85; }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background-color: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .btn-danger:hover { background-color: #fed7d7; }
        .btn-success { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .btn-success:hover { background-color: #dcfce7; }
        .btn-save { background-color: #0284c7; color: #ffffff; font-weight: 800; border: 1px solid #38bdf8; }
        .btn-save:hover { background-color: #0369a1; }
        .btn-markets { background-color: #3b82f6; color: #ffffff; font-weight: 700; border: 1px solid #60a5fa; box-shadow: 0 2px 4px rgba(59,130,246,0.2); }
        .btn-markets:hover { background-color: #2563eb; }

        .autosave-badge { font-size: 11px; color: #15803d; font-weight: bold; opacity: 0; transition: opacity 0.3s; background: #dcfce7; padding: 4px 10px; border-radius: 12px; display: inline-block; }

        .tabs-nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; border-bottom: 2px solid var(--border-color); padding-bottom: 6px; background: var(--card-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); min-height: 45px; }
        .tab-btn { padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; transition: all 0.2s; }
        .tab-btn.active { background-color: var(--active-tab-bg); color: var(--active-tab-text); border-color: var(--active-tab-bg); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card-bg); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 12px; }
        .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .search-input, .select-filter { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--input-bg); color: var(--text-color); font-size: 13px; outline: none; }

        .limit-select-wrapper { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text-color); }

        .table-card { background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .table-wrapper { width: 100%; overflow-x: auto; max-height: 72vh; scroll-behavior: smooth; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: auto; }
        
        th { position: sticky; top: 0; background-color: var(--th-bg); color: var(--th-text); padding: 10px 12px; text-align: left; font-weight: 700; border: 1px solid var(--border-color); white-space: nowrap; z-index: 10; }
        td { padding: 6px 8px; border: 1px solid var(--table-border); vertical-align: middle; white-space: normal; word-break: break-word; position: relative; }
        
        tr.highlight-both { background-color: var(--row-both-checked) !important; }
        tr.highlight-single { background-color: var(--row-single-checked) !important; }
        tr:hover { filter: brightness(0.97); }

        .row-number-cell { text-align: center; font-weight: bold; color: var(--credit-text); min-width: 55px; max-width: 65px; white-space: nowrap !important; padding: 6px 8px; }

        .editable-cell { width: 100%; min-width: 140px; border: 1px solid transparent; background: transparent; color: var(--text-color); font-size: 12px; padding: 4px 6px; border-radius: 4px; outline: none; transition: border 0.2s; white-space: pre-wrap; word-break: break-word; resize: none !important; overflow: hidden !important; min-height: 28px; height: auto; font-family: inherit; line-height: 1.35; }
        .editable-cell:focus { border-color: #38bdf8; background-color: var(--input-bg); box-shadow: 0 0 0 2px rgba(56,189,248,0.2); }
        .checkbox-cell { width: 18px; height: 18px; cursor: pointer; accent-color: #166534; }

        .delete-btn { background: none; border: none; cursor: pointer; font-size: 15px; opacity: 0.7; transition: opacity 0.2s, transform 0.2s; padding: 4px; }
        .delete-btn:hover { opacity: 1; transform: scale(1.2); }

        .meta-bar { display: flex; gap: 15px; font-size: 12px; font-weight: bold; color: var(--credit-text); background: var(--th-bg); padding: 8px 12px; border-radius: 6px; flex-wrap: wrap; border: 1px dashed var(--border-color); }
        .record-count { font-size: 12px; font-weight: bold; color: var(--header-text); }

        .guidelines-container { display: flex; flex-direction: column; gap: 24px; padding: 10px; }
        .guidelines-header-badge { background-color: var(--excel-green-bg); color: var(--excel-green-text); padding: 6px 14px; font-weight: 800; border-radius: 4px; display: inline-block; font-size: 13px; border: 1px solid var(--border-color); }
        .guidelines-section-title { font-weight: 800; font-size: 14px; margin-bottom: 8px; text-align: center; color: var(--header-text); }
        .guidelines-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; }
        .guidelines-table th { text-align: center; background-color: var(--th-bg); border: 1px solid var(--border-color); padding: 8px 10px; }
        .guidelines-table td { border: 1px solid var(--table-border); padding: 4px 6px; }
        .guidelines-cell-input { width: 100%; border: 1px solid transparent; background: transparent; color: var(--text-color); font-size: 12px; padding: 4px; border-radius: 4px; outline: none; text-align: center; }
        .guidelines-cell-input.left-align { text-align: left; font-weight: bold; }
        .rules-card { background-color: var(--excel-yellow-bg); color: var(--excel-yellow-text); padding: 14px 18px; border-radius: 8px; font-size: 12px; font-weight: 700; line-height: 1.6; border: 1px solid var(--border-color); }
        .rules-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
        .rules-item { display: flex; align-items: flex-start; gap: 8px; }
        .rule-textarea { flex: 1; border: 1px solid transparent; background: rgba(255, 255, 255, 0.4); color: var(--excel-yellow-text); font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 6px; outline: none; resize: none; overflow: hidden; min-height: 32px; }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(6px); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-card {
            background: var(--modal-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 22px 26px; width: 92%; max-width: 520px; box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            display: flex; flex-direction: column; gap: 16px; transition: transform 0.25s ease;
        }

        .modal-header { font-size: 16px; font-weight: 800; color: var(--header-text); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .modal-body { display: flex; flex-direction: column; gap: 14px; max-height: 60vh; overflow-y: auto; padding-right: 4px; }
        
        .column-toggle-list { display: flex; flex-direction: column; gap: 8px; }
        .column-toggle-item { display: flex; align-items: center; justify-content: space-between; background: var(--th-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 13px; font-weight: 600; gap: 8px; }
        .column-toggle-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
        .column-title-input { padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--input-bg); color: var(--text-color); font-size: 12px; font-weight: 700; flex: 1; }
        .column-title-input:focus { border-color: #38bdf8; outline: none; }

        .column-delete-btn { color: #ef4444; cursor: pointer; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); transition: all 0.2s; white-space: nowrap; }
        .column-delete-btn:hover { background: #ef4444; color: #ffffff; }

        .market-actions-group { display: flex; gap: 10px; margin-top: 8px; border-top: 1px dashed var(--border-color); padding-top: 12px; }
    </style>
</head>
<body>

    <div class="sticky-top-panel">
        <div class="header-container">
            <div class="title-group">
                <h1>iBET Boosted Odds & Banners Master</h1>
            </div>
            <div class="btn-controls">
                <span id="saveStatus" class="autosave-badge">✓ Live Synced</span>
                <button class="btn btn-save" onclick="saveToFirebaseNow(true)" title="Save & Lock State">💾 SAVE ALL</button>
                <button class="btn btn-secondary" onclick="toggleDarkMode()">🌓 Mode</button>
                <button class="btn btn-danger" id="clearTabBtn" onclick="clearCurrentSheet()">🗑️ Clear Tab</button>
                <button class="btn btn-primary" onclick="openExportModal()">📊 Download Excel File</button>
                <a href="index.html" class="btn btn-secondary">🏠 Dashboard</a>
            </div>
        </div>

        <div class="tabs-nav" id="tabsNav"></div>

        <div class="toolbar">
            <div class="toolbar-left">
                <div id="metaSummary" class="meta-bar"></div>
                <div class="limit-select-wrapper">
                    <span>📅 Show Latest:</span>
                    <select id="recordLimitSelect" class="select-filter" onchange="renderActiveSheet()">
                        <option value="10">10 Rows</option>
                        <option value="20">20 Rows</option>
                        <option value="30" selected>30 Rows</option>
                        <option value="40">40 Rows</option>
                        <option value="ALL">All Records (Legacy)</option>
                    </select>
                </div>
            </div>

            <div class="toolbar-right">
                <button class="btn btn-secondary" onclick="openCalendarBulkModal()" title="Auto tick BO/PUB for a date coverage">☑️ Bulk Check Date</button>
                <button class="btn btn-secondary" id="undoBtn" onclick="undo()" disabled title="Undo (Ctrl+Z)">↩️ Undo</button>
                <button class="btn btn-secondary" id="redoBtn" onclick="redo()" disabled title="Redo (Ctrl+Y)">↪️ Redo</button>
                <button class="btn btn-success" id="addRowBtn" onclick="addNewRow()">➕ Add Row (At Top)</button>
                <button class="btn btn-markets" id="marketsManagerBtn" onclick="openMarketsModal()" title="Configure Markets, Rename or Delete Columns">⚙️ Markets</button>
                <span id="recordCounter" class="record-count">Records: 0</span>
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search active tab..." oninput="filterTable()">
            </div>
        </div>
    </div>

    <div class="table-card" id="mainCard">
        <div class="table-wrapper" id="tableWrapper">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="guidelinesView" style="display: none;"></div>
    </div>

    <!-- CALENDAR RANGE BULK CHECK MODAL -->
    <div class="modal-overlay" id="calendarBulkModal">
        <div class="modal-card">
            <div class="modal-header">
                <span>📅 Select Date Range Coverage</span>
                <button class="delete-btn" onclick="closeCalendarBulkModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700;">
                    <label>From Date (Start):</label>
                    <input type="date" id="calendarStartDate" style="padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700;">
                    <label>To Date (End):</label>
                    <input type="date" id="calendarEndDate" style="padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
                </div>
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
                <button class="btn btn-secondary" onclick="closeCalendarBulkModal()">Cancel</button>
                <button class="btn btn-primary" onclick="executeCalendarBulkCheck()">☑️ Check Range</button>
            </div>
        </div>
    </div>

    <!-- MARKETS & COLUMN MANAGER MODAL -->
    <div class="modal-overlay" id="marketsModal">
        <div class="modal-card">
            <div class="modal-header">
                <span>⚙️ Markets & Column Settings</span>
                <button class="delete-btn" onclick="closeMarketsModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="font-size: 12px; color: var(--credit-text); font-weight: 600; margin-bottom: 4px;">
                    Edit titles, toggle visibility, or delete banner/market columns:
                </div>
                <div class="column-toggle-list" id="columnToggleContainer"></div>

                <div class="market-actions-group">
                    <button class="btn btn-success" style="flex: 1;" onclick="addNewMarketColumn()">➕ Add Column</button>
                    <button class="btn btn-secondary" onclick="resetHiddenColumns()">👁️ Show All</button>
                </div>
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
                <button class="btn btn-primary" onclick="closeMarketsModal()">Apply & Close</button>
            </div>
        </div>
    </div>

        const guidelinesData = {

                "if you spot any other markets which we cant combine - pls let Miguel know"

        };

        const embeddedData = {
            "iBET Football": { headers: ["BO", "PUB", "Brands", "KO Date", "KO Time", "Sports", "League", "Event", "Type", "Market 1", "Market 2", "Market 3", "Market 4", "Notes", "Other Ideas"], meta: { percent: "10%", max_stake: 25, mbl: 2500, showing_in: "All" }, rows: [], hiddenCols: [] },

        let currentSheet = "iBET Football";
        let workbookData = JSON.parse(JSON.stringify(embeddedData));

        /* --- CALENDAR MODAL CONTROLS --- */
        function openCalendarBulkModal() {
            document.getElementById('calendarBulkModal').classList.add('active');

            document.getElementById('calendarBulkModal').classList.remove('active');

        const nonDeletableColumns = ["BO", "PUB", "PUBLISHED", "KO DATE", "EVENT DATE", "BRANDS", "KO TIME", "SPORTS", "LEAGUE", "EVENT", "TYPE"];

        function openMarketsModal() {
            const sheet = workbookData[currentSheet];
            if (!sheet || !sheet.headers) return;

            if (!sheet.hiddenCols) sheet.hiddenCols = [];

            const container = document.getElementById('columnToggleContainer');
            container.innerHTML = '';

            sheet.headers.forEach((header, idx) => {
                const isHidden = sheet.hiddenCols.includes(header);
                const isCore = nonDeletableColumns.includes(header.toUpperCase());

                const div = document.createElement('div');
                div.className = 'column-toggle-item';

                let deleteBtnHtml = !isCore ? `<button class="column-delete-btn" onclick="removeMarketColumn(${idx})" title="Delete Column">🗑️ Delete</button>` : '';

                div.innerHTML = `
                    <label>
                        <input type="checkbox" class="checkbox-cell" ${!isHidden ? 'checked' : ''} onchange="toggleColumnVisibility('${escapeHtml(header)}', this.checked)">
                    </label>
                    <input type="text" class="column-title-input" value="${escapeHtml(header)}" onchange="renameColumn(${idx}, this.value)">
                    ${deleteBtnHtml}
                `;
                container.appendChild(div);
            });

            document.getElementById('marketsModal').classList.add('active');
        }

        function closeMarketsModal() {
            document.getElementById('marketsModal').classList.remove('active');
        }

        function renameColumn(colIdx, newTitle) {
            const sheet = workbookData[currentSheet];
            if (!sheet || !sheet.headers || !newTitle.trim()) return;

            const oldTitle = sheet.headers[colIdx];
            sheet.headers[colIdx] = newTitle.trim();

            if (sheet.hiddenCols && sheet.hiddenCols.includes(oldTitle)) {
                sheet.hiddenCols = sheet.hiddenCols.map(h => h === oldTitle ? newTitle.trim() : h);
            }

            saveToFirebaseNow(true);
            renderActiveSheet();
        }

        function toggleColumnVisibility(headerName, isVisible) {
            const sheet = workbookData[currentSheet];
            if (!sheet.hiddenCols) sheet.hiddenCols = [];

            if (!isVisible) {
                if (!sheet.hiddenCols.includes(headerName)) sheet.hiddenCols.push(headerName);
            } else {
                sheet.hiddenCols = sheet.hiddenCols.filter(h => h !== headerName);
            }

            saveToFirebaseNow(true);
            renderActiveSheet();
        }

        function resetHiddenColumns() {
            const sheet = workbookData[currentSheet];
            if (sheet) sheet.hiddenCols = [];
            saveToFirebaseNow(true);
            openMarketsModal();
            renderActiveSheet();
        }

        function addNewMarketColumn() {
            const sheet = workbookData[currentSheet];
            if (!sheet || !sheet.headers) return;

            const isBanners = currentSheet.includes("Banners");
            let defaultName = isBanners ? "NEW BANNER" : "Market 1";

            if (!isBanners) {
                let highestNum = 0;
                sheet.headers.forEach(h => {
                    const match = h.match(/Market\s*(\d+)/i);
                    if (match) {
                        const num = parseInt(match[1], 10);
                        if (num > highestNum) highestNum = num;
                    }
                });
                defaultName = `Market ${highestNum + 1}`;
            }

            sheet.headers.push(defaultName);

            if (sheet.rows) {
                sheet.rows.forEach(row => {
                    row.push("");
                });
            }

            saveToFirebaseNow(true);
            openMarketsModal();
            renderActiveSheet();
        }

        function removeMarketColumn(colIdx) {
            const sheet = workbookData[currentSheet];
            if (!sheet || !sheet.headers) return;

            const headerName = sheet.headers[colIdx];
            if (confirm(`Are you sure you want to remove column "${headerName}"? This will delete all data inside this column across all rows.`)) {
                sheet.headers.splice(colIdx, 1);
                if (sheet.rows) {
                    sheet.rows.forEach(row => {
                        row.splice(colIdx, 1);
                    });
                }
                if (sheet.hiddenCols) {
                    sheet.hiddenCols = sheet.hiddenCols.filter(h => h !== headerName);
                }
                saveToFirebaseNow(true);
                openMarketsModal();
                renderActiveSheet();
            }
        }

        function executeCalendarBulkCheck() {
            const startVal = document.getElementById('calendarStartDate').value;
            const endVal = document.getElementById('calendarEndDate').value;

            if (!startVal || !endVal) {
                alert("Please select both a Start and End date from the calendars.");
                return;
            }

            const sheet = workbookData[currentSheet];
            if (!sheet || !sheet.rows || sheet.rows.length === 0) {
                alert("No active data in this sheet to check.");
                return;
            }

            const startDate = new Date(startVal);
            startDate.setHours(0, 0, 0, 0);

            const endDate = new Date(endVal);
            endDate.setHours(23, 59, 59, 999);

            let dateColIdx = sheet.headers.findIndex(h => {
                const upper = h.toUpperCase();
                return upper === "KO DATE" || upper === "EVENT DATE";
            });
            if (dateColIdx === -1) dateColIdx = currentSheet === "iBET Banners" ? 1 : 3;

            const boIdx = sheet.headers.indexOf("BO");
            const pubIdx = sheet.headers.indexOf("PUB");
            const publishedIdx = sheet.headers.indexOf("PUBLISHED");

            let tickedCount = 0;

            sheet.rows.forEach(row => {
                const cellDateObj = parseRowDate(row[dateColIdx]);
                if (cellDateObj && cellDateObj >= startDate && cellDateObj <= endDate) {
                    if (boIdx !== -1) row[boIdx] = true;
                    if (pubIdx !== -1) row[pubIdx] = true;
                    if (publishedIdx !== -1) row[publishedIdx] = true;
                    tickedCount++;
                }
            });

            if (tickedCount > 0) {
                saveToFirebaseNow(true);
                renderActiveSheet();
                closeCalendarBulkModal();
                alert(`Successfully ticked BO/PUB for ${tickedCount} offer(s) between ${startVal} and ${endVal}.`);
            } else {
                alert(`No records found falling within ${startVal} to ${endVal}.`);
            }
        }

        /* --- BULK EXCEL PASTE ENGINE --- */
        function handleExcelPaste(e, startRowIdx, startColIdx) {
            e.preventDefault();
            const clipboardData = e.clipboardData || window.clipboardData;
            const pastedText = clipboardData.getData('text');

            if (!pastedText) return;

            const sheet = workbookData[currentSheet];
            if (!sheet || !sheet.rows) return;

            const rows = pastedText.split(/\r\n|\n|\r/);

            rows.forEach((rowText, rOffset) => {
                if (!rowText.trim() && rOffset === rows.length - 1) return;

                const targetRowIdx = startRowIdx + rOffset;

                while (sheet.rows.length <= targetRowIdx) {
                    const blankRow = sheet.headers.map((h) => {
                        if (h === "BO" || h === "PUB" || h === "PUBLISHED") return false;
                        if (h === "Brands") return "iBET";
                        return "";
                    });
                    sheet.rows.push(blankRow);
                }

                const cells = rowText.split('\t');
                cells.forEach((cellText, cOffset) => {
                    const targetColIdx = startColIdx + cOffset;
                    if (targetColIdx < sheet.headers.length) {
                        const headerName = sheet.headers[targetColIdx];
                        let cleanValue = cellText.trim();

                        if (headerName === "BO" || headerName === "PUB" || headerName === "PUBLISHED") {
                            const lower = cleanValue.toLowerCase();
                            sheet.rows[targetRowIdx][targetColIdx] = (lower === "true" || lower === "yes" || lower === "1" || lower === "x");
                        } else {
                            sheet.rows[targetRowIdx][targetColIdx] = cleanValue;
                        }
                    }
                });
            });

            saveToFirebaseNow(true);
            renderActiveSheet();
        }

        function initApp() {
            if (localStorage.getItem('theme_7a') === 'dark') { document.body.setAttribute('data-theme', 'dark'); }
            renderTabs();
            listenToFirebase();
        }

        function listenToFirebase() {
            if (!db) { renderActiveSheet(); return; }
            db.ref('ibet_boosts_master_v1').on('value', (snapshot) => {
                if (document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT')) { return; }
                const liveData = snapshot.val();
                if (liveData && typeof liveData === 'object') {
                    const ordered = {};
                    const tabOrder = ["iBET Football", "iBET Tennis", "iBET Other Sports", "iBET Banners", "Guideliness"];
                    tabOrder.forEach(key => { ordered[key] = liveData[key] || embeddedData[key]; });
                    workbookData = ordered;
                } else { saveToFirebaseNow(); }
                renderTabs();
                renderActiveSheet();
            });
        }

        function saveToFirebaseNow(isManualSave = false) {
            if (db) { db.ref('ibet_boosts_master_v1').set(workbookData); }
            const statusBadge = document.getElementById('saveStatus');
            if (statusBadge) {
                statusBadge.innerText = isManualSave ? '💾 SAVED & LOCKED' : '✓ Live Synced';
                statusBadge.style.opacity = '1';
                setTimeout(() => { statusBadge.style.opacity = '0'; }, 1500);
            }
        }

        function renderTabs() {
            const tabsNav = document.getElementById('tabsNav');
            tabsNav.innerHTML = '';
            const tabOrder = ["iBET Football", "iBET Tennis", "iBET Other Sports", "iBET Banners", "Guideliness"];
            tabOrder.forEach(sheetName => {
                if (workbookData[sheetName]) {
                    const btn = document.createElement('button');
                    btn.className = `tab-btn ${sheetName === currentSheet ? 'active' : ''}`;
                    btn.innerText = sheetName;
                    btn.onclick = () => { currentSheet = sheetName; renderTabs(); renderActiveSheet(); };
                    tabsNav.appendChild(btn);
                }
            });
        }

        function parseRowDate(val) {
            if (!val || typeof val !== 'string' || val.trim() === "") return null;
            let clean = val.trim().split(' ')[0];
            clean = clean.replace(/[\/\-]/g, '.');
            let parts = clean.split('.');
            if (parts.length === 3) {
                let day, month, year;
                if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10); month = parseInt(parts[1], 10) - 1; day = parseInt(parts[2], 10);
                } else {
                    month = parseInt(parts[0], 10) - 1; day = parseInt(parts[1], 10); year = parseInt(parts[2], 10);
                }
                const d = new Date(year, month, day);
                return isNaN(d.getTime()) ? null : d;
            }
            return null;
        }

        function getSortedAndLimitedRows(allRows) {
            if (!allRows) return [];
            const sheet = workbookData[currentSheet];
            let dateColIdx = sheet ? sheet.headers.findIndex(h => {
                const upper = h.toUpperCase();
                return upper === "KO DATE" || upper === "EVENT DATE";
            }) : -1;
            if (dateColIdx === -1) dateColIdx = currentSheet === "iBET Banners" ? 1 : 3;

            const limitVal = document.getElementById('recordLimitSelect')?.value || "30";

            const boIdx = sheet ? sheet.headers.indexOf("BO");
            const pubIdx = sheet ? sheet.headers.indexOf("PUB");
            const publishedIdx = sheet ? sheet.headers.indexOf("PUBLISHED");

            const mappedRows = allRows.map((row, index) => {
                const dateObj = parseRowDate(row[dateColIdx]);
                const timestamp = dateObj ? dateObj.getTime() : 0;

                const isBoChecked = boIdx !== -1 ? Boolean(row[boIdx]) : false;
                const isPubChecked = pubIdx !== -1 ? Boolean(row[pubIdx]) : false;
                const isPublishedChecked = publishedIdx !== -1 ? Boolean(row[publishedIdx]) : false;

                const isCompleted = (isBoChecked && isPubChecked) || isPublishedChecked;

                return { originalIndex: index, row: row, date: timestamp, completed: isCompleted };
            });

            mappedRows.sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }
                return b.date - a.date;
            });

            if (limitVal !== "ALL") {
                const count = parseInt(limitVal, 10);
                return mappedRows.slice(0, count);
            }
            return mappedRows;
        }

        function renderActiveSheet() {
            const tableWrapper = document.getElementById('tableWrapper');
            const guidelinesView = document.getElementById('guidelinesView');
            const metaSummary = document.getElementById('metaSummary');
            const addRowBtn = document.getElementById('addRowBtn');
            const marketsBtn = document.getElementById('marketsManagerBtn');
            const clearTabBtn = document.getElementById('clearTabBtn');
            const searchInput = document.getElementById('searchInput');

            if (currentSheet === "Guideliness") {
                tableWrapper.style.display = 'none'; guidelinesView.style.display = 'block'; metaSummary.style.display = 'none';
                if (addRowBtn) addRowBtn.style.display = 'none';
                if (marketsBtn) marketsBtn.style.display = 'none';
                clearTabBtn.style.display = 'none'; searchInput.style.display = 'none';
                document.getElementById('recordCounter').innerText = "Guidelines Manual";
                renderGuidelinesView();
                return;
            }

            tableWrapper.style.display = 'block'; guidelinesView.style.display = 'none';
            if (addRowBtn) addRowBtn.style.display = 'inline-flex';
            if (marketsBtn) marketsBtn.style.display = 'inline-flex';
            clearTabBtn.style.display = 'inline-flex'; searchInput.style.display = 'inline-block';

            const sheet = workbookData[currentSheet];
            if (!sheet) return;

            if (!sheet.hiddenCols) sheet.hiddenCols = [];

            const thead = document.getElementById('tableHead');
            let headHTML = '<tr><th class="row-number-cell">#</th><th style="width: 50px; text-align: center;">Action</th>';
            sheet.headers.forEach(h => {
                if (!sheet.hiddenCols.includes(h)) {
                    headHTML += `<th>${escapeHtml(h)}</th>`;
                }
            });
            headHTML += '</tr>';
            thead.innerHTML = headHTML;

            let mappedRows = getSortedAndLimitedRows(sheet.rows || []);
            renderTableRows(mappedRows);
        }

                        <table class="guidelines-table">

                                <tr>
                                    <th>RANK</th>
                                    <th>LEAGUE / COMPETITION</th>
                                    <th>OPTION 1</th>
                                    <th>OPTION 2</th>
                                    <th>OPTION 3</th>
                                    <th>OPTION 4</th>

                                <thead>

                                        <th>TYPE</th>

                                        <th>ODDS BOOST %</th>

                gData.specialBoosts.forEach(b => {

                gData.instructions.forEach((ins, idx) => {

        function renderTableRows(mappedRows) {
            const tbody = document.getElementById('tableBody');
            const sheet = workbookData[currentSheet];
            const recordCounter = document.getElementById('recordCounter');
            
            if (recordCounter) { recordCounter.innerText = `Showing ${mappedRows.length} of ${sheet.rows ? sheet.rows.length : 0}`; }

            tbody.innerHTML = '';
            mappedRows.forEach((item, displayIndex) => {
                const tr = createTableRowElement(item.row, item.originalIndex, displayIndex + 1);
                tbody.appendChild(tr);
            });
        }

        function createTableRowElement(row, originalIndex, displayLabelNumber) {
            const sheet = workbookData[currentSheet];
            const tr = document.createElement('tr');

            if (!sheet.hiddenCols) sheet.hiddenCols = [];

            const boIdx = sheet.headers.indexOf("BO");
            const pubIdx = sheet.headers.indexOf("PUB");
            const publishedIdx = sheet.headers.indexOf("PUBLISHED");

            const isBoChecked = boIdx !== -1 ? Boolean(row[boIdx]) : false;
            const isPubChecked = pubIdx !== -1 ? Boolean(row[pubIdx]) : false;
            const isPublishedChecked = publishedIdx !== -1 ? Boolean(row[publishedIdx]) : false;

            if ((isBoChecked && isPubChecked) || isPublishedChecked) {
                tr.className = "highlight-both";
            } else if (isBoChecked || isPubChecked) {
                tr.className = "highlight-single";
            }

            let rowHTML = `
                <td class="row-number-cell">${displayLabelNumber}</td>
                <td style="text-align: center; width: 50px;">
                    <button class="delete-btn" onclick="deleteRow(${originalIndex})" title="Delete Row">🗑️</button>
                </td>
            `;

            sheet.headers.forEach((headerName, colIndex) => {
                if (sheet.hiddenCols.includes(headerName)) return;

                const cellVal = row[colIndex];

                if (typeof cellVal === 'boolean' || headerName === "BO" || headerName === "PUB" || headerName === "PUBLISHED") {
                    const isChecked = Boolean(cellVal);
                    rowHTML += `
                        <td style="text-align: center; width: 45px;">
                            <input type="checkbox" class="checkbox-cell" ${isChecked ? 'checked' : ''} onchange="updateCell(${originalIndex}, ${colIndex}, this.checked)">
                        </td>
                    `;
                } else {
                    rowHTML += `
                        <td>
                            <textarea class="editable-cell" 
                                onpaste="handleExcelPaste(event, ${originalIndex}, ${colIndex})"
                                oninput="autoResizeTextarea(this); updateCellDirectly(${originalIndex}, ${colIndex}, this.value)"
                            >${escapeHtml(cellVal !== undefined && cellVal !== null ? cellVal : '')}</textarea>
                        </td>
                    `;
                }
            });

            tr.innerHTML = rowHTML;
            return tr;
        }

        function autoResizeTextarea(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; }

        function updateCell(rowIndex, colIndex, value) {
            workbookData[currentSheet].rows[rowIndex][colIndex] = value;
            saveToFirebaseNow(true);
            renderActiveSheet();
        }

        function updateCellDirectly(rowIndex, colIndex, value) {
            workbookData[currentSheet].rows[rowIndex][colIndex] = value;
            debouncedSaveToFirebase();
        }

        function debouncedSaveToFirebase() {
            clearTimeout(saveDebounceTimer);
            saveDebounceTimer = setTimeout(() => { saveToFirebaseNow(true); }, 400);
        }

        function addNewRow() {
            const sheet = workbookData[currentSheet];
            if (!sheet.rows) sheet.rows = [];

            const todayStr = new Date().toLocaleDateString('en-US');
            const newRow = sheet.headers.map((h) => {
                if (h === "BO" || h === "PUB" || h === "PUBLISHED") return false;
                if (h === "Brands") return "iBET";
                if (h === "KO Date" || h === "Event Date") return todayStr;
                return "";
            });

            sheet.rows.unshift(newRow);
            saveToFirebaseNow(true);
            renderActiveSheet();
        }

        function deleteRow(rowIndex) {
            if (confirm("Are you sure you want to delete this record?")) {
                workbookData[currentSheet].rows.splice(rowIndex, 1);
                saveToFirebaseNow(true);
                renderActiveSheet();
            }
        }

        function clearCurrentSheet() {
            if (confirm(`Are you sure you want to CLEAR ALL records in "${currentSheet}"?`)) {
                workbookData[currentSheet].rows = [];
                saveToFirebaseNow(true);
                renderActiveSheet();
            }
        }

        function escapeHtml(text) { return String(text).replace(/"/g, "&quot;"); }
        function toggleDarkMode() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme_7a', newTheme);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
