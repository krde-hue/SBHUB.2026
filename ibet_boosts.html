<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBET Boosted Odds Dashboard</title>

    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- SheetJS for Excel / ODS Parsing and Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --header-text: #0f172a;
            --credit-text: #64748b;
            --border-color: #cbd5e0;
            --table-border: #cbd5e0;
            --accent-btn: #e2e8f0;
            --accent-btn-text: #334155;
            --th-bg: #f1f5f9;
            --th-text: #0f172a;
            --hover-row: #f8fafc;
            --active-tab-bg: #0d233a;
            --active-tab-text: #ffffff;
            --input-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --excel-green-bg: #dcfce7;
            --excel-green-text: #166534;
            --excel-yellow-bg: #fef9c3;
            --excel-yellow-text: #854d0e;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --header-text: #38bdf8;
            --credit-text: #94a3b8;
            --border-color: #374151;
            --table-border: #374151;
            --accent-btn: #334155;
            --accent-btn-text: #f8fafc;
            --th-bg: #0f172a;
            --th-text: #94a3b8;
            --hover-row: #1e293b;
            --active-tab-bg: #38bdf8;
            --active-tab-text: #0f172a;
            --input-bg: #0f172a;
            --dropdown-bg: #1e293b;
            --excel-green-bg: #064e3b;
            --excel-green-text: #a7f3d0;
            --excel-yellow-bg: #713f12;
            --excel-yellow-text: #fef08a;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); padding: 15px; color: var(--text-color); transition: background-color 0.3s; }

        /* STICKY FROZEN TOP MENU BAR */
        .sticky-top-panel {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--bg-color);
            padding-bottom: 5px;
        }

        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card-bg); padding: 12px 18px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 12px; border: 1px solid var(--border-color); }
        .title-group { display: flex; flex-direction: column; gap: 2px; }
        h1 { font-size: 20px; color: var(--header-text); }

        .btn-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-primary { background-color: #0d233a; color: white; }
        .btn-primary:hover { background-color: #173b61; }
        .btn-secondary { background-color: var(--accent-btn); color: var(--accent-btn-text); border: 1px solid var(--border-color); }
        .btn-secondary:hover { opacity: 0.85; }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background-color: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .btn-danger:hover { background-color: #fed7d7; }
        .btn-success { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .btn-success:hover { background-color: #dcfce7; }

        .autosave-badge { font-size: 11px; color: #15803d; font-weight: bold; opacity: 0; transition: opacity 0.3s; background: #dcfce7; padding: 4px 10px; border-radius: 12px; display: inline-block; }

        /* DATA IMPORT FILE PICKER STYLING */
        .file-import-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--input-bg);
            border: 1px dashed var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        .file-import-input {
            font-size: 11px;
            color: var(--text-color);
            cursor: pointer;
            max-width: 190px;
        }

        /* NON-BLOCKING TOAST NOTIFICATION STYLING */
        .toast-banner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 14px 20px;
            border-radius: 8px;
            z-index: 99999;
            display: none;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            line-height: 1.4;
            min-width: 260px;
            animation: slideInToast 0.3s ease;
        }

        .toast-banner.show { display: flex; }

        .toast-title {
            font-weight: 800;
            color: #38bdf8;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes slideInToast {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .tabs-nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; border-bottom: 2px solid var(--border-color); padding-bottom: 6px; background: var(--card-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); min-height: 45px; }
        .tab-btn { padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; transition: all 0.2s; }
        .tab-btn.active { background-color: var(--active-tab-bg); color: var(--active-tab-text); border-color: var(--active-tab-bg); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card-bg); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 12px; }
        .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .search-input, .select-filter { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--input-bg); color: var(--text-color); font-size: 13px; outline: none; }

        .limit-select-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
        }

        .table-card { background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .table-wrapper { width: 100%; overflow-x: auto; max-height: 72vh; scroll-behavior: smooth; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: auto; }
        
        th { position: sticky; top: 0; background-color: var(--th-bg); color: var(--th-text); padding: 10px 12px; text-align: left; font-weight: 700; border: 1px solid var(--border-color); white-space: nowrap; z-index: 10; }
        td { padding: 6px 8px; border: 1px solid var(--table-border); vertical-align: middle; white-space: normal; word-break: break-word; position: relative; }
        tr:hover { background-color: var(--hover-row); }

        .row-number-cell { text-align: center; font-weight: bold; color: var(--credit-text); min-width: 55px; max-width: 65px; white-space: nowrap !important; word-break: normal !important; padding: 6px 8px; }

        /* FULLY VISIBLE MULTI-LINE EDITABLE CELL (NO SCROLLBARS OR ARROWS) */
        .editable-cell { 
            width: 100%; 
            min-width: 150px; 
            border: 1px solid transparent; 
            background: transparent; 
            color: var(--text-color); 
            font-size: 12px; 
            padding: 4px 6px; 
            border-radius: 4px; 
            outline: none; 
            transition: border 0.2s, background-color 0.2s; 
            white-space: pre-wrap; 
            word-break: break-word; 
            resize: none !important; 
            overflow: hidden !important; 
            min-height: 32px; 
            height: auto; 
            font-family: inherit; 
            line-height: 1.4; 
            field-sizing: content;
        }
        .editable-cell:focus { border-color: #38bdf8; background-color: var(--input-bg); box-shadow: 0 0 0 2px rgba(56,189,248,0.2); }
        .checkbox-cell { width: 18px; height: 18px; cursor: pointer; accent-color: #0d233a; }

        .delete-btn { background: none; border: none; cursor: pointer; font-size: 15px; opacity: 0.7; transition: opacity 0.2s, transform 0.2s; padding: 4px; }
        .delete-btn:hover { opacity: 1; transform: scale(1.2); }

        .pill-badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 12px; font-weight: 700; font-size: 11px; text-align: center; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: transform 0.15s; }
        .pill-badge:hover { transform: scale(1.04); }

        .sport-football { background-color: #fef08a; color: #854d0e; border-color: #fde047; }
        .sport-tennis { background-color: #fecdd3; color: #9f1239; border-color: #fda4af; }
        .sport-basketball { background-color: #991b1b; color: #ffffff; border-color: #7f1d1d; }
        .sport-ice-hockey { background-color: #dcfce7; color: #166534; border-color: #86efac; }
        .sport-baseball { background-color: #e2e8f0; color: #334155; border-color: #cbd5e0; }
        .sport-american-football { background-color: #e9d5ff; color: #6b21a8; border-color: #c084fc; }
        .sport-mma-boxing { background-color: #334155; color: #ffffff; border-color: #1e293b; }
        .sport-formula-1 { background-color: #713f12; color: #ffffff; border-color: #451a03; }

        .type-bet-builder { background-color: #e9d5ff; color: #6b21a8; border-color: #c084fc; }
        .type-single { background-color: #ccfbf1; color: #115e59; border-color: #5eead4; }
        .type-combo-boost { background-color: #ffedd5; color: #9a3412; border-color: #fdba74; }

        .dropdown-container { display: inline-block; width: 100%; }
        .dropdown-menu { display: none; position: fixed; z-index: 99999; background-color: var(--dropdown-bg); border: 1px solid var(--border-color); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 8px; min-width: 170px; max-height: none !important; overflow: visible !important; }
        .dropdown-menu.show { display: flex; flex-direction: column; gap: 6px; }
        .dropdown-option { padding: 4px; border-radius: 4px; cursor: pointer; }

        .meta-bar { display: flex; gap: 15px; font-size: 12px; font-weight: bold; color: var(--credit-text); background: var(--th-bg); padding: 8px 12px; border-radius: 6px; flex-wrap: wrap; border: 1px dashed var(--border-color); }
        .meta-item { display: flex; align-items: center; gap: 4px; }
        .record-count { font-size: 12px; font-weight: bold; color: var(--header-text); }

        .guidelines-container { display: flex; flex-direction: column; gap: 24px; padding: 10px; }
        .guidelines-header-badge { background-color: var(--excel-green-bg); color: var(--excel-green-text); padding: 6px 14px; font-weight: 800; border-radius: 4px; display: inline-block; font-size: 13px; letter-spacing: 0.5px; border: 1px solid var(--border-color); width: fit-content; }
        .guidelines-section-title { font-weight: 800; font-size: 14px; margin-bottom: 8px; text-align: center; color: var(--header-text); letter-spacing: 0.5px; }
        
        .guidelines-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; }
        .guidelines-table th { text-align: center; background-color: var(--th-bg); border: 1px solid var(--border-color); padding: 8px 10px; }
        .guidelines-table td { border: 1px solid var(--table-border); padding: 4px 6px; }
        
        .guidelines-cell-input { width: 100%; border: 1px solid transparent; background: transparent; color: var(--text-color); font-size: 12px; padding: 4px; border-radius: 4px; outline: none; text-align: center; font-weight: 500; }
        .guidelines-cell-input:focus { border-color: #38bdf8; background-color: var(--input-bg); box-shadow: 0 0 0 2px rgba(56,189,248,0.2); }
        .guidelines-cell-input.left-align { text-align: left; font-weight: bold; }

        .rules-card { background-color: var(--excel-yellow-bg); color: var(--excel-yellow-text); padding: 14px 18px; border-radius: 8px; font-size: 12px; font-weight: 700; line-height: 1.6; border: 1px solid var(--border-color); }
        .rules-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
        .rules-item { display: flex; align-items: flex-start; gap: 8px; }
        
        .rule-textarea { 
            flex: 1; 
            border: 1px solid transparent; 
            background: rgba(255, 255, 255, 0.4); 
            color: var(--excel-yellow-text); 
            font-size: 12px; 
            font-weight: 700; 
            padding: 6px 10px; 
            border-radius: 6px; 
            outline: none; 
            resize: none !important; 
            overflow: hidden !important; 
            min-height: 32px; 
            line-height: 1.35; 
        }
        [data-theme="dark"] .rule-textarea { background: rgba(0, 0, 0, 0.25); color: var(--excel-yellow-text); }
        .rule-textarea:focus { border-color: #38bdf8; background: var(--input-bg); color: var(--text-color); }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.show { display: flex; }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--header-text);
        }

        .export-opt-btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .export-opt-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body>

    <!-- STICKY FROZEN HEADER PANEL -->
    <div class="sticky-top-panel">
        <div class="header-container">
            <div class="title-group">
                <h1>iBET Boosted Odds Master</h1>
            </div>
            <div class="btn-controls">
                <span id="saveStatus" class="autosave-badge">✓ Live Synced</span>

                <!-- DATA IMPORT FILE PICKER -->
                <div class="file-import-box" title="Import ODS/XLSX file into system">
                    <span>📄 Import ODS/XLSX:</span>
                    <input type="file" id="odsFileInput" class="file-import-input" accept=".ods, .xlsx, .xls" onchange="handleFileImport(this)">
                </div>

                <button class="btn btn-secondary" id="undoBtn" onclick="undo()" disabled title="Undo (Ctrl+Z)">↩️ Undo</button>
                <button class="btn btn-secondary" id="redoBtn" onclick="redo()" disabled title="Redo (Ctrl+Y)">↪️ Redo</button>
                <button class="btn btn-secondary" onclick="toggleDarkMode()">🌓 Mode</button>
                <button class="btn btn-success" id="addRowBtn" onclick="addNewRow()">➕ Add Row (At Top)</button>
                <button class="btn btn-danger" id="clearTabBtn" onclick="clearCurrentSheet()">🗑️ Clear Tab</button>
                <button class="btn btn-primary" onclick="openExcelExportModal()">📊 Download Excel File</button>
                <a href="index.html" class="btn btn-secondary">🏠 Dashboard</a>
            </div>
        </div>

        <div class="tabs-nav" id="tabsNav"></div>

        <div class="toolbar">
            <div class="toolbar-left">
                <div id="metaSummary" class="meta-bar"></div>
                
                <div class="limit-select-wrapper">
                    <span>📅 Show Latest:</span>
                    <select id="recordLimitSelect" class="select-filter" onchange="renderActiveSheet()">
                        <option value="10">10 Rows</option>
                        <option value="20">20 Rows</option>
                        <option value="30" selected>30 Rows</option>
                        <option value="40">40 Rows</option>
                        <option value="ALL">All Records (Legacy)</option>
                    </select>
                </div>

                <select id="sportsFilter" class="select-filter" style="display: none;" onchange="filterTable()">
                    <option value="">🏅 All Sports (Filter)</option>
                    <option value="Football">Football</option>
                    <option value="Tennis">Tennis</option>
                    <option value="Basketball">Basketball</option>
                    <option value="Ice Hockey">Ice Hockey</option>
                    <option value="Baseball">Baseball</option>
                    <option value="American Football">American Football</option>
                    <option value="MMA/Boxing">MMA/Boxing</option>
                    <option value="Formula 1">Formula 1</option>
                </select>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="recordCounter" class="record-count">Records: 0</span>
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search active tab..." oninput="filterTable()">
            </div>
        </div>
    </div>

    <div class="table-card" id="mainCard">
        <div class="table-wrapper" id="tableWrapper" onscroll="closeAllDropdowns()">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="guidelinesView" style="display: none;"></div>
    </div>

    <!-- NON-BLOCKING TOAST NOTIFICATION CONTAINER -->
    <div id="toastBanner" class="toast-banner">
        <div class="toast-title" id="toastTitle">✅ Import Complete!</div>
        <div id="toastBody">File processed successfully.</div>
    </div>

    <!-- EXCEL EXPORT MODAL -->
    <div class="modal-backdrop" id="excelExportModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>📊 Export iBet Workbook to Excel</span>
                <span style="cursor: pointer; font-size: 16px;" onclick="closeExcelExportModal()">✖</span>
            </div>
            <p style="font-size: 12px; opacity: 0.85;">Choose your preferred export scope:</p>
            
            <button class="export-opt-btn" onclick="exportCurrentMonthExcel()">
                <span>📊 Download Excel File</span>
                <span style="color: #38bdf8; font-size: 11px;">(Current Month Default)</span>
            </button>

            <div style="display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
                <label style="font-size: 11px; font-weight: 700;">📆 Select Custom Month/Year:</label>
                <div style="display: flex; gap: 8px;">
                    <select id="exportMonthSelect" class="select-filter" style="flex: 1;">
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08" selected>August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <select id="exportYearSelect" class="select-filter" style="width: 90px;">
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <button class="btn btn-primary" style="margin-top: 6px; font-size: 11px;" onclick="exportCustomMonthExcel()">Export Selected Month</button>
            </div>

            <button class="export-opt-btn" onclick="exportFullWorkbookExcel()">
                <span>📁 Export All Records (Full Master Workbook)</span>
            </button>

            <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
                <button class="btn btn-secondary" onclick="closeExcelExportModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaEclzLI284lWCFk-vXbLSXa_bEZsXbOg",
            authDomain: "test-daily-task--sb.firebaseapp.com",
            databaseURL: "https://test-daily-task--sb-default-rtdb.firebaseio.com",
            projectId: "test-daily-task--sb",

            messagingSenderId: "928476661919",

        };

        let db = null;
        try {
            if (typeof firebase !== 'undefined' && !firebase.apps.length) {

        let undoStack = [];

        let saveDebounceTimer = null;
        let renderDebounceTimer = null;
        let isImporting = false;

        const sportsOptions = [
            { name: "Football", class: "sport-football" },
            { name: "Tennis", class: "sport-tennis" },
            { name: "Basketball", class: "sport-basketball" },
            { name: "Ice Hockey", class: "sport-ice-hockey" },
            { name: "Baseball", class: "sport-baseball" },
            { name: "American Football", class: "sport-american-football" },
            { name: "MMA/Boxing", class: "sport-mma-boxing" },
            { name: "Formula 1", class: "sport-formula-1" }
        ];

        const typeOptions = [
            { name: "Bet Builder", class: "type-bet-builder" },
            { name: "Single", class: "type-single" },
            { name: "Combo Boost", class: "type-combo-boost" }
        ];

        function getSportClass(sportName) {
            const found = sportsOptions.find(s => s.name.toLowerCase() === String(sportName).toLowerCase());
            return found ? found.class : "sport-football";
        }

        function getTypeClass(typeName) {
            const found = typeOptions.find(t => t.name.toLowerCase() === String(typeName).toLowerCase());
            return found ? found.class : "type-single";
        }

        /* ROBUST UNIVERSAL DATE PARSER (HANDLES 9/16/26, 16-17 Sept, 2026-09-16, 16.09.2026) */
        function parseRowDate(val) {
            if (!val || typeof val !== 'string' || val.trim() === "") return null;
            let clean = val.split(' ')[0].replace(/[\/\-]/g, '.');
            let parts = clean.split('.');
            if (parts.length === 3) {
                let day, month, year;
                if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10) - 1;
                    day = parseInt(parts[2], 10);
                } else {
                    month = parseInt(parts[0], 10) - 1;
                    day = parseInt(parts[1], 10);
                    year = parseInt(parts[2], 10);
                    if (year < 100) year += 2000;
                }
                return new Date(year, month, day);
            }
            return null;
        }

        /* GUARANTEES LATEST DATES ARE SORTED AT THE ABSOLUTE TOP (STRICT CHRONOLOGICAL) */
        function getSortedAndLimitedRows(allRows) {
            const dateColIdx = 3;
            const limitVal = document.getElementById('recordLimitSelect')?.value || "30";

            const mappedRows = allRows.map((row, index) => {
                const dateObj = parseRowDate(row[dateColIdx]);
                // Undated/blank rows are assigned timestamp 0 so real calendar dates sort strictly above them
                const timestamp = dateObj ? dateObj.getTime() : 0;
                return {
                    originalIndex: index,
                    row: row,
                    date: timestamp
                };
            });

            // Sort strictly descending: Latest dates first
            mappedRows.sort((a, b) => b.date - a.date);

            let resultMapped = mappedRows;
            if (limitVal !== "ALL") {
                const count = parseInt(limitVal, 10);
                resultMapped = mappedRows.slice(0, count);
            }

            return resultMapped;
        }

        function renderTableRows(mappedRows) {
            const tbody = document.getElementById('tableBody');
            const sheet = workbookData[currentSheet];
            const recordCounter = document.getElementById('recordCounter');
            
            if (recordCounter) {
                recordCounter.innerText = `Showing ${mappedRows.length} of ${sheet.rows.length}`;
            }

            tbody.innerHTML = '';
            const totalDatabaseRows = sheet.rows.length;

            mappedRows.forEach((item, displayIndex) => {
                const sequentialLabelNumber = totalDatabaseRows - displayIndex;
                const tr = createTableRowElement(item.row, item.originalIndex, sequentialLabelNumber);
                tbody.appendChild(tr);
            });

            // Expand all textareas dynamically so no text is clipped and scrollbars disappear
            setTimeout(() => {
                document.querySelectorAll('.editable-cell').forEach(el => autoExpandTextarea(el));
            }, 50);
        }

        function autoExpandTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function createTableRowElement(row, originalIndex, displayLabelNumber) {
            const sheet = workbookData[currentSheet];
            const tr = document.createElement('tr');

            let rowHTML = `
                <td class="row-number-cell">${displayLabelNumber}</td>
                <td style="text-align: center; width: 50px;">
                    <button class="delete-btn" onclick="deleteRow(${originalIndex})" title="Delete Row">🗑️</button>
                </td>
            `;

            sheet.headers.forEach((headerName, colIndex) => {
                const cellVal = row[colIndex];

                if (typeof cellVal === 'boolean') {
                    rowHTML += `
                        <td style="text-align: center; width: 45px;">
                            <input type="checkbox" class="checkbox-cell" ${cellVal ? 'checked' : ''} onchange="updateCell(${originalIndex}, ${colIndex}, this.checked)">
                        </td>
                    `;
                } else if (headerName === "Sports") {
                    if (currentSheet === "IBET Football") {
                        rowHTML += `<td><span class="pill-badge sport-football">Football</span></td>`;
                    } else if (currentSheet === "IBET Tennis") {
                        rowHTML += `<td><span class="pill-badge sport-tennis">Tennis</span></td>`;
                    } else {
                        const sClass = getSportClass(cellVal || "Football");
                        rowHTML += `
                            <td>
                                <div class="dropdown-container">
                                    <span class="pill-badge ${sClass}" onclick="toggleFloatingDropdown(event, 'sport-${originalIndex}')">${escapeHtml(cellVal || 'Football')} ▼</span>
                                    <div id="sport-${originalIndex}" class="dropdown-menu">
                                        ${sportsOptions.map(s => `
                                            <div class="dropdown-option" onclick="selectSportOption(${originalIndex}, ${colIndex}, '${s.name}')">

                                            </div>

                                    </div>
                                </div>
                            </td>
                        `;
                    }
                } else if (headerName === "Type") {
                    const tClass = getTypeClass(cellVal || "Single");
                    rowHTML += `
                        <td>
                            <div class="dropdown-container">
                                <span class="pill-badge ${tClass}" onclick="toggleFloatingDropdown(event, 'type-${originalIndex}')">${escapeHtml(cellVal || 'Single')} ▼</span>
                                <div id="type-${originalIndex}" class="dropdown-menu">

                } else {
                    rowHTML += `
                        <td>
                            <textarea class="editable-cell" oninput="autoExpandTextarea(this); updateCellDirectly(${originalIndex}, ${colIndex}, this.value)">${escapeHtml(cellVal !== undefined && cellVal !== null ? cellVal : '')}</textarea>
                        </td>

                }
            });

            tr.innerHTML = rowHTML;
            return tr;
        }

        function exportMonthYearExcel(monthStr, yearStr) {
            const wb = XLSX.utils.book_new();

            Object.keys(workbookData).forEach(sheetName => {
                if (sheetName === "Guideliness") return;

                const sheet = workbookData[sheetName];
                if (!sheet || !sheet.rows) return;

                const filteredRows = sheet.rows.filter(row => {
                    const dateVal = row[3];
                    if (!dateVal || typeof dateVal !== 'string') return false;
                    const parts = dateVal.split(' ')[0].split('.');
                    if (parts.length === 3) {
                        const m = parts[0];
                        const y = parts[2];
                        return m === monthStr && y === yearStr;
                    }
                    return false;
                });

                const sheetData = [sheet.headers, ...filteredRows];
                const ws = XLSX.utils.aoa_to_sheet(sheetData);
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            XLSX.writeFile(wb, `iBet_Boosts_${monthStr}_${yearStr}.xlsx`);
        }

        /* STRICT FILE IMPORT HANDLER: REQUIRES BOTH LEAGUE & EVENT FILLED */
        function handleFileImport(input) {
            const file = input.files[0];
            if (!file) return;

            isImporting = true;

            const statusBadge = document.getElementById('saveStatus');
            if (statusBadge) {
                statusBadge.style.opacity = '1';
                statusBadge.innerText = '⏳ Processing File...';
            }

            setTimeout(() => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true, cellStyles: false, cellFormulas: false });
                        
                        let importedCounts = {
                            "IBET Football": 0,
                            "IBET Tennis": 0,
                            "IBET Other Sports": 0
                        };

                        pushState();

                        workbook.SheetNames.forEach(sheetName => {
                            const ws = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });

                            if (!jsonData || jsonData.length < 2) return;

                            let headerIdx = -1;
                            for (let i = 0; i < Math.min(15, jsonData.length); i++) {
                                const rowStr = jsonData[i].join(' ').toLowerCase();
                                if (rowStr.includes('event') || rowStr.includes('league') || rowStr.includes('markets') || rowStr.includes('date') || rowStr.includes('sport')) {
                                    headerIdx = i;
                                    break;
                                }
                            }

                            if (headerIdx === -1) headerIdx = 0;

                            const headers = jsonData[headerIdx].map(h => String(h || '').trim());
                            
                            const boCol = headers.findIndex(h => /^bo$/i.test(h));
                            const pubCol = headers.findIndex(h => /^pub$/i.test(h));
                            const brandCol = headers.findIndex(h => /brand/i.test(h));
                            const dateCol = headers.findIndex(h => /date/i.test(h));
                            const timeCol = headers.findIndex(h => /^ko$|time/i.test(h));
                            const sportCol = headers.findIndex(h => /sport/i.test(h));
                            const leagueCol = headers.findIndex(h => /league|competition|tournament/i.test(h));
                            const eventCol = headers.findIndex(h => /event|match|fixture|matchup/i.test(h));
                            const typeCol = headers.findIndex(h => /type/i.test(h));
                            const marketCol = headers.findIndex(h => /market|pick|notes/i.test(h));

                            const rowsToProcess = jsonData.slice(headerIdx + 1);

                            for (let r = 0; r < rowsToProcess.length; r++) {
                                const row = rowsToProcess[r];
                                if (!row || row.length === 0) continue;

                                const leagueVal = leagueCol !== -1 && row[leagueCol] ? String(row[leagueCol]).trim() : "";
                                const eventVal = eventCol !== -1 && row[eventCol] ? String(row[eventCol]).trim() : "";

                                // STRICT FILTER: Discard row if EITHER League OR Event is blank
                                if (!leagueVal || !eventVal) continue;

                                const boVal = boCol !== -1 ? (row[boCol] === true || String(row[boCol]).toLowerCase() === 'true' || row[boCol] === 1) : true;
                                const pubVal = pubCol !== -1 ? (row[pubCol] === true || String(row[pubCol]).toLowerCase() === 'true' || row[pubCol] === 1) : true;
                                const brandVal = brandCol !== -1 && row[brandCol] ? String(row[brandCol]).trim() : "Ibet";
                                
                                // Standardize Date
                                let rawDateStr = dateCol !== -1 && row[dateCol] ? String(row[dateCol]).trim() : "";
                                let dateVal = "";
                                if (rawDateStr) {
                                    const parsedObj = parseRowDate(rawDateStr);
                                    if (parsedObj) {
                                        const mm = String(parsedObj.getMonth() + 1).padStart(2, '0');
                                        const dd = String(parsedObj.getDate()).padStart(2, '0');
                                        const yyyy = parsedObj.getFullYear();
                                        dateVal = `${mm}.${dd}.${yyyy}`;
                                    } else {
                                        dateVal = rawDateStr;
                                    }
                                }

                                const timeVal = timeCol !== -1 && row[timeCol] ? String(row[timeCol]).trim() : "";
                                let sportVal = sportCol !== -1 && row[sportCol] ? String(row[sportCol]).trim() : "";
                                const typeVal = typeCol !== -1 && row[typeCol] ? String(row[typeCol]).trim() : "Single";
                                const marketVal = marketCol !== -1 && row[marketCol] ? String(row[marketCol]).trim() : "";

                                let targetSheet = "IBET Football";
                                const sportLower = sportVal.toLowerCase();
                                const sheetLower = sheetName.toLowerCase();

                                if (sportLower.includes('tennis') || sheetLower.includes('tennis')) {
                                    targetSheet = "IBET Tennis";
                                    sportVal = "Tennis";
                                } else if (sportLower.includes('football') || sportLower.includes('soccer') || sheetLower.includes('foot')) {
                                    targetSheet = "IBET Football";
                                    sportVal = "Football";
                                } else if (sportVal !== "" || sheetLower.includes('other')) {
                                    targetSheet = "IBET Other Sports";
                                    if (!sportVal) sportVal = "Basketball";
                                } else {
                                    targetSheet = currentSheet.includes('Tennis') ? "IBET Tennis" : (currentSheet.includes('Other') ? "IBET Other Sports" : "IBET Football");
                                    if (!sportVal) sportVal = targetSheet.replace('IBET ', '');
                                }

                                if (!workbookData[targetSheet]) workbookData[targetSheet] = { rows: [], headers: [] };
                                if (!workbookData[targetSheet].rows) workbookData[targetSheet].rows = [];

                                const newRow = [
                                    boVal, pubVal, brandVal,
                                    dateVal, timeVal, sportVal,
                                    leagueVal, eventVal, typeVal,
                                    marketVal, "", "", "Imported via File", ""
                                ];

                                workbookData[targetSheet].rows.unshift(newRow);
                                importedCounts[targetSheet]++;
                            }
                        });

                        saveToFirebaseNow();
                        renderActiveSheet();

                        const totalAll = importedCounts["IBET Football"] + importedCounts["IBET Tennis"] + importedCounts["IBET Other Sports"];
                        
                        if (totalAll > 0) {
                            showToast(
                                "✅ Import Complete!",
                                `• Football: ${importedCounts["IBET Football"]} rows\n• Tennis: ${importedCounts["IBET Tennis"]} rows\n• Other Sports: ${importedCounts["IBET Other Sports"]} rows`
                            );
                        } else {
                            showToast("⚠️ Import Warning", "No valid rows with filled League & Event detected.");
                        }

                    } catch (err) {
                        console.error("Import Error:", err);
                        showToast("⚠️ Import Error", "Could not process file. Ensure a valid XLSX or ODS spreadsheet.");
                    } finally {
                        isImporting = false;
                        if (statusBadge) {
                            statusBadge.innerText = '✓ Live Synced';
                            statusBadge.style.opacity = '1';
                            setTimeout(() => { statusBadge.style.opacity = '0'; }, 1000);
                        }
                        input.value = '';
                    }
                };
                reader.readAsArrayBuffer(file);
            }, 50);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
