<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root[data-theme="dark"] {
            --bg-color: #060b19;
            --center-btn-bg: linear-gradient(145deg, #1e293b, #0f172a);
            --item-btn-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            --border-color: rgba(56, 189, 248, 0.35);
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #38bdf8;
            --watermark-opacity: 0.25;
            --glow-color: rgba(56, 189, 248, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.85);
            --canvas-opacity: 0.35;
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: linear-gradient(145deg, #ffffff, #e2e8f0);
            --item-btn-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(226, 232, 240, 0.95));
            --border-color: rgba(2, 132, 199, 0.35);
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #0284c7;
            --watermark-opacity: 0.20;
            --glow-color: rgba(2, 132, 199, 0.45);
            --shadow-color: rgba(0, 0, 0, 0.2);
            --canvas-opacity: 0.18;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* TRADING CANVAS BACKGROUND */
        #trading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: var(--canvas-opacity);
            pointer-events: none;
        }

        /* TOP RIGHT CONTROLS */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn, .select-dropdown {
            background: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px var(--shadow-color), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .select-dropdown {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }

        .game-dropdown {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border-color: #f87171;
        }

        .select-dropdown option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--glow-color);
        }

        .mobile-toggle-btn {
            background: linear-gradient(135deg, #a855f7, #9333ea);
            color: #ffffff;
            border-color: #c084fc;
        }

        .mobile-toggle-btn.active {
            background: linear-gradient(135deg, #ec4899, #db2777);
            border-color: #f472b6;
        }

        /* BOTTOM-RIGHT LOGO BRANDING */
        .bottom-right-brand {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        .brand-icon-svg {
            width: 55px;
            height: 55px;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-align: center;
            line-height: 1.1;
        }

        .brand-line {
            width: 80%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.4);
            margin: 3px 0 2px 0;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.05em;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        /* POSITIONED WATERMARK TITLE BELOW MENU CONSOLE */
        .dashboard-header-bg {
            position: absolute;
            top: calc(50% + 280px);
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            user-select: none;
            white-space: nowrap;
            z-index: 2;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: top 0.3s ease;
        }

        .welcome-subtitle-bg {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            color: var(--text-light);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin-bottom: -10px;
            opacity: calc(var(--watermark-opacity) * 0.85);
            transition: font-size 0.3s ease;
            pointer-events: none;
        }

        .title-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #title-text-canvas {
            position: relative;
            display: block;
            z-index: 3;
            pointer-events: none;
            max-width: 95vw;
        }

        /* CIRCULAR NAVIGATION MENU */
        .circular-menu {
            position: relative;
            width: 720px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        /* MOBILE TOUCH PREVIEW BANNER */
        .touch-preview-banner {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 18px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            white-space: nowrap;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 300;
        }

        .touch-preview-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        /* STEADY 3D CENTER BUTTON */
        .toggle-btn {
            position: relative;
            width: 155px;
            height: 155px;
            background: var(--center-btn-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--title-cyan);
            font-size: 3.2rem;
            cursor: pointer;
            z-index: 60;
            box-shadow: 0 15px 35px var(--shadow-color), inset 0 2px 4px rgba(255, 255, 255, 0.3), inset 0 -4px 8px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            pointer-events: auto !important;
            overflow: visible;
            backdrop-filter: blur(12px);
        }

        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 15%;
            width: 70%;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .toggle-btn i {
            transition: transform 0.4s ease, opacity 0.3s ease;
            pointer-events: none;
            position: absolute;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .bull-logo-svg {
            position: absolute;
            width: 110px;
            height: 110px;
            opacity: 0;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 6px 12px rgba(56, 189, 248, 0.6));
        }

        .circular-menu.active .toggle-btn {
            background: linear-gradient(145deg, #0f172a, #0284c7);
            border-color: #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.85), inset 0 2px 6px rgba(255, 255, 255, 0.4);
        }

        .circular-menu.active .toggle-btn i {
            opacity: 0;
            transform: rotate(135deg) scale(0);
        }

        .circular-menu.active .bull-logo-svg {
            opacity: 1;
            transform: scale(1);
        }

        .menu-items {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        .circular-menu.active .menu-items {
            pointer-events: auto;
        }

        /* SLEEK GLASS MUTED BASE BUTTONS */
        .menu-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            margin-top: -50px;
            margin-left: -50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8 !important;
            text-decoration: none;
            font-size: 2.2rem;
            opacity: 0;
            transform: translate(0, 0) scale(0);
            pointer-events: none;
            cursor: pointer;
            z-index: 35;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            overflow: visible;
            -webkit-tap-highlight-color: transparent;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 15%;
            width: 70%;
            height: 35%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .circular-menu.active .menu-item {
            pointer-events: auto;
        }

        .menu-item i {
            pointer-events: none;
            transition: transform 0.3s ease, color 0.3s ease, filter 0.3s ease;
            color: #94a3b8;
        }

        .menu-item .letter-icon {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            line-height: 1;
            display: inline-block;
            pointer-events: none;
            transition: transform 0.3s ease, color 0.3s ease;
            color: #94a3b8 !important;
        }

        /* ANCHORED TRANSFORMS ON HOVER - NO FLICKER */
        .circular-menu.active .menu-item:hover, 
        .circular-menu.active .menu-item.touch-active {
            transform: translate(var(--tx), var(--ty)) scale(1.18) !important;
            z-index: 100 !important;
        }

        /* INDIVIDUAL BRAND COLOR HIGHLIGHTS ON HOVER */
        .menu-item[data-id="duties"]:hover, .menu-item[data-id="duties"].touch-active {
            background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%);
            border-color: #22d3ee;
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="rota"]:hover, .menu-item[data-id="rota"].touch-active {
            background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
            border-color: #818cf8;
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="handover"]:hover, .menu-item[data-id="handover"].touch-active {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            border-color: #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="big-winners"]:hover, .menu-item[data-id="big-winners"].touch-active {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            border-color: #fde047;
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="edge-boost"]:hover, .menu-item[data-id="edge-boost"].touch-active {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            border-color: #fcd34d;
            box-shadow: 0 0 30px rgba(252, 211, 77, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="ibet-boost"]:hover, .menu-item[data-id="ibet-boost"].touch-active {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border-color: #7dd3fc;
            box-shadow: 0 0 30px rgba(125, 211, 252, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        /* TOP PICKS BUTTON HIGHLIGHT STYLING */
        .menu-item[data-id="top-picks"]:hover, .menu-item[data-id="top-picks"].touch-active {
            background: linear-gradient(180deg, #ec4899 0%, #be185d 100%);
            border-color: #f472b6;
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-color="green"]:hover, .menu-item[data-color="green"].touch-active {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            border-color: #86efac;
            box-shadow: 0 0 30px rgba(134, 239, 172, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-color="red"]:hover, .menu-item[data-color="red"].touch-active {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            border-color: #fca5a5;
            box-shadow: 0 0 30px rgba(252, 165, 165, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-color="orange"]:hover, .menu-item[data-color="orange"].touch-active {
            background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
            border-color: #fdba74;
            box-shadow: 0 0 30px rgba(253, 186, 116, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="confluence"]:hover, .menu-item[data-id="confluence"].touch-active {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            border-color: #60a5fa;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="workspace"]:hover, .menu-item[data-id="workspace"].touch-active {
            background: linear-gradient(180deg, #64748b 0%, #334155 100%);
            border-color: #94a3b8;
            box-shadow: 0 0 30px rgba(148, 163, 184, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item:hover i, .menu-item.touch-active i,
        .menu-item:hover .letter-icon, .menu-item.touch-active .letter-icon {
            color: #ffffff !important;
            transform: scale(1.15);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        /* HOVER TOOLTIP BADGES */
        .menu-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -42px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: #0f172a;
            border: 1.5px solid var(--title-cyan);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            z-index: 200;
        }

        .menu-item:hover::after, .menu-item.touch-active::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* MOBILE VIEW CLEANUP MODIFICATIONS */
        body.mobile-view-active .top-controls { 
            top: 15px; 
            right: 15px; 
        }

        /* HIDE UNNECESSARY WIDGETS IN MOBILE VIEW */
        body.mobile-view-active #game-selector,
        body.mobile-view-active #user-profile-select,
        body.mobile-view-active #mobile-toggle,
        body.mobile-view-active .bottom-right-brand {
            display: none !important;
        }

        body.mobile-view-active .control-btn,
        body.mobile-view-active .select-dropdown { 
            padding: 8px 14px; 
            font-size: 0.82rem; 
            border-radius: 20px; 
        }
        
        body.mobile-view-active .dashboard-header-bg {
            top: calc(50% + 180px);
        }

        body.mobile-view-active .welcome-subtitle-bg { font-size: 1.1rem; letter-spacing: 0.20em; }
        body.mobile-view-active .circular-menu { width: 340px; height: 340px; }
        body.mobile-view-active .toggle-btn { width: 95px; height: 95px; font-size: 2rem; }
        body.mobile-view-active .bull-logo-svg { width: 65px; height: 65px; }

        body.mobile-view-active .menu-item {
            width: 54px;
            height: 54px;
            margin-top: -27px;
            margin-left: -27px;
            font-size: 1.2rem;
        }

        body.mobile-view-active .menu-item .letter-icon { font-size: 1.2rem; }
        body.mobile-view-active .menu-item::after { bottom: -30px; font-size: 0.72rem; padding: 3px 8px; }
    </style>
</head>
<body>

    <!-- TRADING CANVAS BACKGROUND -->
    <canvas id="trading-bg"></canvas>

    <!-- TOP CONTROL BUTTONS -->
    <div class="top-controls">
        <select class="select-dropdown game-dropdown" id="game-selector" onchange="switchGame(this.value)">
            <option value="" disabled selected>🎮 Select Game...</option>
            <option value="mario">🎮 Game: Super Mario Arcade ↗</option>
            <option value="flappy">🎮 Game: Flappy Bird ↗</option>
            <option value="block">🎮 Game: Block Puzzle ↗</option>
            <option value="solitaire">🎮 Game: Solitaire ↗</option>
            <option value="word">🎮 Game: Word Puzzle ↗</option>
        </select>

        <select class="select-dropdown" id="user-profile-select" onchange="changeActiveUser(this.value)">
            <option value="" disabled selected>-- Select Your Name --</option>
            <option value="ANN">👤 Player: ANN</option>
            <option value="DAVE">👤 Player: DAVE</option>
            <option value="KENNETH">👤 Player: KENNETH</option>
            <option value="KRIZTEL">👤 Player: KRIZTEL</option>
            <option value="MIGUEL">👤 Player: MIGUEL</option>
            <option value="CUSTOM">+ Custom Name...</option>
        </select>
        
        <button class="control-btn mobile-toggle-btn" id="mobile-toggle">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span id="mobile-text">Mobile View: OFF</span>
        </button>

        <!-- KEPT ACTIVE IN MOBILE VIEW -->
        <button class="control-btn" id="theme-toggle">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
            <span id="theme-text">Night Mode</span>
        </button>
    </div>

    <!-- BOTTOM RIGHT LOGO BRANDING -->
    <div class="bottom-right-brand">
        <div class="brand-card">
            <svg class="brand-icon-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0284c7" />
                        <stop offset="100%" stop-color="#38bdf8" />
                    </linearGradient>
                    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f97316" />
                        <stop offset="100%" stop-color="#fb923c" />
                    </linearGradient>
                </defs>
                <path d="M 100 20 A 80 80 0 1 0 170 140" stroke="url(#grad-blue)" stroke-width="18" stroke-linecap="round"/>
                <path d="M 120 40 A 60 60 0 1 1 150 150" stroke="url(#grad-orange)" stroke-width="18" stroke-linecap="round"/>
                <path d="M 50 150 Q 90 100 160 30" stroke="url(#grad-blue)" stroke-width="20" stroke-linecap="round"/>
                <path d="M 130 25 L 175 25 L 175 70 Z" fill="url(#grad-orange)"/>
            </svg>
            <div class="brand-title">K HUB 2026</div>
            <div class="brand-line"></div>
            <div class="brand-subtitle">(kriztel)</div>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- BACKGROUND WATERMARK TITLE WITH REAL TIME DYNAMIC SINE WAVE CHOMPING -->
        <div class="dashboard-header-bg">
            <div class="welcome-subtitle-bg">Welcome to</div>
            <div class="title-wrapper">
                <canvas id="title-text-canvas" width="1150" height="150"></canvas>
            </div>
        </div>

        <!-- CIRCULAR NAVIGATION MENU -->
        <div class="circular-menu" id="circular-menu">
            <div class="touch-preview-banner" id="touch-banner">SELECT A BUTTON</div>
            <div class="toggle-btn" id="toggle-btn" title="Expand Operations Menu">
                <i class="fa-solid fa-plus"></i>
                
                <svg class="bull-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#22d3ee" />
                        </linearGradient>
                    </defs>
                    <path d="M 50 65 C 20 40 25 15 55 25 C 65 30 75 50 72 65 Z" fill="url(#bullGrad)"/>
                    <path d="M 150 65 C 180 40 175 15 145 25 C 135 30 125 50 128 65 Z" fill="url(#bullGrad)"/>
                    <path d="M 52 65 C 70 65 80 80 100 85 C 120 80 130 65 148 65 C 160 85 165 110 145 135 C 130 155 115 165 100 165 C 85 165 70 155 55 135 C 35 110 40 85 52 65 Z" stroke="url(#bullGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="82" y1="85" x2="82" y2="135" stroke="#38bdf8" stroke-width="4"/>
                    <rect x="77" y="95" width="10" height="25" fill="#38bdf8" rx="2"/>
                    <line x1="100" y1="75" x2="100" y2="145" stroke="#38bdf8" stroke-width="4"/>
                    <rect x="95" y="85" width="10" height="45" fill="#38bdf8" rx="2"/>
                    <line x1="118" y1="90" x2="118" y2="130" stroke="#38bdf8" stroke-width="4"/>
                    <rect x="113" y="100" width="10" height="20" fill="#38bdf8" rx="2"/>
                </svg>
            </div>
            <div class="menu-items" id="menu-items"></div>
        </div>
    </div>

    <script>
        // Updated JSON array with "TOP PICKS" pointing to boostschedule.html
        const navMenuJSON = [
            { id: "duties", icon: "fa-solid fa-list-check", label: "DAILY DUTIES", url: "duties.html" },
            { id: "rota", icon: "fa-solid fa-calendar-days", label: "ROTA 2026", url: "rota.html" },
            { id: "handover", icon: "fa-solid fa-clipboard-list", label: "HANDOVER & SOP", url: "handover.html" },
            { id: "big-winners", icon: "fa-solid fa-trophy", label: "BIG WINNERS", url: "big-winners.html" },
            { id: "top-picks", icon: "fa-solid fa-fire", label: "TOP PICKS", url: "boostschedule.html" },
            { id: "edge-boost", icon: "fa-solid fa-bolt", label: "EDGE BOOST", url: "edge_boosts.html" },
            { id: "ibet-boost", icon: "fa-solid fa-chart-line", label: "IBET BOOST", url: "https://docs.google.com/spreadsheets/d/18ZJNs7wJ37-4sAHX5CNMfqQQcmpfy1cIvP19tHI7rY4/edit?gid=784209986#gid=784209986" },
            { id: "green-tracking", letter: "G", label: "GREEN TRACKING", url: "https://docs.google.com/spreadsheets/d/1qruVq-HZCyM0uDgnYSqFhccXKnMkqJ8z/edit?gid=1305147410#gid=1305147410", color: "green" },
            { id: "red-tracking", letter: "R", label: "RED TRACKING", url: "https://docs.google.com/spreadsheets/d/1OcaMz_AOUeRsWIVplbnk2XAna62m3IKa/edit?gid=457800468#gid=457800468", color: "red" },
            { id: "orange-tracking", letter: "O", label: "ORANGE TRACKING", url: "https://docs.google.com/spreadsheets/d/1U-Dmc628kHQabzJGoBeEgRus5PiRhgSd/edit?pli=1&gid=1983372695#gid=1983372695", color: "orange" },
            { id: "green-crm", icon: "fa-solid fa-users", label: "GREEN CRM", url: "https://docs.google.com/spreadsheets/d/11STKO4Xsj0a8iTuUXSCXC-XEE4-7qmF9/edit?pli=1&gid=1701374259#gid=1701374259", color: "green" },
            { id: "red-crm", icon: "fa-solid fa-users-slash", label: "RED CRM", url: "https://docs.google.com/spreadsheets/d/1gPks2FdHyOOTiILvn553miz32WeEtOpx/edit?gid=1701374259#gid=1701374259", color: "red" },
            { id: "confluence", icon: "fa-solid fa-book", label: "CONFLUENCE", url: "https://ibet.atlassian.net/wiki/spaces/Sportsbook/overview" },
            { id: "workspace", icon: "fa-solid fa-laptop-code", label: "WORKSPACE", url: "workspace.html" }
        ];

        const circularMenu = document.getElementById('circular-menu');
        const toggleBtn = document.getElementById('toggle-btn');
        const menuItemsContainer = document.getElementById('menu-items');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const mobileToggleBtn = document.getElementById('mobile-toggle');
        const mobileText = document.getElementById('mobile-text');
        const userProfileSelect = document.getElementById('user-profile-select');
        const touchBanner = document.getElementById('touch-banner');

        let isMobileView = false;

        function initActiveUser() {
            let savedUser = localStorage.getItem('sb_active_user');
            if (userProfileSelect && savedUser) {
                userProfileSelect.value = savedUser;
            }
            return savedUser || "GUEST";
        }

        let currentUser = initActiveUser();

        function changeActiveUser(val) {
            if (val === "CUSTOM") {
                let typedName = prompt("Enter your Name:", "KRIZTEL");
                if (typedName) {
                    currentUser = typedName.toUpperCase().trim();
                    localStorage.setItem('sb_active_user', currentUser);
                    let customOpt = document.createElement('option');
                    customOpt.value = currentUser;
                    customOpt.textContent = `👤 Player: ${currentUser}`;
                    userProfileSelect.appendChild(customOpt);
                    userProfileSelect.value = currentUser;
                }
            } else {
                currentUser = val;
                localStorage.setItem('sb_active_user', currentUser);
            }
        }

        function switchGame(val) {
            const selector = document.getElementById('game-selector');
            if (val === 'mario') {
                window.open('mario.html', '_blank');
            } else if (val === 'flappy') {
                window.open('flappy.html', '_blank');
            } else if (val === 'block') {
                window.open('block.html', '_blank');
            } else if (val === 'solitaire') {
                window.open('solitaire.html', '_blank');
            } else if (val === 'word') {
                window.open('word.html', '_blank');
            }
            if (selector) selector.value = '';
        }

        function getRadius() {
            return isMobileView ? 135 : 290;
        }

        function buildMenuFromJSON(items) {
            if (!menuItemsContainer) return;
            menuItemsContainer.innerHTML = '';
            const total = items.length;
            const radius = getRadius();

            items.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = Math.round(radius * Math.cos(angle));
                const y = Math.round(radius * Math.sin(angle));

                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'menu-item';
                a.setAttribute('data-id', item.id);
                a.setAttribute('data-tooltip', item.label);
                a.setAttribute('data-index', index);
                if (item.color) a.setAttribute('data-color', item.color);

                if (item.url.startsWith('http://') || item.url.startsWith('https://')) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }

                a.style.setProperty('--tx', `${x}px`);
                a.style.setProperty('--ty', `${y}px`);

                if (item.icon) {
                    const i = document.createElement('i');
                    i.className = item.icon;
                    a.appendChild(i);
                } else if (item.letter) {
                    const span = document.createElement('span');
                    span.className = 'letter-icon';
                    span.textContent = item.letter;
                    a.appendChild(span);
                }

                menuItemsContainer.appendChild(a);
            });
        }

        function toggleMenu() {
            circularMenu.classList.toggle('active');
            const isActive = circularMenu.classList.contains('active');
            const items = menuItemsContainer.querySelectorAll('.menu-item');

            items.forEach((item) => {
                if (isActive) {
                    const tx = item.style.getPropertyValue('--tx');
                    const ty = item.style.getPropertyValue('--ty');
                    item.style.transform = `translate(${tx}, ${ty}) scale(1)`;
                    item.style.opacity = '1';
                } else {
                    item.style.transform = 'translate(0, 0) scale(0)';
                    item.style.opacity = '0';
                }
            });
        }

        toggleBtn.addEventListener('click', toggleMenu);

        // Mobile View Toggle Logic
        mobileToggleBtn.addEventListener('click', () => {
            isMobileView = !isMobileView;
            document.body.classList.toggle('mobile-view-active', isMobileView);
            mobileToggleBtn.classList.toggle('active', isMobileView);
            mobileText.textContent = isMobileView ? "Mobile View: ON" : "Mobile View: OFF";

            buildMenuFromJSON(navMenuJSON);

            if (circularMenu.classList.contains('active')) {
                const items = menuItemsContainer.querySelectorAll('.menu-item');
                items.forEach((item) => {
                    const tx = item.style.getPropertyValue('--tx');
                    const ty = item.style.getPropertyValue('--ty');
                    item.style.transform = `translate(${tx}, ${ty}) scale(1)`;
                    item.style.opacity = '1';
                });
            }
        });

        // Theme Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);

            if (newTheme === 'dark') {
                themeIcon.className = 'fa-solid fa-moon';
                themeText.textContent = 'Night Mode';
            } else {
                themeIcon.className = 'fa-solid fa-sun';
                themeText.textContent = 'Day Mode';
            }
        });

        // Initialize Menu Build
        buildMenuFromJSON(navMenuJSON);
    </script>
</body>
</html>
