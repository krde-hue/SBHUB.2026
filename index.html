<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-color: #0b1329;
            --center-btn-bg: #1e293b;
            --center-btn-active: #0f172a;
            --item-btn-bg: #1e293b;
            --item-hover-bg: #38bdf8;
            --border-color: #334155;
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #38bdf8;
            --watermark-color: #38bdf8;
            --watermark-opacity: 0.25;
            --glow-color: rgba(56, 189, 248, 0.85);
            --shadow-color: rgba(0, 0, 0, 0.65);
            --canvas-opacity: 0.35;
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: #ffffff;
            --center-btn-active: #0f172a;
            --item-btn-bg: #ffffff;
            --item-hover-bg: #0284c7;
            --border-color: #cbd5e1;
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #0284c7;
            --watermark-color: #0284c7;
            --watermark-opacity: 0.20;
            --glow-color: rgba(2, 132, 199, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.18);
            --canvas-opacity: 0.18;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* TRADING CANVAS BACKGROUND */
        #trading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: var(--canvas-opacity);
            pointer-events: none;
        }

        /* TOP RIGHT CONTROLS */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn, .user-select-btn {
            background-color: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px var(--shadow-color);
            transition: all 0.2s ease;
        }

        .user-select-btn {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            outline: none;
        }

        .user-select-btn option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
        }

        .mobile-toggle-btn {
            background-color: #a855f7;
            color: #ffffff;
            border-color: #c084fc;
        }

        .mobile-toggle-btn.active {
            background-color: #ec4899;
            border-color: #f472b6;
        }

        /* BOTTOM-LEFT REALTIME LEADERBOARD */
        .bottom-left-leaderboard {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #facc15;
            border-radius: 8px;
            padding: 10px 14px;
            width: 250px;
            box-shadow: 0 0 16px rgba(250, 204, 21, 0.35);
            backdrop-filter: blur(6px);
        }

        .leaderboard-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            font-weight: 900;
            color: #facc15;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .leaderboard-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #f8fafc;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .rank-tag {
            color: #38bdf8;
            font-weight: 900;
            width: 22px;
            display: inline-block;
        }

        .score-val {
            color: #facc15;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
        }

        /* BOTTOM-RIGHT LOGO BRANDING */
        .bottom-right-brand {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        .brand-icon-svg {
            width: 55px;
            height: 55px;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-align: center;
            line-height: 1.1;
        }

        .brand-line {
            width: 80%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.4);
            margin: 3px 0 2px 0;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.05em;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .dashboard-header-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            user-select: none;
            white-space: nowrap;
            z-index: 2;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-subtitle-bg {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            color: var(--text-light);
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin-bottom: -15px;
            opacity: calc(var(--watermark-opacity) * 0.85);
            transition: font-size 0.3s ease;
            pointer-events: none;
        }

        .title-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #title-text-canvas {
            position: relative;
            display: block;
            z-index: 3;
            pointer-events: none;
            max-width: 95vw;
        }

        #mario-game-canvas {
            position: absolute;
            bottom: -430px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
            touch-action: none;
        }

        .circular-menu {
            position: relative;
            width: 720px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        .toggle-btn {
            position: relative;
            width: 155px;
            height: 155px;
            background-color: var(--center-btn-bg);
            border: 4px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--title-cyan);
            font-size: 3.2rem;
            cursor: pointer;
            z-index: 60;
            box-shadow: 0 12px 35px var(--shadow-color);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                        background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            pointer-events: auto !important;
            overflow: hidden;
        }

        .toggle-btn i {
            transition: transform 0.4s ease, opacity 0.3s ease;
            pointer-events: none;
            position: absolute;
            z-index: 2;
        }

        .bull-logo-svg {
            position: absolute;
            width: 110px;
            height: 110px;
            opacity: 0;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            z-index: 1;
            pointer-events: none;
        }

        .circular-menu.active .toggle-btn {
            background-color: #0a172c;
            border-color: #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.85), inset 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .circular-menu.active .toggle-btn i {
            opacity: 0;
            transform: rotate(135deg) scale(0);
        }

        .circular-menu.active .bull-logo-svg {
            opacity: 1;
            transform: scale(1);
        }

        .menu-items {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        .circular-menu.active .menu-items {
            pointer-events: auto;
        }

        .menu-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110px;
            height: 110px;
            margin-top: -55px;
            margin-left: -55px;
            background-color: var(--item-btn-bg);
            border: 3px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 2.4rem;
            box-shadow: 0 8px 24px var(--shadow-color);
            opacity: 0;
            transform: translate(0, 0) scale(0);
            pointer-events: none;
            cursor: pointer;
            z-index: 35;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 0.3s ease, 
                        background-color 0.25s ease, 
                        border-color 0.25s ease, 
                        box-shadow 0.25s ease;
        }

        .circular-menu.active .menu-item {
            pointer-events: auto;
        }

        .menu-item i {
            pointer-events: none;
            transition: transform 0.25s ease;
        }

        .menu-item .letter-icon {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 2.4rem;
            line-height: 1;
            display: inline-block;
            pointer-events: none;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .menu-item[data-color="green"] .letter-icon {
            color: #22c55e;
            text-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
        }

        .menu-item[data-color="red"] .letter-icon {
            color: #ef4444;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        .menu-item[data-color="orange"] .letter-icon {
            color: #f97316;
            text-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
        }

        .menu-item:hover {
            transform: translate(var(--tx), var(--ty)) scale(1.4) !important;
            background-color: var(--item-hover-bg);
            border-color: var(--title-cyan);
            color: #ffffff;
            box-shadow: 0 0 50px var(--glow-color), 0 0 25px rgba(56, 189, 248, 0.95);
            z-index: 50;
        }

        .menu-item:hover i,
        .menu-item:hover .letter-icon {
            transform: scale(1.15);
        }

        .menu-item[data-color="green"]:hover {
            background-color: #22c55e !important;
            border-color: #4ade80 !important;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.95) !important;
        }

        .menu-item[data-color="green"]:hover .letter-icon {
            color: #ffffff !important;
            text-shadow: none;
        }

        .menu-item[data-color="red"]:hover {
            background-color: #ef4444 !important;
            border-color: #f87171 !important;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.95) !important;
        }

        .menu-item[data-color="red"]:hover .letter-icon {
            color: #ffffff !important;
            text-shadow: none;
        }

        .menu-item[data-color="orange"]:hover {
            background-color: #f97316 !important;
            border-color: #fb923c !important;
            box-shadow: 0 0 50px rgba(249, 115, 22, 0.95) !important;
        }

        .menu-item[data-color="orange"]:hover .letter-icon {
            color: #ffffff !important;
            text-shadow: none;
        }

        .menu-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -38px;
            background: rgba(15, 23, 42, 0.98);
            border: 1.5px solid var(--title-cyan);
            color: #f8fafc;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .menu-item[data-color="green"]::after { border-color: #22c55e; }
        .menu-item[data-color="red"]::after { border-color: #ef4444; }
        .menu-item[data-color="orange"]::after { border-color: #f97316; }

        .menu-item:hover::after {
            opacity: 1;
            transform: translateY(2px) scale(0.85);
        }

        body.mobile-view-active .top-controls {
            top: 12px;
            right: 12px;
            gap: 8px;
        }

        body.mobile-view-active .control-btn,
        body.mobile-view-active .user-select-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 18px;
        }

        body.mobile-view-active .bottom-right-brand {
            bottom: 12px;
            right: 15px;
        }

        body.mobile-view-active .bottom-left-leaderboard {
            bottom: 12px;
            left: 12px;
            width: 170px;
            padding: 6px 8px;
        }

        body.mobile-view-active .leaderboard-title {
            font-size: 0.68rem;
        }

        body.mobile-view-active .leaderboard-item {
            font-size: 0.72rem;
        }

        body.mobile-view-active .brand-icon-svg {
            width: 40px;
            height: 40px;
        }

        body.mobile-view-active .brand-title {
            font-size: 0.78rem;
        }

        body.mobile-view-active .brand-subtitle {
            font-size: 0.70rem;
        }

        body.mobile-view-active .welcome-subtitle-bg {
            font-size: 1.4rem;
            letter-spacing: 0.25em;
        }

        body.mobile-view-active .circular-menu {
            width: 340px;
            height: 340px;
        }

        body.mobile-view-active .toggle-btn {
            width: 95px;
            height: 95px;
            font-size: 2rem;
        }

        body.mobile-view-active .bull-logo-svg {
            width: 65px;
            height: 65px;
        }

        body.mobile-view-active .menu-item {
            width: 58px;
            height: 58px;
            margin-top: -29px;
            margin-left: -29px;
            font-size: 1.3rem;
            border-width: 2px;
        }

        body.mobile-view-active .menu-item .letter-icon {
            font-size: 1.3rem;
        }

        body.mobile-view-active .menu-item::after {
            bottom: -28px;
            font-size: 0.72rem;
            padding: 3px 8px;
        }

        body.mobile-view-active #mario-game-canvas {
            bottom: -180px;
            width: 350px;
            height: 120px;
        }
    </style>
</head>
<body>

    <canvas id="trading-bg"></canvas>

        } catch (e) {

        const circularMenu = document.getElementById('circular-menu');
        const toggleBtn = document.getElementById('toggle-btn');
        const menuItemsContainer = document.getElementById('menu-items');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const mobileToggleBtn = document.getElementById('mobile-toggle');
        const mobileText = document.getElementById('mobile-text');
        const userProfileSelect = document.getElementById('user-profile-select');

        let isMobileView = false;
        let rotationAngle = 0;
        let rotationAnimationId = null;

        function initActiveUser() {
            const params = new URLSearchParams(window.location.search);
            let userParam = params.get('user') || params.get('name') || params.get('member');
            
            if (userParam) {
                userParam = userParam.toUpperCase().trim();
                localStorage.setItem('sb_active_user', userParam);
            }

            let savedUser = localStorage.getItem('sb_active_user');
            
            if (userProfileSelect && savedUser) {
                let matchOption = Array.from(userProfileSelect.options).find(o => o.value === savedUser);
                if (matchOption) {
                    userProfileSelect.value = savedUser;
                } else {
                    let customOpt = document.createElement('option');
                    customOpt.value = savedUser;
                    customOpt.textContent = `👤 Player: ${savedUser}`;
                    userProfileSelect.appendChild(customOpt);
                    userProfileSelect.value = savedUser;
                }
            } else if (userProfileSelect) {
                userProfileSelect.selectedIndex = 0; 
            }
            return savedUser || "GUEST";
        }

        let currentUser = initActiveUser();

        function changeActiveUser(val) {
            if (val === "CUSTOM") {
                let typedName = prompt("Enter your Name for Mario Score tracking:", "KRIZTEL");
                if (typedName) {
                    currentUser = typedName.toUpperCase().trim();
                    localStorage.setItem('sb_active_user', currentUser);
                    let customOpt = document.createElement('option');
                    customOpt.value = currentUser;
                    customOpt.textContent = `👤 Player: ${currentUser}`;
                    userProfileSelect.appendChild(customOpt);
                    userProfileSelect.value = currentUser;
                } else {
                    userProfileSelect.value = currentUser;
                    return;
                }
            } else {
                currentUser = val;
                localStorage.setItem('sb_active_user', currentUser);
            }
            listenToRealtimeLeaderboard();
        }

        // DYNAMIC RANK SORTING & HIDE NUMBERS IF ALL ZERO
        function updateLeaderboardUI(scoreList) {
            if (!scoreList) return;

            const nonZeroEntries = scoreList.filter(item => item[1] > 0);
            const hasAnyScore = nonZeroEntries.length > 0;

            for (let i = 1; i <= 3; i++) {
                const item = scoreList[i - 1];
                const tagElem = document.getElementById(`rank${i}-tag`);
                const nameElem = document.getElementById(`rank${i}-name`);
                const scoreElem = document.getElementById(`rank${i}-score`);

                if (item && (hasAnyScore || item[1] > 0)) {
                    tagElem.textContent = `#${i}`;
                    nameElem.textContent = item[0];
                    scoreElem.textContent = `${item[1]} PTS`;
                } else {
                    tagElem.textContent = ""; 
                    nameElem.textContent = item ? item[0] : "--";
                    scoreElem.textContent = "0 PTS";
                }
            }
        }

        function listenToRealtimeLeaderboard() {
            let localBest = parseInt(localStorage.getItem(`mario_high_${currentUser}`) || '0');
            updateLeaderboardUI([[currentUser, localBest], ["ANN", 0], ["DAVE", 0]]);

            if (!db) return;
            db.ref('mario_leaderboard').orderByValue().limitToLast(5).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
                updateLeaderboardUI(sorted);
            });
        }

        function saveScoreToRealtimeLeaderboard(score) {
            if (!currentUser || currentUser === "GUEST") return;
            let currentLocalHigh = parseInt(localStorage.getItem(`mario_high_${currentUser}`) || '0');
            if (score > currentLocalHigh) {
                localStorage.setItem(`mario_high_${currentUser}`, score.toString());
            }

            if (db) {
                db.ref(`mario_leaderboard/${currentUser}`).transaction((currentScore) => {
                    return Math.max(currentScore || 0, score);
                });
            } else {
                let currentBest = Math.max(currentLocalHigh, score);
                updateLeaderboardUI([[currentUser, currentBest], ["ANN", 0], ["DAVE", 0]]);
            }
        }

        function getRadius() {
            return isMobileView ? 135 : 290;
        }

        function buildMenuFromJSON(items) {
            if (!menuItemsContainer) return;
            menuItemsContainer.innerHTML = '';
            const total = items.length;
            const radius = getRadius();

            items.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2) + rotationAngle; 
                const x = Math.round(radius * Math.cos(angle));
                const y = Math.round(radius * Math.sin(angle));

                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'menu-item';
                a.setAttribute('data-tooltip', item.label);
                if (item.color) a.setAttribute('data-color', item.color);

                if (item.url.startsWith('http://') || item.url.startsWith('https://')) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }

                a.style.setProperty('--tx', `${x}px`);
                a.style.setProperty('--ty', `${y}px`);

                if (circularMenu.classList.contains('active')) {
                    a.style.opacity = '1';
                    a.style.transform = `translate(${x}px, ${y}px) scale(1)`;
                } else {
                    a.style.opacity = '0';
                    a.style.transform = `translate(0px, 0px) scale(0)`;
                }

                if (item.letter) {
                    a.innerHTML = `<span class="letter-icon">${item.letter}</span>`;
                } else {
                    a.innerHTML = `<i class="${item.icon}"></i>`;
                }
                
                menuItemsContainer.appendChild(a);
            });
        }

        function startSlowRotation() {
            function step() {
                if (circularMenu.classList.contains('active')) {
                    rotationAngle += 0.0001; 
                    const items = navMenuJSON;
                    const total = items.length;
                    const radius = getRadius();
                    const menuElements = menuItemsContainer.querySelectorAll('.menu-item');

                    menuElements.forEach((a, index) => {
                        const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2) + rotationAngle; 
                        const x = Math.round(radius * Math.cos(angle));
                        const y = Math.round(radius * Math.sin(angle));

                        a.style.setProperty('--tx', `${x}px`);
                        a.style.setProperty('--ty', `${y}px`);

                        if (!a.matches(':hover')) {
                            a.style.transform = `translate(${x}px, ${y}px) scale(1)`;
                        }
                    });
                }
                rotationAnimationId = requestAnimationFrame(step);
            }
            if (!rotationAnimationId) {
                step();
            }
        }

        if (toggleBtn && circularMenu) {
            function handleToggleMenu(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                const isActive = circularMenu.classList.toggle('active');
                const items = menuItemsContainer.querySelectorAll('.menu-item');

                items.forEach((item, index) => {
                    if (isActive) {
                        setTimeout(() => {
                            const tx = item.style.getPropertyValue('--tx');
                            const ty = item.style.getPropertyValue('--ty');
                            item.style.opacity = '1';
                            item.style.transform = `translate(${tx}, ${ty}) scale(1)`;
                        }, index * 25);
                    } else {
                        item.style.opacity = '0';
                        item.style.transform = 'translate(0, 0) scale(0)';
                    }
                });
            }

            toggleBtn.addEventListener('click', handleToggleMenu);
        }

        function toggleMobileView() {
            isMobileView = !isMobileView;
            if (isMobileView) {
                document.body.classList.add('mobile-view-active');
                mobileText.textContent = 'Mobile View: ON';
                mobileToggleBtn.classList.add('active');
            } else {
                document.body.classList.remove('mobile-view-active');
                mobileText.textContent = 'Mobile View: OFF';
                mobileToggleBtn.classList.remove('active');
            }
            localStorage.setItem('dashboard_mobile_view', isMobileView ? 'true' : 'false');
            buildMenuFromJSON(navMenuJSON);
            fitTitleCanvasScale();
        }

        if (mobileToggleBtn) {
            mobileToggleBtn.addEventListener('click', toggleMobileView);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (themeIcon && themeText) {
                if (theme === 'dark') {
                    themeIcon.className = 'fa-solid fa-moon';
                    themeText.textContent = 'Night Mode';
                } else {
                    themeIcon.className = 'fa-solid fa-sun';
                    themeText.textContent = 'Daylight Mode';
                }
            }
            localStorage.setItem('dashboard_theme', theme);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                setTheme(currentTheme === 'dark' ? 'light' : 'dark');
            });
        }

        function fitTitleCanvasScale() {
            const canvas = document.getElementById('title-text-canvas');
            if (!canvas) return;
            const screenWidth = window.innerWidth;
            if (screenWidth < 1150 || isMobileView) {
                const targetWidth = isMobileView ? Math.min(screenWidth * 0.90, 360) : Math.min(screenWidth * 0.95, 1150);
                const scale = targetWidth / 1150;
                canvas.style.transform = `scale(${scale})`;
            } else {
                canvas.style.transform = `scale(1)`;
            }
        }

        function initTitleWatermarkEngine() {
            const canvas = document.getElementById('title-text-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function render() {
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                const mainColor = isDark ? '#38bdf8' : '#0284c7';
                const opacity = isDark ? 0.25 : 0.20;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.font = '900 96px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillStyle = mainColor;
                ctx.globalAlpha = opacity;
                ctx.shadowColor = mainColor;
                ctx.shadowBlur = isDark ? 25 : 10;

                ctx.fillText('SPORTSBOOK HUB', canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;

                requestAnimationFrame(render);
            }

            render();
        }

        // INTERACTIVE SUPER MARIO GAME
        function initSuperMarioGame() {
            const canvas = document.getElementById('mario-game-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let coins = 0;
            let highScore = parseInt(localStorage.getItem(`mario_high_${currentUser}`) || '0');
            let gameOver = false;
            let levelCleared = false;
            let currentStage = 1;
            let baseSpeed = 1.5;
            const stageGoals = [1000, 3000, 5000, 7000, 10000];
            const groundY = 80;

            const mario = {
                x: 80,
                y: groundY - 30,
                baseWidth: 24,
                baseHeight: 30,
                width: 24,
                height: 30,
                scale: 1.0,
                speed: 3.5,
                facingLeft: false,
                isSuper: false,
                invincibleTimer: 0,
                dy: 0,
                gravity: 0.52,
                jumpPower: -10.2,
                isGrounded: true,
                animFrame: 0
            };

            const keys = { left: false, right: false };
            let entities = [];
            let finishLineObj = null;
            let backgroundScroll = 0;
            let spawnTimer = 0;

            function triggerJump() {
                if (gameOver || levelCleared) {
                    saveScoreToRealtimeLeaderboard(coins);
                    coins = 0;
                    currentStage = 1;
                    gameOver = false;
                    levelCleared = false;
                    baseSpeed = 1.5;
                    entities = [];
                    finishLineObj = null;
                    mario.scale = 1.0;
                    mario.isSuper = false;
                    mario.width = mario.baseWidth;
                    mario.height = mario.baseHeight;
                    mario.x = 80;
                    mario.y = groundY - mario.height;
                    mario.dy = 0;
                    mario.isGrounded = true;
                    return;
                }
                if (mario.isGrounded) {
                    mario.dy = mario.jumpPower;
                    mario.isGrounded = false;
                }
            }

            window.addEventListener('keydown', (e) => {
                if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                    if (document.activeElement.tagName !== 'INPUT') {
                        e.preventDefault();
                        triggerJump();
                    }
                }
                if (['ArrowLeft', 'KeyA'].includes(e.code)) {
                    keys.left = true;
                    mario.facingLeft = true;
                }
                if (['ArrowRight', 'KeyD'].includes(e.code)) {
                    keys.right = true;
                    mario.facingLeft = false;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
                if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
            });

            function handleScreenTap(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const tapX = clientX - rect.left;

                if (tapX < rect.width * 0.20) {
                    mario.x -= 20;
                    mario.facingLeft = true;
                } else if (tapX > rect.width * 0.80) {
                    mario.x += 20;
                    mario.facingLeft = false;
                } else {
                    triggerJump();
                }
            }

            canvas.addEventListener('click', handleScreenTap);
            canvas.addEventListener('touchstart', handleScreenTap, { passive: false });

            function drawMario(x, y) {
                if (mario.invincibleTimer > 0 && Math.floor(mario.invincibleTimer / 4) % 2 === 0) {
                    return;
                }

                ctx.save();
                ctx.translate(x + (mario.facingLeft ? mario.width : 0), y);
                if (mario.facingLeft) ctx.scale(-1, 1);
                ctx.scale(mario.scale, mario.scale);

                // Red Hat & Shirt
                ctx.fillStyle = '#e52521'; 
                ctx.fillRect(6, 0, 14, 5);
                ctx.fillRect(4, 5, 18, 4);
                ctx.fillRect(6, 14, 12, 8);
                ctx.fillRect(2, 14, 4, 6);
                ctx.fillRect(18, 14, 4, 6);

                // Face & Skin Tone
                ctx.fillStyle = '#fcc082';
                ctx.fillRect(6, 9, 14, 5);
                ctx.fillRect(2, 20, 4, 3);
                ctx.fillRect(18, 20, 4, 3);

                // Hair & Mustache
                ctx.fillStyle = '#4b2c11';
                ctx.fillRect(4, 7, 6, 4);
                ctx.fillRect(12, 11, 8, 3);

                // Blue Overalls
                ctx.fillStyle = '#0022cc';
                ctx.fillRect(6, 20, 12, 6);
                ctx.fillRect(8, 16, 3, 5);
                ctx.fillRect(13, 16, 3, 5);

                // Yellow Buttons
                ctx.fillStyle = '#fcd000';
                ctx.fillRect(8, 19, 2, 2);
                ctx.fillRect(14, 19, 2, 2);

                // Brown Boots
                ctx.fillStyle = '#6e3400';
                if (!mario.isGrounded) {
                    ctx.fillRect(4, 26, 6, 4);
                    ctx.fillRect(14, 24, 6, 4);
                } else if (Math.floor(mario.animFrame / 8) % 2 === 0) {
                    ctx.fillRect(4, 26, 7, 4);
                    ctx.fillRect(13, 26, 7, 4);
                } else {
                    ctx.fillRect(6, 26, 7, 4);
                    ctx.fillRect(11, 26, 7, 4);
                }

                ctx.restore();
            }

            function drawGoomba(x, y) {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(x + 2, y, 16, 12);
                ctx.fillRect(x, y + 4, 20, 8);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 4, y + 4, 4, 5);
                ctx.fillRect(x + 12, y + 4, 4, 5);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 6, y + 6, 2, 3);
                ctx.fillRect(x + 12, y + 6, 2, 3);
                ctx.fillRect(x + 3, y + 2, 6, 2);
                ctx.fillRect(x + 11, y + 2, 6, 2);

                ctx.fillStyle = '#000000';
                ctx.fillRect(x, y + 12, 7, 4);
                ctx.fillRect(x + 13, y + 12, 7, 4);
            }

            function drawMushroom(x, y) {
                ctx.fillStyle = '#e52521';
                ctx.fillRect(x + 2, y, 14, 10);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 4, y + 2, 4, 4);
                ctx.fillRect(x + 10, y + 2, 4, 4);

                ctx.fillStyle = '#fcc082';
                ctx.fillRect(x + 3, y + 10, 12, 6);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 5, y + 11, 2, 3);
                ctx.fillRect(x + 11, y + 11, 2, 3);
            }

            function drawQuestionBlock(x, y) {
                ctx.fillStyle = '#f97316';
                ctx.fillRect(x, y, 18, 18);
                ctx.fillStyle = '#000000';
                ctx.strokeRect(x, y, 18, 18);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px monospace';
                ctx.fillText('?', x + 5, y + 13);
            }

            function drawFinishLine(x, y) {
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(x, y + 45, 18, 10);
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(x + 7, y - 40, 4, 85);
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(x + 9, y - 43, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.moveTo(x + 7, y - 35);
                ctx.lineTo(x - 22, y - 25);
                ctx.lineTo(x + 7, y - 15);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#b45309';
                ctx.fillRect(x + 55, y - 10, 45, 55);
                ctx.fillRect(x + 63, y - 25, 29, 15);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 70, y + 18, 15, 27);
            }

            function drawBackgroundSkyline() {
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                const bldgColor = isDark ? 'rgba(30, 41, 59, 0.45)' : 'rgba(203, 213, 225, 0.5)';

                backgroundScroll = (backgroundScroll + baseSpeed * 0.15) % 300;

                ctx.fillStyle = bldgColor;
                for (let i = -1; i < 5; i++) {
                    let bx = i * 260 - backgroundScroll;
                    ctx.fillRect(bx, 10, 45, 70);
                    ctx.fillRect(bx + 55, 25, 35, 55);
                    ctx.fillRect(bx + 100, 5, 60, 75);
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                drawBackgroundSkyline();

                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                const groundColor = isDark ? '#334155' : '#cbd5e1';

                ctx.fillStyle = groundColor;
                ctx.fillRect(0, groundY, canvas.width, 18);
                ctx.fillStyle = '#b45309';
                for (let bx = 0; bx < canvas.width; bx += 20) {
                    ctx.fillRect(bx, groundY, 18, 4);
                }

                if (!gameOver && !levelCleared) {
                    mario.animFrame++;
                    if (mario.invincibleTimer > 0) mario.invincibleTimer--;

                    if (keys.left) mario.x -= mario.speed;
                    if (keys.right) mario.x += mario.speed;

                    mario.x = Math.max(10, Math.min(canvas.width - 60, mario.x));

                    mario.dy += mario.gravity;
                    mario.y += mario.dy;

                    if (mario.y >= groundY - mario.height) {
                        mario.y = groundY - mario.height;
                        mario.dy = 0;
                        mario.isGrounded = true;
                    }

                    const targetGoal = stageGoals[currentStage - 1];
                    if (coins >= targetGoal && currentStage < 5) {
                        currentStage++;
                        baseSpeed += 0.35;
                    }

                    if (coins >= 10000 && !finishLineObj) {
                        finishLineObj = { x: canvas.width + 50, y: groundY - 55, width: 110, height: 65 };
                    }

                    if (!finishLineObj) {
                        spawnTimer++;
                        let spawnRate = Math.max(70, 140 - currentStage * 12);
                        if (spawnTimer > spawnRate) {
                            const rand = Math.random();
                            if (currentStage === 5 && rand < 0.3) {
                                entities.push({ type: 'goomba', x: canvas.width, y: groundY - 16, width: 20, height: 16 });
                                entities.push({ type: 'goomba', x: canvas.width, y: groundY - 32, width: 20, height: 16 });
                            } else if (rand < 0.5) {
                                entities.push({ type: 'goomba', x: canvas.width, y: groundY - 16, width: 20, height: 16 });
                            } else if (rand < 0.8) {
                                entities.push({ type: 'mushroom', x: canvas.width, y: groundY - 16, width: 18, height: 16 });
                            } else {
                                entities.push({ type: 'block', x: canvas.width, y: groundY - 45, width: 18, height: 18 });
                            }
                            spawnTimer = 0;
                        }
                    }

                    if (finishLineObj) {
                        finishLineObj.x -= baseSpeed;
                        drawFinishLine(finishLineObj.x, finishLineObj.y);

                        if (mario.x + mario.width >= finishLineObj.x + 10) {
                            levelCleared = true;
                            saveScoreToRealtimeLeaderboard(coins);
                        }
                    }

                    for (let i = entities.length - 1; i >= 0; i--) {
                        let e = entities[i];
                        e.x -= baseSpeed;

                        if (e.type === 'goomba') drawGoomba(e.x, e.y);
                        else if (e.type === 'mushroom') drawMushroom(e.x, e.y);
                        else if (e.type === 'block') drawQuestionBlock(e.x, e.y);

                        if (
                            mario.x < e.x + e.width &&
                            mario.x + mario.width > e.x &&
                            mario.y < e.y + e.height &&
                            mario.y + mario.height > e.y
                        ) {
                            if (e.type === 'goomba') {
                                if (mario.dy > 0 && mario.y + mario.height - mario.dy <= e.y + 8) {
                                    entities.splice(i, 1);
                                    mario.dy = -8;
                                    coins += 100;
                                    saveScoreToRealtimeLeaderboard(coins);
                                } else if (mario.invincibleTimer === 0) {
                                    if (mario.isSuper) {
                                        mario.isSuper = false;
                                        mario.scale = 1.0;
                                        mario.width = mario.baseWidth;
                                        mario.height = mario.baseHeight;
                                        mario.invincibleTimer = 45;
                                    } else {
                                        gameOver = true;
                                        saveScoreToRealtimeLeaderboard(coins);
                                    }
                                }
                            } else if (e.type === 'mushroom') {
                                coins += 200;
                                mario.isSuper = true;
                                mario.scale = 1.45;
                                mario.width = mario.baseWidth * 1.45;
                                mario.height = mario.baseHeight * 1.45;
                                mario.y = groundY - mario.height;
                                entities.splice(i, 1);
                                saveScoreToRealtimeLeaderboard(coins);
                            } else if (e.type === 'block') {
                                coins += 150;
                                entities.splice(i, 1);
                                saveScoreToRealtimeLeaderboard(coins);
                            }
                        }

                        if (e.x + e.width < 0) {
                            entities.splice(i, 1);
                        }
                    }

                    baseSpeed += 0.0001;
                }

                drawMario(mario.x, mario.y);

                if (levelCleared) {
                    if (finishLineObj) drawFinishLine(finishLineObj.x, finishLineObj.y);
                    ctx.font = '700 12px Orbitron, sans-serif';
                    ctx.fillStyle = '#22c55e';
                    ctx.textAlign = 'left';
                    ctx.fillText(`🎉 STAGE 5 CLEARED ${currentUser}! STAGE COMPLETE! Tap to replay.`, 180, 135);
                } else if (gameOver) {
                    entities.forEach(e => {
                        if (e.type === 'goomba') drawGoomba(e.x, e.y);
                        else if (e.type === 'mushroom') drawMushroom(e.x, e.y);
                        else if (e.type === 'block') drawQuestionBlock(e.x, e.y);
                    });

                    ctx.font = '700 12px Orbitron, sans-serif';
                    ctx.fillStyle = '#ef4444';
                    ctx.textAlign = 'left';
                    ctx.fillText(`GAME OVER ${currentUser}! Tap to restart.`, 180, 135);
                }

                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fillRect(canvas.width - 270, 100, 250, 42);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(canvas.width - 270, 100, 250, 42);

                ctx.font = '700 11px Orbitron, sans-serif';
                ctx.fillStyle = '#facc15';
                ctx.textAlign = 'left';
                ctx.fillText(`PLAYER: ${currentUser} (STAGE ${currentStage}/5)`, canvas.width - 260, 116);
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`SCORE: ${coins} / ${stageGoals[currentStage - 1]}  | BEST: ${highScore}`, canvas.width - 260, 132);

                requestAnimationFrame(animate);
            }

            animate();
        }

        function initTradingBackground() {
            const canvas = document.getElementById('trading-bg');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                fitTitleCanvasScale();
            }
            resize();
            window.addEventListener('resize', resize);

            class DepthParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3 + 1.5;
                    this.speedX = (Math.random() - 0.5) * 1.2;
                    this.speedY = (Math.random() - 0.5) * 1.2;
                    this.isBuy = Math.random() > 0.5;
                    this.color = this.isBuy ? '34, 197, 94' : '239, 68, 68';
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.reset();
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, 0.65)`;
                    ctx.fill();
                }
            }

            const particles = Array.from({ length: 60 }, () => new DepthParticle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('dashboard_theme') || 'dark';
            setTheme(savedTheme);

            if (localStorage.getItem('dashboard_mobile_view') === 'true' || window.innerWidth < 768) {
                isMobileView = false;
                toggleMobileView();
            } else {
                buildMenuFromJSON(navMenuJSON);
            }

            initTradingBackground();
            initTitleWatermarkEngine();
            initSuperMarioGame();
            listenToRealtimeLeaderboard();
            fitTitleCanvasScale();
            startSlowRotation();
        });
    </script>
</body>
