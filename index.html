<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root[data-theme="dark"] {
            --bg-color: #030712;
            --center-btn-bg: linear-gradient(145deg, #1e293b, #0f172a);
            --item-btn-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.95));
            --border-color: rgba(56, 189, 248, 0.45);
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #38bdf8;
            --glow-color: rgba(56, 189, 248, 0.75);
            --shadow-color: rgba(0, 0, 0, 0.90);
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: linear-gradient(145deg, #ffffff, #e2e8f0);
            --item-btn-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(226, 232, 240, 0.95));
            --border-color: rgba(2, 132, 199, 0.45);
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #0284c7;
            --glow-color: rgba(2, 132, 199, 0.55);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --modal-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
        }

        /* Fullscreen Background via Direct GitHub Raw URL */
        body {
            background-image: linear-gradient(rgba(3, 7, 18, 0.35), rgba(3, 7, 18, 0.45)), url('https://raw.githubusercontent.com/krde-hue/SBHUB.2026/9c22ed926e11ee62a80805b0599ae4e3c3dc24f6/SB%20background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn, .select-dropdown {
            background: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px var(--shadow-color), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .select-dropdown {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }

        .game-dropdown {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border-color: #f87171;
        }

        .select-dropdown option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--glow-color);
        }

        .bottom-right-brand {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
        }

        .brand-icon-svg {
            width: 55px;
            height: 55px;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-align: center;
            line-height: 1.1;
        }

        .brand-line {
            width: 80%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.4);
            margin: 3px 0 2px 0;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.05em;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        /* Central Toggle (+) Button Container */
        .center-toggle-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 90;
            pointer-events: auto;
        }

        .toggle-btn {
            position: relative;
            width: 110px;
            height: 110px;
            background: var(--center-btn-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--title-cyan);
            font-size: 2.8rem;
            cursor: pointer;
            z-index: 95;
            box-shadow: 0 15px 35px var(--shadow-color), inset 0 2px 4px rgba(255, 255, 255, 0.3), inset 0 -4px 8px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            pointer-events: auto !important;
            overflow: visible;
            backdrop-filter: blur(12px);
        }

        .toggle-btn i {
            transition: transform 0.4s ease, opacity 0.3s ease;
            pointer-events: none;
            position: absolute;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .bull-logo-svg {
            position: absolute;
            width: 80px;
            height: 80px;
            opacity: 0;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 6px 12px rgba(56, 189, 248, 0.6));
        }

        .center-toggle-wrapper.active .toggle-btn {
            background: linear-gradient(145deg, #0f172a, #0284c7);
            border-color: #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.85), inset 0 2px 6px rgba(255, 255, 255, 0.4);
        }

        .center-toggle-wrapper.active .toggle-btn i {
            opacity: 0;
            transform: rotate(135deg) scale(0);
        }

        .center-toggle-wrapper.active .bull-logo-svg {
            opacity: 1;
            transform: scale(1);
        }

        /* Top App Dock Layer */
        .app-dock-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 80;
            pointer-events: none;
        }

        .categories-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            opacity: 0;
            transition: opacity 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .app-dock-container.active .categories-wrapper {
            opacity: 1;
        }

        /* Draggable Category Card Container */
        .category-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 16px 16px 16px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(56, 189, 248, 0.30);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: grab;
            user-select: none;
            touch-action: none;
            pointer-events: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .app-dock-container.active .category-group {
            pointer-events: auto;
        }

        .category-group:active {
            cursor: grabbing;
            border-color: #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            z-index: 300 !important;
        }

        .category-title {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            color: var(--title-cyan);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            padding-left: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .category-title::after {
            content: "\f0b2";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 0.7rem;
            opacity: 0.5;
            margin-left: 8px;
        }

        /* Horizontal Row Layout */
        .category-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        /* Circular App Icon Styling (64px) */
        .menu-item {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8 !important;
            text-decoration: none;
            font-size: 1.6rem;
            cursor: pointer;
            z-index: 35;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            overflow: visible;
            -webkit-tap-highlight-color: transparent;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.95));
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 15%;
            width: 70%;
            height: 35%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .menu-item i {
            pointer-events: none;
            transition: transform 0.25s ease, color 0.25s ease;
            color: #94a3b8;
        }

        .menu-item .letter-icon {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            line-height: 1;
            display: inline-block;
            pointer-events: none;
            transition: transform 0.25s ease, color 0.25s ease;
            color: #94a3b8 !important;
        }

        .menu-item:hover {
            transform: scale(1.22) translateY(-4px) !important;
            z-index: 200 !important;
        }

        .menu-item[data-id="top-picks"]:hover {
            background: linear-gradient(180deg, #ec4899 0%, #be185d 100%);
            border-color: #f472b6;
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.85);
        }

        .menu-item[data-id="duties"]:hover {
            background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%);
            border-color: #22d3ee;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.85);
        }

        .menu-item[data-id="rota"]:hover {
            background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
            border-color: #818cf8;
            box-shadow: 0 0 25px rgba(129, 140, 248, 0.85);
        }

        .menu-item[data-id="handover"]:hover {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            border-color: #34d399;
            box-shadow: 0 0 25px rgba(52, 211, 153, 0.85);
        }

        .menu-item[data-id="big-winners"]:hover {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            border-color: #fde047;
            box-shadow: 0 0 25px rgba(253, 224, 71, 0.85);
        }

        .menu-item[data-id="edge-boost"]:hover,
        .menu-item[data-id="edge-boost-v1"]:hover {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            border-color: #fcd34d;
            box-shadow: 0 0 25px rgba(252, 211, 77, 0.85);
        }

        .menu-item[data-id="ibet-boost"]:hover,
        .menu-item[data-id="ibet-boost-v1"]:hover {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border-color: #7dd3fc;
            box-shadow: 0 0 25px rgba(125, 211, 252, 0.85);
        }

        .menu-item[data-color="green"]:hover {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            border-color: #86efac;
            box-shadow: 0 0 25px rgba(134, 239, 172, 0.85);
        }

        .menu-item[data-color="red"]:hover {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            border-color: #fca5a5;
            box-shadow: 0 0 25px rgba(252, 165, 165, 0.85);
        }

        .menu-item[data-color="orange"]:hover {
            background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
            border-color: #fdba74;
            box-shadow: 0 0 25px rgba(253, 186, 116, 0.85);
        }

        .menu-item[data-id="confluence"]:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            border-color: #60a5fa;
            box-shadow: 0 0 25px rgba(96, 165, 250, 0.85);
        }

        .menu-item[data-id="workspace"]:hover {
            background: linear-gradient(180deg, #64748b 0%, #334155 100%);
            border-color: #94a3b8;
            box-shadow: 0 0 25px rgba(148, 163, 184, 0.85);
        }

        .menu-item:hover i, .menu-item:hover .letter-icon {
            color: #ffffff !important;
            transform: scale(1.15);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .menu-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -38px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: #0f172a;
            border: 1.5px solid var(--title-cyan);
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            z-index: 200;
        }

        .menu-item:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Auth Modal Styling */
        .login-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .login-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .login-card {
            background: var(--modal-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px var(--shadow-color), 0 0 30px var(--glow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .login-modal-overlay.active .login-card {
            transform: scale(1);
        }

        .login-icon {
            font-size: 2.8rem;
            color: var(--title-cyan);
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px var(--glow-color));
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .login-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .login-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .login-input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Segoe UI', sans-serif;
            outline: none;
            text-align: center;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            border-color: var(--title-cyan);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .toggle-password-icon {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            user-select: none;
        }

        .toggle-password-icon:hover {
            color: var(--title-cyan);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
        }

        .login-error-msg {
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .login-error-msg.show {
            opacity: 1;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- Controls at Top Right -->
    <div class="top-controls">
        <select class="select-dropdown game-dropdown" id="game-selector" onchange="switchGame(this.value)">
            <option value="" disabled selected>🎮 Select Entertainment...</option>
            <option value="mario">🎮 Entertainment: Super Mario Arcade ↗</option>
            <option value="flappy">🎮 Entertainment: Flappy Bird ↗</option>
            <option value="block">🎮 Entertainment: Block Puzzle ↗</option>
            <option value="solitaire">🎮 Entertainment: Solitaire ↗</option>
            <option value="word">🎮 Entertainment: Word Puzzle ↗</option>
        </select>

        <select class="select-dropdown" id="user-profile-select" onchange="changeActiveUser(this.value)">
            <option value="" disabled selected>-- Select Your Name --</option>
            <option value="ANN">👤 USER: ANN</option>
            <option value="DAVE">👤 USER: DAVE</option>
            <option value="KENNETH">👤 USER: KENNETH</option>
            <option value="KRIZTEL">👤 USER: KRIZTEL</option>
            <option value="MIGUEL">👤 USER: MIGUEL</option>
            <option value="CUSTOM">+ Custom Name...</option>
        </select>

        <button class="control-btn" id="theme-toggle">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
            <span id="theme-text">Night Mode</span>
        </button>
    </div>

    <!-- Branding at Bottom Right -->
    <div class="bottom-right-brand">
        <div class="brand-card">
            <svg class="brand-icon-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0284c7" />
                        <stop offset="100%" stop-color="#38bdf8" />
                    </linearGradient>
                    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f97316" />
                        <stop offset="100%" stop-color="#fb923c" />
                    </linearGradient>
                </defs>
                <path d="M 100 20 A 80 80 0 1 0 170 140" stroke="url(#grad-blue)" stroke-width="18" stroke-linecap="round"/>
                <path d="M 120 40 A 60 60 0 1 1 150 150" stroke="url(#grad-orange)" stroke-width="18" stroke-linecap="round"/>
                <path d="M 50 150 Q 90 100 160 30" stroke="url(#grad-blue)" stroke-width="20" stroke-linecap="round"/>
                <path d="M 130 25 L 175 25 L 175 70 Z" fill="url(#grad-orange)"/>
            </svg>
            <div class="brand-title">K HUB 2026</div>
            <div class="brand-line"></div>
            <div class="brand-subtitle">(kriztel)</div>
        </div>
    </div>

    <!-- Categorized Top App Dock Container -->
    <div class="app-dock-container" id="app-dock-container">
        <div class="categories-wrapper" id="categories-wrapper"></div>
    </div>

    <!-- Main Container with Central (+) Button -->
    <div class="dashboard-container">
        <div class="center-toggle-wrapper" id="center-toggle-wrapper">
            <div class="toggle-btn" id="toggle-btn" title="Toggle Operations Menu">
                <i class="fa-solid fa-plus"></i>
                <svg class="bull-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">

    <!-- Auth Modal -->
    <div class="login-modal-overlay" id="login-modal">
        <div class="login-card" id="login-card">
            <i class="fa-solid fa-shield-halved login-icon"></i>
            <div class="login-title">AUTHENTICATION</div>
            <div class="login-subtitle">Enter key to access Sportsbook Hub</div>
            <div class="login-input-wrapper">
                <input type="password" id="passcode-input" class="login-input" placeholder="Enter Password..." autocomplete="off">
                <i class="fa-solid fa-eye toggle-password-icon" id="toggle-password-btn" title="Toggle Visibility"></i>
            </div>
            <button class="login-btn" id="login-submit-btn">UNLOCK HUB</button>
            <div class="login-error-msg" id="login-error">Incorrect passcode! Access Denied.</div>
        </div>
    </div>

    <script>
        // Categorized Structured Menu Dataset
        const categorisedMenuData = [
            {
                id: "internal",
                category: "INTERNAL",
                defaultPos: { left: "30px", top: "25px" },
                items: [
                    { id: "duties", icon: "fa-solid fa-list-check", label: "DAILY DUTIES", url: "duties.html" },
                    { id: "rota", icon: "fa-solid fa-calendar-days", label: "ROTA 2026", url: "rota.html" }
                ]
            },
            {
                id: "monitoring",
                category: "DAILY MONITORING",
                defaultPos: { left: "245px", top: "25px" },
                items: [
                    { id: "big-winners", icon: "fa-solid fa-trophy", label: "BIG WINNERS", url: "big-winners.html" },
                    { id: "green-tracking", letter: "G", label: "GREEN TRACKING", url: "https://docs.google.com/spreadsheets/d/1qruVq-HZCyM0uDgnYSqFhccXKnMkqJ8z/edit?gid=1305147410#gid=1305147410", color: "green" },
                    { id: "red-tracking", letter: "R", label: "RED TRACKING", url: "https://docs.google.com/spreadsheets/d/1OcaMz_AOUeRsWIVplbnk2XAna62m3IKa/edit?gid=457800468#gid=457800468", color: "red" },
                    { id: "orange-tracking", letter: "O", label: "ORANGE TRACKING", url: "https://docs.google.com/spreadsheets/d/1U-Dmc628kHQabzJGoBeEgRus5PiRhgSd/edit?pli=1&gid=1983372695#gid=1983372695", color: "orange" },
                    { id: "green-crm", icon: "fa-solid fa-users", label: "GREEN CRM", url: "https://docs.google.com/spreadsheets/d/11STKO4Xsj0a8iTuUXSCXC-XEE4-7qmF9/edit?pli=1&gid=1701374259#gid=1701374259", color: "green" },
                    { id: "red-crm", icon: "fa-solid fa-users-slash", label: "RED CRM", url: "https://docs.google.com/spreadsheets/d/1gPks2FdHyOOTiILvn553miz32WeEtOpx/edit?gid=1701374259#gid=1701374259", color: "red" }
                ]
            },
            {
                id: "task",
                category: "DAILY TASK",
                defaultPos: { left: "755px", top: "25px" },
                items: [
                    { id: "edge-boost-v1", icon: "fa-solid fa-bolt-lightning", label: "EDGE BOOST (V1)", url: "https://docs.google.com/spreadsheets/d/1Pl8XVaYNEaupKx57HlXbWibsIeR7a28UfemRasxJ8RY/edit?gid=606091991#gid=606091991" },
                    { id: "ibet-boost-v1", icon: "fa-solid fa-arrow-trend-up", label: "IBET BOOST (V1)", url: "https://docs.google.com/spreadsheets/d/18ZJNs7wJ37-4sAHX5CNMfqQQcmpfy1cIvP19tHI7rY4/edit?gid=784209986#gid=784209986" },
                    { id: "edge-boost", icon: "fa-solid fa-bolt", label: "EDGE BOOST", url: "edge_boosts.html" },
                    { id: "ibet-boost", icon: "fa-solid fa-chart-line", label: "IBET BOOST", url: "ibet_boosts.html" }
                ]
            },
            {
                id: "procedures",
                category: "PROCEDURES",
                defaultPos: { left: "30px", top: "220px" },
                items: [
                    { id: "handover", icon: "fa-solid fa-clipboard-list", label: "HANDOVER SOP", url: "handover.html" },
                    { id: "confluence", icon: "fa-solid fa-book", label: "CONFLUENCE", url: "https://ibet.atlassian.net/wiki/spaces/Sportsbook/overview" },
                    { id: "workspace", icon: "fa-solid fa-laptop-code", label: "WORKSPACE", url: "workspace.html" }
                ]
            }
        ];

        const toggleBtn = document.getElementById('toggle-btn');
        const centerToggleWrapper = document.getElementById('center-toggle-wrapper');
        const appDockContainer = document.getElementById('app-dock-container');
        const categoriesWrapper = document.getElementById('categories-wrapper');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const userProfileSelect = document.getElementById('user-profile-select');

        const loginModal = document.getElementById('login-modal');
        const loginCard = document.getElementById('login-card');
        const passcodeInputs = document.getElementById('passcode-input');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const loginError = document.getElementById('login-error');

        function checkAuthStatus() {
            return localStorage.getItem('sb_device_authenticated') === 'true';
        }

        function promptLogin(callback) {
            loginModal.classList.add('active');
            passcodeInputs.value = '';
            loginError.classList.remove('show');
            setTimeout(() => passcodeInputs.focus(), 100);

            function handleAuthenticate() {
                const enteredPass = passcodeInputs.value.trim();
                if (enteredPass === 'sportsbook2026') {
                    localStorage.setItem('sb_device_authenticated', 'true');
                    loginModal.classList.remove('active');
                    loginSubmitBtn.removeEventListener('click', handleAuthenticate);
                    passcodeInputs.removeEventListener('keydown', handleKeyDown);
                    if (callback) callback();
                } else {
                    loginError.classList.add('show');
                    loginCard.classList.add('shake');
                    passcodeInputs.value = '';
                    passcodeInputs.focus();
                    setTimeout(() => loginCard.classList.remove('shake'), 400);
                }
            }

            function handleKeyDown(e) {
                if (e.key === 'Enter') handleAuthenticate();
            }

            loginSubmitBtn.onclick = handleAuthenticate;
            passcodeInputs.onkeydown = handleKeyDown;
        }

        if (togglePasswordBtn && passcodeInputs) {
            togglePasswordBtn.addEventListener('click', () => {
                if (passcodeInputs.type === 'password') {
                    passcodeInputs.type = 'text';
                    togglePasswordBtn.classList.remove('fa-eye');
                    togglePasswordBtn.classList.add('fa-eye-slash');
                } else {
                    passcodeInputs.type = 'password';
                    togglePasswordBtn.classList.remove('fa-eye-slash');
                    togglePasswordBtn.classList.add('fa-eye');
                }
            });
        }

        function initActiveUser() {
            let savedUser = localStorage.getItem('sb_active_user');
            if (userProfileSelect && savedUser) {
                userProfileSelect.value = savedUser;
            }
            return savedUser || "GUEST";
        }

        let currentUser = initActiveUser();

        function changeActiveUser(val) {
            if (val === "CUSTOM") {
                let typedName = prompt("Enter your Name:", "KRIZTEL");
                if (typedName) {
                    currentUser = typedName.toUpperCase().trim();
                    localStorage.setItem('sb_active_user', currentUser);
                    let customOpt = document.createElement('option');
                    customOpt.value = currentUser;
                    customOpt.textContent = "👤 USER: " + currentUser;
                    userProfileSelect.appendChild(customOpt);
                    userProfileSelect.value = currentUser;
                }
            } else {
                currentUser = val;
                localStorage.setItem('sb_active_user', currentUser);
            }
        }

        function switchGame(val) {
            const selector = document.getElementById('game-selector');
            if (val === 'mario') {
                window.open('mario.html', '_blank');
            } else if (val === 'flappy') {
                window.open('flappy.html', '_blank');
            } else if (val === 'block') {
                window.open('block.html', '_blank');
            } else if (val === 'solitaire') {
                window.open('solitaire.html', '_blank');
            } else if (val === 'word') {
                window.open('word.html', '_blank');
            }
            if (selector) selector.value = '';
        }

        /* Drag and Drop Implementation with Saved Coordinates */
        function makeElementDraggable(elmnt, groupId) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            elmnt.onpointerdown = dragMouseDown;

            function dragMouseDown(e) {
                // Ignore drags starting from clickable menu items
                if (e.target.closest('.menu-item')) return;

                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;

                document.onpointermove = elementDrag;
                document.onpointerup = closeDragElement;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;

                let newTop = elmnt.offsetTop - pos2;
                let newLeft = elmnt.offsetLeft - pos1;

                elmnt.style.top = newTop + "px";
                elmnt.style.left = newLeft + "px";
            }

            function closeDragElement() {
                document.onpointermove = null;
                document.onpointerup = null;

                // Save custom coordinates in LocalStorage
                const savedPositions = JSON.parse(localStorage.getItem('sb_card_positions') || '{}');
                savedPositions[groupId] = {
                    left: elmnt.style.left,
                    top: elmnt.style.top
                };
                localStorage.setItem('sb_card_positions', JSON.stringify(savedPositions));
            }
        }

        function buildCategorizedAppDock(dataset) {
            if (!categoriesWrapper) return;
            categoriesWrapper.innerHTML = '';
            
            const savedPositions = JSON.parse(localStorage.getItem('sb_card_positions') || '{}');

            dataset.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'category-group';
                groupDiv.id = 'group-' + group.id;

                // Apply saved position or fallback to default
                const pos = savedPositions[group.id] || group.defaultPos;
                groupDiv.style.left = pos.left;
                groupDiv.style.top = pos.top;

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.textContent = group.category;
                groupDiv.appendChild(titleDiv);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'category-grid';

                group.items.forEach(item => {
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.className = 'menu-item';
                    a.setAttribute('data-id', item.id);
                    a.setAttribute('data-tooltip', item.label);
                    
                    // Configured EVERY button to open in a new tab
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');

                    if (item.color) a.setAttribute('data-color', item.color);

                    if (item.letter) {
                        a.innerHTML = '<span class="letter-icon">' + item.letter + '</span>';
                    } else {
                        a.innerHTML = '<i class="' + item.icon + '"></i>';
                    }

                    gridDiv.appendChild(a);
                });

                groupDiv.appendChild(gridDiv);
                categoriesWrapper.appendChild(groupDiv);

                // Enable Drag-and-Drop capability for this category group
                makeElementDraggable(groupDiv, group.id);
            });
        }

        if (toggleBtn && appDockContainer && centerToggleWrapper) {
            function executeMenuToggle() {
                const isActive = centerToggleWrapper.classList.toggle('active');
                if (isActive) {
                    appDockContainer.classList.add('active');
                } else {
                    appDockContainer.classList.remove('active');
                }
            }

            function handleToggleMenu(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                if (checkAuthStatus()) {
                    executeMenuToggle();
                } else {
                    promptLogin(() => {
                        executeMenuToggle();
                    });
                }
            }

            toggleBtn.addEventListener('click', handleToggleMenu);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (themeIcon && themeText) {
                if (theme === 'dark') {
                    themeIcon.className = 'fa-solid fa-moon';
                    themeText.textContent = 'Night Mode';
                } else {
                    themeIcon.className = 'fa-solid fa-sun';
                    themeText.textContent = 'Daylight Mode';
                }
            }
            localStorage.setItem('dashboard_theme', theme);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                setTheme(currentTheme === 'dark' ? 'light' : 'dark');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('dashboard_theme') || 'dark';
            setTheme(savedTheme);

            localStorage.removeItem('dashboard_mobile_view');

            buildCategorizedAppDock(categorisedMenuData);
        });
    </script>
</body>
