<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root[data-theme="dark"] {
            --bg-color: #0b1329;
            --center-btn-bg: #ffffff;
            --center-btn-active: #38bdf8;
            --item-btn-bg: #1e293b;
            --item-hover-bg: #38bdf8;
            --border-color: #334155;
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #38bdf8;
            --watermark-color: #38bdf8;
            --watermark-opacity: 0.25;
            --credit-color: rgba(56, 189, 248, 0.35);
            --glow-color: rgba(56, 189, 248, 0.75);
            --shadow-color: rgba(0, 0, 0, 0.65);
            --canvas-opacity: 0.35;
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: #0f172a;
            --center-btn-active: #0284c7;
            --item-btn-bg: #ffffff;
            --item-hover-bg: #0284c7;
            --border-color: #cbd5e1;
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #0284c7;
            --watermark-color: #0284c7;
            --watermark-opacity: 0.20;
            --credit-color: rgba(2, 132, 199, 0.30);
            --glow-color: rgba(2, 132, 199, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.18);
            --canvas-opacity: 0.18;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        #trading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: var(--canvas-opacity);
            pointer-events: none;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background-color: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px var(--shadow-color);
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
        }

        .mobile-toggle-btn {
            background-color: #a855f7;
            color: #ffffff;
            border-color: #c084fc;
        }

        .mobile-toggle-btn.active {
            background-color: #ec4899;
            border-color: #f472b6;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
        }

        .dashboard-header-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 2;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome-subtitle-bg {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            color: var(--text-light);
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin-bottom: 0px;
            opacity: calc(var(--watermark-opacity) * 0.85);
            transition: font-size 0.3s ease;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
        }

        #pacman-text-canvas {
            position: relative;
            display: block;
            z-index: 3;
            pointer-events: none;
            max-width: 100vw;
        }

        .pacman-sprite {
            position: absolute;
            top: 78%;
            left: 0;
            width: 32px;
            height: 32px;
            margin-top: -16px;
            margin-left: -16px;
            background: #ffeb3b;
            border-radius: 50%;
            z-index: 15;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
            clip-path: polygon(100% 0%, 100% 50%, 100% 100%, 0% 100%, 0% 0%);
            animation: pacmanChomp 1.2s ease-in-out infinite alternate, pacmanTraverse 180s linear infinite;
            pointer-events: none;
        }

        @keyframes pacmanChomp {
            0% { clip-path: polygon(100% 18%, 50% 50%, 100% 82%, 100% 100%, 0% 100%, 0% 0%, 100% 0%); }
            100% { clip-path: polygon(100% 48%, 50% 50%, 100% 52%, 100% 100%, 0% 100%, 0% 0%, 100% 0%); }
        }

        @keyframes pacmanTraverse {
            0% { left: 0%; transform: scaleX(1); }
            49.9% { left: 100%; transform: scaleX(1); }
            50% { left: 100%; transform: scaleX(-1); }
            99.9% { left: 0%; transform: scaleX(-1); }
            100% { left: 0%; transform: scaleX(1); }
        }

        .hub-credit-bg {
            position: absolute;
            left: 0;
            bottom: -28px;
            font-family: 'Rajdhani', sans-serif;
            font-style: italic;
            color: var(--credit-color);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: lowercase;
            pointer-events: none;
        }

        /* RADIAL SWIPE MENU WRAPPER */
        .circular-menu {
            position: relative;
            width: 720px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .circular-menu:active {
            cursor: grabbing;
        }

        .toggle-btn {
            position: relative;
            width: 140px;
            height: 140px;
            background-color: var(--center-btn-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            font-size: 3.2rem;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 12px 35px var(--shadow-color);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                        background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
            pointer-events: auto;
        }

        .circular-menu.active .toggle-btn {
            background-color: var(--center-btn-active);
            color: #ffffff;
            box-shadow: 0 0 50px var(--glow-color);
        }

        .circular-menu.active .toggle-btn i {
            transform: rotate(135deg);
        }

        .menu-items {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            transition: transform 0.1s ease-out;
        }

        .circular-menu.active .menu-items {
            pointer-events: auto;
        }

        .menu-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110px;
            height: 110px;
            margin-top: -55px;
            margin-left: -55px;
            background-color: var(--item-btn-bg);
            border: 3px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 2.4rem;
            box-shadow: 0 8px 24px var(--shadow-color);
            opacity: 0;
            transform: translate(0, 0) scale(0);
            pointer-events: none;
            cursor: pointer;
            z-index: 35;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .circular-menu.active .menu-item {
            pointer-events: auto;
        }

        .menu-item i {
            pointer-events: none;
        }

        /* TOOLTIP ALWAYS VISIBLE ON HOVER / TOUCH WITHOUT IMMEDIATE TRIGGERING */
        .menu-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -38px;
            background: rgba(15, 23, 42, 0.98);
            border: 1.5px solid var(--title-cyan);
            color: #f8fafc;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease 0.1s, transform 0.25s ease 0.1s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .menu-item:hover::after,
        .menu-item.active-focus::after {
            opacity: 1;
            transform: translateY(2px);
        }

        .menu-item:hover {
            background-color: var(--item-hover-bg);
            border-color: var(--title-cyan);
            color: #ffffff;
            z-index: 40;
        }

        /* MOBILE VIEW STYLES */
        body.mobile-view-active .circular-menu {
            width: 340px;
            height: 340px;
        }

        body.mobile-view-active .toggle-btn {
            width: 80px;
            height: 80px;
            font-size: 2rem;
        }

        body.mobile-view-active .menu-item {
            width: 58px;
            height: 58px;
            margin-top: -29px;
            margin-left: -29px;
            font-size: 1.3rem;
            border-width: 2px;
        }

        body.mobile-view-active .menu-item::after {
            bottom: -28px;
            font-size: 0.72rem;
            padding: 3px 8px;
        }
    </style>
</head>
<body>

    <canvas id="trading-bg"></canvas>

    <div class="top-controls">
        <button class="control-btn mobile-toggle-btn" id="mobile-toggle">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span id="mobile-text">Mobile View: OFF</span>
        </button>
        <button class="control-btn" id="theme-toggle">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
            <span id="theme-text">Night Mode</span>
        </button>
    </div>

    <div class="dashboard-container">
        <div class="dashboard-header-bg">
            <div class="welcome-subtitle-bg">Welcome to</div>
            <div class="title-wrapper">
                <canvas id="pacman-text-canvas" width="1150" height="130"></canvas>
                <div class="pacman-sprite" id="pacman-sprite"></div>
                <div class="hub-credit-bg">kriztelhub.2026 model</div>
            </div>
        </div>

        <div class="circular-menu" id="circular-menu">
            <div class="toggle-btn" id="toggle-btn" title="Expand Operations Menu">
                <i class="fa-solid fa-plus"></i>
            </div>
            <div class="menu-items" id="menu-items"></div>
        </div>
    </div>

    <script>
        const navMenuJSON = [
            { id: "duties", icon: "fa-solid fa-list-check", label: "DAILY DUTIES", url: "duties.html" },
            { id: "rota", icon: "fa-solid fa-calendar-days", label: "ROTA 2026", url: "rota.html" },
            { id: "big-winners", icon: "fa-solid fa-trophy", label: "BIG WINNERS", url: "big-winners.html" },
            { id: "edge-boost", icon: "fa-solid fa-bolt", label: "EDGE BOOST", url: "https://docs.google.com/spreadsheets/d/1Pl8XVaYNEaupKx57HlXbWibsIeR7a28UfemRasxJ8RY/edit?gid=1386504317#gid=1386504317" },
            { id: "ibet-boost", icon: "fa-solid fa-chart-line", label: "IBET BOOST", url: "https://docs.google.com/spreadsheets/d/18ZJNs7wJ37-4sAHX5CNMfqQQcmpfy1cIvP19tHI7rY4/edit?gid=784209986#gid=784209986" },
            { id: "green-tracking", icon: "fa-solid fa-chart-pie", label: "GREEN TRACKING", url: "https://docs.google.com/spreadsheets/d/1qruVq-HZCyM0uDgnYSqFhccXKnMkqJ8z/edit?gid=1305147410#gid=1305147410", color: "green" },
            { id: "red-tracking", icon: "fa-solid fa-chart-pie", label: "RED TRACKING", url: "https://docs.google.com/spreadsheets/d/1OcaMz_AOUeRsWIVplbnk2XAna62m3IKa/edit?gid=457800468#gid=457800468", color: "red" },
            { id: "orange-tracking", icon: "fa-solid fa-chart-pie", label: "ORANGE TRACKING", url: "https://docs.google.com/spreadsheets/d/1U-Dmc628kHQabzJGoBeEgRus5PiRhgSd/edit?pli=1&gid=1983372695#gid=1983372695", color: "orange" },
            { id: "green-crm", icon: "fa-solid fa-users", label: "GREEN CRM", url: "https://docs.google.com/spreadsheets/d/11STKO4Xsj0a8iTuUXSCXC-XEE4-7qmF9/edit?pli=1&gid=1701374259#gid=1701374259", color: "green" },
            { id: "red-crm", icon: "fa-solid fa-users-slash", label: "RED CRM", url: "https://docs.google.com/spreadsheets/d/1gPks2FdHyOOTiILvn553miz32WeEtOpx/edit?gid=1701374259#gid=1701374259", color: "red" },
            { id: "confluence", icon: "fa-solid fa-book", label: "CONFLUENCE", url: "https://ibet.atlassian.net/wiki/spaces/Sportsbook/overview" },
            { id: "workspace", icon: "fa-solid fa-laptop-code", label: "WORKSPACE", url: "workspace.html" }
        ];

        const circularMenu = document.getElementById('circular-menu');
        const toggleBtn = document.getElementById('toggle-btn');
        const menuItemsContainer = document.getElementById('menu-items');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const mobileToggleBtn = document.getElementById('mobile-toggle');

        let isMobileView = false;
        let rotationOffset = 0;
        let isDragging = false;
        let startAngle = 0;

        function updateRadius() {
            return isMobileView ? 135 : 290;
        }

        function buildMenuFromJSON() {
            if (!menuItemsContainer) return;
            menuItemsContainer.innerHTML = '';
            const total = navMenuJSON.length;
            const radius = updateRadius();

            navMenuJSON.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2) + rotationOffset; 
                const x = Math.round(radius * Math.cos(angle));
                const y = Math.round(radius * Math.sin(angle));

                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'menu-item';
                a.setAttribute('data-tooltip', item.label);

                if (item.url.startsWith('http://') || item.url.startsWith('https://')) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }

                a.style.setProperty('--tx', `${x}px`);
                a.style.setProperty('--ty', `${y}px`);
                a.style.transform = circularMenu.classList.contains('active') 
                    ? `translate(${x}px, ${y}px) scale(1)` 
                    : 'translate(0, 0) scale(0)';
                if (circularMenu.classList.contains('active')) a.style.opacity = '1';

                a.innerHTML = `<i class="${item.icon}"></i>`;

                // DELIBERATE CLICK GUARD (Prevents auto-launching when swiping)
                a.addEventListener('click', (e) => {
                    if (isDragging) {
                        e.preventDefault();
                    }
                });

                menuItemsContainer.appendChild(a);
            });
        }

        /* ROTATIONAL SWIPE / DRAG CONTROLLER */
        function getPointerAngle(e) {
            const rect = circularMenu.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - centerY, clientX - centerX);
        }

        circularMenu.addEventListener('pointerdown', (e) => {
            if (!circularMenu.classList.contains('active')) return;
            isDragging = false;
            startAngle = getPointerAngle(e) - rotationOffset;

            const onPointerMove = (moveEvt) => {
                isDragging = true;
                rotationOffset = getPointerAngle(moveEvt) - startAngle;
                buildMenuFromJSON();
            };

            const onPointerUp = () => {
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
            };

            window.addEventListener('pointermove', onPointerMove);
