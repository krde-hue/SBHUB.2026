<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-color: #0b1329;
            --center-btn-bg: #1e293b;
            --center-btn-active: #0f172a;
            --item-btn-bg: #1e293b;
            --item-hover-bg: #38bdf8;
            --border-color: #334155;
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #38bdf8;
            --watermark-color: #38bdf8;
            --watermark-opacity: 0.25;
            --glow-color: rgba(56, 189, 248, 0.85);
            --shadow-color: rgba(0, 0, 0, 0.65);
            --canvas-opacity: 0.35;
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: #ffffff;
            --center-btn-active: #0f172a;
            --item-btn-bg: #ffffff;
            --item-hover-bg: #0284c7;
            --border-color: #cbd5e1;
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #0284c7;
            --watermark-color: #0284c7;
            --watermark-opacity: 0.20;
            --glow-color: rgba(2, 132, 199, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.18);
            --canvas-opacity: 0.18;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        #trading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: var(--canvas-opacity);
            pointer-events: none;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn, .user-select-btn {
            background-color: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px var(--shadow-color);
            transition: all 0.2s ease;
        }

        .user-select-btn {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            outline: none;
        }

        .user-select-btn option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
        }

        .mobile-toggle-btn {
            background-color: #a855f7;
            color: #ffffff;
            border-color: #c084fc;
        }

        .mobile-toggle-btn.active {
            background-color: #ec4899;
            border-color: #f472b6;
        }

        .bottom-left-leaderboard {
            position: absolute;
            bottom: 20px;
            left: 25px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #facc15;
            border-radius: 8px;
            padding: 10px 14px;
            width: 250px;
            box-shadow: 0 0 16px rgba(250, 204, 21, 0.35);
            backdrop-filter: blur(6px);
        }

        .leaderboard-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            font-weight: 900;
            color: #facc15;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .leaderboard-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #f8fafc;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .rank-tag {
            color: #38bdf8;
            font-weight: 900;
            width: 22px;
        }

        .score-val {
            color: #facc15;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
        }

        .bottom-right-brand {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        .brand-icon-svg {
            width: 55px;
            height: 55px;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-align: center;
            line-height: 1.1;
        }

        .brand-line {
            width: 80%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.4);
            margin: 3px 0 2px 0;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.05em;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .dashboard-header-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            user-select: none;
            white-space: nowrap;
            z-index: 2;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-subtitle-bg {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            color: var(--text-light);
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin-bottom: -15px;
            opacity: calc(var(--watermark-opacity) * 0.85);
            transition: font-size 0.3s ease;
            pointer-events: none;
        }

        .title-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #title-text-canvas {
            position: relative;
            display: block;
            z-index: 3;
            pointer-events: none;
            max-width: 95vw;
        }

        #mario-game-canvas {
            position: absolute;
            bottom: -235px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
        }

        .circular-menu {
            position: relative;
            width: 720px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        .toggle-btn {
            position: relative;
            width: 155px;
            height: 155px;
            background-color: var(--center-btn-bg);
            border: 4px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--title-cyan);
            font-size: 3.2rem;
            cursor: pointer;
            z-index: 60;
            box-shadow: 0 12px 35px var(--shadow-color);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                        background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            pointer-events: auto !important;
            overflow: hidden;
        }

        .toggle-btn i {
            transition: transform 0.4s ease, opacity 0.3s ease;
            pointer-events: none;
            position: absolute;
            z-index: 2;
        }

        .bull-logo-svg {
            position: absolute;
            width: 110px;
            height: 110px;
            opacity: 0;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            z-index: 1;
            pointer-events: none;
        }

            background-color: #0a172c;
            border-color: #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189
