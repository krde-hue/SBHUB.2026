<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <!-- Orbitron & Rajdhani Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root[data-theme="dark"] {
            --bg-color: #0b1329;
            --center-btn-bg: #1e293b;
            --center-btn-active: #0f172a;
            --item-btn-bg: #1e293b;
            --item-hover-bg: #38bdf8;
            --border-color: #334155;
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #38bdf8;
            --watermark-color: #38bdf8;
            --watermark-opacity: 0.25;
            --glow-color: rgba(56, 189, 248, 0.85);
            --shadow-color: rgba(0, 0, 0, 0.65);
            --canvas-opacity: 0.35;
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: #ffffff;
            --center-btn-active: #0f172a;
            --item-btn-bg: #ffffff;
            --item-hover-bg: #0284c7;
            --border-color: #cbd5e1;
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #0284c7;
            --watermark-color: #0284c7;
            --watermark-opacity: 0.20;
            --glow-color: rgba(2, 132, 199, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.18);
            --canvas-opacity: 0.18;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* TRADING CANVAS BACKGROUND */
        #trading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: var(--canvas-opacity);
            pointer-events: none;
        }

        /* TOP RIGHT CONTROLS */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background-color: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px var(--shadow-color);
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
        }

        .mobile-toggle-btn {
            background-color: #a855f7;
            color: #ffffff;
            border-color: #c084fc;
        }

        .mobile-toggle-btn.active {
            background-color: #ec4899;
            border-color: #f472b6;
        }

        /* BOTTOM-RIGHT LOGO BRANDING */
        .bottom-right-brand {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        .brand-icon-svg {
            width: 55px;
            height: 55px;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-align: center;
            line-height: 1.1;
        }

        .brand-line {
            width: 80%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.4);
            margin: 3px 0 2px 0;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.05em;
        }

        /* MAIN DASHBOARD CONTAINER */
        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        /* WATERMARK HEADERS */
        .dashboard-header-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            user-select: none;
            white-space: nowrap;
            z-index: 2;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-subtitle-bg {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            color: var(--text-light);
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin-bottom: -15px;
            opacity: calc(var(--watermark-opacity) * 0.85);
            transition: font-size 0.3s ease;
            pointer-events: none;
        }

        .title-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #title-text-canvas {
            position: relative;
            display: block;
            z-index: 3;
            pointer-events: none;
            max-width: 95vw;
        }

        /* INTERACTIVE DINO GAME CANVAS */
        #dino-game-canvas {
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
        }

        /* CIRCULAR MENU CONTAINER */
        .circular-menu {
            position: relative;
            width: 720px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        /* CENTER TOGGLE BUTTON WITH BULL ICON DYNAMIC SWITCH */
        .toggle-btn {
            position: relative;
            width: 155px;
            height: 155px;
            background-color: var(--center-btn-bg);
            border: 4px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--title-cyan);
            font-size: 3.2rem;
            cursor: pointer;
            z-index: 60;
            box-shadow: 0 12px 35px var(--shadow-color);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55),
                        background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            pointer-events: auto !important;
            overflow: hidden;
        }

        .toggle-btn i {
            transition: transform 0.4s ease, opacity 0.3s ease;
            pointer-events: none;
            position: absolute;
            z-index: 2;
        }

        .bull-logo-svg {
            position: absolute;
            width: 110px;
            height: 110px;
            opacity: 0;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            z-index: 1;
            pointer-events: none;
        }

        .circular-menu.active .toggle-btn {
            background-color: #0a172c;
            border-color: #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.85), inset 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .circular-menu.active .toggle-btn i {
            opacity: 0;
            transform: rotate(135deg) scale(0);
        }

        .circular-menu.active .bull-logo-svg {
            opacity: 1;
            transform: scale(1);
        }

        .menu-items {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        .circular-menu.active .menu-items {
            pointer-events: auto;
        }

        /* RADIAL MENU BUTTONS */
        .menu-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110px;
            height: 110px;
            margin-top: -55px;
            margin-left: -55px;
            background-color: var(--item-btn-bg);
            border: 3px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 2.4rem;
            box-shadow: 0 8px 24px var(--shadow-color);
            opacity: 0;
            transform: translate(0, 0) scale(0);
            pointer-events: none;
            cursor: pointer;
            z-index: 35;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 0.3s ease, 
                        background-color 0.25s ease, 
                        border-color 0.25s ease, 
                        box-shadow 0.25s ease;
        }

        .circular-menu.active .menu-item {
            pointer-events: auto;
        }

        .menu-item i {
            pointer-events: none;
            transition: transform 0.25s ease;
        }

        .menu-item .letter-icon {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 2.4rem;
            line-height: 1;
            display: inline-block;
            pointer-events: none;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .menu-item[data-color="green"] .letter-icon {
            color: #22c55e;
            text-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
        }

        .menu-item[data-color="red"] .letter-icon {
            color: #ef4444;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        .menu-item[data-color="orange"] .letter-icon {
            color: #f97316;
            text-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
        }

        .menu-item:hover {
            transform: translate(var(--tx), var(--ty)) scale(1.4) !important;
            background-color: var(--item-hover-bg);
            border-color: var(--title-cyan);
            color: #ffffff;
            box-shadow: 0 0 50px var(--glow-color), 0 0 25px rgba(56, 189, 248, 0.95);
            z-index: 50;
        }

        .menu-item:hover i,
        .menu-item:hover .letter-icon {
            transform: scale(1.15);
        }

        .menu-item[data-color="green"]:hover {
            background-color: #22c55e !important;
            border-color: #4ade80 !important;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.95) !important;
        }

        .menu-item[data-color="green"]:hover .letter-icon {
            color: #ffffff !important;
            text-shadow: none;
        }

        .menu-item[data-color="red"]:hover {
            background-color: #ef4444 !important;
            border-color: #f87171 !important;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.95) !important;
        }

        .menu-item[data-color="red"]:hover .letter-icon {
            color: #ffffff !important;
            text-shadow: none;
        }

        .menu-item[data-color="orange"]:hover {
            background-color: #f97316 !important;
            border-color: #fb923c !important;
            box-shadow: 0 0 50px rgba(249, 115, 22, 0.95) !important;
        }

        .menu-item[data-color="orange"]:hover .letter-icon {
            color: #ffffff !important;
            text-shadow: none;
        }

        .menu-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -38px;
            background: rgba(15, 23, 42, 0.98);
            border: 1.5px solid var(--title-cyan);
            color: #f8fafc;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .menu-item[data-color="green"]::after { border-color: #22c55e; }
        .menu-item[data-color="red"]::after { border-color: #ef4444; }
        .menu-item[data-color="orange"]::after { border-color: #f97316; }

        .menu-item:hover::after {
            opacity: 1;
            transform: translateY(2px) scale(0.85);
        }

        /* MOBILE VIEW OPTIMIZATIONS */
        body.mobile-view-active .top-controls {
            top: 12px;
            right: 12px;
            gap: 8px;
        }

        body.mobile-view-active .control-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 18px;
        }

        body.mobile-view-active .bottom-right-brand {
            bottom: 12px;
            right: 15px;
        }

        body.mobile-view-active .brand-icon-svg {
            width: 40px;
            height: 40px;
        }

        body.mobile-view-active .brand-title {
            font-size: 0.78rem;
        }

        body.mobile-view-active .brand-subtitle {
            font-size: 0.70rem;
        }

        body.mobile-view-active .welcome-subtitle-bg {
            font-size: 1.4rem;
            letter-spacing: 0.25em;
        }

        body.mobile-view-active .circular-menu {
            width: 340px;
            height: 340px;
        }

        body.mobile-view-active .toggle-btn {
            width: 95px;
            height: 95px;
            font-size: 2rem;
        }

        body.mobile-view-active .bull-logo-svg {
            width: 65px;
            height: 65px;
        }

        body.mobile-view-active .menu-item {
            width: 58px;
            height: 58px;
            margin-top: -29px;
            margin-left: -29px;
            font-size: 1.3rem;
            border-width: 2px;
        }

        body.mobile-view-active .menu-item .letter-icon {
            font-size: 1.3rem;
        }

        body.mobile-view-active .menu-item::after {
            bottom: -28px;
            font-size: 0.72rem;
            padding: 3px 8px;
        }

        body.mobile-view-active #dino-game-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <!-- TRADING CANVAS BACKGROUND -->
    <canvas id="trading-bg"></canvas>

    <!-- TOP CONTROL BUTTONS -->
    <div class="top-controls">
        <button class="control-btn mobile-toggle-btn" id="mobile-toggle">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span id="mobile-text">Mobile View: OFF</span>
        </button>
        <button class="control-btn" id="theme-toggle">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
            <span id="theme-text">Night Mode</span>
        </button>
    </div>

    <!-- BOTTOM RIGHT LOGO BRANDING -->
    <div class="bottom-right-brand">
        <div class="brand-card">
            <svg class="brand-icon-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0284c7" />
                        <stop offset="100%" stop-color="#38bdf8" />
                    </linearGradient>
                    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f97316" />
                        <stop offset="100%" stop-color="#fb923c" />
                    </linearGradient>
                </defs>
                <path d="M 100 20 A 80 80 0 1 0 170 140" stroke="url(#grad-blue)" stroke-width="18" stroke-linecap="round"/>
                <path d="M 120 40 A 60 60 0 1 1 150 150" stroke="url(#grad-orange)" stroke-width="18" stroke-linecap="round"/>
                <path d="M 50 150 Q 90 100 160 30" stroke="url(#grad-blue)" stroke-width="20" stroke-linecap="round"/>
                <path d="M 130 25 L 175 25 L 175 70 Z" fill="url(#grad-orange)"/>
            </svg>
            <div class="brand-title">K HUB 2026</div>
            <div class="brand-line"></div>
            <div class="brand-subtitle">(kriztel)</div>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- BACKGROUND WATERMARK TITLE WITH DINO GAME OVERLAY -->
        <div class="dashboard-header-bg">
            <div class="welcome-subtitle-bg">Welcome to</div>
            <div class="title-wrapper">
                <canvas id="title-text-canvas" width="1150" height="150"></canvas>
                <!-- INTERACTIVE DINO RUNNER MINI-GAME -->
                <canvas id="dino-game-canvas" width="1050" height="85"></canvas>
            </div>
        </div>

        <!-- CIRCULAR NAVIGATION MENU -->
        <div class="circular-menu" id="circular-menu">
            <div class="toggle-btn" id="toggle-btn" title="Expand Operations Menu">
                <i class="fa-solid fa-plus"></i>
                
                <!-- VECTOR BULL HEAD WITH TRADING CANDLESTICKS -->
                <svg class="bull-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#22d3ee" />
                        </linearGradient>
                    </defs>
                    <path d="M 50 65 C 20 40 25 15 55 25 C 65 30 75 50 72 65 Z" fill="url(#bullGrad)"/>
                    <path d="M 150 65 C 180 40 175 15 145 25 C 135 30 125 50 128 65 Z" fill="url(#bullGrad)"/>
                    <path d="M 52 65 C 70 65 80 80 100 85 C 120 80 130 65 148 65 C 160 85 165 110 145 135 C 130 155 115 165 100 165 C 85 165 70 155 55 135 C 35 110 40 85 52 65 Z" stroke="url(#bullGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="82" y1="85" x2="82" y2="135" stroke="#38bdf8" stroke-width="4"/>
                    <rect x="77" y="95" width="10" height="25" fill="#38bdf8" rx="2"/>
                    <line x1="100" y1="75" x2="100" y2="145" stroke="#38bdf8" stroke-width="4"/>
                    <rect x="95" y="85" width="10" height="45" fill="#38bdf8" rx="2"/>
                    <line x1="118" y1="90" x2="118" y2="130" stroke="#38bdf8" stroke-width="4"/>
                    <rect x="113" y="100" width="10" height="20" fill="#38bdf8" rx="2"/>
                </svg>
            </div>
            <div class="menu-items" id="menu-items"></div>
        </div>
    </div>

    <script>
        const navMenuJSON = [
            { id: "duties", icon: "fa-solid fa-list-check", label: "DAILY DUTIES", url: "duties.html" },
            { id: "rota", icon: "fa-solid fa-calendar-days", label: "ROTA 2026", url: "rota.html" },
            { id: "big-winners", icon: "fa-solid fa-trophy", label: "BIG WINNERS", url: "big-winners.html" },
            { id: "edge-boost", icon: "fa-solid fa-bolt", label: "EDGE BOOST", url: "https://docs.google.com/spreadsheets/d/1Pl8XVaYNEaupKx57HlXbWibsIeR7a28UfemRasxJ8RY/edit?gid=1386504317#gid=1386504317" },
            { id: "ibet-boost", icon: "fa-solid fa-chart-line", label: "IBET BOOST", url: "https://docs.google.com/spreadsheets/d/18ZJNs7wJ37-4sAHX5CNMfqQQcmpfy1cIvP19tHI7rY4/edit?gid=784209986#gid=784209986" },
            { id: "green-tracking", letter: "G", label: "GREEN TRACKING", url: "https://docs.google.com/spreadsheets/d/1qruVq-HZCyM0uDgnYSqFhccXKnMkqJ8z/edit?gid=1305147410#gid=1305147410", color: "green" },
            { id: "red-tracking", letter: "R", label: "RED TRACKING", url: "https://docs.google.com/spreadsheets/d/1OcaMz_AOUeRsWIVplbnk2XAna62m3IKa/edit?gid=457800468#gid=457800468", color: "red" },
            { id: "orange-tracking", letter: "O", label: "ORANGE TRACKING", url: "https://docs.google.com/spreadsheets/d/1U-Dmc628kHQabzJGoBeEgRus5PiRhgSd/edit?pli=1&gid=1983372695#gid=1983372695", color: "orange" },
            { id: "green-crm", icon: "fa-solid fa-users", label: "GREEN CRM", url: "https://docs.google.com/spreadsheets/d/11STKO4Xsj0a8iTuUXSCXC-XEE4-7qmF9/edit?pli=1&gid=1701374259#gid=1701374259", color: "green" },
            { id: "red-crm", icon: "fa-solid fa-users-slash", label: "RED CRM", url: "https://docs.google.com/spreadsheets/d/1gPks2FdHyOOTiILvn553miz32WeEtOpx/edit?gid=1701374259#gid=1701374259", color: "red" },
            { id: "confluence", icon: "fa-solid fa-book", label: "CONFLUENCE", url: "https://ibet.atlassian.net/wiki/spaces/Sportsbook/overview" },
            { id: "workspace", icon: "fa-solid fa-laptop-code", label: "WORKSPACE", url: "workspace.html" }
        ];

        const circularMenu = document.getElementById('circular-menu');
        const toggleBtn = document.getElementById('toggle-btn');
        const menuItemsContainer = document.getElementById('menu-items');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const mobileToggleBtn = document.getElementById('mobile-toggle');
        const mobileText = document.getElementById('mobile-text');

        let isMobileView = false;
        let rotationAngle = 0;
        let rotationAnimationId = null;

        function getRadius() {
            return isMobileView ? 135 : 290;
        }

        function buildMenuFromJSON(items) {
            if (!menuItemsContainer) return;
            menuItemsContainer.innerHTML = '';
            const total = items.length;
            const radius = getRadius();

            items.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2) + rotationAngle; 
                const x = Math.round(radius * Math.cos(angle));
                const y = Math.round(radius * Math.sin(angle));

                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'menu-item';
                a.setAttribute('data-tooltip', item.label);
                if (item.color) a.setAttribute('data-color', item.color);

                if (item.url.startsWith('http://') || item.url.startsWith('https://')) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }

                a.style.setProperty('--tx', `${x}px`);
                a.style.setProperty('--ty', `${y}px`);

                if (circularMenu.classList.contains('active')) {
                    a.style.opacity = '1';
                    a.style.transform = `translate(${x}px, ${y}px) scale(1)`;
                } else {
                    a.style.opacity = '0';
                    a.style.transform = `translate(0px, 0px) scale(0)`;
                }

                if (item.letter) {
                    a.innerHTML = `<span class="letter-icon">${item.letter}</span>`;
                } else {
                    a.innerHTML = `<i class="${item.icon}"></i>`;
                }
                
                menuItemsContainer.appendChild(a);
            });
        }

        // NEAR-IMPERCEPTIBLE ROTATION ENGINE
        function startSlowRotation() {
            function step() {
                if (circularMenu.classList.contains('active')) {
                    rotationAngle += 0.0001; 
                    const items = navMenuJSON;
                    const total = items.length;
                    const radius = getRadius();
                    const menuElements = menuItemsContainer.querySelectorAll('.menu-item');

                    menuElements.forEach((a, index) => {
                        const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2) + rotationAngle; 
                        const x = Math.round(radius * Math.cos(angle));
                        const y = Math.round(radius * Math.sin(angle));

                        a.style.setProperty('--tx', `${x}px`);
                        a.style.setProperty('--ty', `${y}px`);

                        if (!a.matches(':hover')) {
                            a.style.transform = `translate(${x}px, ${y}px) scale(1)`;
                        }
                    });
                }
                rotationAnimationId = requestAnimationFrame(step);
            }
            if (!rotationAnimationId) {
                step();
            }
        }

        // TOGGLE MENU STATE
        if (toggleBtn && circularMenu) {
            function handleToggleMenu(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                const isActive = circularMenu.classList.toggle('active');
                const items = menuItemsContainer.querySelectorAll('.menu-item');

                items.forEach((item, index) => {
                    if (isActive) {
                        setTimeout(() => {
                            const tx = item.style.getPropertyValue('--tx');
                            const ty = item.style.getPropertyValue('--ty');
                            item.style.opacity = '1';
                            item.style.transform = `translate(${tx}, ${ty}) scale(1)`;
                        }, index * 25);
                    } else {
                        item.style.opacity = '0';
                        item.style.transform = 'translate(0, 0) scale(0)';
                    }
                });
            }

            toggleBtn.addEventListener('click', handleToggleMenu);
        }

        function toggleMobileView() {
            isMobileView = !isMobileView;
            if (isMobileView) {
                document.body.classList.add('mobile-view-active');
                mobileText.textContent = 'Mobile View: ON';
                mobileToggleBtn.classList.add('active');
            } else {
                document.body.classList.remove('mobile-view-active');
                mobileText.textContent = 'Mobile View: OFF';
                mobileToggleBtn.classList.remove('active');
            }
            localStorage.setItem('dashboard_mobile_view', isMobileView ? 'true' : 'false');
            buildMenuFromJSON(navMenuJSON);
            fitTitleCanvasScale();
        }

        if (mobileToggleBtn) {
            mobileToggleBtn.addEventListener('click', toggleMobileView);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (themeIcon && themeText) {
                if (theme === 'dark') {
                    themeIcon.className = 'fa-solid fa-moon';
                    themeText.textContent = 'Night Mode';
                } else {
                    themeIcon.className = 'fa-solid fa-sun';
                    themeText.textContent = 'Daylight Mode';
                }
            }
            localStorage.setItem('dashboard_theme', theme);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                setTheme(currentTheme === 'dark' ? 'light' : 'dark');
            });
        }

        function fitTitleCanvasScale() {
            const canvas = document.getElementById('title-text-canvas');
            if (!canvas) return;
            const screenWidth = window.innerWidth;
            if (screenWidth < 1150 || isMobileView) {
                const targetWidth = isMobileView ? Math.min(screenWidth * 0.90, 360) : Math.min(screenWidth * 0.95, 1150);
                const scale = targetWidth / 1150;
                canvas.style.transform = `scale(${scale})`;
            } else {
                canvas.style.transform = `scale(1)`;
            }
        }

        // BACKGROUND WATERMARK TEXT ENGINE
        function initTitleWatermarkEngine() {
            const canvas = document.getElementById('title-text-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function render() {
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                const mainColor = isDark ? '#38bdf8' : '#0284c7';
                const opacity = isDark ? 0.25 : 0.20;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.font = '900 96px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillStyle = mainColor;
                ctx.globalAlpha = opacity;
                ctx.shadowColor = mainColor;
                ctx.shadowBlur = isDark ? 25 : 10;

                ctx.fillText('SPORTSBOOK HUB', canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;

                requestAnimationFrame(render);
            }

            render();
        }

        // INTERACTIVE CHROME DINO RUNNER MINI-GAME
        function initDinoRunnerGame() {
            const canvas = document.getElementById('dino-game-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let gameScore = 0;
            let gameOver = false;
            let gameSpeed = 4.2;

            // Dino State
            const dino = {
                x: 60,
                y: 45,
                width: 24,
                height: 28,
                dy: 0,
                gravity: 0.55,
                jumpPower: -10,
                isGrounded: true
            };

            const groundY = 70;
            let cactuses = [];
            let spawnTimer = 0;

            function triggerJump() {
                if (gameOver) {
                    // Restart Game
                    gameScore = 0;
                    gameOver = false;
                    gameSpeed = 4.2;
                    cactuses = [];
                    dino.y = 45;
                    dino.dy = 0;
                    dino.isGrounded = true;
                    return;
                }
                if (dino.isGrounded) {
                    dino.dy = dino.jumpPower;
                    dino.isGrounded = false;
                }
            }

            // Keyboard & Pointer Jump Event Listeners
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    if (document.activeElement.tagName !== 'INPUT') {
                        e.preventDefault();
                        triggerJump();
                    }
                }
            });

            canvas.addEventListener('click', triggerJump);

            function drawDino(x, y) {
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                ctx.fillStyle = isDark ? '#38bdf8' : '#0284c7';

                // Head & Snout
                ctx.fillRect(x + 10, y, 14, 10);
                ctx.fillRect(x + 18, y + 2, 4, 3); // Eye cutout fix
                ctx.fillStyle = isDark ? '#0b1329' : '#f1f5f9';
                ctx.fillRect(x + 14, y + 2, 3, 3); // Eye
                ctx.fillStyle = isDark ? '#38bdf8' : '#0284c7';

                // Body & Arm
                ctx.fillRect(x + 6, y + 10, 14, 12);
                ctx.fillRect(x + 18, y + 12, 4, 3); // Small Arm

                // Tail
                ctx.fillRect(x, y + 10, 6, 6);

                // Legs
                if (Math.floor(gameScore / 5) % 2 === 0 || !dino.isGrounded) {
                    ctx.fillRect(x + 6, y + 22, 4, 6);
                    ctx.fillRect(x + 14, y + 22, 4, 4);
                } else {
                    ctx.fillRect(x + 6, y + 22, 4, 4);
                    ctx.fillRect(x + 14, y + 22, 4, 6);
                }
            }

            function drawCactus(x, y, w, h) {
                ctx.fillStyle = '#22c55e'; // Green Cactus
                ctx.fillRect(x + w * 0.35, y, w * 0.3, h); // Main stem
                ctx.fillRect(x, y + h * 0.3, w, h * 0.2); // Arms cross
                ctx.fillRect(x, y + h * 0.15, w * 0.25, h * 0.2); // Left arm up
                ctx.fillRect(x + w * 0.75, y + h * 0.15, w * 0.25, h * 0.2); // Right arm up
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                const strokeColor = isDark ? 'rgba(56, 189, 248, 0.4)' : 'rgba(2, 132, 199, 0.3)';

                // Draw Ground Track Line
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(canvas.width, groundY);
                ctx.stroke();

                if (!gameOver) {
                    // Physics Update
                    dino.dy += dino.gravity;
                    dino.y += dino.dy;

                    if (dino.y >= groundY - dino.height) {
                        dino.y = groundY - dino.height;
                        dino.dy = 0;
                        dino.isGrounded = true;
                    }

                    // Spawn Cactus Obstacles
                    spawnTimer++;
                    if (spawnTimer > Math.max(60, 120 - gameScore * 0.1)) {
                        cactuses.push({
                            x: canvas.width,
                            y: groundY - 24,
                            width: 16,
                            height: 24
                        });
                        spawnTimer = 0;
                    }

                    // Update & Render Cactuses
                    for (let i = cactuses.length - 1; i >= 0; i--) {
                        let c = cactuses[i];
                        c.x -= gameSpeed;
                        drawCactus(c.x, c.y, c.width, c.height);

                        // Collision Detection
                        if (
                            dino.x < c.x + c.width &&
                            dino.x + dino.width > c.x &&
                            dino.y < c.y + c.height &&
                            dino.y + dino.height > c.y
                        ) {
                            gameOver = true;
                        }

                        if (c.x + c.width < 0) {
                            cactuses.splice(i, 1);
                        }
                    }

                    gameScore++;
                    gameSpeed += 0.0008;
                } else {
                    // Draw Dead Cactuses
                    cactuses.forEach(c => drawCactus(c.x, c.y, c.width, c.height));

                    // Game Over Message
                    ctx.font = '700 14px Orbitron, sans-serif';
                    ctx.fillStyle = '#ef4444';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER - CLICK / TAP TO RESTART', canvas.width / 2, 35);
                }

                // Draw Dino
                drawDino(dino.x, dino.y);

                // Draw Score
                ctx.font = '700 12px Rajdhani, sans-serif';
                ctx.fillStyle = isDark ? '#38bdf8' : '#0284c7';
                ctx.textAlign = 'right';
                ctx.fillText(`HI DINO RUNNER: ${Math.floor(gameScore / 5)}`, canvas.width - 20, 20);

                requestAnimationFrame(animate);
            }

            animate();
        }

        // ANIMATED BACKGROUND PARTICLES
        function initTradingBackground() {
            const canvas = document.getElementById('trading-bg');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                fitTitleCanvasScale();
            }
            resize();
            window.addEventListener('resize', resize);

            class DepthParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3 + 1.5;
                    this.speedX = (Math.random() - 0.5) * 1.2;
                    this.speedY = (Math.random() - 0.5) * 1.2;
                    this.isBuy = Math.random() > 0.5;
                    this.color = this.isBuy ? '34, 197, 94' : '239, 68, 68';
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.reset();
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, 0.65)`;
                    ctx.fill();
                }
            }

            const particles = Array.from({ length: 60 }, () => new DepthParticle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('dashboard_theme') || 'dark';
            setTheme(savedTheme);

            if (localStorage.getItem('dashboard_mobile_view') === 'true' || window.innerWidth < 768) {
                isMobileView = false;
                toggleMobileView();
            } else {
                buildMenuFromJSON(navMenuJSON);
            }

            initTradingBackground();
            initTitleWatermarkEngine();
            initDinoRunnerGame();
            fitTitleCanvasScale();
            startSlowRotation();
        });
    </script>
</body>
</html>
