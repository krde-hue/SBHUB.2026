<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root[data-theme="dark"] {
            --bg-color: #0d131a;
            --center-btn-bg: linear-gradient(135deg, #ff416c, #ff4b2b);
            --item-btn-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.95));
            --border-color: rgba(255, 75, 43, 0.55);
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #ff4b2b;
            --glow-color: rgba(255, 65, 108, 0.85);
            --shadow-color: rgba(0, 0, 0, 0.90);
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: linear-gradient(135deg, #ff416c, #ff4b2b);
            --item-btn-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(226, 232, 240, 0.95));
            --border-color: rgba(255, 75, 43, 0.55);
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #ff4b2b;
            --glow-color: rgba(255, 65, 108, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --modal-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
        }

        body {
            background-image: linear-gradient(rgba(13, 19, 26, 0.65), rgba(13, 19, 26, 0.75)), url('https://raw.githubusercontent.com/krde-hue/SBHUB.2026/9c22ed926e11ee62a80805b0599ae4e3c3dc24f6/SB%20background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn, .select-dropdown {
            background: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px var(--shadow-color), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .select-dropdown {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }

        .game-dropdown {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border-color: #f87171;
        }

        .select-dropdown option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--glow-color);
        }

        .bottom-right-brand {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
        }

        .brand-icon-svg {
            width: 55px;
            height: 55px;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-align: center;
            line-height: 1.1;
        }

        .brand-line {
            width: 80%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.4);
            margin: 3px 0 2px 0;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.05em;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .half-arc-menu {
            position: absolute;
            top: 52%; 
            left: 91%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 60;
            user-select: none;
            pointer-events: auto;
        }

        .toggle-btn-half {
            position: absolute;
            left: 50%; 
            top: 50%;
            transform: translate(-50%, -50%);
            width: 115px;
            height: 140px;
            border-radius: 70px 0 0 70px;
            background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 65%, rgba(255, 75, 43, 0) 100%);
            border-left: 2.5px solid rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 26px;
            color: #ffffff;
            font-size: 2.6rem;
            cursor: pointer;
            z-index: 95;
            box-shadow: -12px 0 35px rgba(255, 65, 108, 0.85);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.35s ease;
            pointer-events: auto !important;
        }

        .toggle-btn-half i {
            transition: transform 0.4s ease;
            pointer-events: none;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
        }

        .half-arc-menu.active .toggle-btn-half i {
            transform: rotate(135deg) scale(1.1);
        }

        .category-nodes {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 70;
        }

        .half-arc-menu.active .category-nodes {
            pointer-events: auto;
        }

        .category-node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 68px;
            height: 68px;
            margin-top: -34px;
            margin-left: -34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff !important;
            font-size: 1.6rem;
            opacity: 0;
            transform: translate(0, 0) scale(0);
            pointer-events: none;
            cursor: pointer;
            z-index: 75;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            border: 1.5px solid rgba(56, 189, 248, 0.4);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85));
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            overflow: visible;
        }

        .category-node::before {
            content: '';
            position: absolute;
            top: 3%;
            left: 12%;
            width: 76%;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .half-arc-menu.active .category-node {
            pointer-events: auto;
        }

        .category-node:hover, .category-node.active-node {
            transform: translate(var(--tx), var(--ty)) scale(1.2) !important;
            border-color: #38bdf8;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(2, 132, 199, 0.85));
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.8), 0 10px 25px rgba(0, 0, 0, 0.85);
            z-index: 100 !important;
        }

        .category-node i {
            pointer-events: none;
            color: var(--text-light) !important;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
        }

        .category-node::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 50%;
            top: -46px;
            transform: translateX(-50%) translateY(5px);
            background: rgba(15, 23, 42, 0.95);
            border: 1.5px solid var(--title-cyan);
            color: #ffffff;
            padding: 5px 14px;
            border-radius: 20px;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.4), 0 8px 20px rgba(0,0,0,0.8);
            z-index: 200;
        }

        .category-node:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
        }

        .category-node.active-node::after {
            display: none !important;
        }

        .centered-branch-modal {
            position: fixed;
            top: 50%;
            left: 45%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 28px 36px;
            background: rgba(13, 19, 26, 0.88);
            border: 2px solid var(--border-color);
            border-radius: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.3), 0 20px 50px rgba(0, 0, 0, 0.9);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 85vw;
        }

        .centered-branch-modal.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .modal-category-title {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--title-cyan);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            margin-bottom: 4px;
        }

        .branch-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 16px 20px;
            max-width: 800px;
            width: 100%;
        }

        .branch-item {
            position: relative;
            width: auto;
            min-width: 140px;
            height: 52px;
            padding: 0 26px;
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff !important;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease, background 0.25s ease;
            backdrop-filter: blur(10px);
            overflow: visible;
            flex-shrink: 0;
        }

        .branch-item::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 8%;
            width: 84%;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 20px;
            pointer-events: none;
        }

        .branch-label-text {
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            color: #ffffff !important;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
        }

        .branch-item:hover {
            transform: scale(1.08) translateY(-3px) !important;
            z-index: 250 !important;
        }

        /* SUB-ITEM COLOR GRADIENTS */
        .branch-item[data-color="pink"], .branch-item[data-color="purple"] {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.95) 0%, rgba(190, 24, 93, 0.85) 60%, rgba(13, 19, 26, 0.9) 100%);
            border: 1.5px solid rgba(244, 114, 182, 0.8);
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.65), 0 6px 16px rgba(0, 0, 0, 0.6);
        }
        .branch-item[data-color="pink"]:hover, .branch-item[data-color="purple"]:hover { box-shadow: 0 0 32px rgba(244, 114, 182, 0.95); }

        .branch-item[data-color="cyan"], .branch-item[data-color="blue"] {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.95) 0%, rgba(8, 145, 178, 0.85) 60%, rgba(13, 19, 26, 0.9) 100%);
            border: 1.5px solid rgba(34, 211, 238, 0.8);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.65), 0 6px 16px rgba(0, 0, 0, 0.6);
        }
        .branch-item[data-color="cyan"]:hover, .branch-item[data-color="blue"]:hover { box-shadow: 0 0 32px rgba(34, 211, 238, 0.95); }

        .branch-item[data-color="gold"], .branch-item[data-color="orange"] {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.95) 0%, rgba(217, 119, 6, 0.85) 60%, rgba(13, 19, 26, 0.9) 100%);
            border: 1.5px solid rgba(252, 211, 77, 0.8);
            box-shadow: 0 0 20px rgba(252, 211, 77, 0.65), 0 6px 16px rgba(0, 0, 0, 0.6);
        }
        .branch-item[data-color="gold"]:hover, .branch-item[data-color="orange"]:hover { box-shadow: 0 0 32px rgba(252, 211, 77, 0.95); }

        .branch-item[data-color="green"] {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.95) 0%, rgba(22, 163, 74, 0.85) 60%, rgba(13, 19, 26, 0.9) 100%);
            border: 1.5px solid rgba(134, 239, 172, 0.8);
            box-shadow: 0 0 20px rgba(134, 239, 172, 0.65), 0 6px 16px rgba(0, 0, 0, 0.6);
        }
        .branch-item[data-color="green"]:hover { box-shadow: 0 0 32px rgba(134, 239, 172, 0.95); }

        .branch-item[data-color="red"] {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.95) 0%, rgba(220, 38, 38, 0.85) 60%, rgba(13, 19, 26, 0.9) 100%);
            border: 1.5px solid rgba(252, 165, 165, 0.8);
            box-shadow: 0 0 20px rgba(252, 165, 165, 0.65), 0 6px 16px rgba(0, 0, 0, 0.6);
        }
        .branch-item[data-color="red"]:hover { box-shadow: 0 0 32px rgba(252, 165, 165, 0.95); }

        .branch-item[data-color="royal"], .branch-item[data-color="slate"] {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.95) 0%, rgba(37, 99, 235, 0.85) 60%, rgba(13, 19, 26, 0.9) 100%);
            border: 1.5px solid rgba(125, 211, 252, 0.8);
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.65), 0 6px 16px rgba(0, 0, 0, 0.6);
        }
        .branch-item[data-color="royal"]:hover, .branch-item[data-color="slate"]:hover { box-shadow: 0 0 32px rgba(96, 165, 250, 0.95); }

        /* CUSTOM RIGHT-CLICK CONTEXT MENU STYLING */
        .custom-context-menu {
            position: fixed;
            z-index: 10000;
            background: rgba(15, 23, 42, 0.95);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            min-width: 190px;
        }

        .custom-context-menu.active {
            display: flex;
        }

        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .context-menu-item:hover {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.6);
        }

        /* Auth Modal Styling */
        .login-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .login-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .login-card {
            background: var(--modal-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px var(--shadow-color), 0 0 30px var(--glow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .login-modal-overlay.active .login-card {
            transform: scale(1);
        }

        .login-icon {
            font-size: 2.8rem;
            color: var(--title-cyan);
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px var(--glow-color));
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .login-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .login-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .login-input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Segoe UI', sans-serif;
            outline: none;
            text-align: center;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            border-color: var(--title-cyan);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .toggle-password-icon {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            user-select: none;
        }

        .toggle-password-icon:hover {
            color: var(--title-cyan);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.75);
        }

        .login-error-msg {
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .login-error-msg.show {
            opacity: 1;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* ==========================================================================
           MOBILE MODE ONLY OVERRIDES (Activated strictly via .is-mobile class on <body>)
           ========================================================================== */
        body.is-mobile {
            overflow: hidden !important;
        }

        body.is-mobile .top-controls {
            top: 12px;
            right: 12px;
            left: 12px;
            justify-content: space-between;
            gap: 6px;
        }

        body.is-mobile .control-btn, 
        body.is-mobile .select-dropdown {
            padding: 7px 10px;
            font-size: 0.75rem;
            border-radius: 16px;
            gap: 4px;
        }

        body.is-mobile .bottom-right-brand {
            bottom: 12px;
            right: 12px;
        }

        body.is-mobile .brand-icon-svg {
            width: 38px;
            height: 38px;
        }

        body.is-mobile .brand-title {
            font-size: 0.75rem;
        }

        body.is-mobile .brand-subtitle {
            font-size: 0.68rem;
        }

        /* Mobile Bottom Floating Action Arc Button */
        body.is-mobile .half-arc-menu {
            top: auto;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 220px;
        }

        body.is-mobile .toggle-btn-half {
            left: 50%;
            top: 80%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            padding-left: 0;
            justify-content: center;
            border-left: none;
            border: 2px solid rgba(255, 255, 255, 0.8);
            font-size: 2rem;
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.9);
        }

        body.is-mobile .category-node {
            width: 52px;
            height: 52px;
            margin-top: -26px;
            margin-left: -26px;
            font-size: 1.2rem;
        }

        body.is-mobile .category-node::after {

        /* Mobile Branch Grid Responsive Modal Drawer */
        body.is-mobile .centered-branch-modal {

        body.is-mobile .branch-grid {

        body.is-mobile .branch-item {

            border-radius: 16px;
        }

        body.is-mobile .branch-label-text {
            font-size: 0.88rem;
        }

    <script>

                    { id: "oddschecker", label: "ODDSCHECKER", url: "https://www.oddschecker.com/", color: "pink" },
                    { id: "betfair", label: "BETFAIR", url: "https://www.betfair.com/exchange/plus/", color: "gold" },
                    { id: "bet365", label: "BET365", url: "https://www.bet365.com/", color: "green" },
                    { id: "pinnacle", label: "PINNACLE", url: "https://www.pinnacle.com/", color: "orange" },
                    { id: "ggbet", label: "GGBET", url: "https://gg.bet/", color: "purple" },
                    { id: "unibet", label: "UNIBET", url: "https://www.unibet.com.au/", color: "green" },
                    { id: "sofascore", label: "SOFASCORE", url: "https://www.sofascore.com/", color: "blue" },
                    { id: "marathonbet", label: "MARATHONBET", url: "https://www.marathonbet.com/", color: "royal" },
                    { id: "fonbet", label: "FONBET", url: "https://fonbet.com/", color: "red" }
                ]
            },
            {
                id: "procedures",
                category: "PROCEDURES",
                icon: "fa-solid fa-book",
                items: [
                    { id: "handover", label: "HANDOVER SOP", url: "handover.html", color: "green" },
                    { id: "confluence", label: "CONFLUENCE", url: "https://ibet.atlassian.net/wiki/spaces/Sportsbook/overview", color: "royal" },
                    { id: "workspace", label: "WORKSPACE", url: "workspace.html", color: "slate" }
                ]
            }
        ];

        const toggleBtn = document.getElementById('toggle-btn');
        const halfArcMenu = document.getElementById('half-arc-menu');
        const categoryNodesContainer = document.getElementById('category-nodes');
        const centeredBranchModal = document.getElementById('centered-branch-modal');
        const modalCategoryTitle = document.getElementById('modal-category-title');
        const modalBranchGrid = document.getElementById('modal-branch-grid');
        const customContextMenu = document.getElementById('custom-context-menu');
        const openAllTabsBtn = document.getElementById('open-all-tabs-btn');

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const userProfileSelect = document.getElementById('user-profile-select');

        const loginModal = document.getElementById('login-modal');
        const loginCard = document.getElementById('login-card');
        const passcodeInputs = document.getElementById('passcode-input');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const loginError = document.getElementById('login-error');

        let activeCategoryNode = null;
        let currentOpenGroupId = null;
        let contextTargetGroup = null;

        function checkAuthStatus() {
            return localStorage.getItem('sb_device_authenticated') === 'true';
        }

        function promptLogin(callback) {
            loginModal.classList.add('active');
            passcodeInputs.value = '';
            loginError.classList.remove('show');
            setTimeout(() => passcodeInputs.focus(), 100);

            function handleAuthenticate() {
                const enteredPass = passcodeInputs.value.trim();
                if (enteredPass === 'sportsbook2026') {
                    localStorage.setItem('sb_device_authenticated', 'true');
                    loginModal.classList.remove('active');
                    loginSubmitBtn.removeEventListener('click', handleAuthenticate);
                    passcodeInputs.removeEventListener('keydown', handleKeyDown);
                    if (callback) callback();
                } else {
                    loginError.classList.add('show');
                    loginCard.classList.add('shake');
                    passcodeInputs.value = '';
                    passcodeInputs.focus();
                    setTimeout(() => loginCard.classList.remove('shake'), 400);
                }
            }

            function handleKeyDown(e) {
                if (e.key === 'Enter') handleAuthenticate();
            }

            loginSubmitBtn.onclick = handleAuthenticate;
            passcodeInputs.onkeydown = handleKeyDown;
        }

        if (togglePasswordBtn && passcodeInputs) {
            togglePasswordBtn.addEventListener('click', () => {
                if (passcodeInputs.type === 'password') {
                    passcodeInputs.type = 'text';
                    togglePasswordBtn.classList.remove('fa-eye');
                    togglePasswordBtn.classList.add('fa-eye-slash');
                } else {
                    passcodeInputs.type = 'password';
                    togglePasswordBtn.classList.remove('fa-eye-slash');
                    togglePasswordBtn.classList.add('fa-eye');
                }
            });
        }

        function initActiveUser() {
            let savedUser = localStorage.getItem('sb_active_user');
            if (userProfileSelect && savedUser) {
                userProfileSelect.value = savedUser;
            }
            return savedUser || "GUEST";
        }

        let currentUser = initActiveUser();

        function changeActiveUser(val) {
            if (val === "CUSTOM") {
                let typedName = prompt("Enter your Name:", "KRIZTEL");
                if (typedName) {
                    currentUser = typedName.toUpperCase().trim();
                    localStorage.setItem('sb_active_user', currentUser);
                    let customOpt = document.createElement('option');
                    customOpt.value = currentUser;
                    customOpt.textContent = "👤 USER: " + currentUser;
                    userProfileSelect.appendChild(customOpt);
                    userProfileSelect.value = currentUser;
                }
            } else {
                currentUser = val;
                localStorage.setItem('sb_active_user', currentUser);
            }
        }

        function switchGame(val) {
            const selector = document.getElementById('game-selector');
            if (val === 'mario') {
                window.open('mario.html', '_blank');
            } else if (val === 'flappy') {
                window.open('flappy.html', '_blank');
            } else if (val === 'block') {
                window.open('block.html', '_blank');
            } else if (val === 'solitaire') {
                window.open('solitaire.html', '_blank');
            } else if (val === 'word') {
                window.open('word.html', '_blank');
            }
            if (selector) selector.value = '';
        }

        function buildCategoryWheel(dataset) {
            if (!categoryNodesContainer) return;
            categoryNodesContainer.innerHTML = '';

            const total = dataset.length;
            const mobile = isMobileDevice();

            // Radius and Angles tuned separately for Mobile vs Desktop
            const innerRadius = mobile ? 115 : 275; 
            const startAngle = mobile ? Math.PI * 1.15 : Math.PI * 1.42; 
            const endAngle = mobile ? Math.PI * 1.85 : Math.PI * 0.58;
            const angleStep = (endAngle - startAngle) / (total - 1);

            dataset.forEach((group, index) => {
                const angle = startAngle + (index * angleStep);
                const x = Math.round(innerRadius * Math.cos(angle));
                const y = Math.round(innerRadius * Math.sin(angle));

                const node = document.createElement('div');
                node.className = 'category-node';
                node.setAttribute('data-id', group.id);
                node.setAttribute('data-tooltip', group.category);
                node.setAttribute('data-angle', angle);
                node.style.setProperty('--tx', x + 'px');
                node.style.setProperty('--ty', y + 'px');

                node.innerHTML = `<i class="${group.icon}"></i>`;

                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    if (currentOpenGroupId === group.id) {
                        closeBranchModal();
                    } else {
                        if (activeCategoryNode) activeCategoryNode.classList.remove('active-node');
                        activeCategoryNode = node;
                        activeCategoryNode.classList.add('active-node');
                        currentOpenGroupId = group.id;

                        openCenteredBranchModal(group);
                    }
                });

                node.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    contextTargetGroup = group;
                    showContextMenu(e.clientX, e.clientY);
                });

                categoryNodesContainer.appendChild(node);
            });
        }

        function openCenteredBranchModal(group) {
            modalCategoryTitle.textContent = group.category;
            modalBranchGrid.innerHTML = '';

            group.items.forEach((item) => {
                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'branch-item';
                a.setAttribute('data-id', item.id);
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');

                if (item.color) a.setAttribute('data-color', item.color);

                a.innerHTML = '<span class="branch-label-text">' + item.label + '</span>';
                modalBranchGrid.appendChild(a);
            });

            centeredBranchModal.classList.add('active');
        }

        function closeBranchModal() {
            centeredBranchModal.classList.remove('active');

            if (activeCategoryNode) {
                activeCategoryNode.classList.remove('active-node');
                activeCategoryNode = null;
            }
            currentOpenGroupId = null;
        }

        function showContextMenu(x, y) {
            customContextMenu.style.left = x + 'px';
            customContextMenu.style.top = y + 'px';
            customContextMenu.classList.add('active');
        }

        function hideContextMenu() {
            customContextMenu.classList.remove('active');
        }

        if (openAllTabsBtn) {
            openAllTabsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (contextTargetGroup && contextTargetGroup.items) {
                    let blockedCount = 0;
                    
                    contextTargetGroup.items.forEach((item) => {
                        const link = document.createElement('a');
                        link.href = item.url;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        document.body.appendChild(link);
                        
                        const win = window.open(item.url, '_blank');
                        if (!win || win.closed || typeof win.closed === 'undefined') {
                            blockedCount++;
                        }
                        document.body.removeChild(link);
                    });

                    if (blockedCount > 0) {
                        alert("⚠️ Browser blocked multi-tabs!\n\nPlease click 'Always allow pop-ups' in your browser's top address bar to enable opening all links at once.");
                    }
                }
                hideContextMenu();
            });
        }

        if (centeredBranchModal) {
            centeredBranchModal.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (currentOpenGroupId) {
                    contextTargetGroup = categorisedMenuData.find(g => g.id === currentOpenGroupId);
                    showContextMenu(e.clientX, e.clientY);
                }
            });
        }

        document.addEventListener('click', (e) => {
            hideContextMenu();
            if (currentOpenGroupId && !e.target.closest('#centered-branch-modal') && !e.target.closest('.category-node')) {
                closeBranchModal();
            }
        });

        if (toggleBtn && halfArcMenu) {
            function executeMenuToggle() {
                const isActive = halfArcMenu.classList.toggle('active');
                const nodes = categoryNodesContainer.querySelectorAll('.category-node');

                nodes.forEach((node, index) => {
                    const tx = node.style.getPropertyValue('--tx');
                    const ty = node.style.getPropertyValue('--ty');

                    if (isActive) {
                        setTimeout(() => {
                            node.style.opacity = '1';
                            node.style.transform = 'translate(' + tx + ', ' + ty + ') scale(1)';
                        }, index * 30);
                    } else {
                        node.style.opacity = '0';
                        node.style.transform = 'translate(0, 0) scale(0)';
                    }
                });

                if (!isActive) {
                    closeBranchModal();
                    hideContextMenu();
                }
            }

            function handleToggleMenu(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                if (checkAuthStatus()) {
                    executeMenuToggle();
                } else {
                    promptLogin(() => {
                        executeMenuToggle();
                    });
                }
            }

            toggleBtn.addEventListener('click', handleToggleMenu);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (themeIcon && themeText) {
                if (theme === 'dark') {
                    themeIcon.className = 'fa-solid fa-moon';
                    themeText.textContent = 'Night Mode';
                } else {
                    themeIcon.className = 'fa-solid fa-sun';
                    themeText.textContent = 'Daylight Mode';
                }
            }
            localStorage.setItem('dashboard_theme', theme);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                setTheme(currentTheme === 'dark' ? 'light' : 'dark');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('dashboard_theme') || 'dark';
            setTheme(savedTheme);

            buildCategoryWheel(categorisedMenuData);
        });
    </script>
