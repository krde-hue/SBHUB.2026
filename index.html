<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root[data-theme="dark"] {
            --bg-color: #060b19;
            --center-btn-bg: linear-gradient(145deg, #1e293b, #0f172a);
            --item-btn-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            --border-color: rgba(56, 189, 248, 0.35);
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --title-cyan: #38bdf8;
            --watermark-opacity: 0.25;
            --glow-color: rgba(56, 189, 248, 0.65);
            --shadow-color: rgba(0, 0, 0, 0.85);
            --canvas-opacity: 0.35;
            --modal-bg: rgba(15, 23, 42, 0.92);
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --center-btn-bg: linear-gradient(145deg, #ffffff, #e2e8f0);
            --item-btn-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(226, 232, 240, 0.95));
            --border-color: rgba(2, 132, 199, 0.35);
            --text-dark: #ffffff;
            --text-light: #0f172a;
            --title-cyan: #0284c7;
            --watermark-opacity: 0.20;
            --glow-color: rgba(2, 132, 199, 0.45);
            --shadow-color: rgba(0, 0, 0, 0.2);
            --canvas-opacity: 0.18;
            --modal-bg: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* TRADING CANVAS BACKGROUND */
        #trading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: var(--canvas-opacity);
            pointer-events: none;
        }

        /* TOP RIGHT CONTROLS */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn, .select-dropdown {
            background: var(--item-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px var(--shadow-color), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .select-dropdown {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }

        .game-dropdown {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border-color: #f87171;
        }

        .select-dropdown option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .control-btn:hover {
            border-color: var(--title-cyan);
            color: var(--title-cyan);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--glow-color);
        }

        .mobile-toggle-btn {
            background: linear-gradient(135deg, #a855f7, #9333ea);
            color: #ffffff;
            border-color: #c084fc;
        }

        .mobile-toggle-btn.active {
            background: linear-gradient(135deg, #ec4899, #db2777);
            border-color: #f472b6;
        }

        /* BOTTOM-RIGHT LOGO BRANDING */
        .bottom-right-brand {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .brand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
        }

        .brand-icon-svg {
            width: 55px;
            height: 55px;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            color: #ffffff;
            letter-spacing: 0.08em;
            text-align: center;
            line-height: 1.1;
        }

        .brand-line {
            width: 80%;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.4);
            margin: 3px 0 2px 0;
        }

        .brand-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.05em;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        /* POSITIONED WATERMARK TITLE BELOW MENU CONSOLE */
        .dashboard-header-bg {
            position: absolute;
            top: calc(50% + 280px);
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            user-select: none;
            white-space: nowrap;
            z-index: 2;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: top 0.3s ease;
        }

        .welcome-subtitle-bg {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            color: var(--text-light);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin-bottom: -10px;
            opacity: calc(var(--watermark-opacity) * 0.85);
            transition: font-size 0.3s ease;
            pointer-events: none;
        }

        .title-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #title-text-canvas {
            position: relative;
            display: block;
            z-index: 3;
            pointer-events: none;
            max-width: 95vw;
        }

        /* CIRCULAR NAVIGATION MENU */
        .circular-menu {
            position: relative;
            width: 720px;
            height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }

        /* MOBILE TOUCH PREVIEW BANNER */
        .touch-preview-banner {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 18px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            white-space: nowrap;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 300;
        }

        .touch-preview-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        /* STEADY 3D CENTER BUTTON */
        .toggle-btn {
            position: relative;
            width: 155px;
            height: 155px;
            background: var(--center-btn-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--title-cyan);
            font-size: 3.2rem;
            cursor: pointer;
            z-index: 60;
            box-shadow: 0 15px 35px var(--shadow-color), inset 0 2px 4px rgba(255, 255, 255, 0.3), inset 0 -4px 8px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            pointer-events: auto !important;
            overflow: visible;
            backdrop-filter: blur(12px);
        }

        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 15%;
            width: 70%;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .toggle-btn i {
            transition: transform 0.4s ease, opacity 0.3s ease;
            pointer-events: none;
            position: absolute;
            z-index: 2;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .bull-logo-svg {
            position: absolute;
            width: 110px;
            height: 110px;
            opacity: 0;
            transform: scale(0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 6px 12px rgba(56, 189, 248, 0.6));
        }

        .circular-menu.active .toggle-btn {
            background: linear-gradient(145deg, #0f172a, #0284c7);
            border-color: #38bdf8;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.85), inset 0 2px 6px rgba(255, 255, 255, 0.4);
        }

        .circular-menu.active .toggle-btn i {
            opacity: 0;
            transform: rotate(135deg) scale(0);
        }

        .circular-menu.active .bull-logo-svg {
            opacity: 1;
            transform: scale(1);
        }

        .menu-items {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        .circular-menu.active .menu-items {
            pointer-events: auto;
        }

        /* SLEEK GLASS MUTED BASE BUTTONS */
        .menu-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            margin-top: -50px;
            margin-left: -50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8 !important;
            text-decoration: none;
            font-size: 2.2rem;
            opacity: 0;
            transform: translate(0, 0) scale(0);
            pointer-events: none;
            cursor: pointer;
            z-index: 35;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            overflow: visible;
            -webkit-tap-highlight-color: transparent;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 4%;
            left: 15%;
            width: 70%;
            height: 35%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .circular-menu.active .menu-item {
            pointer-events: auto;
        }

        .menu-item i {
            pointer-events: none;
            transition: transform 0.3s ease, color 0.3s ease, filter 0.3s ease;
            color: #94a3b8;
        }

        .menu-item .letter-icon {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            line-height: 1;
            display: inline-block;
            pointer-events: none;
            transition: transform 0.3s ease, color 0.3s ease;
            color: #94a3b8 !important;
        }

        /* ANCHORED TRANSFORMS ON HOVER - NO FLICKER */
        .circular-menu.active .menu-item:hover, 
        .circular-menu.active .menu-item.touch-active {
            transform: translate(var(--tx), var(--ty)) scale(1.18) !important;
            z-index: 100 !important;
        }

        /* INDIVIDUAL BRAND COLOR HIGHLIGHTS ON HOVER */
        .menu-item[data-id="top-picks"]:hover, .menu-item[data-id="top-picks"].touch-active {
            background: linear-gradient(180deg, #ec4899 0%, #be185d 100%);
            border-color: #f472b6;
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.8), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="duties"]:hover, .menu-item[data-id="duties"].touch-active {
            background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%);
            border-color: #22d3ee;
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="rota"]:hover, .menu-item[data-id="rota"].touch-active {
            background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
            border-color: #818cf8;
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="handover"]:hover, .menu-item[data-id="handover"].touch-active {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            border-color: #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="big-winners"]:hover, .menu-item[data-id="big-winners"].touch-active {
            background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%);
            border-color: #fde047;
            box-shadow: 0 0 30px rgba(253, 224, 71, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="edge-boost"]:hover, .menu-item[data-id="edge-boost"].touch-active {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            border-color: #fcd34d;
            box-shadow: 0 0 30px rgba(252, 211, 77, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="ibet-boost"]:hover, .menu-item[data-id="ibet-boost"].touch-active {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border-color: #7dd3fc;
            box-shadow: 0 0 30px rgba(125, 211, 252, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-color="green"]:hover, .menu-item[data-color="green"].touch-active {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            border-color: #86efac;
            box-shadow: 0 0 30px rgba(134, 239, 172, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-color="red"]:hover, .menu-item[data-color="red"].touch-active {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            border-color: #fca5a5;
            box-shadow: 0 0 30px rgba(252, 165, 165, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-color="orange"]:hover, .menu-item[data-color="orange"].touch-active {
            background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
            border-color: #fdba74;
            box-shadow: 0 0 30px rgba(253, 186, 116, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="confluence"]:hover, .menu-item[data-id="confluence"].touch-active {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            border-color: #60a5fa;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item[data-id="workspace"]:hover, .menu-item[data-id="workspace"].touch-active {
            background: linear-gradient(180deg, #64748b 0%, #334155 100%);
            border-color: #94a3b8;
            box-shadow: 0 0 30px rgba(148, 163, 184, 0.7), 0 12px 25px rgba(0, 0, 0, 0.6);
            color: #ffffff !important;
        }

        .menu-item:hover i, .menu-item.touch-active i,
        .menu-item:hover .letter-icon, .menu-item.touch-active .letter-icon {
            color: #ffffff !important;
            transform: scale(1.15);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        /* HOVER TOOLTIP BADGES */
        .menu-item::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -42px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: #0f172a;
            border: 1.5px solid var(--title-cyan);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            z-index: 200;
        }

        .menu-item:hover::after, .menu-item.touch-active::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* LOGIN AUTH MODAL STYLES */
        .login-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .login-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .login-card {
            background: var(--modal-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px var(--shadow-color), 0 0 30px var(--glow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .login-modal-overlay.active .login-card {
            transform: scale(1);
        }

        .login-icon {
            font-size: 2.8rem;
            color: var(--title-cyan);
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px var(--glow-color));
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .login-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .login-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .login-input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Segoe UI', sans-serif;
            outline: none;
            text-align: center;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            border-color: var(--title-cyan);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .toggle-password-icon {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s ease;
            user-select: none;
        }

        .toggle-password-icon:hover {
            color: var(--title-cyan);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
        }

        .login-error-msg {
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .login-error-msg.show {
            opacity: 1;
        }

        /* Shake Animation for incorrect password */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* MOBILE VIEW CLEANUP MODIFICATIONS */
        body.mobile-view-active .top-controls { 
            top: 15px; 
            right: 15px; 
        }

        /* HIDE UNNECESSARY WIDGETS IN MOBILE VIEW */
        body.mobile-view-active #game-selector,
        body.mobile-view-active #user-profile-select,
        body.mobile-view-active #mobile-toggle,
        body.mobile-view-active .bottom-right-brand {
            display: none !important;
        }

    <script>
        const navMenuJSON = [
            { id: "top-picks", icon: "fa-solid fa-fire", label: "TOP PICKS", url: "boostschedule.html" },
            { id: "duties", icon: "fa-solid fa-list-check", label: "DAILY DUTIES", url: "duties.html" },
            { id: "rota", icon: "fa-solid fa-calendar-days", label: "ROTA 2026", url: "rota.html" },
            { id: "handover", icon: "fa-solid fa-clipboard-list", label: "HANDOVER & SOP", url: "handover.html" },
            { id: "big-winners", icon: "fa-solid fa-trophy", label: "BIG WINNERS", url: "big-winners.html" },
            { id: "edge-boost", icon: "fa-solid fa-bolt", label: "EDGE BOOST", url: "edge_boosts.html" },
            { id: "ibet-boost", icon: "fa-solid fa-chart-line", label: "IBET BOOST", url: "https://docs.google.com/spreadsheets/d/18ZJNs7wJ37-4sAHX5CNMfqQQcmpfy1cIvP19tHI7rY4/edit?gid=784209986#gid=784209986" },
            { id: "green-tracking", letter: "G", label: "GREEN TRACKING", url: "https://docs.google.com/spreadsheets/d/1qruVq-HZCyM0uDgnYSqFhccXKnMkqJ8z/edit?gid=1305147410#gid=1305147410", color: "green" },
            { id: "red-tracking", letter: "R", label: "RED TRACKING", url: "https://docs.google.com/spreadsheets/d/1OcaMz_AOUeRsWIVplbnk2XAna62m3IKa/edit?gid=457800468#gid=457800468", color: "red" },
            { id: "orange-tracking", letter: "O", label: "ORANGE TRACKING", url: "https://docs.google.com/spreadsheets/d/1U-Dmc628kHQabzJGoBeEgRus5PiRhgSd/edit?pli=1&gid=1983372695#gid=1983372695", color: "orange" },
            { id: "green-crm", icon: "fa-solid fa-users", label: "GREEN CRM", url: "https://docs.google.com/spreadsheets/d/11STKO4Xsj0a8iTuUXSCXC-XEE4-7qmF9/edit?pli=1&gid=1701374259#gid=1701374259", color: "green" },
            { id: "red-crm", icon: "fa-solid fa-users-slash", label: "RED CRM", url: "https://docs.google.com/spreadsheets/d/1gPks2FdHyOOTiILvn553miz32WeEtOpx/edit?gid=1701374259#gid=1701374259", color: "red" },
            { id: "confluence", icon: "fa-solid fa-book", label: "CONFLUENCE", url: "https://ibet.atlassian.net/wiki/spaces/Sportsbook/overview" },
            { id: "workspace", icon: "fa-solid fa-laptop-code", label: "WORKSPACE", url: "workspace.html" }
        ];

        const circularMenu = document.getElementById('circular-menu');
        const toggleBtn = document.getElementById('toggle-btn');
        const menuItemsContainer = document.getElementById('menu-items');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const mobileToggleBtn = document.getElementById('mobile-toggle');
        const mobileText = document.getElementById('mobile-text');
        const userProfileSelect = document.getElementById('user-profile-select');
        const touchBanner = document.getElementById('touch-banner');

        // LOGIN AUTH ELEMENTS
        const loginModal = document.getElementById('login-modal');
        const loginCard = document.getElementById('login-card');
        const passcodeInputs = document.getElementById('passcode-input');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const loginError = document.getElementById('login-error');

        let isMobileView = false;
        let activeTouchedItem = null;

        function checkAuthStatus() {
            return localStorage.getItem('sb_device_authenticated') === 'true';
        }

        function promptLogin(callback) {
            loginModal.classList.add('active');
            passcodeInputs.value = '';
            loginError.classList.remove('show');
            setTimeout(() => passcodeInputs.focus(), 100);

            function handleAuthenticate() {
                const enteredPass = passcodeInputs.value.trim();
                if (enteredPass === 'sportsbook2026') {
                    localStorage.setItem('sb_device_authenticated', 'true');
                    loginModal.classList.remove('active');
                    loginSubmitBtn.removeEventListener('click', handleAuthenticate);
                    passcodeInputs.removeEventListener('keydown', handleKeyDown);
                    if (callback) callback();
                } else {
                    loginError.classList.add('show');
                    loginCard.classList.add('shake');
                    passcodeInputs.value = '';
                    passcodeInputs.focus();
                    setTimeout(() => loginCard.classList.remove('shake'), 400);
                }
            }

            function handleKeyDown(e) {
                if (e.key === 'Enter') handleAuthenticate();
            }

            loginSubmitBtn.onclick = handleAuthenticate;
            passcodeInputs.onkeydown = handleKeyDown;
        }

        if (togglePasswordBtn && passcodeInputs) {
            togglePasswordBtn.addEventListener('click', () => {
                if (passcodeInputs.type === 'password') {
                    passcodeInputs.type = 'text';
                    togglePasswordBtn.classList.remove('fa-eye');
                    togglePasswordBtn.classList.add('fa-eye-slash');
                } else {
                    passcodeInputs.type = 'password';
                    togglePasswordBtn.classList.remove('fa-eye-slash');
                    togglePasswordBtn.classList.add('fa-eye');
                }
            });
        }

        function initActiveUser() {
            let savedUser = localStorage.getItem('sb_active_user');
            if (userProfileSelect && savedUser) {
                userProfileSelect.value = savedUser;
            }
            return savedUser || "GUEST";
        }

        let currentUser = initActiveUser();

        function changeActiveUser(val) {
            if (val === "CUSTOM") {
                let typedName = prompt("Enter your Name:", "KRIZTEL");
                if (typedName) {
                    currentUser = typedName.toUpperCase().trim();
                    localStorage.setItem('sb_active_user', currentUser);
                    let customOpt = document.createElement('option');
                    customOpt.value = currentUser;
                    customOpt.textContent = `👤 Player: ${currentUser}`;
                    userProfileSelect.appendChild(customOpt);
                    userProfileSelect.value = currentUser;
                }
            } else {
                currentUser = val;
                localStorage.setItem('sb_active_user', currentUser);
            }
        }

        function switchGame(val) {
            const selector = document.getElementById('game-selector');
            if (val === 'mario') {
                window.open('mario.html', '_blank');
            } else if (val === 'flappy') {
                window.open('flappy.html', '_blank');
            } else if (val === 'block') {
                window.open('block.html', '_blank');
            } else if (val === 'solitaire') {
                window.open('solitaire.html', '_blank');
            } else if (val === 'word') {
                window.open('word.html', '_blank');
            }
            if (selector) selector.value = '';
        }

        function getRadius() {
            return isMobileView ? 135 : 290;
        }

        function buildMenuFromJSON(items) {
            if (!menuItemsContainer) return;
            menuItemsContainer.innerHTML = '';
            const total = items.length;
            const radius = getRadius();

            items.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = Math.round(radius * Math.cos(angle));
                const y = Math.round(radius * Math.sin(angle));

                const a = document.createElement('a');
                a.href = item.url;
                a.className = 'menu-item';
                a.setAttribute('data-id', item.id);
                a.setAttribute('data-tooltip', item.label);
                a.setAttribute('data-index', index);
                if (item.color) a.setAttribute('data-color', item.color);

                if (item.url.startsWith('http://') || item.url.startsWith('https://')) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }

                a.style.setProperty('--tx', `${x}px`);
                a.style.setProperty('--ty', `${y}px`);

                if (item.letter) {
                    a.innerHTML = `<span class="letter-icon">${item.letter}</span>`;
                } else {
                    a.innerHTML = `<i class="${item.icon}"></i>`;
                }
                
                menuItemsContainer.appendChild(a);
            });
        }

        // MOBILE TOUCH/SLIDE HOVER GESTURE ENGINE
        function initMobileTouchGestures() {
            if (!circularMenu) return;

            function processTouchPoint(touchX, touchY) {
                if (!circularMenu.classList.contains('active')) return;

                const items = menuItemsContainer.querySelectorAll('.menu-item');
                let foundItem = null;

                items.forEach((item) => {
                    const rect = item.getBoundingClientRect();
                    if (
                        touchX >= rect.left - 15 &&
                        touchX <= rect.right + 15 &&
                        touchY >= rect.top - 15 &&
                        touchY <= rect.bottom + 15
                    ) {
                        foundItem = item;
                    }
                });

                if (foundItem) {
                    if (activeTouchedItem && activeTouchedItem !== foundItem) {
                        activeTouchedItem.classList.remove('touch-active');
                    }
                    activeTouchedItem = foundItem;
                    activeTouchedItem.classList.add('touch-active');

                    const label = activeTouchedItem.getAttribute('data-tooltip');
                    touchBanner.textContent = `📍 ${label}`;
                    touchBanner.classList.add('show');
                } else if (activeTouchedItem) {
                    activeTouchedItem.classList.remove('touch-active');
                    activeTouchedItem = null;
                    touchBanner.classList.remove('show');
                }
            }

            circularMenu.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    processTouchPoint(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            circularMenu.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    processTouchPoint(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            circularMenu.addEventListener('touchend', (e) => {
                if (activeTouchedItem) {
                    const targetUrl = activeTouchedItem.getAttribute('href');
                    const isExternal = targetUrl.startsWith('http://') || targetUrl.startsWith('https://');

                    setTimeout(() => {
                        if (isExternal) {
                            window.open(targetUrl, '_blank');
                        } else {
                            window.location.href = targetUrl;
                        }
                        if (activeTouchedItem) {
                            activeTouchedItem.classList.remove('touch-active');
                            activeTouchedItem = null;
                        }
                        touchBanner.classList.remove('show');
                    }, 120);
                }
            });
        }

        if (toggleBtn && circularMenu) {
            function executeMenuToggle() {
                const isActive = circularMenu.classList.toggle('active');
                const items = menuItemsContainer.querySelectorAll('.menu-item');

                items.forEach((item, index) => {
                    const tx = item.style.getPropertyValue('--tx');
                    const ty = item.style.getPropertyValue('--ty');
                    if (isActive) {
                        setTimeout(() => {
                            item.style.opacity = '1';
                            item.style.transform = `translate(${tx}, ${ty}) scale(1)`;
                        }, index * 25);
                    } else {
                        item.style.opacity = '0';
                        item.style.transform = 'translate(0, 0) scale(0)';
                    }
                });
            }

            function handleToggleMenu(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                if (checkAuthStatus()) {
                    executeMenuToggle();
                } else {
                    promptLogin(() => {
                        executeMenuToggle();
                    });
                }
            }

            toggleBtn.addEventListener('click', handleToggleMenu);
        }

        function toggleMobileView() {
            isMobileView = !isMobileView;
            if (isMobileView) {
                document.body.classList.add('mobile-view-active');
                mobileText.textContent = 'Mobile View: ON';
                mobileToggleBtn.classList.add('active');
            } else {
                document.body.classList.remove('mobile-view-active');
                mobileText.textContent = 'Mobile View: OFF';
                mobileToggleBtn.classList.remove('active');
            }
            localStorage.setItem('dashboard_mobile_view', isMobileView ? 'true' : 'false');
            buildMenuFromJSON(navMenuJSON);
            fitTitleCanvasScale();
        }

        if (mobileToggleBtn) {
            mobileToggleBtn.addEventListener('click', toggleMobileView);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (themeIcon && themeText) {
                if (theme === 'dark') {
                    themeIcon.className = 'fa-solid fa-moon';
                    themeText.textContent = 'Night Mode';
                } else {
                    themeIcon.className = 'fa-solid fa-sun';
                    themeText.textContent = 'Daylight Mode';
                }
            }
            localStorage.setItem('dashboard_theme', theme);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                setTheme(currentTheme === 'dark' ? 'light' : 'dark');
            });
        }

        function fitTitleCanvasScale() {
            const canvas = document.getElementById('title-text-canvas');
            if (!canvas) return;
            const screenWidth = window.innerWidth;
            if (screenWidth < 1150 || isMobileView) {
                const targetWidth = isMobileView ? Math.min(screenWidth * 0.90, 360) : Math.min(screenWidth * 0.95, 1150);
                const scale = targetWidth / 1150;
                canvas.style.transform = `scale(${scale})`;
            } else {
                canvas.style.transform = `scale(1)`;
            }
        }

        // PERFECT DIRECTIONAL ROTATION PAC-MAN ENGINE (NO BLACK SHADOW, 100% FORWARD FACING)
        function initTitleWatermarkEngine() {
            const canvas = document.getElementById('title-text-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // OFF-SCREEN BUFFER CANVAS FOR MASKING WITHOUT BLACK TRAILS
            const textCanvas = document.createElement('canvas');
            textCanvas.width = canvas.width;
            textCanvas.height = canvas.height;
            const textCtx = textCanvas.getContext('2d');

            const text = "SPORTSBOOK HUB";
            textCtx.font = '900 96px Orbitron, sans-serif';
            const totalWidth = textCtx.measureText(text).width;
            const startX = (canvas.width - totalWidth) / 2;

            let activeBites = [];

            let pacmanX = startX - 40; 
            let pacmanDirection = 1; // 1 = MOVING RIGHT, -1 = MOVING LEFT
            let pacmanSpeed = 0.15; // 3X SLOWER SPEED
            let mouthAngle = 0.2;
            let mouthSpeed = 0.015;

            // SINE WAVE PATH CONSTANTS
            const centerY = canvas.height / 2;
            const waveAmplitude = 32; 
            const waveFrequency = 0.012; 

            function getPacmanY(x) {
                return centerY + Math.sin(x * waveFrequency) * waveAmplitude;
            }

            function render() {
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                const mainColor = isDark ? '#38bdf8' : '#0284c7';

                const currentPacmanY = getPacmanY(pacmanX);

                // 1. RENDER CLEAN BASE TEXT TO OFF-SCREEN CANVAS
                textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);

                textCtx.font = '900 96px Orbitron, sans-serif';
                textCtx.textAlign = 'center';
                textCtx.textBaseline = 'middle';

                textCtx.save();
                textCtx.fillStyle = mainColor;
                textCtx.globalAlpha = isDark ? 0.25 : 0.20;
                textCtx.shadowColor = mainColor;
                textCtx.shadowBlur = isDark ? 20 : 8;

                let currentX = startX;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const charWidth = textCtx.measureText(char).width;
                    const charCenterX = currentX + charWidth / 2;
                    textCtx.fillText(char, charCenterX, centerY);
                    currentX += charWidth;
                }
                textCtx.restore();

                // 2. LOG CIRCULAR CHOMP DAMAGE
                if (pacmanX >= startX - 20 && pacmanX <= startX + totalWidth + 20) {
                    activeBites.push({
                        x: pacmanX,
                        y: currentPacmanY,
                        radius: 16,
                        healTimer: 600
                    });
                }

                // 3. MASK BITE HOLES CLEANLY ON TEXT LAYER ONLY
                textCtx.save();
                textCtx.globalCompositeOperation = 'destination-out';

                for (let j = activeBites.length - 1; j >= 0; j--) {
                    let bite = activeBites[j];
                    
                    if (bite.healTimer > 0) {
                        bite.healTimer--;
                    } else {
                        bite.radius -= 0.04; // SLOW REGENERATION
                    }

                    if (bite.radius <= 0) {
                        activeBites.splice(j, 1);
                    } else {
                        textCtx.beginPath();
                        textCtx.arc(bite.x, bite.y, bite.radius, 0, Math.PI * 2);
                        textCtx.fill();
                    }
                }
                textCtx.restore();

                // 4. CLEAR MAIN DISPLAY CANVAS AND DRAW MASKED TEXT
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(textCanvas, 0, 0);

                // 5. UPDATE PAC-MAN POSITION & PING-PONG DIRECTION
                pacmanX += pacmanSpeed * pacmanDirection;

                const rightLimit = startX + totalWidth + 50;
                const leftLimit = startX - 50;

                if (pacmanX >= rightLimit) {
                    pacmanX = rightLimit;
                    pacmanDirection = -1; // TURN AROUND TO MOVE LEFT
                } else if (pacmanX <= leftLimit) {
                    pacmanX = leftLimit;
                    pacmanDirection = 1; // TURN AROUND TO MOVE RIGHT
                }

                mouthAngle += mouthSpeed;
                if (mouthAngle > 0.42 || mouthAngle < 0.05) mouthSpeed = -mouthSpeed;

                // 6. DRAW PAC-MAN (ROTATED TANGENT TO WAVE & FULLY REVERSED WHEN MOVING LEFT)
                ctx.save();
                ctx.translate(pacmanX, currentPacmanY);

                const deltaX = 1;
                const deltaY = getPacmanY(pacmanX + deltaX) - currentPacmanY;
                let slopeAngle = Math.atan2(deltaY, deltaX);

                if (pacmanDirection === -1) {
                    // FLIP 180 DEGREES SO MOUTH FACES LEFT TOWARDS DIRECTION OF TRAVEL
                    slopeAngle += Math.PI; 
                }

                ctx.rotate(slopeAngle);

                ctx.beginPath();
                ctx.arc(0, 0, 15, mouthAngle * Math.PI, (2 - mouthAngle) * Math.PI);
                ctx.lineTo(0, 0);
                ctx.fillStyle = '#facc15';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();

                requestAnimationFrame(render);
            }

            render();
        }

        function initTradingBackground() {
            const canvas = document.getElementById('trading-bg');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                fitTitleCanvasScale();
            }
            resize();
            window.addEventListener('resize', resize);

            class DepthParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3 + 1.5;
                    this.speedX = (Math.random() - 0.5) * 1.2;
                    this.speedY = (Math.random() - 0.5) * 1.2;
                    this.isBuy = Math.random() > 0.5;
                    this.color = this.isBuy ? '34, 197, 94' : '239, 68, 68';
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                        this.reset();
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, 0.65)`;
                    ctx.fill();
                }
            }

            const particles = Array.from({ length: 60 }, () => new DepthParticle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            animate();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('dashboard_theme') || 'dark';
            setTheme(savedTheme);

            if (localStorage.getItem('dashboard_mobile_view') === 'true' || window.innerWidth < 768) {
                isMobileView = false;
                toggleMobileView();
            } else {
                buildMenuFromJSON(navMenuJSON);
            }

            initTradingBackground();
            initTitleWatermarkEngine();
            initMobileTouchGestures();
            fitTitleCanvasScale();
        });
    </script>
</body>
