        function listenToRealtimeDatabase() {
            db.ref('big_winners_data').on('value', (snapshot) => {
                const liveData = snapshot.val();
                if (liveData && Array.isArray(liveData) && liveData.length > 50) {
                    playersData = liveData;
                } else {
                    playersData = generate747Players();
                    saveToDatabase();
                }
                document.getElementById('user-count').textContent = playersData.length;
                renderTable();
            });
        }

        function saveToDatabase() {
            const statusDot = document.querySelector('.status-dot');
            const statusText = document.getElementById('save-status');
            
            statusText.textContent = "Syncing...";
            statusDot.style.backgroundColor = "#eab308";

            db.ref('big_winners_data').set(playersData).then(() => {
                statusText.textContent = "✓ Live Synced";
                statusDot.style.backgroundColor = "#22c55e";
            });
        }

        function changeHistoricalDate(dateVal) {
            selectedHistoricalDate = dateVal;
            renderTable();
        }

        function setBrandFilter(brand) {
            selectedBrandFilter = brand.toUpperCase();
            document.querySelectorAll('.brand-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toUpperCase() === selectedBrandFilter || (selectedBrandFilter === 'ALL' && btn.innerText === 'VIEW ALL'));
            });
            filterPlayers();
        }

        function calculatePlayerTotals(player) {
            let total = 0;
            let fourteenDay = 0;
            const now = new Date("2026-08-28");
            const fourteenDaysAgo = new Date(now);
            fourteenDaysAgo.setDate(now.getDate() - 14);

            if (player.records) {
                player.records.forEach(rec => {
                    if (selectedHistoricalDate !== 'ALL' && rec.date !== selectedHistoricalDate) return;

                    const val = parseFloat(rec.amount) || 0;
                    total += val;
                    const recDate = new Date(rec.date);
                    if (!isNaN(recDate) && recDate >= fourteenDaysAgo) {
                        fourteenDay += val;
                    }
                });
            }
            return { total, fourteenDay };
        }

        function renderTable() {
            const tbody = document.getElementById('players-tbody');
            tbody.innerHTML = '';

                const totals = calculatePlayerTotals(player);

                const fourteenClass = totals.fourteenDay < 0 ? 'pnl-negative' : 'pnl-positive';

                        <input type="text" class="cell-input" style="font-weight:600;" value="${player.id}" onchange="updatePlayerField(${pIndex}, 'id', this.value)">
                    </td>
                    <td>

                    </td>
                    <td>
                        <input type="text" class="cell-input" placeholder="Add Risk Notes & Recommendation..." value="${player.notes || ''}" onchange="updatePlayerField(${pIndex}, 'notes', this.value)">
                    </td>
                    <td><div class="${totalClass}">${totalFormatted}</div></td>
                    <td><div class="${fourteenClass}">${fourteenFormatted}</div></td>
                    <td>
                        <select class="select-input" onchange="updatePlayerField(${pIndex}, 'status', this.value)">
                            <option value="Under Review" ${player.status === 'Under Review' ? 'selected' : ''}>Under Review</option>
                            <option value="Cleared" ${player.status === 'Cleared' ? 'selected' : ''}>Cleared</option>
                            <option value="Limited" ${player.status === 'Limited' ? 'selected' : ''}>Limited</option>
                        </select>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn btn-sm btn-danger" title="Delete Player" onclick="deletePlayer(${pIndex})">
                            <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                        </button>
                    </td>
                `;

                const detailsRow = document.createElement('tr');
                detailsRow.className = `details-row ${openRowIndex === pIndex ? 'open' : ''}`;
                detailsRow.id = `details-row-${pIndex}`;

                let recordsHtml = '';
                if (player.records) {
                    player.records.forEach((rec, rIndex) => {
                        if (selectedHistoricalDate !== 'ALL' && rec.date !== selectedHistoricalDate) return;

                        const amt = parseFloat(rec.amount) || 0;
                        const badgeClass = amt < 0 ? 'badge-loss' : 'badge-win';

                        recordsHtml += `

                                </td>
                                <td style="width: 160px;">
                                    <input type="number" step="0.01" class="cell-input" value="${rec.amount}" onchange="updateRecord(${pIndex}, ${rIndex}, 'amount', this.value)">
                                </td>

                                            <th style="text-align: center;">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${recordsHtml.length > 0 ? recordsHtml : '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 1rem;">No entries for selected date filter.</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(row);
                tbody.appendChild(detailsRow);
            });

            lucide.createIcons();
            filterPlayers();

        function toggleRow(index) {
            openRowIndex = (openRowIndex === index) ? null : index;
            renderTable();
        }

        function updatePlayerField(pIndex, field, value) {
            saveStateToUndo();
            playersData[pIndex][field] = value;
            saveToDatabase();
        }

        function deletePlayer(pIndex) {
            if (confirm(`Delete player ID ${playersData[pIndex].id}?`)) {
                saveStateToUndo();
                playersData.splice(pIndex, 1);
                openRowIndex = null;
                document.getElementById('user-count').textContent = playersData.length;
                saveToDatabase();
                renderTable();
            }
        }

        function updateRecord(pIndex, rIndex, field, value) {
            saveStateToUndo();
            playersData[pIndex].records[rIndex][field] = value;
            saveToDatabase();
        }

        function addRecord(pIndex) {
            saveStateToUndo();
            const today = new Date().toISOString().split('T')[0];
            if (!playersData[pIndex].records) playersData[pIndex].records = [];
            playersData[pIndex].records.push({ date: today, amount: 0.00, notes: "" });
            saveToDatabase();
            renderTable();
        }

        function deleteRecord(pIndex, rIndex) {
            saveStateToUndo();
            playersData[pIndex].records.splice(rIndex, 1);
            saveToDatabase();
            renderTable();
        }

        function addNewPlayer() {
            saveStateToUndo();
            playersData.unshift({
                id: "NEW_" + Math.floor(100000 + Math.random() * 900000),
                email: "new.player@domain.com",
                link: "https://betbook.center/qbet/players/",
                brand: "qbet",
                ccf: "1.00",
                notes: "New account under monitoring",
                status: "Under Review",
                records: []
            });
            openRowIndex = 0;
            document.getElementById('user-count').textContent = playersData.length;
            saveToDatabase();
            renderTable();
        }

        function filterPlayers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            playersData.forEach((player, pIndex) => {
                const masterRow = document.getElementById(`player-row-${pIndex}`);
                const detailsRow = document.getElementById(`details-row-${pIndex}`);
                
                const playerBrand = (player.brand || '').toUpperCase();
                const matchesBrand = (selectedBrandFilter === 'ALL') || (playerBrand === selectedBrandFilter);
                
                const matchesSearch = player.id.toLowerCase().includes(query) || 
                                     player.email.toLowerCase().includes(query) ||
                                     playerBrand.toLowerCase().includes(query) ||
                                     (player.notes && player.notes.toLowerCase().includes(query));

                const isVisible = matchesBrand && matchesSearch;

                if (masterRow) masterRow.style.display = isVisible ? '' : 'none';
                if (detailsRow) detailsRow.style.display = (isVisible && openRowIndex === pIndex) ? 'table-row' : 'none';
            });
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'dark') {
                themeIcon.setAttribute('data-lucide', 'moon');
                themeText.textContent = 'Dark Mode';
            } else {
                themeIcon.setAttribute('data-lucide', 'sun');
                themeText.textContent = 'Light Mode';
            }
            lucide.createIcons();
            localStorage.setItem('sportsbook_theme_747', theme);
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playersData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Sportsbook_Big_Winners_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        // KEYBOARD SHORTCUTS FOR UNDO / REDO (Ctrl+Z / Ctrl+Y)
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                redo();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('sportsbook_theme_747') || 'dark';
            setTheme(savedTheme);
            listenToRealtimeDatabase();
        });
    </script>
