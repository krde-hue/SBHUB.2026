<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportsbook Operations Hub - Big Winners</title>
    
    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Lucide Icons -->

    <style>
        :root[data-theme="dark"] {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-sidebar: #172033;
            --bg-card: #334155;
            --bg-expanded: #162032;
            --bg-subtable: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --border-light: #475569;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-text: #4ade80;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-text: #f87171;
            --input-bg: #0f172a;

            --row-pos-bg: rgba(34, 197, 94, 0.08);
            --row-neg-bg: rgba(239, 68, 68, 0.08);
            --row-pos-hover: rgba(34, 197, 94, 0.16);
            --row-neg-hover: rgba(239, 68, 68, 0.16);
        }

        :root[data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-sidebar: #f1f5f9;
            --bg-card: #e2e8f0;
            --bg-expanded: #f8fafc;
            --bg-subtable: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-light: #94a3b8;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-text: #15803d;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-text: #b91c1c;

            --row-neg-bg: #fef2f2;

            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            overflow-x: hidden;
            overflow-y: auto;

        .sidebar.collapsed {

        .sidebar-header {

            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.75rem;

            gap: 0.6rem;

            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;

        .user-avatar {

            height: 34px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            flex-shrink: 0;

        .user-info {
            display: flex;
            flex-direction: column;

            letter-spacing: 0.05em;

        .sidebar-group {

            gap: 0.3rem;

            color: var(--text-main);
            vertical-align: middle;

        .player-row.row-neg { background-color: var(--row-neg-bg); }

            background-color: var(--bg-expanded) !important;

            align-items: center;
            justify-content: center;
            margin-right: 0.3rem;

            transform: rotate(90deg);

        .select-input, .cell-input {

            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: inherit;
            font-weight: 500;
            width: 100%;

        .cell-input:focus, .select-input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .link-cell {
            display: flex;
            align-items: center;
            gap: 0.3rem;

        .link-btn {
            color: var(--accent-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.2rem;
            border-radius: 0.25rem;
        }

        .link-btn:hover {
            background-color: var(--bg-card);

        .pnl-positive {
            background-color: var(--success-bg);
            color: var(--success-text);
            font-weight: 700;
            text-align: center;
            border-radius: 0.25rem;

        .pnl-negative {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            font-weight: 700;
            text-align: center;
            border-radius: 0.25rem;
            padding: 0.2rem 0.4rem;
        }

        .details-row {
            display: none;
            background-color: var(--bg-expanded);
        }

        .details-row.open {
            display: table-row;
        }

        .details-container {
            padding: 0.75rem 1rem;
            border-bottom: 2px solid var(--accent-color);
        }

        .subtable-card {
            background: var(--bg-subtable);
            border: 1px solid var(--border-light);
            border-radius: 0.5rem;
            padding: 0.75rem;
        }

        .subtable-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .subtable-header h4 {
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--accent-color);
        }

        .subtable {
            width: 100%;
            margin-top: 0.4rem;
        }

        .subtable th {
            background: var(--bg-surface);
            font-size: 0.75rem;
            padding: 0.4rem;
            position: static;
        }

        .subtable td {
            padding: 0.3rem 0.4rem;
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-weight: 700;
        }
        .badge-win { background: var(--success-bg); color: var(--success-text); }
        .badge-loss { background: var(--danger-bg); color: var(--danger-text); }

</head>
<body>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaEclzLI284lWCFk-vXbLSXa_bEZsXbOg",
            authDomain: "test-daily-task--sb.firebaseapp.com",
            databaseURL: "https://test-daily-task--sb-default-rtdb.firebaseio.com",
            projectId: "test-daily-task--sb",
            storageBucket: "test-daily-task--sb.firebasestorage.app",
            messagingSenderId: "928476661919",
            appId: "1:928476661919:web:c6d531190824c6ed7c7aaa"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playersData = [];
        let openRowIndex = null;
        const availableBrands = ["qbet", "ibet", "30bet", "55bet", "7abet", "bvbet", "pubs"];

        // UNDO / REDO HISTORY BUFFER
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 10;
        let isUndoRedoAction = false;

        function saveStateToUndo() {
            if (isUndoRedoAction) return;
            const currentState = JSON.stringify(playersData);
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] === currentState) return;

            undoStack.push(currentState);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
        }

        function undo() {
            if (undoStack.length === 0) return alert("No earlier changes to undo.");
            isUndoRedoAction = true;
            redoStack.push(JSON.stringify(playersData));
            playersData = JSON.parse(undoStack.pop());
            saveToDatabase();
            renderTable();
            isUndoRedoAction = false;
        }

        function redo() {
            if (redoStack.length === 0) return alert("No changes to redo.");
            isUndoRedoAction = true;
            undoStack.push(JSON.stringify(playersData));
            playersData = JSON.parse(redoStack.pop());
            saveToDatabase();
            renderTable();
            isUndoRedoAction = false;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function changeFontSize(val) {
            document.body.style.fontSize = val + 'px';
            document.getElementById('font-size-val').textContent = val + 'px';
        }

        function generate747Players() {
            let defaults = [
                { id: "51705", email: "rozhi141@gmail.com", link: "https://mga-betbook.center/ibet/players/1840769", brand: "ibet", ccf: "0.20", notes: "Monitor Bets", status: "Under Review", records: [{ date: "2026-08-26", amount: -1394.47, notes: "Accumulator Win" }, { date: "2026-08-27", amount: -7353.22, notes: "In-Play Tennis Win" }, { date: "2026-08-28", amount: -24927.52, notes: "Football Win" }] },
                { id: "55415", email: "mackanlindholm44@gmail.com", link: "https://mga-betbook.center/ibet/players/926979", brand: "ibet", ccf: "3.00", notes: "Monitor Bets", status: "Under Review", records: [{ date: "2026-08-27", amount: -1827.77, notes: "Basketball Win" }, { date: "2026-08-28", amount: -2674.30, notes: "In-play Win" }] },
                { id: "73102", email: "abanob_123@hotmail.se", link: "https://mga-betbook.center/ibet/players/2670708", brand: "ibet", ccf: "1.00", notes: "Monitor Bets", status: "Under Review", records: [{ date: "2026-08-26", amount: -3584.56, notes: "Tennis Win" }, { date: "2026-08-27", amount: -3394.56, notes: "Football Win" }, { date: "2026-08-28", amount: -139.26, notes: "Player Win" }] },
                { id: "128099", email: "tbruinse@hotmail.com", link: "https://betbook.center/qbet/players/8160946", brand: "qbet", ccf: "10.00", notes: "VIP Client - Escalated to Risk Manager", status: "Cleared", records: [{ date: "2026-08-27", amount: 14493.77, notes: "Single Bet Loss" }, { date: "2026-08-28", amount: 19681.17, notes: "High Stake Loss" }] },
                { id: "136665", email: "destidakwerken@hotmail.com", link: "https://betbook.center/qbet/players/976625", brand: "qbet", ccf: "0.25", notes: "Monitor Bets", status: "Under Review", records: [{ date: "2026-08-27", amount: -23464.32, notes: "Multiple Bets Win" }, { date: "2026-08-28", amount: -20476.61, notes: "Football Acca Win" }] }
            ];

            const ccfDistribution = ["0.10", "0.20", "0.25", "0.50", "1.00", "2.00", "3.00", "5.00", "6.00", "10.00"];

            for (let i = 6; i <= 747; i++) {
                const chosenBrand = availableBrands[i % availableBrands.length];
                const chosenCcf = ccfDistribution[i % ccfDistribution.length];
                const pId = (2000000 + i * 37).toString();
                defaults.push({
                    id: pId,
                    email: `user_${pId}@sportsbook.com`,
                    link: `https://betbook.center/${chosenBrand}/players/${pId}`,
                    brand: chosenBrand,
                    ccf: chosenCcf,
                    notes: "Standard Monitoring Record",
                    status: "Under Review",
                    records: [
                        { date: "2026-08-27", amount: (i % 2 === 0 ? -1 : 1) * (250 + (i * 12.5)), notes: "Daily Betting Activity Log" }
                    ]

            return defaults;
        }

        function listenToRealtimeDatabase() {
            db.ref('big_winners_data').on('value', (snapshot) => {
                const liveData = snapshot.val();
                if (liveData && Array.isArray(liveData) && liveData.length > 50) {
                    playersData = liveData;
                } else {
                    playersData = generate747Players();
                    saveToDatabase();
                }
                renderTable();
            });
        }

        function saveToDatabase() {
            const statusDot = document.querySelector('.status-dot');
            const statusText = document.getElementById('save-status');
            statusText.textContent = "Syncing...";
            statusDot.style.backgroundColor = "#eab308";

            db.ref('big_winners_data').set(playersData).then(() => {
                statusText.textContent = "✓ Live Synced";
                statusDot.style.backgroundColor = "#22c55e";
            });
        }

        function calculatePlayerTotals(player) {
            let total = 0;
            let fourteenDay = 0;
            const now = new Date("2026-08-28");
            const fourteenDaysAgo = new Date(now);
            fourteenDaysAgo.setDate(now.getDate() - 14);

            const filterDateVal = document.getElementById('date-filter').value;
            const filterYearVal = document.getElementById('year-filter').value;

            if (player.records) {
                player.records.forEach(rec => {
                    if (filterDateVal && rec.date !== filterDateVal) return;
                    if (filterYearVal !== 'ALL' && rec.date && !rec.date.startsWith(filterYearVal)) return;

                    const val = parseFloat(rec.amount) || 0;
                    total += val;
                    const recDate = new Date(rec.date);
                    if (!isNaN(recDate) && recDate >= fourteenDaysAgo) {
                        fourteenDay += val;
                    }
                });
            }
            return { total, fourteenDay };
        }

        function renderTable() {
            const tbody = document.getElementById('players-tbody');
            tbody.innerHTML = '';

            playersData.forEach((player, pIndex) => {
                const totals = calculatePlayerTotals(player);
                const totalFormatted = (totals.total > 0 ? '+' : '') + totals.total.toFixed(2);
                const totalClass = totals.total < 0 ? 'pnl-negative' : 'pnl-positive';

                const fourteenFormatted = (totals.fourteenDay > 0 ? '+' : '') + totals.fourteenDay.toFixed(2);
                const fourteenClass = totals.fourteenDay < 0 ? 'pnl-negative' : 'pnl-positive';

                const rowHighlightClass = totals.total < 0 ? 'row-neg' : 'row-pos';

                let brandOptions = availableBrands.map(b => 
                    `<option value="${b}" ${(player.brand || 'qbet').toLowerCase() === b ? 'selected' : ''}>${b.toUpperCase()}</option>`
                ).join('');

                const row = document.createElement('tr');
                row.className = `player-row ${rowHighlightClass} ${openRowIndex === pIndex ? 'expanded' : ''}`;
                row.id = `player-row-${pIndex}`;
                row.onclick = (e) => {
                    if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON', 'A', 'I'].includes(e.target.tagName)) return;
                    toggleRow(pIndex);
                };

                row.innerHTML = `
                    <td>
                        <span class="toggle-icon"><i data-lucide="chevron-right" style="width: 14px; height: 14px;"></i></span>
                        <input type="text" class="cell-input" style="font-weight:600;" value="${player.id}" onchange="updatePlayerField(${pIndex}, 'id', this.value)">
                    </td>
                    <td><input type="text" class="cell-input" value="${player.email}" onchange="updatePlayerField(${pIndex}, 'email', this.value)"></td>
                    <td>
                        <div class="link-cell">
                            <input type="text" class="cell-input" value="${player.link || ''}" onchange="updatePlayerField(${pIndex}, 'link', this.value)">
                            ${player.link ? `<a href="${player.link}" target="_blank" class="link-btn"><i data-lucide="external-link" style="width: 12px; height: 12px;"></i></a>` : ''}
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <select class="select-input" style="font-weight:700; text-align:center;" onchange="updatePlayerField(${pIndex}, 'brand', this.value)">${brandOptions}</select>
                    </td>
                    <td><input type="text" class="cell-input" style="text-align:center; font-weight:600;" value="${player.ccf || '1.00'}" onchange="updatePlayerField(${pIndex}, 'ccf', this.value)"></td>
                    <td><input type="text" class="cell-input" placeholder="Add Risk Notes..." value="${player.notes || ''}" onchange="updatePlayerField(${pIndex}, 'notes', this.value)"></td>
                    <td><div class="${totalClass}">${totalFormatted}</div></td>
                    <td><div class="${fourteenClass}">${fourteenFormatted}</div></td>
                    <td>
                        <select class="select-input" onchange="updatePlayerField(${pIndex}, 'status', this.value)">
                            <option value="Under Review" ${player.status === 'Under Review' ? 'selected' : ''}>Under Review</option>
                            <option value="Cleared" ${player.status === 'Cleared' ? 'selected' : ''}>Cleared</option>
                            <option value="Limited" ${player.status === 'Limited' ? 'selected' : ''}>Limited</option>
                        </select>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn btn-sm btn-danger" onclick="deletePlayer(${pIndex})"><i data-lucide="trash-2" style="width: 12px; height: 12px;"></i></button>
                    </td>
                `;

                const detailsRow = document.createElement('tr');
                detailsRow.className = `details-row ${openRowIndex === pIndex ? 'open' : ''}`;
                detailsRow.id = `details-row-${pIndex}`;

                let recordsHtml = '';
                const filterDateVal = document.getElementById('date-filter').value;
                const filterYearVal = document.getElementById('year-filter').value;

                if (player.records) {
                    player.records.forEach((rec, rIndex) => {
                        if (filterDateVal && rec.date !== filterDateVal) return;
                        if (filterYearVal !== 'ALL' && rec.date && !rec.date.startsWith(filterYearVal)) return;

                        const amt = parseFloat(rec.amount) || 0;
                        const badgeClass = amt < 0 ? 'badge-loss' : 'badge-win';
                        const badgeText = amt < 0 ? 'Player Win' : 'Player Loss';

                        recordsHtml += `
                            <tr>
                                <td style="width: 140px;"><input type="date" class="cell-input" value="${rec.date}" onchange="updateRecord(${pIndex}, ${rIndex}, 'date', this.value)"></td>
                                <td style="width: 150px;"><input type="number" step="0.01" class="cell-input" value="${rec.amount}" onchange="updateRecord(${pIndex}, ${rIndex}, 'amount', this.value)"></td>
                                <td style="width: 100px; text-align: center;"><span class="badge ${badgeClass}">${badgeText}</span></td>
                                <td><input type="text" class="cell-input" placeholder="Add note..." value="${rec.notes || ''}" onchange="updateRecord(${pIndex}, ${rIndex}, 'notes', this.value)"></td>
                                <td style="width: 50px; text-align: center;"><button class="btn btn-sm btn-danger" onclick="deleteRecord(${pIndex}, ${rIndex})"><i data-lucide="trash-2" style="width: 12px; height: 12px;"></i></button></td>
                            </tr>
                        `;
                    });
                }

                detailsRow.innerHTML = `
                    <td colspan="10">
                        <div class="details-container">
                            <div class="subtable-card">
                                <div class="subtable-header">
                                    <h4><i data-lucide="history" style="width: 14px; height: 14px;"></i> Daily Win / Loss Logs (${player.email})</h4>
                                    <button class="btn btn-sm btn-primary" onclick="addRecord(${pIndex})"><i data-lucide="plus" style="width: 12px; height: 12px;"></i> Add Entry</button>
                                </div>
                                <table class="subtable">
                                    <thead><tr><th>Date</th><th>Amount (EUR)</th><th style="text-align: center;">Type</th><th>Notes</th><th style="text-align: center;">Action</th></tr></thead>
                                    <tbody>${recordsHtml.length > 0 ? recordsHtml : '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 0.5rem;">No entries matching current date/year filter.</td></tr>'}</tbody>
                                </table>
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(row);
                tbody.appendChild(detailsRow);
            });

            lucide.createIcons();
            filterPlayers();
        }

        function toggleRow(index) {
            openRowIndex = (openRowIndex === index) ? null : index;
            renderTable();
        }

        function updatePlayerField(pIndex, field, value) {
            saveStateToUndo();
            playersData[pIndex][field] = value;
            saveToDatabase();
        }

        function deletePlayer(pIndex) {
            if (confirm(`Delete player ID ${playersData[pIndex].id}?`)) {
                saveStateToUndo();
                playersData.splice(pIndex, 1);
                openRowIndex = null;
                saveToDatabase();
                renderTable();
            }
        }

        function updateRecord(pIndex, rIndex, field, value) {
            saveStateToUndo();
            playersData[pIndex].records[rIndex][field] = value;
            saveToDatabase();
        }

        function addRecord(pIndex) {
            saveStateToUndo();
            const today = new Date().toISOString().split('T')[0];
            if (!playersData[pIndex].records) playersData[pIndex].records = [];
            playersData[pIndex].records.push({ date: today, amount: 0.00, notes: "" });
            saveToDatabase();
            renderTable();
        }

        function deleteRecord(pIndex, rIndex) {
            saveStateToUndo();
            playersData[pIndex].records.splice(rIndex, 1);
            saveToDatabase();
            renderTable();
        }

        function addNewPlayer() {
            saveStateToUndo();
            playersData.unshift({
                id: "NEW_" + Math.floor(100000 + Math.random() * 900000),
                email: "new.player@domain.com",
                link: "https://betbook.center/qbet/players/",
                brand: "qbet",
                ccf: "1.00",
                notes: "New account under monitoring",
                status: "Under Review",
                records: []
            });
            openRowIndex = 0;
            saveToDatabase();
            renderTable();
        }

        function applyFilters() {
            renderTable();
        }

        function resetFilters() {
            document.getElementById('brand-select-filter').value = 'ALL';
            document.getElementById('date-filter').value = '';
            document.getElementById('year-filter').value = 'ALL';
            renderTable();
        }

        function filterPlayers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const selectedBrand = document.getElementById('brand-select-filter').value.toUpperCase();
            
            let activeCount = 0;

            playersData.forEach((player, pIndex) => {
                const masterRow = document.getElementById(`player-row-${pIndex}`);
                const detailsRow = document.getElementById(`details-row-${pIndex}`);
                
                const playerBrand = (player.brand || '').toUpperCase();
                const matchesBrand = (selectedBrand === 'ALL') || (playerBrand === selectedBrand);
                
                const matchesSearch = player.id.toLowerCase().includes(query) || 
                                     player.email.toLowerCase().includes(query) ||
                                     playerBrand.toLowerCase().includes(query) ||
                                     (player.notes && player.notes.toLowerCase().includes(query));

                const isVisible = matchesBrand && matchesSearch;

                if (isVisible) activeCount++;

                if (masterRow) masterRow.style.display = isVisible ? '' : 'none';
                if (detailsRow) detailsRow.style.display = (isVisible && openRowIndex === pIndex) ? 'table-row' : 'none';
            });

            document.getElementById('active-players-count').textContent = activeCount;
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'dark') {
                themeIcon.setAttribute('data-lucide', 'moon');
                themeText.textContent = 'Dark';
            } else {
                themeIcon.setAttribute('data-lucide', 'sun');
                themeText.textContent = 'Light';
            }
            lucide.createIcons();
            localStorage.setItem('sportsbook_theme_747', theme);
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playersData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Sportsbook_Big_Winners_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.shiftKey ? redo() : undo();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                redo();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('sportsbook_theme_747') || 'dark';
            setTheme(savedTheme);
            listenToRealtimeDatabase();
        });
    </script>
</body>
</html>
