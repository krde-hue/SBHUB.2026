<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros Arcade - Sportsbook Hub</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0b1329;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .header-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .btn-back {
            background-color: #38bdf8;
            color: #0b1329;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            transform: scale(1.05);
            background-color: #7dd3fc;
        }

        .game-card {
            background: #0f172a;
            border: 2px solid #e52521;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(229, 37, 33, 0.35);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 95vw;
            height: 82vh;
            margin-top: 45px;
            position: relative;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: #facc15;
            padding: 0 10px;
        }

        .viewer-pill {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .viewer-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .char-select-btn {
            background: #1e293b;
            border: 1px solid #e52521;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 16px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .char-select-btn.active-luigi {
            border-color: #22c55e;
            color: #22c55e;
        }

        canvas#marioCanvas {
            background: #5c94fc;
            border-radius: 8px;
            border: 2px solid #334155;
            cursor: pointer;
            touch-action: none;
            width: 100%;
            height: calc(100% - 60px);
            display: block;
            image-rendering: pixelated;
        }

        /* REALTIME SCOREBOARD OVERLAY */
        .leaderboard-overlay {
            position: absolute;
            top: 75px;
            right: 35px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid #facc15;
            border-radius: 10px;
            padding: 10px 14px;
            width: 210px;
            z-index: 90;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }

        .lb-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #facc15;
            text-align: center;
            border-bottom: 1px solid rgba(250, 204, 21, 0.3);
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .lb-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            color: #f8fafc;
        }

        .lb-item.highlight {
            color: #38bdf8;
        }

        .controls-hint {
            font-size: 0.88rem;
            color: #94a3b8;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <div style="font-family: 'Orbitron'; font-weight: 900; color: #e52521; font-size: 1.2rem;">SUPER MARIO BROS ARCADE</div>
    </div>

    <div class="game-card">
        <div class="hud-row">
            <div class="viewer-pill">
                <span class="viewer-dot"></span>
                <span id="live-viewers-count">1 LIVE VIEWING</span>
            </div>
            <span id="player-display">PLAYER: --</span>
            <div>
                <button class="char-select-btn" id="char-btn" onclick="toggleCharacter()">CHARACTER: MARIO 🔴</button>
            </div>
            <span id="stage-display">WORLD 1-1</span>
            <span id="score-display">SCORE: 000000</span>
        </div>
        
        <canvas id="marioCanvas" width="1200" height="600"></canvas>

        <!-- REALTIME ARCADE LEADERBOARD -->
        <div class="leaderboard-overlay">
            <div class="lb-title"><i class="fa-solid fa-trophy"></i> TOP SCORES</div>
            <ul class="lb-list" id="leaderboard-ul">
                <li class="lb-item"><span>1. --</span><span>0</span></li>
            </ul>
        </div>

        <div class="controls-hint">
            💡 Controls: [A / D] or [Left / Right Arrow] to Move | [Spacebar / W / Up Arrow] to Jump
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaEclzLI284lWCFk-vXbLSXa_bEZsXbOg",
            authDomain: "test-daily-task--sb.firebaseapp.com",
            databaseURL: "https://test-daily-task--sb-default-rtdb.firebaseio.com",
            projectId: "test-daily-task--sb",
            storageBucket: "test-daily-task--sb.firebasestorage.app",
            messagingSenderId: "928476661919",
            appId: "1:928476661919:web:c6d531190824c6ed7c7aaa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem('sb_active_user') || 'GUEST';
        document.getElementById('player-display').textContent = `PLAYER: ${currentUser}`;

        // 1. ACCURATE REALTIME PRESENCE / LIVE VIEWERS TRACKING
        const myPresenceRef = db.ref(`mario_presence/${currentUser}_${Math.random().toString(36).substr(2, 6)}`);
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set({
                    user: currentUser,
                    joinedAt: firebase.database.ServerValue.TIMESTAMP
                });
            }
        });

        db.ref('mario_presence').on('value', (snap) => {
            const count = snap.numChildren() || 1;
            document.getElementById('live-viewers-count').textContent = `${count} LIVE VIEWING`;
        });

        // 2. REALTIME HIGH SCORE LEADERBOARD SYNC
        const leaderboardUl = document.getElementById('leaderboard-ul');
        db.ref('mario_leaderboard').on('value', (snap) => {
            const data = snap.val() || {};
            let scoresArray = [];
            for (let name in data) {
                scoresArray.push({ name: name, score: data[name] });
            }
            // Sort highest to lowest
            scoresArray.sort((a, b) => b.score - a.score);

            leaderboardUl.innerHTML = '';
            if (scoresArray.length === 0) {
                leaderboardUl.innerHTML = '<li class="lb-item"><span>No games yet</span></li>';
            } else {
                scoresArray.slice(0, 5).forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = `lb-item ${item.name === currentUser ? 'highlight' : ''}`;
                    li.innerHTML = `<span>${idx + 1}. ${item.name}</span><span>${item.score}</span>`;
                    leaderboardUl.appendChild(li);
                });
            }
        });

        function saveScoreToFirebase(pts) {
            if (pts <= 0) return;
            db.ref(`mario_leaderboard/${currentUser}`).transaction(curr => {
                return Math.max(curr || 0, pts);
            });
        }

        const canvas = document.getElementById('marioCanvas');
        const ctx = canvas.getContext('2d');

        let selectedHero = 'mario'; 
        let score = 0;
        let coins = 0;
        let gameOver = false;
        let gameWin = false;
        let cameraX = 0;
        let currentWorld = 1;

        const groundY = 480;
        const levelLength = 3400;

        const hero = {
            x: 100, y: groundY - 32, baseWidth: 28, baseHeight: 32, width: 28, height: 32,
            dx: 0, dy: 0, speed: 4.5, gravity: 0.55, jumpPower: -12.5,
            isGrounded: false, facingLeft: false, isSuper: false,
            invincibleTimer: 0
        };

        const keys = { left: false, right: false };

        let popups = [];
        let mushrooms = [];
        let blocks = [];
        let goombas = [];
        let particles = [];
        
        let isSequenceActive = false;
        let sequenceState = 'none';
        let flagY = groundY - 310;
        let peachX = 3050;
        let peachHug = false;

        function getStageTemplate(worldNum) {
            flagY = groundY - 310;
            isSequenceActive = false;
            sequenceState = 'none';
            peachX = 3050;
            peachHug = false;

            if (worldNum === 1) {
                canvas.style.background = '#5c94fc';
                return {
                    name: 'WORLD 1-1 (EASY)',
                    bgColor: '#5c94fc',
                    blocks: [
                        { x: 0, y: groundY, w: 1200, h: 120, type: 'ground' },
                        { x: 1320, y: groundY, w: 900, h: 120, type: 'ground' },
                        { x: 2360, y: groundY, w: 1100, h: 120, type: 'ground' },
                        { x: 450, y: groundY - 64, w: 64, h: 64, type: 'pipe' },
                        { x: 750, y: groundY - 96, w: 64, h: 96, type: 'pipe' },
                        { x: 1050, y: groundY - 128, w: 64, h: 128, type: 'pipe' },
                        { x: 1500, y: groundY - 128, w: 64, h: 128, type: 'pipe' },
                        { x: 300, y: groundY - 160, w: 32, h: 32, type: 'q-block', content: 'coin', hit: false },
                        { x: 520, y: groundY - 160, w: 32, h: 32, type: 'brick', hit: false },
                        { x: 552, y: groundY - 160, w: 32, h: 32, type: 'q-block', content: 'shroom', hit: false },
                        { x: 584, y: groundY - 160, w: 32, h: 32, type: 'brick', hit: false },
                        { x: 1800, y: groundY - 32, w: 32, h: 32, type: 'stair' },
                        { x: 1832, y: groundY - 64, w: 32, h: 64, type: 'stair' },
                        { x: 1864, y: groundY - 96, w: 32, h: 96, type: 'stair' },
                        { x: 2800, y: groundY - 320, w: 8, h: 320, type: 'flagpole' },
                        { x: 2950, y: groundY - 160, w: 160, h: 160, type: 'castle' }
                    ],
                    goombas: [
                        { x: 500, y: groundY - 30, w: 32, h: 30, dx: -1.2, alive: true },
                        { x: 720, y: groundY - 30, w: 32, h: 30, dx: -1.2, alive: true },
                        { x: 980, y: groundY - 30, w: 32, h: 30, dx: -1.2, alive: true },
                        { x: 1400, y: groundY - 30, w: 32, h: 30, dx: -1.2, alive: true },
                        { x: 1700, y: groundY - 30, w: 32, h: 30, dx: -1.2, alive: true }
                    ]
                };
            } else if (worldNum === 2) {
                canvas.style.background = '#000000';
                return {
                    name: 'WORLD 1-2 (MODERATE UNDERGROUND)',
                    bgColor: '#000000',
                    blocks: [
                        { x: 0, y: groundY, w: 1000, h: 120, type: 'ground' },
                        { x: 1160, y: groundY, w: 900, h: 120, type: 'ground' },
                        { x: 2200, y: groundY, w: 1200, h: 120, type: 'ground' },
                        { x: 0, y: 0, w: 3400, h: 48, type: 'brick', hit: false },
                        { x: 400, y: groundY - 120, w: 160, h: 32, type: 'brick', hit: false },
                        { x: 464, y: groundY - 120, w: 32, h: 32, type: 'q-block', content: 'shroom', hit: false },
                        { x: 800, y: groundY - 160, w: 192, h: 32, type: 'brick', hit: false },
                        { x: 1600, y: groundY - 96, w: 64, h: 96, type: 'pipe' },
                        { x: 2800, y: groundY - 320, w: 8, h: 320, type: 'flagpole' },
                        { x: 2950, y: groundY - 160, w: 160, h: 160, type: 'castle' }
                    ],
                    goombas: [
                        { x: 700, y: groundY - 30, w: 32, h: 30, dx: -1.5, alive: true },
                        { x: 850, y: groundY - 192, w: 32, h: 30, dx: -1.5, alive: true },
                        { x: 1300, y: groundY - 30, w: 32, h: 30, dx: -1.5, alive: true },
                        { x: 1700, y: groundY - 30, w: 32, h: 30, dx: -1.5, alive: true }
                    ]
                };
            } else if (worldNum === 3) {
                canvas.style.background = '#5c94fc';
                return {
                    name: 'WORLD 1-3 (HARD TREETOP)',
                    bgColor: '#5c94fc',
                    blocks: [
                        { x: 0, y: groundY, w: 500, h: 120, type: 'ground' },
                        { x: 650, y: groundY - 40, w: 180, h: 32, type: 'brick', hit: false },
                        { x: 950, y: groundY - 100, w: 160, h: 32, type: 'brick', hit: false },
                        { x: 1000, y: groundY - 100, w: 32, h: 32, type: 'q-block', content: 'shroom', hit: false },
                        { x: 1250, y: groundY - 60, w: 220, h: 32, type: 'brick', hit: false },
                        { x: 1600, y: groundY, w: 1800, h: 120, type: 'ground' },
                        { x: 2800, y: groundY - 320, w: 8, h: 320, type: 'flagpole' },
                        { x: 2950, y: groundY - 160, w: 160, h: 160, type: 'castle' }
                    ],
                    goombas: [
                        { x: 700, y: groundY - 72, w: 32, h: 30, dx: -1.8, alive: true },
                        { x: 1000, y: groundY - 132, w: 32, h: 30, dx: -1.8, alive: true },
                        { x: 1300, y: groundY - 92, w: 32, h: 30, dx: -1.8, alive: true },
                        { x: 1800, y: groundY - 30, w: 32, h: 30, dx: -1.8, alive: true }
                    ]
                };
            } else {
                canvas.style.background = '#000000';
                return {
                    name: 'WORLD 1-4 (EXPERT LAVA CASTLE)',
                    bgColor: '#000000',
                    blocks: [
                        { x: 0, y: groundY, w: 800, h: 120, type: 'ground' },
                        { x: 980, y: groundY, w: 700, h: 120, type: 'ground' },
                        { x: 1840, y: groundY, w: 1600, h: 120, type: 'ground' },
                        { x: 0, y: 0, w: 3400, h: 48, type: 'brick', hit: false },
                        { x: 450, y: groundY - 120, w: 160, h: 32, type: 'brick', hit: false },
                        { x: 2800, y: groundY - 320, w: 8, h: 320, type: 'flagpole' },
                        { x: 2950, y: groundY - 160, w: 200, h: 160, type: 'castle' }
                    ],
                    goombas: [
                        { x: 600, y: groundY - 30, w: 32, h: 30, dx: -2.0, alive: true },
                        { x: 1100, y: groundY - 30, w: 32, h: 30, dx: -2.0, alive: true },
                        { x: 1500, y: groundY - 30, w: 32, h: 30, dx: -2.0, alive: true },
                        { x: 2000, y: groundY - 30, w: 32, h: 30, dx: -2.0, alive: true }
                    ]
                };
            }
        }

        function loadWorld(worldNum) {
            const template = getStageTemplate(worldNum);
            blocks = JSON.parse(JSON.stringify(template.blocks));
            goombas = JSON.parse(JSON.stringify(template.goombas));
            
            hero.x = 100;
            hero.y = groundY - 32;
            hero.dx = 0;
            hero.dy = 0;
            hero.isGrounded = false;
            hero.invincibleTimer = 0;
            cameraX = 0;
            gameOver = false;
            gameWin = false;
            popups = [];
            mushrooms = [];
            particles = [];

            document.getElementById('stage-display').textContent = template.name;
        }

        function toggleCharacter() {
            selectedHero = selectedHero === 'mario' ? 'luigi' : 'mario';
            const btn = document.getElementById('char-btn');
            if (selectedHero === 'mario') {
                btn.textContent = 'CHARACTER: MARIO 🔴';
                btn.classList.remove('active-luigi');
            } else {
                btn.textContent = 'CHARACTER: LUIGI 🟢';
                btn.classList.add('active-luigi');
            }
        }

        function triggerJump() {
            if (gameOver) {
                restartGame();
                return;
            }
            if (gameWin && !isSequenceActive) {
                if (currentWorld < 4) {
                    currentWorld++;
                } else {
                    currentWorld = 1;
                }
                loadWorld(currentWorld);
                return;
            }
            if (hero.isGrounded && !isSequenceActive) {
                hero.dy = hero.jumpPower;
                hero.isGrounded = false;
            }
        }

        function restartGame() {
            score = 0; coins = 0; currentWorld = 1;
            hero.isSuper = false; hero.width = hero.baseWidth; hero.height = hero.baseHeight;
            loadWorld(currentWorld);
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score-display').textContent = `SCORE: ${String(score).padStart(6, '0')}`;
        }

        window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { triggerJump(); }
            if (['ArrowLeft', 'KeyA'].includes(e.code)) { keys.left = true; hero.facingLeft = true; }
            if (['ArrowRight', 'KeyD'].includes(e.code)) { keys.right = true; hero.facingLeft = false; }
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
            if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
        });

        function spawnPopup(text, x, y) {
            popups.push({ text: text, x: x, y: y, opacity: 1.0, dy: -1.5 });
        }

        function shatterBrick(x, y) {
            for (let i = 0; i < 4; i++) {
                particles.push({
                    x: x + 16, y: y + 16,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 1) * 6,
                    size: 8, opacity: 1.0
                });
            }
        }

        function drawHero(x, y) {
            if (hero.invincibleTimer > 0 && Math.floor(hero.invincibleTimer / 4) % 2 === 0) {
                return;
            }

            ctx.save();
            ctx.translate(x + (hero.facingLeft ? hero.width : 0), y);
            if (hero.facingLeft) ctx.scale(-1, 1);

            const scale = hero.isSuper ? 1.4 : 1.0;
            ctx.scale(scale, scale);

            const hatColor = selectedHero === 'mario' ? '#d82800' : '#00a800';
            const shirtColor = '#fc9838';
            const p = 2;

            ctx.fillStyle = hatColor;
            ctx.fillRect(5 * p, 0, 8 * p, 2 * p);
            ctx.fillRect(4 * p, 2 * p, 11 * p, 2 * p);

            ctx.fillStyle = '#887000';
            ctx.fillRect(3 * p, 3 * p, 3 * p, 3 * p);
            ctx.fillRect(2 * p, 4 * p, 2 * p, 3 * p);
            ctx.fillRect(8 * p, 5 * p, 4 * p, 2 * p);

            ctx.fillStyle = '#fc9838';
            ctx.fillRect(5 * p, 3 * p, 6 * p, 4 * p);
            ctx.fillRect(11 * p, 4 * p, 2 * p, 2 * p);

            ctx.fillStyle = shirtColor;
            ctx.fillRect(3 * p, 7 * p, 8 * p, 3 * p);
            ctx.fillRect(2 * p, 8 * p, 10 * p, 2 * p);

            ctx.fillStyle = hatColor;
            ctx.fillRect(4 * p, 9 * p, 6 * p, 5 * p);
            ctx.fillRect(3 * p, 10 * p, 8 * p, 2 * p);

            ctx.fillStyle = '#887000';
            ctx.fillRect(2 * p, 14 * p, 4 * p, 2 * p);
            ctx.fillRect(8 * p, 14 * p, 4 * p, 2 * p);

            ctx.restore();
        }

        function drawPrincessPeach(x, y) {
            const px = x - cameraX;
            ctx.fillStyle = '#ec4899';
            ctx.fillRect(px, y, 28, 36);
            ctx.fillStyle = '#facc15';
            ctx.fillRect(px + 4, y - 10, 20, 10);
            ctx.fillStyle = '#fc9838';
            ctx.fillRect(px + 6, y, 16, 12);

            if (peachHug) {
                ctx.fillStyle = '#ef4444';
                ctx.font = '20px sans-serif';
                ctx.fillText('❤️', px + 4, y - 18);
            }
        }

        function drawNESGround(px, py, width, height) {
            ctx.fillStyle = '#e45c10';
            ctx.fillRect(px, py, width, height);

            ctx.fillStyle = '#000000';
            for (let bx = px; bx < px + width; bx += 32) {
                ctx.fillRect(bx, py, 32, 2);
                ctx.fillRect(bx, py + 16, 32, 2);
                ctx.fillRect(bx, py + 32, 32, 2);
                ctx.fillRect(bx + 30, py, 2, height);
                ctx.fillRect(bx + 16, py, 2, 16);
                ctx.fillRect(bx + 8, py + 16, 2, 16);
            }

            ctx.fillStyle = '#fce0a8';
            for (let bx = px; bx < px + width; bx += 32) {
                ctx.fillRect(bx + 2, py + 2, 14, 2);
                ctx.fillRect(bx + 18, py + 2, 12, 2);
                ctx.fillRect(bx + 2, py + 18, 6, 2);
                ctx.fillRect(bx + 10, py + 18, 18, 2);
            }
        }

        function drawNESQuestionBlock(px, py, isHit) {
            if (isHit) {
                ctx.fillStyle = '#8d5113';
                ctx.fillRect(px, py, 32, 32);
                ctx.fillStyle = '#000000';
                ctx.strokeRect(px, py, 32, 32);
                ctx.fillRect(px + 4, py + 4, 4, 4);
                ctx.fillRect(px + 24, py + 4, 4, 4);
                ctx.fillRect(px + 4, py + 24, 4, 4);
                ctx.fillRect(px + 24, py + 24, 4, 4);
                return;
            }

            ctx.fillStyle = '#fc9838';
            ctx.fillRect(px, py, 32, 32);
            ctx.fillStyle = '#000000';
            ctx.strokeRect(px, py, 32, 32);

            ctx.fillRect(px + 2, py + 2, 3, 3);
            ctx.fillRect(px + 27, py + 2, 3, 3);
            ctx.fillRect(px + 2, py + 27, 3, 3);
            ctx.fillRect(px + 27, py + 27, 3, 3);

            ctx.fillStyle = '#000000';
            ctx.fillRect(px + 10, py + 6, 12, 4);
            ctx.fillRect(px + 18, py + 10, 4, 6);
            ctx.fillRect(px + 14, py + 16, 4, 4);
            ctx.fillRect(px + 14, py + 22, 4, 4);
        }

        function update() {
            if (hero.invincibleTimer > 0) {
                hero.invincibleTimer--;
            }

            if (isSequenceActive) {
                if (sequenceState === 'sliding') {
                    if (hero.y < groundY - hero.height) {
                        hero.y += 3;
                    }
                    if (flagY < groundY - 40) {
                        flagY += 4;
                    } else if (hero.y >= groundY - hero.height) {
                        sequenceState = 'walking';
                    }
                } else if (sequenceState === 'walking') {
                    hero.facingLeft = false;
                    hero.x += 2.5;
                    if (currentWorld === 4) {
                        if (hero.x >= 3000) {
                            sequenceState = 'peach';
                        }
                    } else if (hero.x >= 3000) {
                        isSequenceActive = false;
                        gameWin = true;
                    }
                } else if (sequenceState === 'peach') {
                    if (peachX > hero.x + 35) {
                        peachX -= 1.5;
                    } else {
                        peachHug = true;
                        isSequenceActive = false;
                        gameWin = true;
                    }
                }
                cameraX = Math.max(0, Math.min(hero.x - 200, levelLength - canvas.width));
                return;
            }

            if (!gameOver && !gameWin) {
                hero.dx = 0;
                if (keys.left) hero.dx = -hero.speed;
                if (keys.right) hero.dx = hero.speed;

                hero.x += hero.dx;

                // Solid Wall Collisions
                blocks.forEach(b => {
                    if (b.type === 'flagpole' || b.type === 'castle') return;
                    if (
                        hero.x < b.x + b.w &&
                        hero.x + hero.width > b.x &&
                        hero.y < b.y + b.h &&
                        hero.y + hero.height > b.y
                    ) {
                        if (hero.dx > 0) hero.x = b.x - hero.width;
                        else if (hero.dx < 0) hero.x = b.x + b.w;
                    }
                });

                hero.dy += hero.gravity;
                hero.y += hero.dy;
                hero.isGrounded = false;

                // Vertical Collisions & Flagpole Trigger
                for (let i = blocks.length - 1; i >= 0; i--) {
                    let b = blocks[i];
                    if (
                        hero.x + hero.width > b.x &&
                        hero.x < b.x + b.w &&
                        hero.y + hero.height > b.y &&
                        hero.y + hero.height - hero.dy <= b.y + 12
                    ) {
                        if (b.type !== 'flagpole' && b.type !== 'castle') {
                            hero.y = b.y - hero.height;
                            hero.dy = 0;
                            hero.isGrounded = true;
                        }
                    }

                    if (
                        hero.x + hero.width > b.x &&
                        hero.x < b.x + b.w &&
                        hero.y < b.y + b.h &&
                        hero.y - hero.dy >= b.y + b.h - 10
                    ) {
                        hero.dy = 2;
                        if (b.type === 'q-block' && !b.hit) {
                            b.hit = true;
                            if (b.content === 'coin') {
                                score += 200; coins++;
                                spawnPopup('200', b.x, b.y - 12);
                            } else if (b.content === 'shroom') {
                                score += 1000;
                                spawnPopup('1000', b.x, b.y - 12);
                                mushrooms.push({ x: b.x + 2, y: b.y - 32, w: 28, h: 28, dx: 1.5 });
                            }
                            updateHUD();
                            saveScoreToFirebase(score);
                        } else if (b.type === 'brick' && hero.isSuper) {
                            shatterBrick(b.x, b.y);
                            blocks.splice(i, 1);
                            score += 50;
                            spawnPopup('50', hero.x, hero.y - 10);
                            updateHUD();
                            saveScoreToFirebase(score);
                        }
                    }

                    if (b.type === 'flagpole' && hero.x + hero.width >= b.x && !isSequenceActive) {
                        isSequenceActive = true;
                        sequenceState = 'sliding';
                        hero.x = b.x - 10;
                        hero.dx = 0;
                        hero.dy = 0;
                        score += 5000;
                        updateHUD();
                        saveScoreToFirebase(score);
                    }
                }

                mushrooms.forEach((m, idx) => {
                    m.x += m.dx;
                    if (
                        hero.x + hero.width > m.x &&
                        hero.x < m.x + m.w &&
                        hero.y + hero.height > m.y &&
                        hero.y < m.y + m.h
                    ) {
                        hero.isSuper = true;
                        hero.width = hero.baseWidth * 1.4;
                        hero.height = hero.baseHeight * 1.4;
                        score += 1000;
                        spawnPopup('SUPER!', hero.x, hero.y - 20);
                        mushrooms.splice(idx, 1);
                        updateHUD();
                        saveScoreToFirebase(score);
                    }
                });

                goombas.forEach(g => {
                    if (!g.alive) return;
                    g.x += g.dx;
                    if (g.x < 400 || g.x > 2200) g.dx *= -1;

                    if (
                        hero.x + hero.width > g.x &&
                        hero.x < g.x + g.w &&
                        hero.y + hero.height > g.y &&
                        hero.y + hero.height - hero.dy <= g.y + 12
                    ) {
                        g.alive = false;
                        hero.dy = -8;
                        score += 200;
                        spawnPopup('200', g.x, g.y - 10);
                        updateHUD();
                        saveScoreToFirebase(score);
                    } else if (
                        hero.x + hero.width > g.x &&
                        hero.x < g.x + g.w &&
                        hero.y + hero.height > g.y &&
                        hero.y < g.y + g.h
                    ) {
                        if (hero.invincibleTimer === 0) {
                            if (hero.isSuper) {
                                hero.isSuper = false;
                                hero.width = hero.baseWidth;
                                hero.height = hero.baseHeight;
                                hero.y = groundY - hero.height;
                                hero.invincibleTimer = 60;
                                spawnPopup('DOWN!', hero.x, hero.y - 20);
                            } else {
                                gameOver = true;
                                saveScoreToFirebase(score);
                            }
                        }
                    }
                });

                if (hero.y > canvas.height) {
                    gameOver = true;
                    saveScoreToFirebase(score);
                }

                cameraX = Math.max(0, Math.min(hero.x - 200, levelLength - canvas.width));
            }

            particles.forEach((pt, idx) => {
                pt.x += pt.dx;
                pt.y += pt.dy;
                pt.opacity -= 0.03;
                if (pt.opacity <= 0) particles.splice(idx, 1);
            });

            popups.forEach((p, idx) => {
                p.y += p.dy;
                p.opacity -= 0.02;
                if (p.opacity <= 0) popups.splice(idx, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentWorld === 1 || currentWorld === 3) {
                let hillX = 250 - cameraX;
                ctx.fillStyle = '#00a800';
                ctx.beginPath(); ctx.arc(hillX, groundY, 80, 0, Math.PI, true); ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.fillRect(hillX - 15, groundY - 50, 6, 14);
                ctx.fillRect(hillX + 8, groundY - 50, 6, 14);

                let hillX2 = 950 - cameraX;
                ctx.fillStyle = '#00a800';
                ctx.beginPath(); ctx.arc(hillX2, groundY, 110, 0, Math.PI, true); ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.fillRect(hillX2 - 20, groundY - 70, 8, 18);
                ctx.fillRect(hillX2 + 12, groundY - 70, 8, 18);
            }

            blocks.forEach(b => {
                let px = b.x - cameraX;
                if (b.type === 'ground') {
                    drawNESGround(px, b.y, b.w, b.h);
                } else if (b.type === 'stair' || b.type === 'brick') {
                    ctx.fillStyle = '#c84c0c';
                    ctx.fillRect(px, b.y, b.w, b.h);
                    ctx.strokeStyle = '#000000';
                    ctx.strokeRect(px, b.y, b.w, b.h);
                    ctx.beginPath();
                    ctx.moveTo(px, b.y + b.h / 2); ctx.lineTo(px + b.w, b.y + b.h / 2);
                    ctx.stroke();
                } else if (b.type === 'pipe') {
                    ctx.fillStyle = '#00a800';
                    ctx.fillRect(px, b.y, b.w, b.h);
                    ctx.fillStyle = '#48d848';
                    ctx.fillRect(px + 4, b.y + 4, 12, b.h - 8);
                    ctx.strokeStyle = '#000000';
                    ctx.strokeRect(px, b.y, b.w, b.h);
                    ctx.strokeRect(px - 4, b.y, b.w + 8, 24);
                } else if (b.type === 'q-block') {
                    drawNESQuestionBlock(px, b.y, b.hit);
                } else if (b.type === 'flagpole') {
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(px, b.y, b.w, b.h);
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.moveTo(px, flagY);
                    ctx.lineTo(px - 30, flagY + 15);
                    ctx.lineTo(px, flagY + 30);
                    ctx.closePath();
                    ctx.fill();
                } else if (b.type === 'castle') {
                    ctx.fillStyle = '#c84c0c'; ctx.fillRect(px, b.y, b.w, b.h);
                    ctx.fillStyle = '#000000'; ctx.fillRect(px + 55, b.y + 100, 50, 60);
                }
            });

            if (currentWorld === 4) {
                drawPrincessPeach(peachX, groundY - 36);
            }

            particles.forEach(pt => {
                ctx.fillStyle = `rgba(200, 76, 12, ${pt.opacity})`;
                ctx.fillRect(pt.x - cameraX, pt.y, pt.size, pt.size);
            });

            mushrooms.forEach(m => {
                ctx.fillStyle = '#e52521';
                ctx.fillRect(m.x - cameraX, m.y, m.w, m.h);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(m.x - cameraX + 6, m.y + 6, 8, 8);
            });

            goombas.forEach(g => {
                if (!g.alive) return;
                ctx.fillStyle = '#c84c0c';
                ctx.fillRect(g.x - cameraX, g.y, g.w, g.h);
                ctx.fillStyle = '#fc9838';
                ctx.fillRect(g.x - cameraX + 6, g.y + 8, 20, 12);
                ctx.fillStyle = '#000000';
                ctx.fillRect(g.x - cameraX + 8, g.y + 10, 4, 8);
                ctx.fillRect(g.x - cameraX + 20, g.y + 10, 4, 8);
            });

            drawHero(hero.x - cameraX, hero.y);

            popups.forEach(p => {
                ctx.font = 'bold 20px monospace';
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.fillText(p.text, p.x - cameraX, p.y);
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)'; ctx.fillRect(canvas.width / 2 - 250, canvas.height / 2 - 60, 500, 120);
                ctx.fillStyle = '#ef4444'; ctx.font = '900 26px Orbitron, sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`GAME OVER ${currentUser}!`, canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#ffffff'; ctx.font = '600 16px Rajdhani, sans-serif';
                ctx.fillText('Press Spacebar or Tap to Retry', canvas.width / 2, canvas.height / 2 + 25);
            } else if (gameWin && !isSequenceActive) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)'; ctx.fillRect(canvas.width / 2 - 280, canvas.height / 2 - 60, 560, 120);
                ctx.fillStyle = '#22c55e'; ctx.font = '900 22px Orbitron, sans-serif'; ctx.textAlign = 'center';
                if (currentWorld === 4) {
                    ctx.fillText(`THANK YOU ${currentUser}!`, canvas.width / 2, canvas.height / 2 - 15);
                    ctx.fillStyle = '#facc15'; ctx.font = '700 16px Rajdhani, sans-serif';
                    ctx.fillText('YOUR QUEST IS COMPLETE! YOU SAVED PRINCESS PEACH!', canvas.width / 2, canvas.height / 2 + 20);
                } else {
                    ctx.fillText(`🎉 STAGE CLEARED!`, canvas.width / 2, canvas.height / 2 - 10);
                    ctx.fillStyle = '#ffffff'; ctx.font = '600 16px Rajdhani, sans-serif';
                    ctx.fillText('Press Spacebar to Advance to Next Stage', canvas.width / 2, canvas.height / 2 + 25);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loadWorld(1);
        loop();
    </script>
</body>
</html>
