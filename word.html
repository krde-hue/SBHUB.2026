<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Puzzle (1-100 Stages) - Sportsbook Hub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0b1329;
            color: #ffffff;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .header-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .btn-back {
            background-color: #38bdf8;
            color: #0b1329;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            transform: scale(1.05);
            background-color: #7dd3fc;
        }

        .game-card {
            background: #0f172a;
            border: 2px solid #a855f7;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.35);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 95vw;
            height: 82vh;
            margin-top: 45px;
            position: relative;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #facc15;
            padding: 0 10px;
        }

        .difficulty-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 900;
        }
        .diff-easy { background: #22c55e; color: #0b1329; }
        .diff-mod { background: #f97316; color: #ffffff; }
        .diff-hard { background: #ef4444; color: #ffffff; }

        .word-game-area {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 10px;
            width: 100%;
            height: calc(100% - 60px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .crossword-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            min-width: 300px;
            max-height: 100%;
            overflow-y: auto;
            padding: 10px;
        }

        .word-row {
            display: flex;
            gap: 6px;
        }

        .grid-tile {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 8px;
            color: #0b1329;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-tile.hidden-tile {
            background: #1e293b;
            color: transparent;
            border: 2px solid #475569;
            box-shadow: none;
        }

        .wheel-container {
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            touch-action: none;
        }

        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .letter-node {
            width: 55px;
            height: 55px;
            background: #ffffff;
            border-radius: 50%;
            color: #0b1329;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
            z-index: 10;
            cursor: pointer;
        }

        .letter-node.active-node {
            background: #38bdf8;
            color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 20px #38bdf8;
        }

        .current-word-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #a855f7;
            padding: 8px 24px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: #facc15;
            letter-spacing: 0.15em;
            min-width: 140px;
            text-align: center;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .current-word-box.error-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ef4444;
            color: #ef4444;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-51%, 0, 0); }
            20%, 80% { transform: translate3d(-47%, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-54%, 0, 0); }
            40%, 60% { transform: translate3d(-46%, 0, 0); }
        }

        .stage-clear-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(15, 23, 42, 0.95);
            border: 2.5px solid #22c55e;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
            border-radius: 16px;
            padding: 20px 40px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: #22c55e;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 200;
        }

        .stage-clear-overlay.show-banner {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .controls-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-game-act {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 16px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-game-act:hover {
            background: #38bdf8;
            color: #0b1329;
        }

        @media (max-width: 768px) {
            .word-game-area { flex-direction: column; gap: 20px; }
            .grid-tile { width: 32px; height: 32px; font-size: 1rem; }
            .wheel-container { width: 220px; height: 220px; }
            .letter-node { width: 44px; height: 44px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <div style="font-family: 'Orbitron'; font-weight: 900; color: #a855f7; font-size: 1.2rem;">WORD PUZZLE 1-100</div>
    </div>

    <div class="game-card">
        <div class="hud-row">
            <span id="player-display">PLAYER: --</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="stage-display">STAGE 1 / 100</span>
                <span class="difficulty-badge diff-easy" id="diff-tag">EASY</span>
            </div>
            <span id="score-display">SCORE: 0</span>
        </div>
        
        <div class="word-game-area">
            <div class="current-word-box" id="current-word">---</div>

            <div class="stage-clear-overlay" id="clear-overlay">
                🎉 STAGE CLEARED!
            </div>

            <div class="crossword-grid" id="grid-container"></div>

            <div class="wheel-container" id="letter-wheel">
                <canvas id="line-canvas" width="280" height="280"></canvas>
            </div>
        </div>

        <div class="controls-row">
            <button class="btn-game-act" onclick="shuffleWheel()"><i class="fa-solid fa-shuffle"></i> Shuffle</button>
            <button class="btn-game-act" onclick="giveHint()"><i class="fa-solid fa-lightbulb"></i> Hint</button>
            <button class="btn-game-act" onclick="clearSelection()"><i class="fa-solid fa-xmark"></i> Clear</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCaEclzLI284lWCFk-vXbLSXa_bEZsXbOg",
            authDomain: "test-daily-task--sb.firebaseapp.com",
            databaseURL: "https://test-daily-task--sb-default-rtdb.firebaseio.com",
            projectId: "test-daily-task--sb",
            storageBucket: "test-daily-task--sb.firebasestorage.app",
            messagingSenderId: "928476661919",
            appId: "1:928476661919:web:c6d531190824c6ed7c7aaa"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem('sb_active_user') || 'GUEST';
        document.getElementById('player-display').textContent = `PLAYER: ${currentUser}`;

        let currentStage = 1;
        let totalScore = 0;
        let selectedLetters = [];
        let solvedWords = [];
        let stageTargetWords = [];
        let currentWheelLetters = [];
        let usedRootIndices = [];
        let isDragging = false;
        let pointerPos = { x: 0, y: 0 };

        // LARGE DYNAMIC DICTIONARY POOL (PREVENTS REPEAT PUZZLES)
        const wordMasterList = [
            // 3-4 LETTER EASY WORDS
            { root: "CAT", sub: ["CAT", "AT"] },
            { root: "DOG", sub: ["DOG", "DO"] },
            { root: "SUN", sub: ["SUN", "US"] },
            { root: "BUS", sub: ["BUS", "US"] },
            { root: "PEN", sub: ["PEN", "EN"] },
            { root: "COW", sub: ["COW", "OW"] },
            { root: "BOW", sub: ["BOW", "OW"] },
            { root: "FIX", sub: ["FIX", "IF"] },
            { root: "LION", sub: ["LION", "ON", "IN"] },
            { root: "BIRD", sub: ["BIRD", "RID"] },
            { root: "FISH", sub: ["FISH", "IF", "HI"] },
            { root: "FIRE", sub: ["FIRE", "RIDE", "IF"] },
            { root: "BOOK", sub: ["BOOK", "BOO"] },
            { root: "GOLD", sub: ["GOLD", "OLD", "GO"] },
            { root: "KING", sub: ["KING", "INK", "IN"] },
            { root: "PARK", sub: ["PARK", "ARK"] },
            { root: "STAR", sub: ["STAR", "ARTS", "RAT"] },
            { root: "MOON", sub: ["MOON", "MOO"] },
            { root: "TREE", sub: ["TREE", "TEE"] },
            { root: "WIND", sub: ["WIND", "IN", "WIN"] },

            // 5-6 LETTER MODERATE WORDS
            { root: "SMART", sub: ["SMART", "STAR", "ARTS", "MATS", "ARM"] },
            { root: "PLANT", sub: ["PLANT", "PLAN", "PLAT", "ANT"] },
            { root: "TRAIN", sub: ["TRAIN", "RAIN", "ANTI", "RAT"] },
            { root: "STORM", sub: ["STORM", "MOST", "SORT", "ROAM"] },
            { root: "BRAIN", sub: ["BRAIN", "RAIN", "BARN", "RIB"] },
            { root: "CLOUD", sub: ["CLOUD", "COLD", "LOUD", "OLD"] },
            { root: "GRACE", sub: ["GRACE", "RACE", "CAGE", "CARE"] },
            { root: "SCALE", sub: ["SCALE", "SALE", "CASE", "LACE"] },
            { root: "FLAME", sub: ["FLAME", "MALE", "MEAL", "FAME"] },
            { root: "DREAM", sub: ["DREAM", "DEAR", "READ", "MADE"] },
            { root: "GLOBE", sub: ["GLOBE", "LOBE", "BLOG", "BOLE"] },
            { root: "TABLE", sub: ["TABLE", "ABLE", "BEAT", "LATE"] },
            { root: "SMILE", sub: ["SMILE", "MILE", "SLIME", "LIME"] },
            { root: "POWER", sub: ["POWER", "PORE", "ROPE", "ROW"] },
            { root: "COWBOY", sub: ["COWBOY", "COW", "BOW", "BOY"] },
            { root: "GARDEN", sub: ["GARDEN", "READ", "DEAR", "EARN", "RANGE"] },
            { root: "PLANET", sub: ["PLANET", "PLANE", "PLANT", "LATE", "TAPE"] },
            { letters: ['M','A','R','K','E','T'], words: ['MARKET', 'MAKE', 'TAKE', 'TEAM', 'MATE'] },
            { letters: ['F','O','R','E','S','T'], words: ['FOREST', 'FORT', 'REST', 'SOFT', 'ROSE'] },
            { letters: ['C','A','S','T','L','E'], words: ['CASTLE', 'CASE', 'EAST', 'LATE', 'SALE'] },

            // 7-10 LETTER HARD WORDS
            { root: "SPORTSBOOK", sub: ["SPORTSBOOK", "SPORTS", "BOOK", "BOOT", "PORT", "POST", "SPORT"] },
            { root: "FOOTBALL", sub: ["FOOTBALL", "BALL", "FOOT", "TOLL", "FALL", "LOFT", "TOOL"] },
            { root: "CHAMPION", sub: ["CHAMPION", "CAMP", "MAIN", "MICH", "INCH", "PAIN", "PIN"] },
            { root: "DASHBOARD", sub: ["DASHBOARD", "BOARD", "DASH", "ROAD", "BROAD", "HARD", "BAND"] },
            { root: "OPERATION", sub: ["OPERATION", "PORT", "PART", "PAIR", "TRAIN", "RAIN", "RATION"] },
            { root: "FINANCIAL", sub: ["FINANCIAL", "FINAL", "NAIL", "FAIL", "COIN", "CLAN"] },
            { root: "BUSINESS", sub: ["BUSINESS", "BUS", "SUN", "SIN", "SINE", "BINS"] },
            { root: "TECHNOLOGY", sub: ["TECHNOLOGY", "TECH", "LONG", "ONLY", "TONE", "ECHO"] }
        ];

        function getRandomUnusedIndex(minLen, maxLen) {
            let pool = wordMasterList.filter((item, idx) => {
                let len = item.root ? item.root.length : item.letters.length;
                return len >= minLen && len <= maxLen && !usedRootIndices.includes(idx);
            });

            if (pool.length === 0) {
                usedRootIndices = []; // Reset tracked pool if exhausted
                return Math.floor(Math.random() * wordMasterList.length);
            }

            let chosen = pool[Math.floor(Math.random() * pool.length)];
            let originalIndex = wordMasterList.indexOf(chosen);
            usedRootIndices.push(originalIndex);
            return originalIndex;
        }

        function getStageConfig(stageNum) {
            let item;
            let diff = 'EASY';
            let diffClass = 'diff-easy';

            if (stageNum <= 25) {
                let idx = getRandomUnusedIndex(3, 4);
                item = wordMasterList[idx];
                diff = 'EASY';
                diffClass = 'diff-easy';
            } else if (stageNum <= 60) {
                let idx = getRandomUnusedIndex(5, 6);
                item = wordMasterList[idx];
                diff = 'MODERATE';
                diffClass = 'diff-mod';
            } else {
                let idx = getRandomUnusedIndex(7, 10);
                item = wordMasterList[idx];
                diff = 'HARD';
                diffClass = 'diff-hard';
            }

            let letters = item.letters ? item.letters : item.root.split('');
            let words = item.words ? item.words : item.sub;

            // Shuffle Wheel Letters on Load
            letters = [...letters].sort(() => Math.random() - 0.5);

            return { letters, words, diff, class: diffClass };
        }

        function loadStage(stageNum) {
            const config = getStageConfig(stageNum);
            stageTargetWords = config.words;
            currentWheelLetters = [...config.letters];
            solvedWords = [];
            selectedLetters = [];

            document.getElementById('stage-display').textContent = `STAGE ${stageNum} / 100`;
            const diffTag = document.getElementById('diff-tag');
            diffTag.textContent = config.diff;
            diffTag.className = `difficulty-badge ${config.class}`;

            renderGrid();
            renderWheel();
            updateCurrentWordDisplay();
        }

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            stageTargetWords.forEach(word => {
                const row = document.createElement('div');
                row.className = 'word-row';

                for (let i = 0; i < word.length; i++) {
                    const tile = document.createElement('div');
                    tile.className = 'grid-tile hidden-tile';
                    tile.setAttribute('data-word', word);
                    tile.setAttribute('data-index', i);
                    tile.textContent = word[i];
                    row.appendChild(tile);
                }
                container.appendChild(row);
            });
        }

        function renderWheel() {
            const wheel = document.getElementById('letter-wheel');
            const lineCanvas = document.getElementById('line-canvas');
            
            wheel.innerHTML = '';
            wheel.appendChild(lineCanvas);

            const total = currentWheelLetters.length;
            const radius = 95;

            currentWheelLetters.forEach((char, idx) => {
                const angle = (idx / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = Math.round(radius * Math.cos(angle));
                const y = Math.round(radius * Math.sin(angle));

                const node = document.createElement('div');
                node.className = 'letter-node';
                node.textContent = char;
                node.setAttribute('data-idx', idx);
                node.style.left = `calc(50% + ${x}px - 28px)`;
                node.style.top = `calc(50% + ${y}px - 28px)`;

                wheel.appendChild(node);
            });

            initDragListeners();
        }

        function initDragListeners() {
            const wheel = document.getElementById('letter-wheel');
            const canvas = document.getElementById('line-canvas');
            const ctx = canvas.getContext('2d');

            function getWheelCenterOffset(node) {
                const rect = wheel.getBoundingClientRect();
                const nodeRect = node.getBoundingClientRect();
                return {
                    x: nodeRect.left + nodeRect.width / 2 - rect.left,
                    y: nodeRect.top + nodeRect.height / 2 - rect.top
                };
            }

            function drawLines() {
                canvas.width = wheel.clientWidth;
                canvas.height = wheel.clientHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (selectedLetters.length === 0) return;

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;

                ctx.beginPath();
                selectedLetters.forEach((item, idx) => {
                    const pos = getWheelCenterOffset(item.elem);
                    if (idx === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });

                if (isDragging) {
                    ctx.lineTo(pointerPos.x, pointerPos.y);
                }
                ctx.stroke();
            }

            function checkNodeCollision(clientX, clientY) {
                const nodes = document.querySelectorAll('.letter-node');
                nodes.forEach(node => {
                    const rect = node.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const dist = Math.hypot(clientX - centerX, clientY - centerY);

                    if (dist < 32) {
                        const idx = node.getAttribute('data-idx');
                        const alreadySelected = selectedLetters.some(item => item.elem === node);

                        if (!alreadySelected) {
                            selectedLetters.push({ char: node.textContent, elem: node });
                            node.classList.add('active-node');
                            updateCurrentWordDisplay();
                        }
                    }
                });
            }

            function handleStart(e) {
                e.preventDefault();
                isDragging = true;
                clearSelection();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const rect = wheel.getBoundingClientRect();
                pointerPos = { x: clientX - rect.left, y: clientY - rect.top };

                checkNodeCollision(clientX, clientY);
                drawLines();
            }

            function handleMove(e) {
                if (!isDragging) return;
                e.preventDefault();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const rect = wheel.getBoundingClientRect();
                pointerPos = { x: clientX - rect.left, y: clientY - rect.top };

                checkNodeCollision(clientX, clientY);
                drawLines();
            }

            function handleEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                drawLines();
                autoSubmitWord();
            }

            wheel.onmousedown = handleStart;
            wheel.onmousemove = handleMove;
            window.onmouseup = handleEnd;

            wheel.ontouchstart = handleStart;
            wheel.ontouchmove = handleMove;
            window.ontouchend = handleEnd;
        }

        function updateCurrentWordDisplay() {
            const word = selectedLetters.map(item => item.char).join('');
            document.getElementById('current-word').textContent = word || '---';
        }

        function clearSelection() {
            selectedLetters.forEach(item => item.elem.classList.remove('active-node'));
            selectedLetters = [];
            updateCurrentWordDisplay();
            const canvas = document.getElementById('line-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function shuffleWheel() {
            currentWheelLetters.sort(() => Math.random() - 0.5);
            clearSelection();
            renderWheel();
        }

        function triggerErrorShake() {
            const wordBox = document.getElementById('current-word');
            wordBox.classList.add('error-shake');
            setTimeout(() => {
                wordBox.classList.remove('error-shake');
                clearSelection();
            }, 450);
        }

        function autoSubmitWord() {
            const word = selectedLetters.map(item => item.char).join('');
            if (!word) return;

            if (stageTargetWords.includes(word) && !solvedWords.includes(word)) {
                solvedWords.push(word);
                totalScore += word.length * 100;
                document.getElementById('score-display').textContent = `SCORE: ${totalScore}`;

                db.ref(`word_leaderboard/${currentUser}`).transaction(curr => Math.max(curr || 0, totalScore));

                const tiles = document.querySelectorAll(`.grid-tile[data-word="${word}"]`);
                tiles.forEach(tile => tile.classList.remove('hidden-tile'));

                clearSelection();

                if (solvedWords.length === stageTargetWords.length) {
                    const overlay = document.getElementById('clear-overlay');
                    overlay.textContent = `🎉 STAGE ${currentStage} CLEARED!`;
                    overlay.classList.add('show-banner');

                    setTimeout(() => {
                        overlay.classList.remove('show-banner');
                        if (currentStage < 100) {
                            currentStage++;
                            loadStage(currentStage);
                        } else {
                            overlay.textContent = '🏆 ALL 100 STAGES CLEARED!';
                            overlay.classList.add('show-banner');
                        }
                    }, 1000);
                }
            } else {
                triggerErrorShake();
            }
        }

        function giveHint() {
            const unsolved = stageTargetWords.filter(w => !solvedWords.includes(w));
            if (unsolved.length > 0) {
                const word = unsolved[0];
                const hiddenTiles = document.querySelectorAll(`.grid-tile[data-word="${word}"].hidden-tile`);
                if (hiddenTiles.length > 0) {
                    hiddenTiles[0].classList.remove('hidden-tile');
                }
            }
        }

        loadStage(1);
    </script>
</body>
</html>
