        .btn-back:hover {
            transform: scale(1.05);

        }

            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 95vw;
            height: 82vh;
            margin-top: 45px;
            position: relative;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #facc15;
            padding: 0 10px;
        }

        .difficulty-badge {
            padding: 4px 12px;

            font-size: 0.8rem;
            font-weight: 900;
        }
        .diff-easy { background: #22c55e; color: #0b1329; }
        .diff-mod { background: #f97316; color: #ffffff; }

            border-radius: 10px;
            width: 100%;
            height: calc(100% - 60px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* DYNAMIC CROSSWORD BOARD */
        .crossword-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            min-width: 300px;
            max-height: 100%;
            overflow-y: auto;
            padding: 10px;
        }

        .word-row {
            display: flex;
            gap: 6px;
        }

        .grid-tile {
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 8px;
            color: #0b1329;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-tile.hidden-tile {
            background: #1e293b;
            color: transparent;
            border: 2px solid #475569;
            box-shadow: none;
        }

        /* CIRCULAR LETTER WHEEL WITH CANVAS OVERLAY */
        .wheel-container {
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            touch-action: none;
        }

        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .letter-node {
            width: 55px;
            height: 55px;
            background: #ffffff;
            border-radius: 50%;
            color: #0b1329;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
            z-index: 10;
            cursor: pointer;
        }

        .letter-node.active-node {
            background: #38bdf8;
            color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 20px #38bdf8;
        }

        .current-word-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #a855f7;

            letter-spacing: 0.15em;
            min-width: 140px;
            text-align: center;
            transition: border-color 0.2s ease, color 0.2s ease;

            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ef4444;
            color: #ef4444;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-51%, 0, 0); }
            20%, 80% { transform: translate3d(-47%, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-54%, 0, 0); }
            40%, 60% { transform: translate3d(-46%, 0, 0); }
        }

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(15, 23, 42, 0.95);
            border: 2.5px solid #22c55e;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);

            padding: 20px 40px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: #22c55e;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 200;
        }

        .stage-clear-overlay.show-banner {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .controls-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-game-act {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 16px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-game-act:hover {
            background: #38bdf8;
            color: #0b1329;
        }

        @media (max-width: 768px) {
            .word-game-area { flex-direction: column; gap: 20px; }
            .grid-tile { width: 32px; height: 32px; font-size: 1rem; }
            .wheel-container { width: 220px; height: 220px; }
            .letter-node { width: 44px; height: 44px; font-size: 1.1rem; }
        }
