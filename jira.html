<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jira Ticket Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.15);
      
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.2s, color 0.2s; }
    
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-top: 30px;
      line-height: 1.5;
    }

    /* Static High-Visibility Alert Banner Inside Jira Tracker */
    .jira-static-alert-banner {
      width: 100%;
      min-height: 40px;
      margin-bottom: 24px;
      background: rgba(220, 38, 38, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(239, 68, 68, 0.7);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.25), inset 0 0 10px rgba(239, 68, 68, 0.15);
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      gap: 12px;
      box-sizing: border-box;
    }
    .jira-static-alert-banner.active { display: flex !important; }

    .jira-alert-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .jira-alert-badge {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff; font-weight: 800; font-size: 11px; padding: 5px 12px;
      border-radius: 6px; display: inline-flex; align-items: center; gap: 6px;
      letter-spacing: 0.5px; text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }

    .jira-ticket-pills-container { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .jira-pill-item {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px; border-radius: 6px; font-size: 12px; color: #f8fafc;
      display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
    }

    .jira-pill-brand {
      color: #fca5a5; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 10px;
      background: rgba(239, 68, 68, 0.3); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .jira-pill-key { color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .jira-pill-time { color: #f87171; font-weight: 700; }

    .container { max-width: 1100px; margin: 0 auto 40px auto; padding: 0 20px; }
    
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 28px; margin-bottom: 28px;
      box-shadow: var(--glass-shadow);
    }

    h1 { font-size: 24px; font-weight: 800; margin-bottom: 20px; }
    h2 { font-size: 16px; font-weight: 700; margin-bottom: 18px; color: #cbd5e1; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; }
    
    textarea, input, select {
      width: 100%; padding: 12px 14px;
      background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; color: var(--text-main); font-size: 14px; outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    textarea { height: 75px; resize: vertical; }

    .grid-4 { display: grid; grid-template-columns: 1.5fr 1.2fr 1fr 1.2fr; gap: 16px; }
    @media (max-width: 768px) { .grid-4 { grid-template-columns: 1fr 1fr; } }

    .btn {
      background-color: var(--primary); color: white; border: none;
      padding: 12px 24px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 10px; }
    th { text-align: left; padding: 10px 16px; color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--glass-border); }
    td { padding: 14px 16px; background: rgba(15, 23, 42, 0.5); font-size: 14px; }
    td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
    
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .badge-brand { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.15); }
    .badge-overdue { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; }
    .action-btn:hover { background: var(--danger-bg); color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <h1>📋 Jira Resolution Tracker</h1>

    <!-- Static High-Visibility Banner -->
    <div id="notification-banner" class="jira-static-alert-banner">
      <div class="jira-alert-left">
        <div class="jira-alert-badge">
          ⚠️ PENDING JIRA (>24H)
        </div>
        <div class="jira-ticket-pills-container" id="jiraPillsContainer">
          <!-- Rendered Dynamically -->
        </div>
      </div>
    </div>

    <!-- Quick Paste Card -->
    <div class="glass-card">
      <h2>Paste & Track Ticket</h2>
      <div class="form-group">
        <label for="smart-input">Quick Paste Jira Link or Summary</label>
        <textarea id="smart-input" placeholder="Paste ticket details or Atlassian URL..."></textarea>
      </div>

      <div class="grid-4">
        <div class="form-group">
          <label for="ticket-key">Ticket Key</label>
          <input type="text" id="ticket-key" placeholder="e.g. B2B-16446" />
        </div>
        <div class="form-group">
          <label for="ticket-brand">Brand</label>
          <select id="ticket-brand">
            <option value="KT PROJECTS">KT PROJECTS</option>
            <option value="IBET">IBET</option>
            <option value="BETSSON">BETSSON</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ticket-status">Status</label>
          <select id="ticket-status">
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="In Review">In Review</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ticket-time">Creation Time</label>
          <input type="datetime-local" id="ticket-time" />
        </div>
      </div>

      <button class="btn" id="add-ticket-btn">+ Track Ticket</button>
    </div>

    <!-- Active Tickets -->
    <div class="glass-card">
      <h2>Tracked Tickets</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Key</th>
              <th>Brand</th>
              <th>Summary</th>
              <th>Created</th>
              <th>SLA Status</th>
              <th>State</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="ticket-table-body">
            <!-- Rendered Dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'jira_tracked_tickets';
    const channel = new BroadcastChannel('jira_sync_channel');

    document.getElementById('ticket-time').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

    document.getElementById('smart-input').addEventListener('input', (e) => {
      const text = e.target.value;
      const keyMatch = text.match(/[A-Z0-9]{2,10}-\d+/i);
      if (keyMatch) {
        document.getElementById('ticket-key').value = keyMatch[0].toUpperCase();
      }
    });

    function cleanTextSummary(text, key) {
      if (!text) return key;
      let cleaned = text.replace(/https?:\/\/[^\s]+/gi, '').trim();
      return cleaned || key;
    }

    function formatElapsedTime(createdAt) {
      const diffMs = new Date() - new Date(createdAt);
      const totalHours = Math.floor(diffMs / (1000 * 60 * 60));
      const days = Math.floor(totalHours / 24);
      const hours = totalHours % 24;

      if (days > 0) return `${days}d ${hours}h passed`;
      return `${totalHours}h passed`;
    }

    function getTickets() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }

    function saveTickets(tickets) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
      channel.postMessage('update');
      render();
    }

    function addTicket() {
      const keyInput = document.getElementById('ticket-key');
      const brandInput = document.getElementById('ticket-brand');
      const inputSummary = document.getElementById('smart-input');
      const statusInput = document.getElementById('ticket-status');
      const timeInput = document.getElementById('ticket-time');

      if (!keyInput.value.trim()) return alert('Please provide a Jira Ticket Key.');

      const keyVal = keyInput.value.trim().toUpperCase();
      const tickets = getTickets();

      const newTicket = {
        id: Date.now().toString(),
        key: keyVal,
        brand: brandInput.value,
        summary: cleanTextSummary(inputSummary.value, keyVal),
        status: statusInput.value,
        createdAt: timeInput.value ? new Date(timeInput.value).toISOString() : new Date().toISOString()
      };

      tickets.unshift(newTicket);
      saveTickets(tickets);

      keyInput.value = '';
      inputSummary.value = '';
      document.getElementById('ticket-time').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    function updateStatus(id, newStatus) {
      const tickets = getTickets();
      const ticket = tickets.find(t => t.id === id);
      if (ticket) { ticket.status = newStatus; saveTickets(tickets); }
    }

    function deleteTicket(id) { saveTickets(getTickets().filter(t => t.id !== id)); }

    function render() {
      const tickets = getTickets();
      const tbody = document.getElementById('ticket-table-body');
      tbody.innerHTML = '';

      let overdueTickets = [];

      tickets.forEach(ticket => {
        const isResolved = String(ticket.status).toLowerCase() === 'resolved';
        const hoursAgo = Math.floor((new Date() - new Date(ticket.createdAt)) / 3600000);
        const overdue = !isResolved && hoursAgo >= 24;

        if (overdue) overdueTickets.push(ticket);

        const createdDate = new Date(ticket.createdAt);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${ticket.key}</td>
          <td><span class="badge badge-brand">${ticket.brand || 'N/A'}</span></td>
          <td>${ticket.summary}</td>
          <td style="white-space:nowrap;">${createdDate.toLocaleDateString()} ${createdDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
          <td>${overdue ? `<span class="badge badge-overdue">⚠️ ${hoursAgo}h (>24h)</span>` : `<span>${hoursAgo}h ago</span>`}</td>
          <td>
            <select style="width:auto; padding:6px 10px;" onchange="updateStatus('${ticket.id}', this.value)">
              <option value="Open" ${ticket.status === 'Open' ? 'selected' : ''}>Open</option>
              <option value="In Progress" ${ticket.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="In Review" ${ticket.status === 'In Review' ? 'selected' : ''}>In Review</option>
              <option value="Resolved" ${ticket.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
            </select>
          </td>
          <td><button class="action-btn" onclick="deleteTicket('${ticket.id}')">✕ Delete</button></td>
        `;
        tbody.appendChild(tr);
      });

      // Render Alert Banner
      const banner = document.getElementById('notification-banner');
      const pillsContainer = document.getElementById('jiraPillsContainer');

      if (overdueTickets.length > 0) {
        const pillsHTML = overdueTickets.map(t => `
          <div class="jira-pill-item">
            <span class="jira-pill-brand">${t.brand || 'KT PROJECTS'}</span>
            <span class="jira-pill-key">${t.key}</span>
            <span>• <span class="jira-pill-time">${formatElapsedTime(t.createdAt)}</span></span>
          </div>
        `).join('');

        if (pillsContainer) pillsContainer.innerHTML = pillsHTML;
        if (banner) banner.classList.add('active');
      } else {
        if (banner) banner.classList.remove('active');
      }
    }

    channel.onmessage = () => render();
    window.addEventListener('storage', () => render());
    document.getElementById('add-ticket-btn').addEventListener('click', addTicket);

    render();
    setInterval(render, 10000);
  </script>
</body>
</html>
